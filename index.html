<!DOCTYPE html>
<html lang="en-AU"><head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Capability Coach</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#101a30">

<style>
:root{
 --bg:#0e1626; --bg2:#141f36; --card:#1a2740; --card2:#213152; --line:#2c3f63;
 --ink:#eef3fb; --dim:#9fb0cc; --gold:#e8b84b; --blue:#6ea8ff;
 --exc:#4fd18b; --cle:#6ea8ff; --par:#e8b84b; --not:#ff7b7b;
 --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:linear-gradient(180deg,#0e1626,#131d33 40%,#0e1626);color:var(--ink);
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
 overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(14,22,38,.92);backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#6ea8ff,#3f6fd8);
 display:grid;place-items:center;font-weight:800;color:#0e1626;font-size:14px}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px}
.brand .s{font-size:11px;color:var(--dim);margin-top:-2px}
.modes{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:0 0 auto;background:#1b2942;border:1px solid var(--line);color:var(--dim);
 padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
.modes button.on{background:var(--blue);border-color:var(--blue);color:#08101f;font-weight:700}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + var(--safe-b))}
.mx{max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
h2{margin:0 0 4px;font-size:22px;line-height:1.22;font-weight:700}
.sub{color:var(--dim);font-size:13px}
.pill{display:inline-block;background:#24365a;color:#bcd0f0;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:600;margin:0 6px 6px 0}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:3px 9px;border-radius:11px;text-transform:uppercase}
.chip.exc{background:rgba(79,209,139,.16);color:var(--exc)} .chip.cle{background:rgba(110,168,255,.16);color:var(--cle)}
.chip.par{background:rgba(232,184,75,.16);color:var(--par)} .chip.not{background:rgba(255,123,123,.16);color:var(--not)}
.btn{background:var(--blue);color:#08101f;border:0;padding:11px 18px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:8px 13px;font-size:13px}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ---------- avatar ---------- */
.stage{display:flex;gap:18px;align-items:flex-start}
.avwrap{flex:0 0 128px;position:relative;display:grid;place-items:center}
.avring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(110,168,255,.25)}
.avring.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.07);opacity:.85}}
svg.face{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#26365a,#16223a);
 box-shadow:0 10px 30px rgba(0,0,0,.45)}
.saying{flex:1;min-width:0}
.saying .lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:6px}
.saying .txt{position:relative;font-size:19px;line-height:1.55;font-weight:500;max-height:44vh;overflow-y:auto;padding-right:4px;scroll-behavior:smooth}
.saying .txt::-webkit-scrollbar{width:5px}.saying .txt::-webkit-scrollbar-thumb{background:#33456a;border-radius:3px}
.saying .txt .done{color:var(--dim)}
.saying .txt .now{color:#fff;background:rgba(110,168,255,.16);border-radius:5px;box-shadow:0 0 0 4px rgba(110,168,255,.16)}
.saying .txt .todo{color:#8ea3c4}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:-1px;
 background:linear-gradient(180deg,rgba(26,39,64,.7),var(--card) 30%);padding:12px 0 4px;z-index:6}
.ctl button{background:#22314f;border:1px solid var(--line);color:var(--ink);width:44px;height:44px;border-radius:50%;
 display:grid;place-items:center;cursor:pointer;font-size:16px}
.ctl button.main{width:56px;height:56px;background:var(--blue);color:#08101f;border-color:var(--blue);font-size:20px}
.ctl select{background:#22314f;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;max-width:160px;min-width:104px}
.rail{display:flex;gap:5px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail i{flex:0 0 auto;width:22px;height:6px;border-radius:3px;background:#2b3d60;cursor:pointer;display:block}
.rail i.done{background:#41628f}
.prog{height:4px;background:#22314f;border-radius:3px;overflow:hidden;margin-top:12px}
.prog b{display:block;height:100%;background:linear-gradient(90deg,#6ea8ff,#4fd18b);width:0}
/* ---------- lists ---------- */
.capbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
 color:var(--ink);padding:12px 14px;border-radius:13px;margin-bottom:8px;cursor:pointer}
.capbtn:active{background:var(--card2)}
.capbtn .nm{flex:1;font-size:15px;font-weight:600;line-height:1.3}
.capbtn .mt{font-size:11px;color:var(--dim);margin-top:2px;font-weight:400}
.capbtn .arw{color:var(--dim)}
.grp{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold);font-weight:800;margin:16px 0 8px 2px}
.ind{border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:var(--card);overflow:hidden}
.ind .hd{display:flex;gap:10px;padding:12px 14px;cursor:pointer;align-items:flex-start}
.ind .code{font-weight:800;color:var(--blue);min-width:26px;font-size:14px}
.ind .t{flex:1;font-size:14px;line-height:1.4}
.ind .bd{display:none;padding:0 14px 14px 50px;border-top:1px solid var(--line);margin-top:2px;padding-top:12px}
.ind.open .bd{display:block}
.ind .bd p{margin:0 0 10px;font-size:14.5px;color:#d7e2f4}
.ind .bd p.sh{font-weight:700;color:var(--gold);margin-top:14px}
.ind .bd p.b{padding-left:14px;text-indent:-12px}
.vt{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;font-weight:800;color:var(--dim);margin:10px 0 8px}
.seg{margin:14px 0}
.seg .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:5px}
.seg p{margin:0 0 9px;font-size:15px;color:#dfe8f7}
.seg p.b{padding-left:14px;text-indent:-12px}
.notes{background:#16233c;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.notes .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.notes p{margin:0 0 7px;font-size:13.5px;color:#c6d4ea}
.notes p.b{padding-left:14px;text-indent:-12px}
.key{display:inline-flex;align-items:center;gap:6px;background:#22314f;border:1px solid var(--line);color:#cfdcf2;
 border-radius:20px;padding:7px 13px;font-size:13px;margin:0 6px 6px 0;cursor:pointer}
.key.hit{background:rgba(79,209,139,.18);border-color:var(--exc);color:var(--exc);font-weight:700}
.tile{background:#22314f;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:14px}
.tile.sel{border-color:var(--blue);background:#27395e}
.tile.ok{border-color:var(--exc)} .tile.no{border-color:var(--not)}
.mic{width:74px;height:74px;border-radius:50%;background:var(--not);border:0;color:#fff;font-size:26px;display:grid;place-items:center;cursor:pointer}
.mic.rec{animation:rec 1.1s infinite}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(255,123,123,.5)}70%{box-shadow:0 0 0 18px rgba(255,123,123,0)}}
.tx{background:#16233c;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:90px;font-size:14.5px;color:#d7e2f4;white-space:pre-wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 15px;flex:1;min-width:110px}
.stat .b{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
input[type=range]{accent-color:var(--blue);width:100px}
input[type=search]{width:100%;background:#16233c;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 13px;font-size:15px}
.warn{background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.35);color:#f0d9a0;border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:12px}
@media(min-width:760px){.saying .txt{font-size:21px}}
@media(max-width:560px){.avwrap{flex:0 0 84px}svg.face{width:84px;height:84px}
 .saying .txt{font-size:17.5px;max-height:40vh}.stage{gap:12px}
 .ctl button{width:40px;height:40px}.ctl button.main{width:50px;height:50px}
 h2{font-size:19px}main{padding:12px 12px calc(18px + var(--safe-b))}.card{padding:14px}}
</style></head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">NK</div>
    <div><h1>Capability Coach</h1><div class="s">NSW Capability Framework V3:2026 · Advanced &amp; Highly advanced</div></div>
  </div>
  <div class="modes" id="modes"></div>
</header>
<main><div class="mx" id="main"></div></main>
</div>
<script>
const DATA={"caps": [{"id": "drc", "name": "Display resilience and courage", "group": "Personal Attributes", "desc": "Be open and honest, prepared to express your views, and willing to accept and commit to change", "verdict": [["Advanced", "CLEARED DECISIVELY on 4 of 6 indicators, with 2 requiring work", "Multiple independent examples across three decades, several externally documented in the public record"], ["Highly advanced", "ARGUABLE on 4 of 6, genuinely strong on 2", "Hold in reserve. Claim it only if a role description sets this capability at Highly advanced, and be ready for the organisational-culture challenge"]], "adv": [{"c": "A1", "t": "Respond constructively when in high pressure and unpredictable situations", "v": "exc", "vt": "", "body": ["STRENGTH: exceptional. You have three independent examples where the pressure was externally documented rather than self-described, which is rare.", "• 2023 State general election. You inherited the program at red. Around you: an initial funding allocation of $89.1M against an estimated cost of $140.7M; a $50.5M Treasury submission still unresolved; a parliamentary joint standing committee inquiring into whether the agency could be funded to run the very election you were delivering; the Electoral Act amended mid-program to compress early voting from thirteen days to seven; the internet voting channel withdrawn on the Commissioner's determination; and a polling day fixed in statute. Delivered at $140.3M against $144.3M with informality improved in both houses. This is the single strongest example in your career for this indicator, and most of the pressure is on the public record so a panel can verify it.", "• RBC Dexia, 2011–12. Ten months into a cross-border platform implementation and offshoring operating model, the joint venture's European parent failed in the sovereign debt crisis and was broken up by agreement between European governments. The business entered a divestment process and was sold in April 2012. You continued delivering to milestone while the question of who would own the operation, and where the work would sit, was genuinely open.", "• NRMA, 1996–2004. Eight years spanning demutualisation, ASX listing, renaming to Insurance Australia Group, and the CGU and NZI acquisitions. Scope, sponsors, reporting lines and organisational structure changed repeatedly underneath the work; the delivery commitments did not."]}, {"c": "A2", "t": "Give frank, honest advice in response to contrary views", "v": "cle", "vt": "", "body": ["STRENGTH: exceptional, and unusually well evidenced in writing. The NSW interview pack for a Band 1 EPMO role states that an assurance function which has never delivered an unwelcome finding to a sponsor has not been doing its job. You have four documented instances.", "• The telecommunications investment case. Having costed the minimum credible path to the client's strategy target at approximately $240k, you advised the divisional leadership team that it met the target with no margin for error, and that the funded base case would reach only two of three capability pillars and push the target out by at least twelve months. That is advice against the commercially convenient answer, given to the people who would have preferred to hear otherwise.", "• The AI transformation program. The sponsor believed the binding constraint was demand. Structured interrogation established that suppliers were already at capacity below fifty wholesale accounts, and that pursuing demand generation alone would drive late and incorrect orders into a word-of-mouth market. You contradicted the sponsor's own diagnosis and named the consequence of being wrong.", "• Charter assurance findings across seven project teams. Written findings issued where teams had let scope guardrails lapse, embellished the KPI set beyond the agreed success test, or allowed sponsor-critical deliverables to lose prominence — delivered to delivery teams with every incentive to hear otherwise.", "• The plan-to-green at the Electoral Commission. Taking a recovery plan to a Program Steering Committee chaired by the Electoral Commissioner is, by definition, advising that the current course will not work — to a statutory officer accountable to Parliament."]}, {"c": "A3", "t": "Be open to criticism of your ideas and respond in a thoughtful and considered way", "v": "exc", "vt": "", "body": ["STRENGTH: weak in personal evidence, strong in designed evidence. THIS IS A GAP. Everything above is you giving frank advice. This indicator is the reciprocal, and panels notice when a candidate can only evidence one direction — it reads as someone who is comfortable being right rather than someone who is genuinely open.", "• What you can currently show is that you built the principle into systems, which is genuinely persuasive at Director level. The seven-step assurance spine you designed includes a management response authored by the reviewed party, presented to the committee together with the finding — the finding never travels alone. Most organisations omit that step. Designing a right of reply into your own assurance process is evidence that you take criticism of a position seriously as a matter of principle.", "• Supporting: the practice principle of publishing your own annual value assessment to the same standard demanded of every client business case, including in unfavourable years; the CIPMO guiding principle of collaborating with key users during development, with directors nominating their own quick wins rather than having them imposed.", "WHAT I NEED: one example where you were told your idea was wrong, took it seriously, and changed course — ideally where the challenge came from someone junior to you or from a delivery team resisting your framework. This is the most valuable single answer you could give me for this capability. Without it, a panel probing beyond your prepared examples will find the soft spot."]}, {"c": "A4", "t": "Welcome new challenges and persist in raising and working through novel and difficult issues", "v": "cle", "vt": "", "body": ["STRENGTH: strong. The word doing the work here is novel — problems without precedent, not merely hard ones.", "• RBC Dexia data sovereignty. Hosting from United States data centres engaged three regimes at once — USA PATRIOT Act government access powers, Australian privacy obligations, and market-sensitive information handling — inside APRA's prudential outsourcing standard, which requires the regulator to be consulted before a material offshoring arrangement is entered. You worked it through to a solution the institution could stand behind rather than accepting and documenting it as a risk. That is persistence on a novel problem.", "• CIPMO. The baseline assessment found assurance operating on none of the ten projects reviewed and formal project controls on one. You built the function that did not exist, in an organisation that had never had one.", "• The regulatory convergence analysis. Mapping five converging AI and automated-decision regimes binding to December 2026 and translating them into a prioritised remediation sequence, in a domain where the obligations were still forming and the precedents did not exist.", "• NRMA, 1996–99. Converting six million policies from annual premium to monthly payment, then building the collections operation that change created — because the problem you had solved generated a second problem nobody had staffed for."]}, {"c": "A5", "t": "Develop effective strategies and be decisive when dealing with emotionally charged situations and difficult issues", "v": "exc", "vt": "", "body": ["STRENGTH: partial. THIS IS THE SECOND GAP. You can evidence difficult issues comprehensively. Emotionally charged situations — conflict, distress, people rather than problems — you cannot, from anything you have given me.", "• What exists: the four-tier incident command structure at the 2024 local government elections, with escalation mapping, crisis communications and legal protocols, and NSW Police contingencies confirmed before polling opened; a disinformation register with escalation to platforms and police; work health and safety as a mandatory readiness criterion across a 22,990-person temporary workforce. The Project Managers Forum you established carried psychological safety, blockers and escalation as standing agenda items — which is a strategy for surfacing charged issues before they escalate.", "WHAT I NEED: a situation involving people under real strain that you personally handled — a serious incident on polling day, a team member in crisis during a compressed delivery window, a conflict between directors that you resolved, a redundancy or performance issue handled well, a distressed sponsor. Public sector panels test this deliberately because executive work involves it constantly, and a candidate whose examples are all systems and none of them people is a recognisable and unfavourable type."]}, {"c": "A6", "t": "Support and lead change and overcome discomfort when things are complicated, uncertain or unclear", "v": "cle", "vt": "", "body": ["STRENGTH: exceptional, and almost nobody will be writing to it yet. This indicator did not exist in the 2020 framework. Most candidates are still preparing from the old wording, so evidencing it directly is a differentiator in a comparative assessment.", "• CIPMO PMO establishment run explicitly as a change initiative. You did not treat standing up a PMO as a delivery task. It was structured on a recognised change model — building urgency, forming a guiding coalition of directors, delivering quick wins early to sustain support, and rolling out tools progressively as they were ready rather than in a single launch — with the quick wins themselves nominated by the directors who would have to live with them. Imposing standards on delivery teams who did not ask for them is precisely the discomfort this indicator names.", "• The enterprise PMO authority strategy. Holding an enterprise-wide mandate with no line authority over the delivery it governed, you attached the framework to the investment decision rather than to policy compliance — so that bypassing a standard cost funding rather than attracting a memo. That is leading change from a position without the authority to compel it.", "• RBC Dexia offshoring model. Deciding which work could leave the country while the ownership of the operation was unresolved is change leadership under maximum uncertainty."], "new3": true}], "ha": [{"c": "H1", "t": "Respond to significant, complex and new challenges with a high level of resilience and persistence", "v": "exc", "vt": "", "body": ["DEFENSIBLE WITHOUT QUALIFICATION. The 2023 State general election is a Highly advanced answer on its face: significant — a whole-of-state statutory event for 5.52 million electors; complex — a funding shortfall of roughly a third, legislation amended mid-delivery, a voting channel withdrawn, ageing infrastructure, live parliamentary scrutiny; new — no prior instance of that combination; and the resilience is evidenced by the outcome rather than asserted, at $4M under budget with informality improved in both chambers against the previous general election."]}, {"c": "H2", "t": "Raise critical issues, make difficult decisions with clarity and accountability", "v": "exc", "vt": "", "body": ["DEFENSIBLE WITHOUT QUALIFICATION. Three instances, each with the accountability visible:", "• The mandatory mobilisation gate at the 2024 local government elections — all venues contracted and accessibility-assessed, workforce at 85 per cent with training underway, ballots certified and in production, systems end-to-end tested, postal ready, comms in market, and no uncontrolled high or extreme risks. Every criterion mandatory, on a program whose end date was fixed in legislation. A readiness gate only means something if the person holding it is willing to say no.", "• The red rating and the plan-to-green in 2022, taken to a Commissioner-chaired committee with a documented recovery baseline.", "• Engineering the difficult decision into the system. In the portfolio product you built, missed scale-or-kill thresholds trigger automatic termination at the database layer — so a stalled initiative is killed by the control rather than by negotiation. That is making difficult decisions with clarity and accountability at the level of design rather than instance."]}, {"c": "H3", "t": "Use a range of strategies to respond constructively and act as a stabilising influence even in the most challenging situations", "v": "cle", "vt": "", "body": ["STRONG, arguable. The four-tier operational command structure you built for polling operations — Commissioner and Executive Control Group, Election Operations Command Centre, functional control rooms, and field operations under returning officers, with escalation mapping, crisis communications and legal protocols and NSW Police contingencies confirmed before polls opened — is a stabilising architecture rather than a personal act of stabilisation. That is arguably stronger, but be ready for a panel to ask what you did on the day, and have an answer."]}, {"c": "H4", "t": "Create an organisational culture that encourages and supports openness, persistence and genuine debate about issues", "v": "cle", "vt": "", "body": ["ARGUABLE — AND THIS IS WHERE A PANEL WILL PUSH. The word is organisational. Your evidence is program-level and function-level, which is real but not the same thing.", "• What you have: a Project Managers Forum whose terms of reference explicitly carried psychological safety, risk and issue escalation, blockers and continuous improvement — you designed a forum for people to say what was going wrong; a Program Leadership forum with escalation \"open to everyone through open door policy\"; an assurance method with a right of reply built in; a PMO founded on a stated transparency principle of no secrets and no surprises; and a community of practice spanning organisational boundaries.", "How to pitch it honestly: \"Across a program of nine functional directors and ten project managers, I designed the forums and the assurance method so that raising a problem was structurally safe\" is defensible and impressive. \"I created an organisational culture\" is a claim about an agency of thousands and invites a question you cannot answer. Take the first."]}, {"c": "H5", "t": "Recognise the need for change and create an environment that welcomes continuous improvement and adaptability", "v": "cle", "vt": "", "body": ["STRONG, and again almost nobody is writing to it. The 2024 program closed with lessons captured through structured debriefs and audits into a Continuous Improvement Register with assigned and tracked actions, transitioned to business as usual — so the next electoral event inherited the improvement rather than relearning it. In the enterprise PMO, the framework carried an annual review in which any artefact without a named consumer was deleted rather than defended. In your own methodology, a maturity re-diagnostic is one of seven mechanically enforced controls and fires at gates. Three different instances of building the improvement loop into the machinery."], "new3": true}, {"c": "H6", "t": "Clearly explain and support agreed positions while staying open to valid suggestions for changes", "v": "cle", "vt": "", "body": ["THE WEAKEST OF THE SIX. It is the Highly advanced form of the openness-to-criticism gap flagged above, and it has the same root cause. What you can show is the change-request route and change advisory board sitting above an endorsed framework — an agreed position with a legitimate mechanism for challenging it. What you cannot yet show is an instance where a valid suggestion changed your position. Same request as before: give me one."]}], "stars": [{"title": "The STAR answer — Advanced, written to be spoken", "sub": "Roughly two and a half minutes at interview. Action dominant, first person throughout, measurable result. Indicator language woven in without sounding recited.", "s": ["In the year leading into the 2024 Local Government elections, the Electoral Commission was under sustained financial pressure that had been publicly acknowledged — the Commissioner had put on record that funding shortfalls were creating risk to the conduct of elections, with more than fifty electoral systems unable to meet mandatory cyber security policy. During that period the agency's funding submission was unsuccessful. That triggered an organisation-wide restructure, the cessation of several programs and projects across the portfolio, and significant anxiety across the workforce, with people uncertain whether their roles would continue. Leadership also changed, with an Acting Commissioner appointed five months before polling day. The election program I managed held the only substantial remaining budget, against an election date fixed in legislation that could not move."], "t": ["I was accountable for delivering the election within its investment authority, and I was carrying program-level risk for cost pressure with mitigations already in place. But I judged that the bigger risk was different: in an organisation that had just lost its funding case, a large contingency sitting inside my program was both an unexamined assumption and, frankly, a temptation. My task was to establish what the program would genuinely cost, whether the contingency covered it, and to do that transparently rather than defensively — while keeping a workforce that was frightened about its future focused on an event that could not be late."], "a": ["I took three steps, each with the Steering Committee's agreement rather than on my own authority.", "• I sought Steering Committee endorsement to raise a program-wide change request to fully expose the cost position across every workstream — not to seek more money, but to test whether the contingency would cover the known pressures and to establish how further unknown costs would be mitigated. I chose to open my own program to that scrutiny at the moment when nobody would have questioned me for staying quiet. The exercise showed the contingency being exhausted.", "• I took that finding straight back to the Steering Committee rather than managing it inside the program, and secured agreement to institute an additional cost control and financial management strategy — reporting over-spend and under-spend at project level on a standing cycle, so variance was visible in period rather than discovered at closure.", "• I built the recovery mechanism into the control: project underspends were swept back into contingency quarterly. That single change altered the incentive across the program. Contingency stopped being a fixed pool that drains, and became a revolving one that projects replenished — which meant I could support further legitimate draws where they were genuinely needed while the overall position improved rather than deteriorated.", "Alongside that I held the program's delivery cadence unchanged through the restructure — the governance forums, the reporting rhythm and the readiness gates all continued to the same standard, because in a period when people cannot control what is happening to them, the thing you can give them is certainty about the work itself."], "r": ["The election was delivered on the statutory date, with forecast spend published at $122.8 million against a $150 million investment authority. The entire contingency was returned as savings — to an agency that had just been awarded nothing and was cutting programs. No high residual risks remained at closure, and every benefit in the realisation register was assessed as achieved. The cost control mechanism I introduced was carried into business as usual."], "notes": [], "probes": [], "keys": ["$122.8 million", "$150 million", "Steering Committee"], "bul": ["I sought Steering Committee endorsement to raise a program-wide change request to fully expose the cost position across every workstream — not to seek more money, but to test whether the contingency would cover the known pressures and to establish how further unknown costs would be mitigated. I chose to open my own program to that scrutiny at the moment when nobody would have questioned me for staying quiet. The exercise showed the contingency being exhausted.", "I took that finding straight back to the Steering Committee rather than managing it inside the program, and secured agreement to institute an additional cost control and financial management strategy — reporting over-spend and under-spend at project level on a standing cycle, so variance was visible in period rather than discovered at closure.", "I built the recovery mechanism into the control: project underspends were swept back into contingency quarterly. That single change altered the incentive across the program. Contingency stopped being a fixed pool that drains, and became a revolving one that projects replenished — which meant I could support further legitimate draws where they were genuinely needed while the overall position improved rather than deteriorated."]}, {"title": "The STAR answer — written to be spoken", "sub": "Around two minutes. Note how much of the Action is about what you did with your own reaction rather than what you did to the problem — that is deliberate, because it is what the indicator is testing.", "s": ["At the program kick-off for the 2024 Local Government elections, a significant amount of the session was taken up with complaints from project managers that lessons from previous electoral events had not been implemented. It was disrupting a meeting that had a lot of ground to cover, so I proposed taking the issues offline. The executive challenged me on that directly — their view was that the stakeholders needed to be heard properly, not deferred, and that I should report back on what came out of it. They were right and I was not, and I said so."], "t": ["I took the action to convene and chair a dedicated Project Managers Forum, since the project managers were the group raising the concerns, with the enterprise PMO and the project management practice lead in the room. What became clear quite quickly was that most of the concerns were not about the election program at all. They were about enterprise methodology, compliance requirements, process and practice — which I had built, in my previous role as senior manager in the enterprise PMO. So I was chairing a session in which the primary complaint was about my own work."], "a": ["The most useful thing I can tell you about that session is what I noticed in myself. I found myself instinctively defending the processes, because they were mine. Recognising that early mattered more than anything else I did, because a chair who is defending is no longer listening, and the people in that room had already been deferred once.", "• So I made a deliberate decision to record every concern rather than answer it. Each issue raised was captured and minuted in the stakeholder's own terms, including the ones I disagreed with and the ones that reflected badly on decisions I had taken. If I had filtered at the point of capture, the exercise would have confirmed my own view and the group would have known it.", "• The substance of the feedback was a fair hit. We had been changing the engine mid-flight — revising methodology and process on delivery teams while they were mid-delivery — and imposing change control on the organisation without applying it to ourselves. That is an uncomfortable thing to hear about work you have built and a harder thing to accept than to describe.", "• The group wanted decisions in the room, not a report later, so I gave direction and firmed the methodology positions where I could, so that teams had certainty to move forward rather than an open consultation that would still be running in three months.", "• I then closed the loop formally. Minutes, decisions, actions and escalations went to the Project Leadership Team, so that what had been raised in a forum became a tracked and controlled set of items rather than a ventilation session. The Leadership Team confirmed they were satisfied that the concerns had reached closure and that a monitoring and control process was in place."], "r": ["The agreed outcome was structural rather than a set of fixes: the Elections PMO and the enterprise PMO would jointly develop a service catalogue defining what the PMO actually offered its delivery teams, and would engage stakeholders on any proposed change to it before making it. In other words, the two failures the project managers had identified — an undefined offer and unannounced change — were addressed at the level of the operating model rather than case by case. [What specifically changed in the methodology, and what the catalogue ended up containing — to confirm]", "The wider result was that the kick-off issue stopped being a grievance and became a governance input. The project managers had a forum, a record and a commitment, and the program started with them engaged rather than deferred."], "notes": [], "probes": [], "keys": ["Project Managers Forum", "Project Leadership Team", "The Leadership Team"], "bul": ["So I made a deliberate decision to record every concern rather than answer it. Each issue raised was captured and minuted in the stakeholder's own terms, including the ones I disagreed with and the ones that reflected badly on decisions I had taken. If I had filtered at the point of capture, the exercise would have confirmed my own view and the group would have known it.", "The substance of the feedback was a fair hit. We had been changing the engine mid-flight — revising methodology and process on delivery teams while they were mid-delivery — and imposing change control on the organisation without applying it to ourselves. That is an uncomfortable thing to hear about work you have built and a harder thing to accept than to describe.", "The group wanted decisions in the room, not a report later, so I gave direction and firmed the methodology positions where I could, so that teams had certainty to move forward rather than an open consultation that would still be running in three months.", "I then closed the loop formally. Minutes, decisions, actions and escalations went to the Project Leadership Team, so that what had been raised in a forum became a tracked and controlled set of items rather than a ventilation session. The Leadership Team confirmed they were satisfied that the concerns had reached closure and that a monitoring and control process was in place."]}, {"title": "ANSWER A — The recovery", "sub": "Inheriting the 2023 State general election program at red. This is your highest-ceiling answer and the one a panel is most likely to remember. The Situation and Result below are complete and externally verifiable. The Action is scaffolded rather than written, because only you can supply what was actually red and what you actually did — and the Action is where the score is.", "s": ["I took over the program to deliver the 2023 NSW State general election with the program rated red. The conditions were unusually adverse and most of them were on the public record. The Commission had received an initial funding allocation of $89.1 million against an estimated delivery cost of $140.7 million — a shortfall of around $51.6 million, with a $50.5 million submission to Treasury unresolved when I started. A parliamentary joint standing committee had been given a reference to inquire into whether the Commission was adequately funded to conduct that very election. The Electoral Act was then amended mid-program to compress the maximum early voting period from thirteen days to seven, concentrating the same demand into a shorter window. Separately, the Commissioner determined that the internet voting channel would not be available, removing an established option relied on by electors with disability and those overseas or in remote areas. The Commission's own stated cost drivers included expiring software licences, obsolete equipment and a timeline compressed by the postponement of the local government elections. And polling day was fixed in statute for 25 March 2023."], "t": ["I was accountable for delivering a statutory event that could not be late, for an electorate of 5.5 million, in a program that was rated red and in an agency whose capacity to fund it was being examined by Parliament. My task was not to defend the rating or explain it — it was to establish honestly why the program was red, build a credible path back to green, and secure endorsement for a changed course from a Steering Committee chaired by the Electoral Commissioner, a statutory officer accountable to Parliament rather than to a minister."], "a": ["What follows is not draft text. It is the structure the Action needs, with the questions only you can answer. Give me these and I will write it properly — and it will be the strongest answer in your set.", "• The diagnosis. What was actually red — which workstreams or readiness criteria, measured against what: schedule, cost, risk exposure, a readiness gate, an assurance rating? Who rated it, and when did you assume the role relative to that rating? A panel needs to hear that you inherited a rating made by someone else, and that you then formed your own independent view of why.", "• The two or three structural moves in the plan to green. Not the whole plan — the small number of changes that actually shifted the position. Was it rebaselining the schedule around the new statutory early voting window? Resequencing the workstreams? Changing the resourcing model? Renegotiating scope with the Commission? Standing up different governance? Whatever they were, those are the Action.", "• The unwelcome part. A plan to green almost always contains something the organisation does not want to accept — a scope reduction, a cost increase, a deferred capability, an assumption someone has to own. What was yours, and how did you get it accepted?", "• The two dates. When the Steering Committee endorsed the plan, and when the status moved to green. Two dates make the whole claim testable, which is precisely what makes it credible.", "• The stabilising dimension. What did the program look like to the people delivering it while all this was happening? A red program under parliamentary scrutiny with an immovable date is frightening to work on. What did you do to keep it steady — cadence, communication, shielding, decision speed?"], "r": ["The election was delivered on the statutory date of 25 March 2023. Total funding was $144.3 million and actual expenditure $140.3 million — four million dollars under budget, in a program that had opened the year with a shortfall of roughly a third of its estimated cost. Early voting venues were increased by 42 per cent on the previous state election and around 1,500 additional staff engaged to service the compressed window. Postal voting demand rose to 540,208 votes issued, an increase of 118 per cent. And the outcome measures that matter to the institution improved rather than merely held: informality fell in both chambers against the 2019 general election, from 3.46 to 3.28 per cent in the Legislative Assembly and from 6.35 to 5.69 per cent in the Legislative Council, with turnout sustained at 90 per cent across 4.86 million Assembly and 4.90 million Council votes cast.", "Why this reaches Highly advanced: it is significant — a whole-of-state statutory event; complex — underfunded by a third, with its enabling legislation amended and a delivery channel withdrawn mid-program; and new — there is no prior instance of that combination. The resilience is evidenced by the outcome rather than asserted, and the outcome is better than the baseline it inherited, not merely equal to it."], "notes": [], "probes": [], "keys": ["$89.1 million", "$140.7 million", "$51.6 million", "$50.5 million", "$144.3 million", "$140.3 million", "The Commission", "The Electoral Act", "Steering Committee", "Electoral Commissioner"], "bul": ["The diagnosis. What was actually red — which workstreams or readiness criteria, measured against what: schedule, cost, risk exposure, a readiness gate, an assurance rating? Who rated it, and when did you assume the role relative to that rating? A panel needs to hear that you inherited a rating made by someone else, and that you then formed your own independent view of why.", "The two or three structural moves in the plan to green. Not the whole plan — the small number of changes that actually shifted the position. Was it rebaselining the schedule around the new statutory early voting window? Resequencing the workstreams? Changing the resourcing model? Renegotiating scope with the Commission? Standing up different governance? Whatever they were, those are the Action.", "The unwelcome part. A plan to green almost always contains something the organisation does not want to accept — a scope reduction, a cost increase, a deferred capability, an assumption someone has to own. What was yours, and how did you get it accepted?", "The two dates. When the Steering Committee endorsed the plan, and when the status moved to green. Two dates make the whole claim testable, which is precisely what makes it credible.", "The stabilising dimension. What did the program look like to the people delivering it while all this was happening? A red program under parliamentary scrutiny with an immovable date is frightening to work on. What did you do to keep it steady — cadence, communication, shielding, decision speed?"]}, {"title": "ANSWER B — The environment", "sub": "Building a delivery environment in which people raised problems early. This one is complete — every element below comes from material you have already given me or from the published record. It carries the two indicators that are distinctively Highly advanced, and which Answer A does not reach.", "s": ["Across two consecutive statutory electoral events I was accountable for delivery through nine functional directors and ten project managers, with the Elections PMO as secretariat to the program's governance. The particular risk in electoral delivery is not incompetence — the people are capable and the methods are known. It is silence. When the end date is fixed in legislation and failure becomes a matter of public and parliamentary record, the incentive to conceal a problem until it looks recoverable is very strong, and a problem concealed for three weeks in an election program is a problem that can no longer be fixed. The Commission was also operating under sustained financial pressure that its own Commissioner had put on the public record as a risk to the conduct of elections, which raises the temperature further."], "t": ["I judged that my primary task was not to detect problems but to make disclosing them the easier option. Detection scales badly — I could not personally review 13 projects across 14 workstreams. What scales is an environment in which the person closest to the problem raises it, because doing so is structurally safe and predictably useful. That had to be designed, not encouraged, because exhortation does not survive pressure."], "a": ["• I gave every category of issue a named place to go. I established a seven-forum governance model — Program Steering Committee, Technology Scope and Risk, Procurement, Project Leadership, Program Leadership, Financial and Cost Control, and a Project Managers Forum — each with defined terms of reference, risk scope, escalation path and cadence from weekly to monthly, with the Elections PMO as secretariat to all seven. Nobody had to work out where to take something, which removes one of the commonest reasons issues sit.", "• I built a forum whose explicit purpose was surfacing what was not working. The Project Managers Forum carried psychological safety, blockers, risk and issue escalation, interdependencies and continuous improvement as standing agenda items. It was the people closest to delivery, meeting on a fixed cadence, with the agenda naming the difficult things rather than leaving them to be raised under any other business. I chaired it.", "• I removed the hierarchy filter on escalation. Program Leadership operated an open-door escalation policy — open to everyone — so that an issue did not have to travel up a reporting line, being softened at each step, before it reached the person who could act on it.", "• I designed the assurance method to be survivable rather than punitive, because assurance read as audit destroys the evidence base permanently — people begin concealing and the reviews stop telling you anything. So: readiness declared by the delivery team before a review rather than reviews being sprung; findings documented against observable criteria rather than sentiment ratings; the project owner and delivery lead sighted before any committee; a management response authored by the reviewed party; assessment and response presented to the committee together, so the finding never travels alone; and hold treated as a legitimate outcome rather than a failed review. The seven steps ran identically at every gate, which meant the method could not be reshaped to suit a difficult finding.", "• I tested it on myself when the moment came. At the program kick-off for the second event, project managers raised sustained complaints that lessons from previous elections had not been implemented. My instinct was to take it offline; the executive challenged that and directed that the stakeholders be heard. I convened and chaired the forum, and most of the criticism turned out to be about enterprise methodology and process that I had built in my previous role. I recorded every concern in the stakeholders' own terms, including the ones I disagreed with, and gave methodology direction in the room so teams had certainty to move. An environment that supports genuine debate is only real at the moment the debate is about the person who built it.", "• I closed the loop into the next cycle. At program closure, lessons were captured through structured debriefs and audits into a Continuous Improvement Register with assigned and tracked actions, and transitioned to business as usual — so the next electoral event inherited the improvement rather than relearning it. In the enterprise framework, an annual review deleted any artefact that could not name its consumer rather than defending it."], "r": ["The Commission's own published report on the 2024 elections records that \"the NSW Electoral Commission's Enterprise Portfolio Management Office provided support and assurance services to the project teams, the governance framework, monitoring progress during the design, development, operational readiness, go-live and closure phases of the projects.\" That is the agency, in a report tabled with the Minister for Local Government, describing the function I established as having provided the governance and assurance for a whole-of-state statutory election.", "Across the two events the environment held under maximum load: the 2023 State general election recovered from red and delivered four million dollars under a $144.3 million budget with informality improved in both chambers; the 2024 Local Government elections delivered on the statutory date with forecast spend of $122.8 million against a $150 million investment authority, the full contingency returned as savings, no high residual risks at closure, and every benefit in the realisation register assessed as achieved. The kick-off criticism produced a joint service catalogue defining what the PMO offered its delivery teams and a commitment to engage stakeholders before changing it — the environment improving itself, which was the point."], "notes": [], "probes": [], "keys": ["$144.3 million", "$122.8 million", "$150 million", "The Commission", "Program Steering Committee", "Technology Scope", "Project Leadership"], "bul": ["I gave every category of issue a named place to go. I established a seven-forum governance model — Program Steering Committee, Technology Scope and Risk, Procurement, Project Leadership, Program Leadership, Financial and Cost Control, and a Project Managers Forum — each with defined terms of reference, risk scope, escalation path and cadence from weekly to monthly, with the Elections PMO as secretariat to all seven. Nobody had to work out where to take something, which removes one of the commonest reasons issues sit.", "I built a forum whose explicit purpose was surfacing what was not working. The Project Managers Forum carried psychological safety, blockers, risk and issue escalation, interdependencies and continuous improvement as standing agenda items. It was the people closest to delivery, meeting on a fixed cadence, with the agenda naming the difficult things rather than leaving them to be raised under any other business. I chaired it.", "I removed the hierarchy filter on escalation. Program Leadership operated an open-door escalation policy — open to everyone — so that an issue did not have to travel up a reporting line, being softened at each step, before it reached the person who could act on it.", "I designed the assurance method to be survivable rather than punitive, because assurance read as audit destroys the evidence base permanently — people begin concealing and the reviews stop telling you anything. So: readiness declared by the delivery team before a review rather than reviews being sprung; findings documented against observable criteria rather than sentiment ratings; the project owner and delivery lead sighted before any committee; a management response authored by the reviewed party; assessment and response presented to the committee together, so the finding never travels alone; and hold treated as a legitimate outcome rather than a failed review. The seven steps ran identically at every gate, which meant the method could not be reshaped to suit a difficult finding.", "I tested it on myself when the moment came. At the program kick-off for the second event, project managers raised sustained complaints that lessons from previous elections had not been implemented. My instinct was to take it offline; the executive challenged that and directed that the stakeholders be heard. I convened and chaired the forum, and most of the criticism turned out to be about enterprise methodology and process that I had built in my previous role. I recorded every concern in the stakeholders' own terms, including the ones I disagreed with, and gave methodology direction in the room so teams had certainty to move. An environment that supports genuine debate is only real at the moment the debate is about the person who built it.", "I closed the loop into the next cycle. At program closure, lessons were captured through structured debriefs and audits into a Continuous Improvement Register with assigned and tracked actions, and transitioned to business as usual — so the next electoral event inherited the improvement rather than relearning it. In the enterprise framework, an annual review deleted any artefact that could not name its consumer rather than defending it."]}], "notes": [{"h": "First — thank you for the framework itself", "body": ["I have been working from Version 2: 2020 wording reconstructed from secondary sources. This is the actual Version 3: 2026 document, and it changes several things I would otherwise have got wrong. Two are directly relevant here: Advanced gains a new indicator about supporting and leading change under discomfort, and Highly advanced gains one about creating an environment that welcomes continuous improvement and adaptability. Resilience in Version 3 is no longer only about composure under pressure — it is about driving change while uncomfortable. That shift works in your favour, and I have mapped to it.", "I have saved the full Version 3 wording for the whole framework. Everything below quotes it verbatim, because panels score against the published indicators and translation under time pressure loses marks."]}, {"h": "The verdict, before the evidence", "body": ["For a PSSE Band 1 Director role this capability typically sits at Adept or Advanced, and it is not usually one of the near-universal focus capabilities. So Advanced is your target, you clear it comfortably, and the Highly advanced material is what moves an answer from Met to Exceeds rather than what you need to survive.", "Be careful here. The single most-cited reason senior NSW candidates are marked down is claiming a level the evidence sits below. Two of these six you can defend without qualification; four are arguable and one is a real stretch. My advice is to prepare all six, lead with the two, and let a panel draw the level conclusion themselves."]}, {"h": "The two gaps, stated once more because they are the whole message", "body": ["Both are answerable. Neither is a weakness in you — they are gaps in what you have told me, which is a different thing. But they need filling before this capability is interview-ready, because the prepared examples will hold and the follow-up questions are where a Band 1 panel actually differentiates candidates."]}, {"h": "What I would do next", "body": ["• Answer the two gaps above. Then I will write the three STAR answers for this capability at Advanced — one for high-pressure response, one for frank advice, one for leading change under discomfort — with the Action dominant and a measurable Result, in the framework's own verbs.", "• Let me do the same mapping for the other nineteen capabilities, or for the eight to ten a specific role description names as focus capabilities. This exercise is what converts thirteen CV sections into an application. It also surfaces gaps while there is still time to fill them, which is the point of doing it before you see a vacancy rather than after.", "• Prioritise the near-universal ones: Project management, Demonstrate accountability, Deliver results, Think and solve problems, Plan and prioritise, Communicate effectively and Influence and negotiate. Your strongest evidence sits in Project management and Demonstrate accountability, and I would expect both to reach Highly advanced comfortably.", "Say the word and I will start on Project management next — Version 3 wording, same treatment.", "Source: The NSW Public Sector Capability Framework, Version 3: 2026, Office of the Public Service Commissioner, © State of New South Wales 2026 — supplied by Naven Kumar and quoted verbatim. Evidence drawn from CV sections 1–13 prepared 13–14 August 2026, and from the public record where cited."]}], "script": {"id": "drc", "intro": ["This capability has one line of definition. Be open and honest, prepared to express your views, and willing to accept and commit to change. Notice it points two ways. Half is what you say when saying it is unwelcome. The other half is what you do when someone else is the one saying it.", "At Advanced the indicators want constructive response under pressure, frank advice against contrary views, openness to criticism of your own ideas, persistence on novel problems, decisiveness when things get emotional, and leading change through discomfort. What lifts an answer to that level is not that the situation was hard. It is that someone other than you can verify the pressure, and the outcome is measurable. Highly advanced then shifts the question. It stops asking what you did and starts asking what you built for other people to work inside.", "The trap is direction. Most candidates arrive strong on speaking truth to power and empty on being told they were wrong. A panel hears that imbalance fast, and it reads as someone comfortable being right rather than someone genuinely open. Version 3 sharpens it. Resilience is no longer only composure. It is driving change while you are uncomfortable."], "standing": ["At Advanced you clear 4 of 6 decisively, with 2 requiring work, on multiple independent examples across three decades. The two needing work are A3, openness to criticism, and A5, emotionally charged situations. At Highly advanced you are arguable on 4 and genuinely strong on 2. H1 and H2 are defensible without qualification.", "For a Band 1 Director role this capability usually sits at Adept or Advanced, and it is rarely a focus capability. So Advanced is the target and you clear it comfortably. Hold Highly advanced in reserve. Claim it only if a role description sets this capability there, and be ready for the organisational-culture challenge on H4. Prepare all six, lead with the two, and let the panel draw the level conclusion themselves."], "inds": {"A1": ["A1 is high pressure and unpredictable situations. Panels accept pressure they can verify. Yours is public. You inherited the 2023 State general election with $89.1 million allocated against an estimated $140.7 million, a $50.5 million Treasury submission unresolved, and a joint standing committee inquiring into whether the agency could be funded to run the very election you were delivering. Mid-program the Electoral Act cut early voting from thirteen days to seven, internet voting was withdrawn, and polling day was fixed in statute. You delivered at $140.3 million against $144.3 million with informality improved in both houses. So in the room, it sounds like this. I took a program rated red with a third of its cost unfunded, and delivered on the statutory date $4 million under budget."], "A2": ["A2 is frank advice in response to contrary views. General candour is not the test. Naming the room is. You costed the minimum credible path to a client's strategy target at roughly $240,000, then told the divisional leadership team the funded base case would reach only two of three capability pillars and push the target out by at least twelve months. On the AI transformation program you contradicted the sponsor's own diagnosis, showing suppliers were already at capacity below fifty wholesale accounts. Add the charter findings issued to seven project teams. So in the room, it sounds like this. I gave the leadership team the number they did not want, and named what being wrong would cost them."], "A3": ["A3 is the reciprocal of A2. Open to criticism of your own ideas. On personal evidence this one is not cleared. What you have is designed evidence, which still persuades at Director level. Your seven-step assurance spine requires a management response authored by the reviewed party, presented to the committee with the finding, so the finding never travels alone. Most organisations omit that step. What is missing is one occasion where you were told your idea was wrong and changed course, ideally challenged by someone junior or by a delivery team resisting your framework. Until that is solid, do not claim broad openness. Lead with the right of reply you designed into your own process."], "A4": ["A4 turns on one word. Novel. Not hard, not large. Without precedent. At RBC Dexia, hosting from United States data centres engaged three regimes at once. The USA PATRIOT Act access powers, Australian privacy obligations, and market-sensitive information handling, all inside the APRA prudential outsourcing standard that requires the regulator be consulted before a material offshoring arrangement. You worked it to a solution the institution could stand behind rather than logging it as a risk. At CIPMO the baseline found assurance operating on none of the ten projects reviewed, and you built the function that had never existed. So in the room, it sounds like this. Three legal regimes collided inside a prudential standard, and I stayed on it until we had a position the institution could stand behind."], "A5": ["A5 has two halves and you own one. Difficult issues you evidence comprehensively. Emotionally charged situations, meaning people rather than problems, you cannot. This one is not cleared. What exists is structural. A four-tier incident command structure at the 2024 local government elections, with crisis communications and legal protocols and NSW Police contingencies confirmed before polls opened. Work health and safety as a mandatory readiness criterion across a 22,990-person temporary workforce. What a panel wants underneath that is a person under real strain who you personally handled. Panels test this deliberately, and a candidate whose examples are all systems and no people is a recognisable type, and not a favourable one."], "A6": ["A6 is new in Version 3, so most candidates are still preparing to the old wording and answering it directly is a differentiator. Support and lead change and overcome discomfort when things are complicated, uncertain or unclear. The discomfort is the point. You ran the CIPMO PMO establishment as a change initiative, not a delivery task. Urgency, a guiding coalition of directors, quick wins early, and the directors nominating the quick wins they would have to live with. In the enterprise PMO you held a mandate with no line authority over the delivery you governed. So in the room, it sounds like this. I could not compel compliance, so I attached the framework to the investment decision, and bypassing a standard cost funding rather than attracting a memo."], "H1": ["H1 wants significant, complex and new challenges met with resilience and persistence. Take the three words in turn, because that is how a panel scores it. Significant is a whole-of-state statutory event for 5.52 million electors. Complex is a shortfall of roughly a third, legislation amended mid-delivery, a voting channel withdrawn, and live parliamentary scrutiny. New is that no prior instance of that combination exists. And the resilience is evidenced by the outcome, not asserted. $4 million under budget with informality improved in both chambers. This one is defensible without qualification. So in the room, it sounds like this. The election finished better than the baseline I inherited, not merely equal to it."], "H2": ["H2 is raising critical issues and making difficult decisions with clarity and accountability. The weight sits on accountability. A panel wants to know who owned the call. The mandatory mobilisation gate at the 2024 local government elections is your best instance. Venues contracted and accessibility-assessed, workforce at 85 per cent with training underway, ballots certified and in production, systems tested end to end, and no uncontrolled high or extreme risks. Every criterion mandatory, on a program with a legislated end date. Behind it, the plan-to-green taken to a Commissioner-chaired committee, and the portfolio product where missed scale-or-kill thresholds trigger automatic termination at the database layer. So in the room, it sounds like this. A readiness gate only means something if the person holding it will say no."], "H3": ["H3 wants a range of strategies to respond constructively and act as a stabilising influence in the most challenging situations. What you built is a stabilising architecture. Four tiers for polling operations. The Commissioner and Executive Control Group, the Election Operations Command Centre, functional control rooms, and field operations under returning officers, with escalation mapping, crisis communications and legal protocols and NSW Police contingencies confirmed before polls opened. That is arguably stronger than a personal act of stabilisation, because it holds when you are not in the room. But be ready for the obvious follow-up. A panel will ask what you did on the day. Have that answer before you offer this one."], "H4": ["H4 is where a panel will push, and the word to watch is organisational. Your evidence is program-level and function-level, which is real but not the same thing. A Project Managers Forum whose terms of reference carried psychological safety, escalation, blockers and continuous improvement. A Program Leadership forum with escalation open to everyone through an open door policy. A PMO founded on a transparency principle of no secrets and no surprises. So pitch the true claim. Across a program of nine functional directors and ten project managers, I designed the forums and the assurance method so that raising a problem was structurally safe. Saying you created an organisational culture is a claim about an agency of thousands, and it invites a question you cannot answer."], "H5": ["H5 is recognising the need for change and creating an environment that welcomes continuous improvement and adaptability. Like A6 it is new, and almost nobody is writing to it. Evidence the loop, not the intention. The 2024 program closed with lessons captured through structured debriefs and audits into a Continuous Improvement Register, with assigned and tracked actions transitioned to business as usual, so the next electoral event inherited the improvement rather than relearning it. In the enterprise PMO, an annual review deleted any artefact without a named consumer rather than defending it. So in the room, it sounds like this. I did not ask people to improve. I built the loop into the machinery, and it ran without me."], "H6": ["H6 is the weakest of the six. Clearly explain and support agreed positions while staying open to valid suggestions for changes. It is the Highly advanced form of the A3 gap, with the same root cause. What you can show is the mechanism. A change-request route and a change advisory board sitting above an endorsed framework, which is an agreed position with a legitimate way to challenge it. What you cannot show is an instance where a valid suggestion changed your position. Do not claim this one on mechanism alone. Describe the route honestly, say the framework was endorsed and challengeable by design, and stop there."]}, "stars": [["This is your Advanced answer, about two and a half minutes. It carries A2 first, because you opened your own program to scrutiny when nobody would have questioned you for staying quiet. It also carries A1 and H2. The moment that does the real work is the sweep. Underspends returned to contingency quarterly, so contingency stopped being a pool that drains and became one that projects replenished. Keep the action dominant and stay in first person, or it sounds like the program did it rather than you. Land the result as a number. $122.8 million against a $150 million investment authority, with the whole contingency returned as savings."], ["This is your openness answer, around two minutes, and it speaks straight to A3. Notice how much of the action is what you did with your own reaction rather than what you did to the problem. That is what the indicator tests. The moment that does the real work is internal. You caught yourself defending the processes because they were yours, and you stopped, because a chair who is defending is no longer listening. Deliver the concession without hedging. They were right and I was not, and I said so."], ["This is your highest-ceiling answer and the one a panel is most likely to remember. It carries H1 on its own, and the situation and result are complete and externally verifiable. $144.3 million funded against $140.3 million spent, early voting venues up 42 per cent, postal votes up 118 per cent to 540,208, informality down in both chambers. What is not yet written is the action, and the action is where the score is. Only you can supply what was actually red, the two or three structural moves in the plan to green, the unwelcome part someone had to accept, and the two dates. Endorsement and green. Two dates make the claim testable, and testable is what makes it credible."], ["Answer B is complete, and it carries the two Highly advanced indicators Answer A cannot reach. H4 and H5. The framing is the strongest part. In electoral delivery the risk is not incompetence, it is silence, and a problem concealed for three weeks can no longer be fixed. So you made disclosure the easier option by design, because exhortation does not survive pressure. The moment that does the real work is where you test the environment on yourself at the kick-off and find the criticism is about methodology you built. Close on the published line. The Commission's own report, tabled with the Minister for Local Government, records the office you established as having provided the support, assurance and governance framework across the projects."]], "outro": ["Two things close this capability. One example where you were told your idea was wrong, took it seriously and changed course, ideally challenged by someone junior to you or by a delivery team resisting your framework. And one situation involving people under real strain that you personally handled. Between them those close A3, A5 and H6. Until then, prepare all six, lead with H1 and H2, and pitch H4 at program level rather than organisational. And this is the sentence you own outright. I took a statutory election rated red, underfunded by roughly a third, with its legislation amended and a voting channel withdrawn mid-program, and delivered it on the fixed date $4 million under budget with informality improved in both chambers."]}}, {"id": "awi", "name": "Act with integrity", "group": "Personal Attributes", "desc": "Be ethical and professional, and uphold and promote the public sector values", "verdict": [["Advanced", "Cleared on all five indicators, three of them exceptionally. This is one of your strongest capabilities and you have been underselling it"], ["Highly advanced", "Cleared on four of five. The fifth turns on a single question about the internal data incident"]], "adv": [{"c": "A1", "t": "Model the highest standards of ethical and professional behaviour and encourage others to do the same", "v": "exc", "vt": "", "body": ["Exceptional. Modelling is cheap when it costs nothing. Yours cost something.", "• The contingency return. You returned $12M in an organisation that had just been awarded nothing, at a moment when holding it quietly would have gone unquestioned and would have given you flexibility everyone else had lost.", "• Your own practice governance. A published AI transparency statement; a commitment to publish the practice's annual value assessment to the same standard demanded of every client business case, including in unfavourable years; operating as your own Client Zero.", "• The kick-off forum. Minuting criticism of your own processes in the stakeholders' own terms rather than filtering it at the point of capture."]}, {"c": "A2", "t": "Set an example for others to follow by representing your organisation in an honest, ethical and professional way", "v": "cle", "vt": "", "body": ["Strong.", "• $80M of high-risk tendering through the Procurement Steering Committee you chaired with the CIO and COO — approving evaluations and recommending vendors under probity obligations, in an environment where a procurement failure becomes a public integrity failure.", "• RBC Dexia data sovereignty. You resolved the PATRIOT Act exposure rather than accepting and documenting it as a risk.", "• The telecommunications investment case — telling a client the cheap option met their target with no margin for error."]}, {"c": "A3", "t": "Promote a culture of integrity and professionalism within your organisation and when dealing with external organisations", "v": "cle", "vt": "", "body": ["Strong.", "• Seven governance forums, each with terms of reference defining membership and decision-making powers, defined risk scope and escalation path, with the Elections PMO as secretariat to all seven — so an integrity question had a named route rather than depending on who you knew.", "• Vendor and systems-integrator governance: onboarding protocols, performance frameworks and assurance checkpoints through the lifecycle.", "• \"No secrets, no surprises\" as a stated founding principle at the cultural infrastructure PMO."]}, {"c": "A4", "t": "Reinforce and monitor the use of ethical practices, standards and systems", "v": "exc", "vt": "", "body": ["Exceptional — your single best-evidenced indicator anywhere in the framework.", "• The seven-step assurance spine run identically at every gate, specifically so the method could not be reshaped to suit a difficult finding.", "• Two-officer verification and discrepancy thresholds in counting; chain-of-custody tracking across 9.6 million ballot papers.", "• Compliance reviews and resolutions actioned as a standing deliverable in the frameworks you designed.", "• Automatic, auditable status logging on every order, supplier and lead record in the systems you built — auditability as a design property rather than a report.", "• A supplier qualification gate with auto-logged stage transitions, so the vetting trail is evidenced rather than asserted."]}, {"c": "A5", "t": "Promote practices and systems that create a workplace culture that values high ethical standards and behaviour", "v": "exc", "vt": "", "body": ["Strong. Note this is new wording in Version 3 — it replaced \"act promptly on reported breaches\", so Advanced is now about building the culture rather than policing it. That shift favours you.", "• Project Managers Forum with psychological safety as a standing agenda item.", "• Open-door escalation removing the hierarchy filter at Program Leadership.", "• A management response authored by the reviewed party, presented to committee with the finding — a right of reply most organisations omit.", "• Materiality thresholds published before any escalation occurs. This is the sophisticated one and I would lead with it: escalating becomes the process working rather than an accusation."]}], "ha": [{"c": "H1", "t": "Champion and model the highest standards of ethical and professional behaviour", "v": "cle", "vt": "", "body": ["Strong. \"Champion\" is public advocacy, not personal conduct alone. The practice positioning — evidence over assertion, publishing your own value assessment including unfavourable years, the transparency statement, no junior leverage model — is advocacy. So is eight years teaching the capstone and a directorship of the largest Australian chapter of your professional body."]}, {"c": "H2", "t": "Lead a culture of integrity and professionalism within your organisation and when dealing with other government agencies, jurisdictions and external organisations", "v": "cle", "vt": "", "body": ["Good. Note the Version 3 addition of jurisdictions. You have it: 39 staff from the Tasmanian, Victorian and Western Australian electoral commissions integrated into delivery; NSW Police liaison; 127 councils; Cyber Security NSW and the Australian Cyber Security Centre on an assurance panel; the Audit Office; and vendor and supplier representation at $80M scale."]}, {"c": "H3", "t": "Set, communicate, evaluate and reinforce the use of ethical practices, standards and systems", "v": "exc", "vt": "", "body": ["Exceptional. Four verbs, and you evidence all four distinctly — which almost no candidate can."]}, {"c": "H4", "t": "Create and promote an organisational culture in which staff feel able to report apparent breaches of legislation, policies and guidelines and respond promptly to reports", "v": "cle", "vt": "", "body": ["Cleared — both halves.", "• Culture half: desktop exercises taking the entire organisation through incident scenarios; drills; published escalation thresholds; psychological safety on the forum agenda. Rehearsal is the most effective way to make reporting normal — people who have practised raising an incident raise real ones faster.", "• Response half: two data incidents during the 2024 elections, both activated, mitigated and recovered in line with rehearsed procedures, with minimal service disruption and electoral integrity maintained. The external incident is corroborated in the Commission's published report."]}, {"c": "H5", "t": "Act promptly and visibly to prevent and respond to unethical behaviour", "v": "par", "vt": "", "body": ["Strong on prevention. Response turns on one question.", "Prevention is comprehensive: the insider threat scenario is explicitly a rehearsal for
