en. The coaching here is restraint. Do not spend your best material proving you attended a steering committee. Clear this in one sentence, then move the evidence up to H1 where it earns far more. So in the room, it sounds like this. I did not sit on that programme's governance, I designed the seven forums and their terms of reference."], "H7": ["The operative word is decisions. A panel accepts a dependency register only if it drove one. Your strongest artefact answers this and it has been sitting unused. The high-level critical path for LGE24 is a single A0 sheet, dated 22 August 2023, thirteen months before polling day, with your name on it as contact. Roughly twenty swimlanes across two financial years, and a systems lane carrying roughly nineteen applications, each with its own user acceptance, security and performance test windows. Dependencies are drawn between the lanes, and one red line runs vertically through all of them. Election day, 14 September. So in the room, it sounds like this. That chart does not describe interdependencies, it makes them decidable thirteen months out against a date that cannot move."], "H1": ["This indicator decides Advanced from Highly advanced. It asks about your organisation, not your project. You did not contribute to the Commission's project management system. You wrote it. The NSWEC Project Management Methodology runs three summary phases, Concept, Strategic Planning and Delivery, across nine detailed phases, with seven governance gates, each carrying a mandatory EPMO assurance gate report. Around it sat a P3O operating model, portfolio tooling with adoption driven, a monthly Community of Practice and a measured maturity uplift against P3M3.", "Then the durability proof. The Community of Practice outlasted your tenure. The change request process you designed was still governing the programme you ran two roles later, so you were subject to your own system. And it is instantiated as gates in the agency's live portfolio platform, still governing the 2027 State general election programme. So in the room, it sounds like this. A methodology still running the next election two cycles later is not a document, it is the organisation's operating system for delivery, and I wrote it."], "H5": ["Two limbs. Does the organisation manage risk, and does it have strategies for when projects differ from plan. What lifts your answer is that risk was a condition inside the plan rather than a register beside it. Gate 2 could not be passed with any uncontrolled high or extreme risk. A weekly Programme Leadership forum governed risks and issues. The procurement tracker was risk-prioritised before a strategy was written. The programme closed with no high residual risks. The responses are evidenced too. A plan to green approved by a Steering Committee, a vendor re-tender, and a resilience capability stood up after event assurance did not achieve its posture. So in the room, it sounds like this. Risk was not reported alongside my plan, it was a condition inside it."], "H3": ["Broader context is where candidates wave at the political environment and say nothing. The test is whether context changed a direction or mitigated a risk. You worked with senior executives on the Commission's strategic plans and goals, with the Chief Financial Officer and the EPMO portfolio on portfolio priorities including organisational structure and funding needs, and with stakeholders on election regulatory priorities, then converted all three into programme strategy, structure, resourcing model and investment plan. Then the lived version. At SGE23 the Electoral Act was amended mid-programme to cut early voting from thirteen days to seven, against a $51.6 million gap between allocation and estimate. At LGE24 the Commissioner retired months before delivery with no funding uplift. So in the room, it sounds like this. Context did not inform those programmes from the outside, it changed underneath them twice."], "H4": ["Notice the word commitment. Not consultation, not engagement. Commitment from people who were free to decline. One structural fact carries this. Eleven of the organisation's twelve Band 1 executives reported into your programme for delivery, at a substantive grade above your own, and none of them reported to you. Commitment there could only be obtained, never required. Cross-organisational is evidenced at more than one boundary. The Australian Electoral Commission for enrolment, Revenue NSW for penalty recovery, and 127 councils as autonomous customers each free to buy the service elsewhere. So in the room, it sounds like this. Eleven of twelve Band 1 executives delivered into my programme at a grade above mine, and not one reported to me."], "H6": ["This one is cleared rather than exceptional, and it helps to know why. A benefits framework carried integrity, timeliness, participation and accessibility, operational efficiency, public trust and compliance, all recorded as achieved at closure, with lessons transitioned to business as usual through a Continuous Improvement Register. The nuance to pre-empt is that benefits realisation in an election is unusual, because the benefit largely is the event. A lawful election delivered on time. If a panel probes for post-implementation benefit capture, do not manufacture it. Point instead to the service catalogue, the complaint handling process, the resilience capability, and a Community of Practice that outlasted you. So in the room, it sounds like this. In an election the benefit largely is the event, so I judge the change I led by what the next programme inherited."], "H2": ["This was the one gap in the capability, and the methodology you wrote settles it. It makes concept and business case assessment an EPMO function with a named decision chain. Submissions arrive through Project Hub, are reviewed for completeness and prioritised for strategic alignment, with EPMO comments appended to the Concept Brief before anything reaches the Strategic Executive Committee. At the gate assessment, business case assurance is completed and Finance is engaged on the economic, financial and cost benefit analysis.", "So the vote sat with the Committee, and the assessment it voted on was yours. Say it this way, without overclaiming. The Strategic Executive Committee held the approve-or-reject vote. The assessment, the strategic alignment prioritisation and the business case assurance it voted on were the EPMO's, and as interim EPMO Director I held that through a business planning cycle. I rejected change requests in my own right."]}, "stars": [["This answer carries H7 on interdependencies, with A1 on scope and A6 on stage transitions underneath it. Its strength is that it is built around an object. One A0 sheet, dated, carrying your name, produced thirteen months out. Very few candidates can put a physical thing on the table that proves the claim, so take it in if the format permits.", "The real work is done by two design decisions. Dependencies drawn between lanes rather than described in a register, so the consequence of any slippage was visible as a line reaching a date. And everything sequenced backwards from statutory milestones that could not move. Keep the phrase anchored to the law rather than to the effort available. That is the discipline of election delivery in one line. The thing you must not forget is the probe. If they ask what happened when something slipped, have one specific instance ready. A critical path's credibility rests on having been used to make a decision, not on its existence."], ["This is your H1 answer, with A4, A7 and H5 supporting. One allocation warning first. It is the same material as your lead answer in the Think and solve problems pack, framed differently. This capability is its more natural home, so keep it here and let that pack lead on the delivery maturity analysis.", "Lead with the diagnosis, not the model. Starting from a P3M3 assessment rather than a template is what separates you from every candidate who has stood up a PMO. The service catalogue reframe is your one genuine claim to originality in this capability, so make it explicitly, then let the external validation carry it. And fix the P3M3 labels before this goes anywhere. Quantitative is CMMI Level 4, not P3M3. Mixing the two in front of an EPMO panel is fatal, and a three-level jump in thirty-one months will be challenged."]], "outro": ["Nothing here needs new evidence. It needs confirmations. The portfolio platform name, because your CV currently names two different vendors' products, Planview and Clarity, and the live system appears to be a Dataverse-based platform. The measurement basis for the adoption figure. And your honest P3M3 start and end levels in P3M3's own labels, which are Aware, Repeatable, Defined, Managed and Optimised. Confirm the interim EPMO Director appointment in the same pass, including the months, the arrangement, the grade and the size of the function. Then lead with the sentence you own. The test of a project management system is not whether it works while its author is there, it is whether it constrains them afterwards."]}}, {"id": "mdp", "name": "Manage and develop people", "group": "People Management", "desc": "Engage with and motivate staff, and develop their capability and potential", "verdict": [["Advanced", "5 of 6 cleared, three exceptionally. A6 — cultural capability and cultural safety — does not clear"], ["Highly advanced", "6 of 8 cleared, one exceptionally. H1 partial. H7 — cultural capability — does not clear"]], "adv": [{"c": "A1", "t": "Refine roles and responsibilities over time to achieve better business outcomes", "v": "cle", "vt": "CLEARED", "body": ["An election programme is a temporary organisation designed from scratch and then adjusted under load: thirteen aggregate projects, fourteen workstreams, nine functional directors, ten project managers and a three-person PMO, with a four-tier operational command structure standing up for the event itself. In the EPMO role, the service catalogue redefined what the function owed each consumer, and the P3O operating model redefined the roles around it."]}, {"c": "A2", "t": "Recognise talent, develop team capability and succession plan", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The strongest possible evidence for this indicator, and very few candidates have it: you have coached several direct reports who then moved into your role when you vacated it.", "Succession planning is usually evidenced by a document. Yours is evidenced by outcome — more than once, the person who replaced you was someone you had developed. That is also the only version of the claim that cannot be challenged, because it either happened or it did not.", "ON NOT NAMING THEM — you are right. Do not name individuals in an application. Say \"on more than one occasion the person who succeeded me in the role was someone I had coached into it\" and let the panel ask. If they ask in interview, you can speak to it generally without identifying anyone."]}, {"c": "A3", "t": "Coach and mentor staff and encourage professional development and continuous learning", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Four distinct layers, which is unusual. Direct coaching of successors. A monthly Community of Practice, topic-led and open to anyone interested rather than restricted by role, which outlasted your tenure. Eight years teaching postgraduate project management at the University of Sydney and a year at TAFE NSW. And the University of Sydney delivery cohort, where you led through direction-setting, empowerment and coaching rather than instruction.", "§ The instance to use, because it shows the method rather than the volume", "You set development of the programme critical path as a development goal for your Master Scheduler — a stretch assignment on the artefact the whole programme would run on. She was technically strong and did not engage stakeholders, and successive versions did not meet the objective. You did not take the work off her and you did not correct the drafts. You brought the key stakeholder into a focused session and drew the critical path on a whiteboard with her in the room, and she saw what had been missing: stakeholder engagement and the tacit knowledge subject matter experts hold about how work actually sequences.", "The systemic version sits behind it. In PMGT5850 you coach nine to ten teams a year through initiating, planning, executing and closing real projects — coaching from the sideline, requiring retrospectives, offering what good could look like rather than prescribing it. Experiential learning designed so that failure is survivable and the learning is extracted deliberately.", "THE FRAMING THAT MAKES THIS LAND. The Master Scheduler’s failure was not engaging stakeholders — the same failure the delivery community had named in your own methodology at the programme kick-off. You had learned it at your own expense. Teaching it cost a whiteboard and an afternoon. Say that, and the story stops being about coaching technique and becomes about transmitting an organisational lesson."]}, {"c": "A4", "t": "Prioritise dealing with team and individual performance issues and ensure your organisation uses a consistent approach", "v": "cle", "vt": "CLEARED", "body": ["This is the indicator most candidates cannot evidence, because most executives avoid the work it describes. You have managed individual performance to conclusion through the agency’s framework, including where the situation escalated to external arbitration.", "The \"consistent approach\" limb matters as much as the first. Using the organisation’s framework rather than an improvised one is what makes a performance decision defensible when it is tested — and yours was tested externally. See STAR B, and read the handling guidance before you write a word of it."]}, {"c": "A5", "t": "Implement performance development frameworks to align workforce capability with your organisation’s current and future priorities and objectives", "v": "cle", "vt": "CLEARED on capability, thinner on performance", "body": ["Read the phrase carefully: performance DEVELOPMENT frameworks, aligning workforce capability with current and future priorities. You have the capability half comprehensively — a workforce strategy and training strategy scheduled on the programme critical path, an Election Workforce Staffing Model approved as a gated deliverable, training material packs for election day and centralised operations, capability and recruitment plans and training needs analysis built into the methodology you wrote, and a measured P3M3 capability uplift.", "DO NOT ANSWER THIS WITH THE PDP REGIME. The agency’s semi-annual performance and development plan cycle is a framework you operated inside, not one you implemented. Offering it here reads as compliance. Answer with the workforce and capability frameworks you built, which are genuinely yours."]}, {"c": "A6", "t": "Develop systems to promote cultural capability as a means of ensuring the cultural safety of all colleagues", "v": "not", "vt": "NOT CLEARED", "body": ["Note the words: systems, and colleagues. This is about the internal workforce and whether cultural capability is built into how people work together.", "Your best available evidence points outward rather than inward — commissioning a First Nations interviewer for First Nations respondents in the service evaluation, and in-language research across five community languages. Both are genuine cultural capability decisions with a cost attached, and both are research design rather than workplace practice.", "Your internal evidence is psychological safety, which is real and which you designed deliberately into the Project Managers Forum. But psychological safety and cultural safety are not the same thing, and a panel that works in this space will know the difference. Psychological safety is about whether it is safe to speak. Cultural safety is about whether it is safe to be.", "WHAT WOULD CLOSE IT. Anything internal and structural: cultural capability content in the training packs for a 22,990-person workforce; engagement with the agency’s Aboriginal employment or inclusion function on programme workforce design; recruitment practices in regional and remote areas that took cultural context into account; or a Reconciliation Action Plan commitment your programme carried. If none of it exists, do not stretch — use the development answer above."]}], "ha": [{"c": "H8", "t": "Set an example by regularly giving and asking for constructive feedback and participating in new experiences", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The rare limb in this indicator is ASKING, and you have the best version of it in the file. After the programme kick-off you went back to the project managers individually and sought feedback on yourself — specifically, why they had not been able to raise their concerns with you directly — and triangulated it with several directors so you were not taking one account of your own conduct.", "The giving limb: every concern minuted as stated rather than as you would have preferred it read. The new experiences limb: moving into AI delivery and hands-on platform work at a senior career stage, when most executives stop acquiring skills and start deploying reputation."]}, {"c": "H5", "t": "Drive a culture of high performance and ensure performance issues are addressed as a priority", "v": "cle", "vt": "CLEARED", "body": ["Both halves. The performance culture: two elections delivered on time and within authority, a benefits framework with formal achievement status, a measured maturity uplift, and gates that could be failed. The performance issues half: managed to conclusion, through the framework, and defensible enough to survive external scrutiny."]}, {"c": "H2", "t": "Lead the development of executive capability and ensure effective succession management practices", "v": "cle", "vt": "CLEARED", "body": ["Succession management evidenced by outcome rather than by plan, more than once, into the role you were leaving. That is the harder and more convincing form.", "ONE PRECISION POINT. \"Executive capability\" invites a question about level. Be accurate about what your successors stepped into — senior manager and programme roles — rather than implying executive band appointments. The claim is strong without inflation, and inflating it is the one way to lose an indicator you have comfortably."]}, {"c": "H3", "t": "Implement effective approaches to identify and develop talent across your organisation", "v": "cle", "vt": "CLEARED", "body": ["The Community of Practice is the mechanism and it was deliberately designed against the failure mode of most PMO forums: topic-led rather than status-led, open to anyone interested rather than restricted by role, drawing around thirty project managers, project owners and ICT stream leads. Open attendance is a talent identification instrument — the people who turn up when they do not have to are the people worth developing.", "And it outlasted you, which is the test of whether a development mechanism belonged to the organisation or to its founder."]}, {"c": "H4", "t": "Encourage a culture of continuous learning and leadership that values constructive feedback and new experiences", "v": "cle", "vt": "CLEARED", "body": ["The Community of Practice for learning. The Project Managers Forum, designed explicitly so risks, issues and concerns could be raised in a psychologically safe setting away from the leaders. And the kick-off, where criticism of processes you had authored was minuted as stated and converted into a structural change rather than absorbed."]}, {"c": "H6", "t": "Set an example to others and encourage teams to build an organisational culture of care, belonging and trust", "v": "cle", "vt": "CLEARED", "body": ["The Project Managers Forum is the artefact: a forum built on the recognition that people will not raise the thing that matters in front of the people it concerns. Designing a space for that is care rendered as structure.", "The stronger evidence is what you did when the structure did not work. You had built the safe forum and the concerns still had not reached you personally, so you went and asked why. Building the structure for safety and being someone people feel safe with are different achievements, and you tested the second one on yourself."]}, {"c": "H1", "t": "Ensure performance development frameworks are in place to manage staff performance, drive the development of organisational capability and undertake succession planning", "v": "par", "vt": "PARTIAL", "body": ["Three limbs. Organisational capability and succession planning both clear — the Community of Practice, the capability uplift, and successors developed into your own role. The performance management framework limb does not: the agency’s performance and development regime existed independently of you and you operated inside it.", "If, as interim EPMO Director, you carried responsibility for the performance framework across the function, that closes it. Otherwise answer on the two limbs you hold and do not claim the third."]}, {"c": "H7", "t": "Monitor and evaluate cultural capability as a central part of development efforts", "v": "not", "vt": "NOT CLEARED", "body": ["Harder than A6, because it asks for measurement rather than intent, and central rather than present. See the structural gap section. Do not attempt to frame around it."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: A2 recognise talent, develop team capability and succession plan · H2 lead the development of capability and ensure effective succession management practices · H3 identify and develop talent across your organisation. Supporting: A3 · H4", "s": ["Delivery capability at the NSW Electoral Commission was concentrated in individuals rather than held by the organisation. In a cyclical business — where the entire product is delivered in concentrated events years apart, and where the people who ran the last one are the only reliable record of how it worked — that is the central workforce risk. If capability leaves with a person, the next cycle starts from a lower base than the last one finished at."], "t": ["To make delivery capability something the organisation held rather than something individuals carried, including the capability to do my own job."], "a": ["Three things, at three levels.", "Individually, I coached my direct reports deliberately toward the role I was in rather than toward the role they held — giving them the parts of my work that developed them, and being explicit that the objective was for them to be able to do it without me.", "[CONFIRM: what you actually did — delegated decisions, exposure to governance forums, deputising, structured coaching? The mechanism is what makes this credible rather than the outcome]", "Collectively, I established a monthly Community of Practice for the delivery population — around thirty project managers, project owners and ICT stream leads — designed against the failure mode of most such forums. It was topic-led rather than status-led, and open to anyone interested in the subject rather than restricted by role, because who chooses to attend when they do not have to is itself talent identification.", "Structurally, I built capability development into the methodology rather than leaving it to intent: capability and recruitment planning, training needs analysis, a workforce strategy and an approved staffing model carried as gated deliverables on the programme critical path rather than as good intentions alongside it."], "r": ["On more than one occasion, the person who succeeded me in a role was someone I had coached into it.", "The Community of Practice outlasted my tenure and was still running after I left. Those two facts are the same test applied to a person and to an institution: whether what you built continues without you. I would rather be evidenced by that than by a succession plan on a page."], "notes": ["§ Delivery notes", "• Do not name individuals. \"The person who succeeded me was someone I had coached into it\" is complete. If a panel wants detail they will ask, and you can speak generally without identifying anyone.", "• The mechanism matters more than the outcome. Succession that happened is good; succession you can explain how you engineered is Highly advanced. Fill the confirmation above before using this.", "• The closing line is the one to keep. \"Whether what you built continues without you\" applies to the person and the forum equally, and it ties this STAR to everything else in your file.", "• Be accurate about level. Say what roles they stepped into. Do not let \"executive capability\" imply executive band appointments if that is not what happened."], "probes": [], "keys": ["The Community"], "bul": []}, {"title": "STAR B — Advanced, extending to Highly advanced", "sub": "Primary indicators: A4 prioritise dealing with individual performance issues and ensure a consistent approach · H5 drive a culture of high performance and ensure performance issues are addressed as a priority", "s": ["I was managing documented performance concerns with a member of staff, under the agency’s performance framework."], "t": ["To keep two things separate that would have been easier to run together: a performance process that had to continue and be fair, and a complaint about me that I could not be the judge of."], "a": ["I stepped back from anything to do with the claims. A complaint concerning me is not mine to assess, and the moment I involve myself in it I have compromised both processes.", "The performance matters continued on the agency’s framework rather than on anything I devised — documented, staged, with expectations set in writing and support offered, and with each step recorded. That was deliberate. A performance decision is only worth as much as the process behind it, and I expected this one to be examined.", "It was. The matter went to external arbitration.", "[CONFIRM: what the arbitration was — an industrial tribunal, an external investigation, a review under the agency’s framework? Name it correctly. And what it found]"], "r": ["[CONFIRM: the outcome of the independent process, stated in its own words rather than yours]", "The performance process reached its conclusion, and it held when it was examined by people who had no reason to take my account of it.", "What I took from it is that the only protection in a contested performance matter is the quality of the record — and that the record has to be built before you know you will need it, not afterwards. It also confirmed something about separation of duty that I had understood in governance terms and had not previously had to apply to myself."], "notes": ["§ The single most important thing about this story: leave the complaint out", "An earlier version of this pack framed this as a reprisal risk. That framing assumed a sequence — your own staff complained about you, and you responded with performance management — which is not what happened. The complaint arose in the director’s area, involving a staff member working there, and you were caught up in it. That is a materially different situation and the earlier characterisation was wrong.", "But the practical advice sharpens rather than disappears, and it is this:", "The indicator does not ask about the complaint. Do not supply it.", "A4 asks whether you prioritise dealing with individual performance issues and use a consistent approach. That question is fully answered by the performance process and its independent testing. The complaint is context you are not being asked for, and volunteering it costs you twice: it consumes the answer explaining a situation the panel cannot verify, and any story that requires you to say you were framed in someone else’s dispute leaves a panel with more questions than it started with. Complexity in a performance-management answer reads as unresolved, however resolved it actually is.", "THIS IS NOT CONCEALMENT. It is answering the question asked. If a panel probes and the complaint becomes relevant, you address it then, briefly, and you lead with what the independent process found rather than with your account of it. What you never do is open with it.", "§ Two rules if you use the story at all", "• Never say \"managed them out.\" It states removal as the objective. Say the performance process ran its course and reached its conclusion. That is the difference between managing performance and pursuing an outcome.", "• Let the independent finding speak. \"The matter was tested externally and the process held\" is evidence. Your characterisation of anyone’s conduct is not, and a panel discounts it automatically.", "§ Delivery notes", "• Lead on the separation, not on the vindication. \"A matter concerning me is not mine to assess\" is the sentence that makes this story safe, and it is also the most impressive thing in it — you applied to yourself the same separation-of-decision-rights discipline you built into seven governance forums.", "• Sound like someone reporting a process, not winning an argument. The less you editorialise, the more the independent outcome carries. This is the one answer in your whole file where restraint is the entire technique.", "• Do not volunteer it. It answers A4 and H5 powerfully and it is not a story to lead with. Use it when a question requires an individual performance example and nothing else covers it.", "• Probe — \"How did the staff member experience that process?\" Have a considered answer ready. A candidate who has never wondered how it felt from the other side is the candidate a panel worries about, and acknowledging the human cost concedes nothing about the substance."], "probes": [], "keys": [], "bul": []}], "notes": [{"h": "Verdict", "body": ["You have the two hardest things in this capability and most candidates have neither: people you developed who succeeded you in your own role, and performance issues taken to conclusion through an independent process. The gap is elsewhere, and it is now the most systematic finding in the campaign."]}, {"h": "The cultural capability gap is now structural", "body": ["Cultural safety and cultural capability have now defeated four indicators across three capabilities, and one of them is at Advanced level, which is more damaging than a Highly advanced miss:", "In NSW public sector usage, cultural capability most often means Aboriginal cultural capability specifically, and cultural safety means whether colleagues can be themselves at work without having to explain or defend their culture. A panel will hear the terms that way.", "§ A correction on the other gap", "Earlier packs recorded recognition as a second systematic gap costing four indicators. That was overstated, and the correction matters because it changes what you should concede.", "You recognised people through the agency’s existing mechanism — the Chief Operating Officer’s award scheme, with recognition made at divisional meetings — and you used it, including putting forward an ICT employee for their contribution to your business area and to the election programme. Nominating someone who does not report to you, from another function, for helping your programme, is the strongest form this behaviour takes. It is cross-boundary recognition, and it is exactly what the Work collaboratively indicator on publicly celebrating collaboration is asking for.", "What remains true is narrower and fairer: there was no programme-level closure recognition for a workforce of nearly 23,000 people. That is a specific omission, not a disposition.", "SO CONCEDE THE RIGHT THING. Do not say you are poor at recognising people — it is not true and you would be handing a panel a weakness you do not have. Say: \"I used the agency’s recognition mechanisms and nominated people through them, including across functional boundaries. What I did not do was mark the closure of a programme of 23,000 people, and I would. In an election workforce that reassembles every cycle, recognition is not sentiment — it is an operational asset. The people you thank are the people who come back.\" That is precise, it concedes something real, and it demonstrates the judgement rather than the deficit.", "[CONFIRM: expand the award scheme name correctly — do not let an unexplained acronym reach a panel, the same discipline as PTA and ICTA]"]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner — People Management group.", "NSWEC Project Management Methodology NPMM v5.4 — capability and recruitment planning, training needs analysis — supplied.", "NSWEC LGE24 high-level critical path — workforce strategy, Election Workforce Staffing Model, training packs — supplied.", "Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025 — supplied.", "Candidate-supplied evidence, 14–16 August 2026."]}], "script": {"id": "mdp", "intro": ["Manage and develop people is about engaging with and motivating staff, and developing their capability and potential. That sounds soft. At Advanced it is not. Look at the verbs. Refine roles over time. Implement performance development frameworks. Develop systems. Ensure a consistent organisational approach. Every one is about building something.", "That is the line between Adept and Advanced. Adept manages a team well. Advanced changes the mechanisms an organisation uses to grow and manage people, and shows them outlasting you. Highly advanced adds reach. Talent identified across the organisation, succession managed rather than hoped for, high performance visible in outcomes.", "Two traps catch most candidates. The first is answering the framework indicators with the corporate performance and development cycle you sat inside. That reads as compliance. The second is the performance issues indicator, which most executives avoid, so they have nothing to say. You have both covered."], "standing": ["At Advanced you clear five of six, three of them exceptionally. A6, cultural capability and cultural safety, does not clear. At Highly advanced you clear six of eight, one exceptionally. H1 is partial and H7 does not clear.", "So claim this one at Highly advanced. You have the two hardest things in it and most candidates have neither. People you developed who then succeeded you in your own role, and performance issues taken to conclusion through an independent process. Build the claim on those, and build no part of it on cultural capability."], "inds": {"A1": ["This asks whether roles changed over time because the work demanded it, not whether you drew an org chart once. An election programme is a temporary organisation designed from scratch and adjusted under load. Thirteen aggregate projects, fourteen workstreams, nine functional directors, ten project managers, a three-person PMO, and a four-tier operational command structure for the event itself. In the EPMO the service catalogue redefined what the function owed each consumer, and the P3O operating model redefined the roles around it. So in the room, it sounds like this. I built the delivery organisation and reshaped it as the work changed, then in the EPMO I redefined what the function owed its consumers and rebuilt the roles around that."], "A2": ["Recognise talent, develop capability, succession plan. Most candidates evidence this with a document, and a panel knows a plan is only intent. Yours is evidenced by outcome. You coached several direct reports who then moved into your role when you vacated it, more than once. That cannot be challenged. It happened or it did not. Do not name individuals in an application. So in the room, it sounds like this. On more than one occasion the person who succeeded me in the role was someone I had coached into it. Then stop, and let the panel ask."], "A3": ["Coaching answers usually come out as generalities. Yours has method, across four layers. Direct coaching of successors. A monthly Community of Practice, topic-led and open to anyone interested, which outlasted your tenure. And eight years teaching postgraduate project management at the University of Sydney, plus a year at TAFE NSW.", "Use the Master Scheduler, because it shows method rather than volume. You made development of the programme critical path her development goal, on the artefact the whole programme would run on. She was technically strong and did not engage stakeholders. You didn't take the work off her or correct her drafts. You brought the key stakeholder in and drew the critical path on a whiteboard with her in the room. She saw what had been missing. Her failure was the same one the delivery community had named in your own methodology at the kick-off. You had learned it at your own expense. Teaching it cost a whiteboard and an afternoon."], "A4": ["Two limbs. Deal with performance issues, and use the organisation's consistent approach. Most executives avoid this work, so most candidates cannot evidence it. You managed individual performance to conclusion through the agency's framework, including where it escalated to external arbitration. Using the organisation's framework rather than an improvised one is what makes a decision defensible when it is tested, and yours was tested.", "Two rules before you write a word of it. Never say you managed anyone out, because that states removal as the objective. Say the process ran its course and reached its conclusion. And the indicator does not ask about the complaint, so do not supply it. So in the room, it sounds like this. I ran it on the agency's framework rather than anything I devised, staged and documented with each step recorded, and it held when it was examined externally."], "A5": ["Read the words. Performance development frameworks, aligning workforce capability with current and future priorities. That is capability and workforce planning, not appraisal. You hold the capability half comprehensively. A workforce strategy and training strategy on the programme critical path. An Election Workforce Staffing Model approved as a gated deliverable. Training packs for election day and centralised operations. Capability and recruitment plans and training needs analysis built into the methodology you wrote. And a measured P3M3 capability uplift. Do not answer with the performance and development plan regime, because that cycle is a framework you operated inside, not one you implemented. So in the room, it sounds like this. I put workforce strategy, an approved staffing model and training needs analysis on the critical path as gated deliverables, so capability was scheduled and approved rather than assumed."], "A6": ["This one does not clear. Note the words. Systems, and colleagues. It is about the internal workforce and whether cultural capability is built into how people work together. Your best evidence points outward instead. A First Nations interviewer commissioned for First Nations respondents in the service evaluation, and in-language research across five community languages. Both are cultural capability decisions with a cost, but both are research design, not workplace practice.", "Your internal evidence is psychological safety, designed deliberately into the Project Managers Forum. A panel that works in this space knows the difference. Psychological safety is about whether it is safe to speak. Cultural safety is about whether it is safe to be. What would close it is anything internal and structural. Cultural capability content in the training packs for a 22,990-person workforce. Engagement with the agency's Aboriginal employment or inclusion function on workforce design. Recruitment practice in regional and remote areas that took cultural context into account. Or a Reconciliation Action Plan commitment your programme carried. If none of it exists, do not stretch."], "H8": ["The rare limb is asking. Everyone can describe giving feedback. Few can describe seeking it on themselves when the answer was going to be uncomfortable. After the kick-off you went back to the project managers individually and asked why they had not raised their concerns with you directly, then triangulated it with several directors so you were not taking one account of your own conduct. The giving limb is the kick-off, where every concern was minuted as stated rather than as you would have preferred it read. The new experiences limb is moving into AI delivery and hands-on platform work at a senior career stage. So in the room, it sounds like this. I asked each project manager why they could not bring their concerns to me, and I checked what they told me against several directors."], "H5": ["Both halves, and you need both. A culture of high performance, and performance issues addressed as a priority. Culture claims are usually assertion, so a panel wants mechanisms with teeth. Two elections delivered on time and within authority. A benefits framework with formal achievement status. A measured maturity uplift. And gates that could actually be failed, which carries the most weight, because a gate that cannot be failed is not a performance mechanism. On the second half, performance managed to conclusion, through the framework, and defensible enough to survive external scrutiny. So in the room, it sounds like this. I ran gates that could be failed, and I dealt with individual performance through the agency's framework rather than letting it sit."], "H2": ["Executive capability and effective succession management practices. Panels have heard a lot of succession plans described. You have succession evidenced by outcome rather than by plan, more than once, into the role you were leaving. That is the harder and more convincing form. One precision point, and it is the only way you lose an indicator you hold comfortably. Executive capability invites a question about level. Be accurate about what your successors stepped into, which was senior manager and programme roles. So in the room, it sounds like this. More than once I developed someone into the role I was in, and they stepped into it at senior manager and programme level when I moved on."], "H3": ["Across your organisation is the load-bearing phrase. Developing your own team is Adept. This wants a mechanism that reaches past your reporting line. The Community of Practice is it, designed against the failure mode of most PMO forums. Topic-led rather than status-led. Open to anyone interested rather than restricted by role. Around thirty project managers, project owners and ICT stream leads. Make that design argument explicitly, because it turns a forum into a talent instrument. And it outlasted you, which is the test of whether a mechanism belonged to the organisation or to its founder. So in the room, it sounds like this. I built it open and topic-led on purpose, because who chooses to attend when they do not have to is itself talent identification."], "H4": ["A culture of continuous learning that values constructive feedback and new experiences. The soft version of this answer is a statement about valuing openness, and a panel discounts it instantly. They want a structure, and an instance where the feedback was about you and something changed. You have three. The Community of Practice for learning. The Project Managers Forum, designed so risks, issues and concerns could be raised in a psychologically safe setting away from the leaders. And the kick-off, where criticism of processes you had authored was minuted as stated and converted into a structural change rather than absorbed. So in the room, it sounds like this. The criticism at kick-off was of processes I had written, and I had it minuted as stated and turned it into a structural change."], "H6": ["Care, belonging and trust attracts sincere but unevidenced answers. A panel wants the artefact, not the sentiment. Yours is the Project Managers Forum, built on the recognition that people will not raise the thing that matters in front of the people it concerns. Designing a space for that is care rendered as structure. The stronger evidence is what you did when the structure did not work. The forum existed and the concerns still had not reached you personally, so you went and asked why. Building a structure for safety and being someone people feel safe with are different achievements. So in the room, it sounds like this. I had built the forum for exactly this and the concerns still did not reach me, so I went to each of them and asked why not."], "H1": ["This one is partial. Three limbs. Performance development frameworks to manage staff performance, drive organisational capability, and undertake succession planning. Two clear comfortably, through the Community of Practice, the measured capability uplift, and successors developed into your own role. The performance management framework limb does not clear. The agency's regime existed independently of you and you operated inside it. One thing would close it. If, as interim EPMO Director, you carried responsibility for the performance framework across the function, say so plainly and the indicator is yours. If you did not, answer on the two limbs you hold and do not claim the third."], "H7": ["This one does not clear either, and it is harder than A6. It asks you to monitor and evaluate cultural capability as a central part of development efforts. Monitor and evaluate means measurement, not intent. Central means it sits at the core of how you develop people. Do not attempt to frame around it. Cultural safety and cultural capability have now defeated four indicators across three capabilities, and one is at Advanced level, which is more damaging than a Highly advanced miss. In NSW public sector usage, cultural capability most often means Aboriginal cultural capability specifically, and cultural safety means whether colleagues can be themselves at work without explaining or defending their culture. A panel will hear the terms that way."]}, "stars": [["STAR A carries A2, H2 and H3, with A3 and H4 behind them. Its strength is the three levels. Individually, you coached direct reports toward the role you were in rather than the one they held. Collectively, the Community of Practice for around thirty project managers, project owners and ICT stream leads. Structurally, capability planning, training needs analysis, a workforce strategy and an approved staffing model carried as gated deliverables on the critical path.", "The close does the real work. Your successor was someone you coached, and the Community of Practice was still running after you left. Two facts, one test. Whether what you built continues without you. Keep that line. Then three rules. Do not name individuals. Be accurate about the level your successors stepped into. And fill the confirmation gap on the individual coaching, because succession that happened is good and succession you can explain how you engineered is Highly advanced."], ["STAR B carries A4 and H5. It is the one answer in your file where restraint is the entire technique. Its strength is that it is a process story, not a vindication story. The performance matters continued on the agency's framework rather than anything you devised, staged and documented, expectations in writing, support offered, each step recorded. Then it was tested externally and it held.", "The moment that does the work is the separation. A matter concerning me is not mine to assess. Lead on that rather than on the outcome. You applied to yourself the same separation of decision rights you built into seven governance forums. Now what you must not forget. The indicator does not ask about the complaint, so do not supply it. That is not concealment, it is answering the question asked. If a panel probes and it becomes relevant, address it briefly then, leading with what the independent process found rather than your account of it. Never say you managed anyone out. Do not volunteer this story. Use it when a question needs an individual performance example and nothing else covers it. And have an answer ready for how the staff member experienced the process."]], "outro": ["Two jobs here. Close the confirmations. Name the external process correctly and state its finding in its own words, and pin down what you actually did in the individual coaching. Then deal with the cultural capability gap, because it is structural and it will keep costing you. Look for anything internal. Cultural capability content in the training packs, work with the agency's Aboriginal employment or inclusion function, or recruitment practice in regional and remote areas. If it is not there, name it yourself rather than stretching. And concede the right thing on recognition. You used the agency's mechanisms and nominated across functional boundaries. What you did not do was mark the closure of a programme of nearly 23,000 people, and you would. Then lead with the sentence you own outright. On more than one occasion the person who succeeded me in the role was someone I had coached into it, and the Community of Practice I built was still running after I left."]}}, {"id": "idp", "name": "Inspire direction and purpose", "group": "People Management", "desc": "Communicate goals, priorities and vision, and recognise achievements", "verdict": [["Advanced", "4 of 5 cleared, one exceptionally. A4 partial"], ["Highly advanced", "2 of 5 clear. Three partial. Still not claimable as a whole"]], "adv": [{"c": "A3", "t": "Work with others to translate strategic direction into operational goals and build a shared understanding of the link between your organisation’s goals and core business outcomes", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your strongest indicator in this capability by a distance, because translation is precisely what you do. The chain is documented end to end: senior executives on the Commission’s strategic plans and goals, the Chief Financial Officer and the EPMO portfolio on portfolio priorities, stakeholders on election regulatory priorities — converted into programme strategy, a programme structure of fourteen workstreams and $133.7 million, a resourcing model, and finally into gate criteria that state what has to be true by when.", "The shared understanding limb is evidenced by the artefacts rather than asserted: a service catalogue where every service has a named consumer and a performance expectation, and a one-sheet critical path that let people who did not write the plan reason about it in a room."]}, {"c": "A1", "t": "Help others to understand the links between government policy, organisational goals and public value", "v": "cle", "vt": "CLEARED", "body": ["An election is the rare programme where public value needs no translation — but the links still do, and yours were made explicit. The Commission’s stated priority goal is maintaining trust and confidence in the electoral system; your programme carried public trust, participation and accessibility, integrity, timeliness, operational efficiency and compliance as tracked benefits with formal achievement status. Policy to organisational goal to programme benefit to measured outcome, in one line."]}, {"c": "A2", "t": "Present information in an engaging way to build a shared sense of direction, clarify priorities and goals, and inspire and prepare others to achieve them", "v": "cle", "vt": "CLEARED", "body": ["Two pieces of evidence, and you have been using neither for this purpose.", "The first is the critical path. Putting an entire two-year programme on one A0 sheet — twenty swimlanes, nineteen systems, dependencies drawn between lanes, one red line at the election date — is information design in the service of shared direction. You made that choice deliberately, because a plan assembled from twenty documents cannot be reasoned about by people who did not write it.", "The second is that you have taught this discipline to postgraduate cohorts for eight years. Presenting complex material in a way that lands, to an audience that is assessed on whether it landed, is this indicator practised weekly for the better part of a decade."]}, {"c": "A5", "t": "Inspire confidence and cultivate an attitude of openness and curiosity when tackling future challenges", "v": "cle", "vt": "CLEARED", "body": ["Curiosity is the easier limb and you have a genuine mechanism for it: a Community of Practice that was topic-led rather than status-led and open to anyone interested in the subject, which is a structure built to reward curiosity rather than seniority.", "Confidence is the harder limb, and the answer is the clarity argument. But there is a second instance worth using, because it works in a way rhetoric cannot: at the programme kick-off the delivery community said openly that they had lost confidence in the methodology — methodology you had authored. You minuted it as stated, and rebuilt the function around what they said. Confidence restored that way lasts, because the people concerned watched it happen to them."]}, {"c": "A4", "t": "Create opportunities for recognising and celebrating high performance at the individual and team level", "v": "par", "vt": "PARTIAL", "body": ["The operative verb is CREATE. You used the recognition opportunities that existed — the Chief Operating Officer’s award scheme and divisional recognition — including a nomination made outside your own team for an ICT employee who contributed to your programme. That is using an opportunity well, and it clears the equivalent indicators in Work collaboratively and Deliver results, which ask you to recognise and celebrate.", "This indicator asks for something narrower: that you made occasions for it. A programme of nearly 23,000 people closed on time and within authority with no closure recognition, and the forums you designed were built for escalation, decisions and safety rather than for acknowledgement.", "DO NOT STRETCH THIS ONE. Concede it precisely and it becomes evidence of judgement rather than a gap: \"I have been better at using the organisation’s recognition mechanisms than at creating my own. On a programme of that size I should have made an occasion at closure, and I would.\" Specific, true, and it does not concede a disposition you do not have."]}], "ha": [{"c": "H4", "t": "Communicate the scope and expected outcomes of organisational strategies", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The one that clears, and it clears because it asks for precision rather than energy. A business case taken through approval to a funding submission to NSW Treasury. A programme structure with scope and money attached to every workstream. A benefits framework carrying six expected outcomes with formal achievement status at closure. Gate criteria that state expected outcomes as testable conditions. Nobody in that programme could be unclear what was in scope or what success looked like, and that is the whole of this indicator."]}, {"c": "H2", "t": "Create a culture of confidence and trust in your organisation’s future direction", "v": "par", "vt": "PARTIAL", "body": ["Within the delivery community, this is genuinely evidenced: a function that had lost the confidence of its consumers was rebuilt with them, maturity was lifted measurably, and two elections were delivered to statutory dates. People who had said the methodology did not serve them watched it change because they said so.", "What is missing is the organisational scope the indicator asks for. Confidence in the agency’s future direction is a thing the Commissioner and the executive hold. Your evidence is confidence in delivery, which is a subset — a large and important one, but a subset."]}, {"c": "H1", "t": "Champion the organisational vision and strategy, and communicate the way forward to achieve the vision and strategy", "v": "par", "vt": "PARTIAL", "body": ["You translate the organisational strategy with unusual rigour. Championing it is a different act — advocating the vision itself, to the organisation, as its owner or its spokesman.", "THE INTERIM EPMO DIRECTOR ROLE IS THE ROUTE. Taking the organisation through a business planning cycle at concept stage means communicating organisational direction to the people whose proposals were being assessed against it. If in that period you presented direction, priorities or the investment position to a directors forum, the executive, or the organisation more broadly, this indicator clears. That is the single highest-value thing you could tell me about this capability."]}, {"c": "H3", "t": "Generate enthusiasm and commitment to goals and ensure all levels of the organisation understand the goals", "v": "cle", "vt": "CLEARED on the reach limb", "body": ["Previously partial. The workforce training cascade closes the \"all levels\" half: a Training and Workforce Strategy a year out, materials developed over seven months, an online pack, a second pack for election day and centralised operations, two days of support officer training, three weeks of face-to-face training for Returning Officers, and a briefing from the Polling Place Manager to every official before setup on the day.", "That reached 22,990 people through a structure that was gated rather than assumed. Combined with seven governance forums at the executive layer and a project managers forum and community of practice in between, there is no level of that organisation the goals did not travel to.", "THE ENTHUSIASM LIMB IS STILL NOT YOURS TO CLAIM, AND YOU SHOULD NOT. Answer on reach and understanding, which you can evidence, and let the two behavioural facts carry the rest — a voluntary forum that outlasted you, and people who wanted your job. Enthusiasm asserted is worth nothing; voluntary attendance is worth a great deal."]}, {"c": "H5", "t": "Celebrate organisational success and high performance, and implement initiatives to maintain morale", "v": "par", "vt": "PARTIAL", "body": ["The celebration limb is the same territory as A4 — you used the mechanisms rather than creating them, and there was no closure occasion.", "The morale limb is stronger than you would think and worth claiming separately. The Project Managers Forum was designed to give people a place to raise risks, issues and concerns away from the leaders — that is a morale instrument, deliberately built, on a programme running at what you have described as pressure-cooker intensity with fires to fight daily. Say that plainly. Designing psychological safety into a governance structure on a high-pressure programme is maintaining morale by structure rather than by exhortation."]}], "stars": [{"title": "STAR A — Advanced", "sub": "Primary indicators: A3 translate strategic direction into operational goals and build shared understanding · A1 links between government policy, organisational goals and public value · A2 present information to build a shared sense of direction. Supporting: H4", "s": ["The NSW Electoral Commission’s stated priority goal is to maintain trust and confidence in the electoral and democratic systems and processes, with particular attention to inclusion and accessibility for people who face additional barriers to participating in democracy.", "That is the right goal and it is also, on its own, unusable. Nobody contracts a venue, trains a returning officer or tests an application against \"trust and confidence\". Between a statement of that kind and a workforce of 22,990 people there is a translation problem, and if it is not solved deliberately it gets solved badly — every function inventing its own interpretation of what the organisation is trying to achieve."], "t": ["To carry the organisation’s goal all the way down to something a person could act on, without losing it on the way."], "a": ["I built the translation in four steps, each of which had to survive contact with the next.", "• Strategy. I worked with senior executives to understand the Commission’s strategic plans and goals, with the Chief Financial Officer and the EPMO portfolio on portfolio priorities including organisational and funding needs, and with stakeholders on election regulatory priorities — because in this domain a great deal of what looks like choice is actually legislation.", "• Structure. That became a programme structure with money attached: fourteen workstreams totalling $133.7 million inside a $150 million authority, each with a defined scope and an accountable executive.", "• Outcomes. The organisational goal was carried as tracked benefits — public trust, participation and accessibility, integrity, timeliness, operational efficiency, compliance — each with formal achievement status rather than a narrative at closure.", "• Operational goals. Finally into gate criteria that state what has to be true by when. Venues 100% contracted and accessible. Workforce at or above 85% filled with training commenced. Systems configured and end-to-end tested. No uncontrolled high or extreme risks.", "And I made the whole thing visible on one sheet. The programme critical path went on a single A0 page — twenty swimlanes, nineteen systems, dependencies drawn between lanes, one line at the election date — and was published thirteen months out. That was a deliberate choice about shared understanding: a plan that has to be assembled from twenty documents cannot be reasoned about in a room by people who did not write it, and eleven of the twelve executives whose functions it governed did not report to me."], "r": ["The chain held. \"Accessibility\" stopped being a value and became a condition that could stop a $150 million mobilisation. The election was delivered on time and within authority, and every benefit was recorded as achieved.", "The independent evaluation is where the translation shows: 90% of electors found it easy to vote, and of the 46% who needed assistance at a voting centre, 95% were satisfied. That is an organisational goal about trust and inclusion, arriving as a person being helped to vote."], "notes": ["§ Delivery notes", "• The Situation is the argument. \"Nobody contracts a venue against trust and confidence\" states the translation problem in one line and shows you understand why this capability exists.", "• Close on the elector, not the gate. The 95% assistance figure is the goal arriving at a person. That is the answer to a capability about purpose.", "• Allocation: this shares source material with the Finance strategic planning STAR, but the two do different work — that one is how the programme was funded, this one is how the goal reached the ground. If both capabilities are assessed, keep the funding argument in Finance and this one here."], "probes": [], "keys": ["$133.7 million", "$150 million", "22,990", "Chief Financial Officer"], "bul": ["Strategy. I worked with senior executives to understand the Commission’s strategic plans and goals, with the Chief Financial Officer and the EPMO portfolio on portfolio priorities including organisational and funding needs, and with stakeholders on election regulatory priorities — because in this domain a great deal of what looks like choice is actually legislation.", "Structure. That became a programme structure with money attached: fourteen workstreams totalling $133.7 million inside a $150 million authority, each with a defined scope and an accountable executive.", "Outcomes. The organisational goal was carried as tracked benefits — public trust, participation and accessibility, integrity, timeliness, operational efficiency, compliance — each with formal achievement status rather than a narrative at closure.", "Operational goals. Finally into gate criteria that state what has to be true by when. Venues 100% contracted and accessible. Workforce at or above 85% filled with training commenced. Systems configured and end-to-end tested. No uncontrolled high or extreme risks."]}, {"title": "STAR B — Advanced, extending toward Highly advanced", "sub": "Primary indicators: A5 inspire confidence when tackling future challenges · H2 create a culture of confidence and trust in future direction", "s": ["I took over the 2023 State general election programme in March 2022. It was rated red. The initial funding allocation was $89.1 million against an estimated requirement of $140.7 million, and the delivery date was fixed in statute.", "A red programme is not primarily a scheduling problem. It is a confidence problem. The people delivering it have already watched a plan fail once, and the natural response is to stop believing the next one — which is what makes the second recovery harder than the first."], "t": ["To produce a plan people could believe, which meant producing one that was not mine alone."], "a": ["I developed a plan to green and took it to the Programme Steering Committee for approval rather than implementing it and reporting afterwards. That distinction was the point. A recovery plan the governing body has approved is a shared commitment; one the programme manager has authored alone is an opinion, and everyone delivering it knows the difference.", "[CONFIRM: what the plan to green actually comprised — the three or four moves that changed the trajectory. Without them this STAR is a posture rather than a method]", "Then the environment moved twice more. The Electoral Act was amended mid-programme to cut the early voting period from thirteen days to seven, which changed venue contracting, workforce rostering, logistics and communications simultaneously. I treated it as a scope event to be re-planned rather than as an explanation for slippage, and re-based each affected workstream against the new timetable."], "r": ["The election was delivered at $140.3 million against $144.3 million in funding, and informality improved in both houses — the cleanest available evidence that the changes did not degrade the elector experience.", "The programme team’s contribution was subsequently recognised by the Governor of New South Wales at a private event at Government House. I was among the team recognised; it was a group acknowledgement.", "What I would offer about confidence is this. It did not come from anything I said at the start. It came from the plan being approved by the people who could stop it, and then from the plan being right — twice, including once when the law changed underneath it."], "notes": ["ALLOCATION WARNING. This is the SGE23 recovery, which is also the primary STAR in the Manage self pack, framed there as managing ambiguity. Use one or the other in a single application.", "§ Delivery notes", "• \"A red programme is a confidence problem\" is the sentence that makes this an Inspire direction answer rather than a recovery answer. Without it, this is Manage self.", "• Volunteer that Government House was group recognition before anyone asks. It is what makes you credible on everything else you claim.", "• The closing paragraph is the honest version of inspiration and it is stronger than a rhetorical one: confidence earned by being right, not asserted at kick-off."], "probes": [], "keys": ["$89.1 million", "$140.7 million", "$140.3 million", "$144.3 million", "Programme Steering Committee", "The Electoral Act", "Government House"], "bul": []}], "notes": [{"h": "Verdict", "body": ["This is your weakest capability of the sixteen benchmarked, and it is worth understanding precisely why — because the reason is a style, not a deficiency, and the wrong response to it would do real damage."]}, {"h": "Read this before you write anything", "body": ["Look at the verbs this capability uses: inspire, engage, generate enthusiasm, cultivate curiosity, celebrate, maintain morale, create confidence. It is written for a particular kind of leader — the one who moves people by conviction and presence.", "Now look at everything in your file. Gates that can be failed. Terms of reference defining decision rights. A service catalogue with named consumers. A change request pipeline. A critical path on a single sheet. Minutes taken verbatim. Your entire evidenced signature is structural, and this capability is written in the register of the opposite temperament.", "THE WRONG RESPONSE, AND IT IS THE COMMON ONE. Do not write an inspirational answer. A candidate whose whole application is architecture, producing a paragraph about generating enthusiasm and energising teams, reads as someone performing a register that is not theirs — and panels detect that faster than almost anything else. It would also cost you credibility in the capabilities where you are genuinely strong, because it invites the question of what else was performed.", "§ The right response", "Answer this capability honestly, in your own register, with the argument that clarity is what actually produces confidence:", "\"I do not inspire people with rhetoric. I inspire confidence by removing ambiguity. On a programme where the date cannot move, what generates belief is knowing exactly what has to be true by when — and knowing that when the gate says a venue must be accessible, it means it.\"", "That is defensible, distinctive, and true. It is also a better answer than most candidates give, because most of them assert inspiration and cannot evidence its effect.", "§ And you can evidence the effect — through two facts most people cannot produce", "There are only two hard tests of whether people actually believe in a leader, and both are behavioural rather than declared. Do they follow you when they do not have to, and do they want the job you are doing?", "• Voluntary followership. A monthly Community of Practice drawing around thirty project managers, project owners and ICT stream leads — topic-led, open to anyone interested, attendance not required by anyone — which continued running after you left. People kept turning up to a forum with no obligation attached, for years, including once you were gone.", "• Succession. On more than one occasion the person who succeeded you in a role was someone you had coached. Nobody takes your job unless they wanted it, and nobody wants a job they have watched being done without belief.", "Use those two facts wherever this capability is assessed. They are the evidence that your form of leadership moves people, offered without a single adjective.", "Two of five clear. The other three are partial in the same way, and the pattern is worth seeing rather than working around: each asks for reach or register across the whole organisation. Reach you now have, through the workforce training cascade. Register — enthusiasm, morale, celebration — is the part that is genuinely not your style, and the honest answer is better than a performed one."]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner — People Management group.", "NSWEC LGE24 high-level critical path (A0, \"Contact: Naven Kumar\", as at 22 August 2023) — supplied.", "NSWEC LGE24 Program Management Plan retrospective (OFFICIAL–Sensitive) and programme governance model — supplied.", "Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025 — supplied.", "Candidate-supplied evidence, 14–16 August 2026."]}], "script": {"id": "idp", "intro": ["This capability sits in People Management and the definition is short. Communicate goals, priorities and vision, and recognise achievements. A panel is not testing whether you can write a vision statement. They are testing whether the goal reached the ground. Adept communicates direction to a team. Advanced translates strategic direction into operational goals. Highly advanced goes wider, to the organisation's vision and its future direction.", "Now look at the verbs. Inspire. Generate enthusiasm. Cultivate curiosity. Celebrate. Maintain morale. This is written for the leader who moves people by conviction and presence. Your evidenced signature is structural. Gates that can be failed. A service catalogue with named consumers. Minutes taken verbatim. The trap, and it is the common one, is writing a paragraph about energising teams to match that register. Panels detect a performed register faster than anything."], "standing": ["At Advanced you clear four of five, one of them exceptionally. A3 is the exceptional one. A4, on creating recognition opportunities, is partial. At Highly advanced two of five clear and three are partial, so Highly advanced is not claimable here as a whole.", "This is your weakest capability of the sixteen benchmarked, and the reason is a style rather than a deficiency. Claim Advanced. Hold Highly advanced in reserve and use the two indicators that stand alone, H4 and the reach limb of H3. Answer in your own register, with the argument that clarity is what produces confidence. And carry two behavioural facts wherever this is assessed. A Community of Practice that kept running after you left, and roles where your successor was someone you had coached."], "inds": {"A3": ["A3 asks you to turn strategic direction into operational goals and build shared understanding of the link to business outcomes. Yours is documented end to end. Senior executives on the Commission's strategic plans. The Chief Financial Officer and the EPMO portfolio on portfolio priorities. Stakeholders on election regulatory priorities. That became fourteen workstreams and $133.7 million, a resourcing model, then gate criteria stating what has to be true by when. Shared understanding sits in the artefacts, not the assertion. A service catalogue where every service has a named consumer and a performance expectation. So in the room, it sounds like this. I turned the Commission's goals into fourteen workstreams and gate criteria, and put the critical path on one sheet so the people it governed could argue with it."], "A1": ["A1 asks you to help others see the links between government policy, organisational goals and public value. An election is the rare programme where public value needs no translation. The links still do. The Commission's stated priority goal is maintaining trust and confidence in the electoral system. Your programme carried public trust, participation and accessibility, integrity, timeliness, operational efficiency and compliance as tracked benefits with formal achievement status. Policy to organisational goal to benefit to measured outcome, in one line. So in the room. The organisation's goal was trust and confidence, and I carried it as six tracked benefits with a formal achievement status at closure."], "A2": ["A2 is about presenting information in an engaging way to build a shared sense of direction. Engaging does not mean entertaining. It means the material lands. The first piece of evidence is the critical path. A two-year programme on one A0 sheet. Twenty swimlanes, nineteen systems, dependencies drawn between lanes, one red line at the election date. That was deliberate, because a plan assembled from twenty documents cannot be reasoned about by people who did not write it. The second is eight years teaching this discipline to postgraduate cohorts, to an audience assessed on whether it landed. So in the room, it sounds like this. I designed the critical path to be readable in a single look."], "A5": ["A5 asks you to inspire confidence and cultivate openness and curiosity about future challenges. Curiosity is the easier limb and you have a mechanism, not a claim. A Community of Practice that was topic-led rather than status-led, open to anyone interested. Confidence is harder, and your answer is the clarity argument. There is a second instance that works in a way rhetoric cannot. At kick-off the delivery community said openly they had lost confidence in the methodology you had authored. You minuted it as stated and rebuilt the function around what they said. So in the room. They told me my own methodology was not serving them, I minuted it as stated, and we rebuilt it around what they said."], "A4": ["A4 is partial, and the reason is one verb. Create. You used the recognition opportunities that existed, and used them well. The Chief Operating Officer's award scheme, divisional recognition, and a nomination made outside your own team for an ICT employee on your programme. This indicator asks whether you made occasions. A programme of nearly 23,000 people closed on time and within authority with no closure recognition, and the forums you designed were built for escalation and decisions. Do not stretch it. Concede it precisely and it reads as judgement. I have been better at using the organisation's recognition mechanisms than at creating my own. On a programme of that size I should have made an occasion at closure, and I would."], "H4": ["H4 asks you to communicate the scope and expected outcomes of organisational strategies. It clears because it wants precision rather than energy. A business case taken through approval to a funding submission to NSW Treasury. A structure with scope and money attached to every workstream. A benefits framework carrying six expected outcomes with formal achievement status at closure. Gate criteria stating expected outcomes as testable conditions. Nobody there could be unclear what was in scope or what success looked like. So in the room, it sounds like this. Every workstream had a defined scope, a number against it and a gate saying what had to be true by when."], "H2": ["H2 asks you to create a culture of confidence and trust in your organisation's future direction. It is partial, and the gap is scope, not substance. Within the delivery community it is genuinely evidenced. A function that had lost the confidence of its consumers was rebuilt with them. Maturity lifted measurably. Two elections delivered to statutory dates. People who had said the methodology did not serve them watched it change because they said so. What is missing is organisational scope. Confidence in the agency's future direction is a thing the Commissioner and the executive hold. Yours is confidence in delivery, a large and important subset, but a subset. So describe what you rebuilt and name it as the delivery community."], "H1": ["H1 asks you to champion the organisational vision and strategy and communicate the way forward. You translate organisational strategy with unusual rigour. Championing is a different act. It is advocating the vision itself, to the organisation, as its owner or its spokesman. On the evidence in front of me, this is partial. The route is the interim EPMO Director role. Taking the organisation through a business planning cycle at concept stage means communicating organisational direction to the people whose proposals were assessed against it. If in that period you presented direction, priorities or the investment position to a directors forum or the executive, this clears. Until then, answer on translation and do not reach for championing."], "H3": ["H3 asks you to generate enthusiasm and commitment to goals and ensure all levels of the organisation understand them. Two limbs, and you clear one. The reach limb is closed by the workforce training cascade. A Training and Workforce Strategy a year out. Materials developed over seven months. An online pack, a second for election day, two days of support officer training, three weeks of face-to-face training for Returning Officers, and a briefing from the Polling Place Manager to every official before setup. That reached 22,990 people through a structure that was gated rather than assumed.", "Add seven governance forums at the executive layer, a project managers forum and a community of practice in between, and no level was missed. The enthusiasm limb is still not yours to claim, and you should not claim it. Enthusiasm asserted is worth nothing. Voluntary attendance is worth a great deal. So in the room. The goals
