 which I had built myself in my previous role as Senior Manager, EPMO."], "t": ["My first instinct was to take it offline to protect the meeting. The executive overruled me and directed me to ensure the stakeholders were heard. So the task was not to receive the criticism — it was to hear criticism of my own work, in public, without letting my authorship of it distort the record."], "a": ["I chaired a dedicated Project Managers Forum on the issues, with the EPMO and the PM Practice Lead present.", "Early in it I noticed I was defending my own processes. Some of the criticism I had seen coming; a good deal of it I had not. That recognition changed what I did next: I minuted every concern as it was raised rather than as I would have preferred it to read, because I could feel that summarising it would have softened it.", "I made methodology decisions in the room where teams needed direction to move, rather than deferring them to a paper. The criticism of the enterprise methodology went into the minute because the stakeholders wanted it minuted and addressed rather than handled informally — and the processes they were describing were mine.", "I escalated the full record to the Project Leadership Team and proposed a structural response rather than a remediation list — the Elections PMO and the EPMO would jointly develop a service catalogue, with a standing commitment that stakeholders are engaged before any change to it.", "Then I did the part that mattered more. I met the project managers individually and asked for feedback on myself — specifically, why they had not been able to raise the concerns with me directly. I also met several directors to understand what they were hearing, so I was not taking one account of my own conduct.", "[CONFIRM: what the 1:1s actually told you, and what you changed as a result — this is the payoff and it is currently missing]"], "r": ["The program mobilised with a delivery framework its own users had helped define, and delivered on time within its $150 million authority. Independent evaluation later recorded political participant satisfaction, trust and perceptions of fairness up sixteen, twenty and twenty-two points respectively against the previous local government elections.", "What I took from it personally is narrower and more useful than the program outcome. I had designed the Project Managers Forum precisely so that risks, issues and concerns could be raised in a psychologically safe setting away from the leaders. What the kick-off told me is that building the structure for safety and being someone people feel safe with are two different achievements, and only the first of them was mine to design."], "notes": ["§ Delivery notes", "• This version is written for behaviour modification, not resilience. The Display resilience and courage version leads on being open to criticism. This one leads on noticing an internal state and changing conduct because of it. Do not use both in one application.", "• The final paragraph is the Highly advanced element. A general lesson drawn from a specific failure of your own, about yourself rather than about the process. Most candidates end at the program outcome and leave the indicator unevidenced.", "• The 1:1s are what convert this from Advanced to Highly advanced. Asking \"why couldn’t you tell me?\" of the people who did not tell you is the rarest evidence in this capability. Do not bury it in the Action — it deserves its own sentence and a pause.", "• On carrying the EPMO criticism into the forum: say the provenance plainly. The stakeholders wanted it minuted rather than handled informally, and you were the conduit — you were not volunteering criticism of colleagues. Then own that the processes were yours. Faithful conduit plus authorship is the strongest available combination and it removes any reading of disloyalty.", "• Attribution discipline: the political participant movements belong to the independent evaluation, not to you. Say the program was the delivery vehicle and let the panel draw the inference."], "probes": [], "keys": ["$150 million", "Senior Manager", "Project Managers Forum", "Practice Lead", "Project Leadership Team"], "bul": []}, {"title": "STAR C — Highly advanced", "sub": "Primary indicator: H6 encourage diverse approaches to leadership that value collaboration, proactiveness and decisiveness. Supporting: H2 · H3 · A4", "s": ["During the 2024 Local Government elections program, a new Information Services Application Director was onboarded. Her teams were, I had been advised by the portfolio manager, product-based agile squads — and I had built a MoSCoW prioritisation process with the business areas and her team on that assumption.", "I was invited to one of her squad meetings. Every team lead reported through a project status report."], "t": ["That single observation told me the delivery maturity was lower than I had assumed, and that the prioritisation process I had put in place with the business might not produce the outcome I was expecting. I had a diagnosis, a preference, and no authority over her — she was a director; I was accountable for the program."], "a": ["I raised it with her in a one-to-one rather than in a governance forum, because a new director’s operating model is not a matter to be examined in front of an audience.", "She had observed exactly the same thing. Her position was that she did not intend to change the operating model until she had been through a complete election cycle.", "I thought that was fair and I backed it. Her reasoning was better than my instinct: in an organisation whose entire product recurs on a four-year cycle, against a statutory date, with institutional knowledge concentrated in people rather than documents, a new director reforming an operating model before experiencing one full event is taking a risk that is difficult to reverse.", "What I did not do was leave the consequence unmanaged. I separated the two questions — whose decision it was, and whether the resulting risk was being controlled. The decision was hers. The risk went into the Technology, Scope and Risk Steering Committee, where it was collectively owned, visible and covered by the program’s assurance regime for the remainder of delivery."], "r": ["The election was delivered on time and within its investment authority, and the risk was managed through governance rather than through a mid-flight change to a team’s way of working.", "The reflection I would offer is this. I had opened that same program listening to criticism that the EPMO changed the engine mid-flight — criticism of processes I had built. A few months later I was presented with the opportunity to do exactly that to a director who had not yet flown one. I did not."], "notes": ["§ Delivery notes", "• The closing paragraph is why this STAR exists. It links two stories into a demonstrated arc: a lesson extracted from criticism of your own work, then applied to yourself months later at cost. That is Manage self at Highly advanced — learning that changed conduct, not learning that was noted.", "• The strongest structural element is the separation of \"whose call is it\" from \"is the risk controlled\". Backing someone’s judgement while routing the residual risk into governance is the difference between supporting a leader and abdicating to one. Say it in those words.", "• Keep the 1:1 choice explicit. Raising it privately rather than in a forum is a small detail that tells a panel a great deal about how you treat senior colleagues you disagree with.", "§ Probe risk — prepare this one", "\"Was project-style reporting really a maturity signal — or was your own governance forcing it on an agile team?\"", "This is a fair and likely challenge from any panel member with a product or agile background, and it is the one question that could unpick the STAR. An EPMO gate and assurance regime that demands project status reporting will produce project status reporting from product teams, irrespective of how they actually work. If that was partly the case, say so — it converts a possible weakness into thought leadership:", "\"Partly, yes — and that is the more interesting problem. If enterprise governance requires project-format reporting from product teams, then governance is the maturity constraint, not the team. The resolution is to gate the investment decision rather than the delivery decision: fund in stages, then govern delivery through standing conditions that are continuously evidenced. That is a change to the assurance model, not to her squads.\"", "That answer also lands on H4 — thought leadership, new practices for the organisation to adopt."], "probes": [], "keys": ["Information Services Application Director", "Risk Steering Committee"], "bul": []}], "notes": [{"h": "Verdict", "body": ["This sits alongside Commit to customer service as your strongest capability, and it clears on largely independent evidence — which is what a portfolio needs. H3 is arguably the single strongest indicator you hold anywhere in the framework."]}, {"h": "Allocation — resolve this before you write anything", "body": ["The LGE24 kick-off arc is currently assigned to Display resilience and courage (\"be open to criticism of your ideas\"). It is a better fit here. Manage self H2 asks for \"a strong capacity and willingness to modify your behaviour\" — and you modified your behaviour in real time, mid-meeting, against your own instinct, on a matter where you were the author of the thing being criticised.", "Display resilience and courage and Manage self are almost never both focus capabilities on the same role — they sit adjacent in the Personal Attributes group and panels treat them as covering similar ground. The rule:", "• Only one is assessed → the kick-off arc goes there, whichever it is", "• Both are assessed → kick-off arc to Manage self; Display resilience runs on the resilience proposal and the SGE23 red-to-green recovery, which are strong enough alone"]}, {"h": "The Band 1 fact — and how to say it", "body": ["Eleven of twelve senior executives, at a substantive grade above your own, took program direction from you. This had not appeared in a single role section, capability pack or STAR before now, and it is the most directly relevant fact you hold for a Band 1 application.", "§ Say \"reported into the program\", not \"reported to me\"", "You made this distinction yourself, correctly, earlier in this campaign: a Program Manager creates a temporary organisation and manages it; the functional directors and executives hold the authority. Hold that line — the honest version is stronger, not weaker:", "\"Eleven of the organisation’s twelve Band 1 executives reported into my program for delivery. None of them reported to me. I had accountability for their delivery and no authority over them, and the program landed on time and within its authority.\"", "Accountability without authority over people senior to you is a far more impressive claim than a line-management claim, and it is unfalsifiable because it is true."]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "NSWEC 2023 State general election and 2024 Local Government elections reports — elections.nsw.gov.au", "NSWEC LGE24 governance model and Program Management Plan retrospective (OFFICIAL–Sensitive) — supplied.", "Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025 — supplied.", "ACU Delivery Optimisation brief (Position 10613501, HEW 9) — R1–R9 EPMO service catalogue and the investment-gating model.", "Candidate-supplied evidence, 14–15 August 2026."]}], "script": {"id": "ms", "intro": ["Manage self sounds soft and marks hard. The framework defines it in seven words. Be persistent, self-reflect and commit to learning. At Advanced a panel wants a professional role model who seeks feedback, uses the negative kind, acts decisively and keeps learning. At Highly advanced they want something rarer. Proof that the learning changed your conduct.", "What separates Advanced from Adept is verifiability. At Adept you pass by describing good habits. At Advanced they have to be visible to other people and held under pressure. The trap is self-assessment language. Take pride in achieving them is the hardest phrase in the framework to answer, and most candidates fail it by trying. The other is the performance and development plan. Every NSW public servant has one, and offered as evidence a panel hears I complied with the performance system."], "standing": ["You are strong here. Advanced clears on all five indicators, on every limb, and four of the five clear exceptionally. Highly advanced clears on five of six. H1, H2, H3, H4 and H6, with H2 complete on all three limbs. H5 is partial, on the recognition gap. That is strong enough to claim at Highly advanced where a role description sets it there.", "Settle one thing first. Display resilience and courage and Manage self are almost never both focus capabilities on the same role. If only one is assessed, the kick-off arc goes there. If both are, the kick-off arc comes here, and Display resilience runs on the resilience proposal and the SGE23 recovery."], "inds": {"A1": ["A1 wants a professional role model with high personal goals. Panels accept conduct others can observe, not adjectives about yourself. What clears it is eight continuous years teaching project management at the University of Sydney while holding full-time senior delivery roles, plus a year at TAFE NSW. The teaching ran right through two election programs, and you held a PMI Sydney Chapter directorship earlier in your career.", "Twice a software vendor hired you after you implemented their product as their client, which you have never used as a claim. BNP Paribas to Milestone Group, and RBC Dexia to Thomson Reuters, 15 years apart. That is a pattern, not luck. So in the room, it sounds like this. Twice a vendor has hired me after I implemented their product as their client. Then stop. Pride shows in what you refused to lower."], "A2": ["A2 has three limbs. Actively seek, reflect, act. Most candidates evidence only the middle one. The kick-off arc carries reflect and act. Actively seek is carried by what came after. You went to the project managers individually and asked for feedback on yourself, and the question was why they had not been able to raise the concerns with you personally. Then you met several directors, so the picture was triangulated. Do not offer the commissioned service evaluation. It measured the service, not you. So in the room, it sounds like this. I asked those project managers, one by one, why they hadn't been able to bring it to me directly."], "A3": ["A3 is about negative feedback, and panels know the fake version. They reject I took it on board. They accept a structural change they can point at. Your first instinct was to contain the criticism and take it offline, and the executive overruled you. You then heard it, minuted it verbatim while feeling defensive, and turned it into a change in how the whole function defines itself. So in the room, it sounds like this. The proof isn't that I accepted the criticism. It's that the Elections PMO and the EPMO built a joint service catalogue because of it."], "A4": ["A4 separates doing your job well from taking on what nobody assigned you. It reveals a signature you have not named. You take ownership of things nobody gave you. The complaint handling process, built from a fragmented intake that was never your responsibility. Election Operations Reporting, championed during the event. The resilience proposal after event assurance did not achieve its posture at SGE23. The change request that returned the entire $12 million contingency.", "Then decisiveness. Methodology decisions made in the room at the Project Managers Forum rather than deferred to a paper, and a vendor re-tender rather than an escalation. So in the room, it sounds like this. Four of the things I'm proudest of in that agency were never assigned to me."], "A5": ["A5 asks for new knowledge applied, and applied is the word a panel tests. A course completed is not evidence. A practice changed is. P3O, the P3M3 maturity uplift, portfolio management tooling, earned value management through the Financial and Cost Control forum, service catalogue discipline, and most recently an AI transformation program with hands-on platform work. The 30 year arc is the evidence. Fund accounting and unit pricing, to product management, to program delivery, to EPMO and portfolio, to AI transformation. So in the room, it sounds like this. I teach the discipline while I practise it, which keeps the knowledge current rather than remembered."], "H3": ["H3 is managing challenging, ambiguous and complex issues professionally. Ambiguous is the word doing the work, and most candidates cannot evidence it. At SGE23 you inherited a red program on an $89.1 million allocation against a $140.7 million estimate. The Electoral Act was then amended mid-program to cut early voting from 13 days to seven, iVote was withdrawn, and the date was fixed in statute. You delivered at $140.3 million against $144.3 million, with informality improved in both houses.", "Then LGE24. The Commissioner retired on 5 April 2024 with an Acting Commissioner from the next day, roughly $400 million sought and nothing awarded, and it landed on time within a $150 million authority. So in the room, it sounds like this. I've delivered two statutory elections against dates that could not move. One had its legislation amended mid-program. The other changed agency head months out. Neither got the funding it asked for."], "H1": ["H1 asks you to model self-improvement and apply new skills. The test is whether the learning is recent and cost you something. Certifications from a decade ago fail it. Teaching while practising is the spine of the answer. The sharper evidence is that at a senior career stage you moved into AI delivery and hands-on platform building rather than coasting on 30 years of method. So in the room, it sounds like this. At this stage of my career I chose to build in a new domain rather than manage from what I already knew."], "H2": ["H2 asks for a strong capacity and willingness to modify your behaviour. Most candidates offer a story about accepting feedback and changing later. A panel wants behaviour that changed while the pressure was still on. Your own words were, I found myself naturally defending them. You noticed it in the moment and changed conduct in the moment, minuting every concern as stated rather than as you would have preferred it to read.", "You had designed the Project Managers Forum to create psychological safety for raising risks and concerns away from the leaders, and at the kick-off you found they still had not reached you. So in the room, it sounds like this. Building the structure for safety and being someone people feel safe with are two different achievements, and only the first was mine to design."], "H4": ["Read the last five words of H4 closely. New knowledge and practices for your organisation to adopt. Not across the sector. You failed the equivalent Work collaboratively indicator on almost identical material, because that one says across the sector and your contribution stopped at the agency boundary. Here you clear on the service catalogue concept, the P3O operating model, the EPMO methodology adopted agency-wide, the Community of Practice that outlasted you, and Election Operations Reporting.", "The ACU delivery optimisation brief treats your Electoral Commission methodology as its reference implementation, which is corroboration that this is thought leadership rather than local preference. So in the room, it sounds like this. The methodology I built was adopted agency-wide, and another organisation's own brief treats it as its reference implementation."], "H6": ["H6 asks you to encourage diverse approaches to leadership. A panel discounts a claim that you tolerate different styles. It accepts a structure that forced you across them. Eleven of the organisation's twelve Band 1 executives reported into your program for delivery, at a substantive grade above your own. You could not have imposed one leadership style on eleven executives running their own functions. STAR C shows it directly, backing a new director's judgement over your own diagnosis and putting a control around the consequence rather than around her. So in the room, it sounds like this. Eleven of the twelve Band 1 executives reported into my program. None of them reported to me."], "H5": ["H5 is partial rather than failed. It asks you to create and promote a culture of organisational achievement, and you need to know which half fails. The achievement half is there in abundance. Two elections delivered, all program benefits recorded as Achieved, a Community of Practice that outlasted you, psychological safety established in the Project Managers Forum. The promote half is missing. There was no recognition, award, nomination or celebration at LGE24 closure.", "This is a pattern, not a coincidence. The same gap cost you the publicly celebrate indicator under Work collaboratively. Do not claim this one. Until the habit is fixed, use the development answer drafted in that pack. It is honest, and it shows you know exactly what the omission cost."]}, "stars": [["STAR A carries H3, and supports A4 and H1. Its strength is not the money, which panels hear about constantly. What they rarely hear is someone who delivered while the legislation governing the work changed mid-program, so lead with the ambiguity, not the adversity. The moment doing the real work is the plan to green going to the Steering Committee for approval rather than being implemented and reported afterwards. An approved recovery plan is a shared commitment. An authored one is an opinion. And do not wait to be asked about Government House. Volunteer that it was a group acknowledgement of the program team."], ["STAR B carries A3 and H2, with A2 underneath. It is written for behaviour modification, not resilience, so do not use it and the Display resilience and courage version in one application. The moment doing the real work is not the forum. It is the one-to-ones afterwards, asking the people who had not told you why they could not tell you. Give that its own sentence and a pause. Say the provenance of the criticism plainly and own that the processes were yours. And the movements of 16, 20 and 22 points belong to the independent evaluation, not to you."], ["STAR C carries H6, supported by H2, H3 and A4. Its strongest element is the separation of two questions. Whose call is it, and is the risk controlled. The decision was hers. The risk went into the Technology, Scope and Risk Steering Committee, collectively owned and covered by assurance. Backing someone's judgement while routing the residual risk into governance is the difference between supporting a leader and abdicating to one. Say it in those words. Then prepare one probe. Was project-style reporting a maturity signal, or was your own governance forcing it on an agile team? If it was partly that, say so, then gate the investment decision rather than the delivery decision. That answer lands you on H4."]], "outro": ["Fix the recognition habit, because H5 is the only indicator you are short of here and the same gap costs you a second capability. Fill the two open items in STAR A, which are what the plan to green comprised and how the gap between the $89.1 million allocation and the $144.3 million of funding was closed. Then finish STAR B by working out what the one-to-ones told you and what you changed as a result. And the strongest sentence you own here is this. Eleven of the organisation's twelve Band 1 executives reported into my program for delivery, none of them reported to me, and the program landed on time and within its authority."]}}, {"id": "inf", "name": "Influence and negotiate", "group": "Relationships", "desc": "Gain consensus and commitment from others, and resolve issues and conflicts", "verdict": [["Advanced", "Cleared on all seven. Two exceptionally"], ["Highly advanced", "Cleared on all seven. Two exceptionally. One limb of H3 is thinner than the rest and should be answered at the altitude you actually operated"]], "adv": [{"c": "A1", "t": "Influence others with a fair and thoughtful approach and present persuasive counter arguments", "v": "cle", "vt": "CLEARED", "body": ["Three instances. Making methodology decisions in the room at the kick-off forum against sustained pushback. Putting a program-wide change request through a governing chain. And the Applications Director conversation, where you presented a counter-position and then accepted hers — which is the \"fair and thoughtful\" half of the indicator, and the half most candidates skip entirely."]}, {"c": "A2", "t": "Work towards mutually beneficial, win-win outcomes", "v": "cle", "vt": "CLEARED", "body": ["The vendor re-tender is the cleanest example and the construction is the point: you did not terminate the incumbent. They retained their work, the program acquired capacity, and the roadmap became deliverable. Likewise the service catalogue — the EPMO gained a defensible offer, the delivery community gained predictability."]}, {"c": "A3", "t": "Show sensitivity and understanding when resolving serious and complex conflicts and differences", "v": "cle", "vt": "CLEARED", "body": ["The better evidence is the smaller instance. Raising the delivery maturity concern with a new Applications Director in a one-to-one rather than in a governance forum — a new director’s operating model is not something you examine in front of an audience. That choice evidences the indicator more convincingly than a large conflict would."]}, {"c": "A4", "t": "Identify key stakeholders and gain their support in advance", "v": "cle", "vt": "CLEARED, architecturally", "body": ["You did not pre-wire the contingency change request person by person, and the reason is the interesting part: you had built a process in your prior role that engineers the engagement into the approval chain. EPMO reviews it. Finance Business Partners approve it. The CFO approves it. It goes to the Program Director, then the Project Leadership Forum, then the Program Steering Committee.", "By the time that request reached the Steering Committee, every stakeholder whose support mattered had already endorsed it in writing. That is gaining support in advance — designed once, structurally, for all change, rather than negotiated afresh each time.", "The sentence to use: \"I did not need to lobby it through, because I had built the pipeline that engages the stakeholders before the decision forum ever sees the paper. The support was already on the document.\""]}, {"c": "A5", "t": "Negotiate from a clear position, based on research, a firm grasp of key issues, likely arguments, points of difference and areas for compromise", "v": "cle", "vt": "CLEARED", "body": ["The re-tender was a formal tender process, which is a research-based negotiating position by construction. The less obvious evidence is the MoSCoW prioritisation you led with the business areas and the applications team — structured negotiation across competing demands, which is \"points of difference and areas for compromise\" rendered as a method rather than a conversation. You have been treating that as a planning technique. It is negotiation evidence."]}, {"c": "A6", "t": "Anticipate and minimise conflict within your organisation and with external stakeholders", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Where the architectural signature pays. The service catalogue exists so that changes to the EPMO offer cannot ambush delivery teams again — a conflict-prevention instrument built directly out of a conflict. The procurement tracker surfaces every procurement and its required-by date before contention arises. Gate 2 criteria prevent late readiness disputes. Complaint triage stops issues escalating for want of an owner."]}, {"c": "A7", "t": "Use evidence, including data insights, to create persuasive stories", "v": "cle", "vt": "CLEARED", "body": ["Worth knowing this indicator is NEW in Version 3 — the \"data insights\" language did not appear in V2:2020, and it signals what the sector now expects of executives. You are well placed: the commissioned service evaluation, earned value management through the Financial and Cost Control forum, P3M3 maturity measurement, and a contingency return evidenced by total expenditure against authority rather than asserted."]}], "ha": [{"c": "H3", "t": "Determine and communicate your organisation’s position and bargaining strategy", "v": "cle", "vt": "CLEARED", "body": ["A CORRECTION TO MY EARLIER ASSESSMENT. I had this as your one real gap, on the assumption that a Procurement Steering Committee chaired by the CIO and COO determined the position while your PMO serviced it. That was wrong, and it was wrong because I inferred your role from the chair of the forum rather than asking who designed it. You created the forum.", "What you actually did: authored a program procurement strategy; built a procurement tracker listing every procurement on the program with its required-by date, probity basis and incumbent vendor; prioritised that tracker by risk to identify the high-risk procurements; and established the Procurement Steering Committee to supervise them — with a remit covering approval of tender documents for market release, evaluation, probity, selection and recommendation to the Program Steering Committee.", "And you did it because of a diagnosed governance failure: at SGE23, ICT had been taking procurements to the Program Steering Committee instead of running a project-level forum, which loaded the program’s highest governing body with commercial decisions it was not constituted to make.", "CALIBRATION. You clear this indicator on the strategy and governance limb, decisively. You have not told me you set evaluation weightings, reserve positions or walk-away points — the tactical bargaining limb. If probed there, answer at the altitude you actually operated: \"I set the strategy, the risk prioritisation and the approval architecture; evaluation panels applied the criteria within it.\" Claiming tactical commercial detail you did not own is the one way to lose this indicator after having won it."]}, {"c": "H1", "t": "Use evidence, expert advice and feedback to shape your negotiation strategy and reach effective solutions", "v": "cle", "vt": "CLEARED", "body": ["The instance is small, precise and excellent. The procurement team was seeking financial information from a selected vendor and the CFO was supporting that requirement at the Program Steering Committee. The delay was cascading into downstream processes. You identified that the entity was a subsidiary of an ASX-listed parent, and that the financial information being sought was therefore already in the public domain through the parent’s continuous disclosure obligations. The procurement moved.", "PHRASING — make it airtight. Say it as: \"the entity was a subsidiary of an ASX-listed parent, so the financial information being sought was already publicly available through the parent’s continuous disclosure obligations to ASX and ASIC.\" That formulation survives a probe from a finance-literate panel member. Avoid any phrasing that implies the subsidiary itself carried the disclosure obligation.", "AND FRAME THE CFO CAREFULLY. \"I provided the disclosure context that resolved it\" — not \"the CFO did not know\". Never place a named executive on the wrong side of your own good idea in a selection process."]}, {"c": "H2", "t": "Influence outcomes with sound arguments, strong evidence, quality data and expert opinion", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The ASX instance is influence upward, with technical substance, in a Steering Committee, producing a schedule benefit. The contingency return is the larger instance: a program-wide change request agreed by the Steering Committee, with the outcome evidenced by total expenditure against authority.", "§ The argument this unlocks about your career shape", "Knowing that a subsidiary’s financials are visible through an ASX-listed parent’s disclosure regime is precisely the knowledge you acquire in fourteen years across BNP Paribas, RBC Dexia, Milestone Group and Thomson Reuters — and almost nobody in an electoral commission would hold it.", "Every private-to-public candidate faces the unspoken question of whether their commercial background translates. This is your answer, and it is concrete rather than assertive: a piece of financial services knowledge, applied inside a public sector procurement, that removed a schedule constraint. Use it whenever the translation question is in the room."]}, {"c": "H4", "t": "Represent your organisation in critical and challenging negotiations, including those that are cross-jurisdictional", "v": "cle", "vt": "CLEARED", "body": ["Read \"including\" carefully — cross-jurisdictional is offered as an example, not required. That matters, because your cross-jurisdictional evidence is resourcing rather than solution development, and here it does not block you.", "You clear on vendor representation, which you identified yourself: external representation is not yours for stakeholders or community, but for vendors it is. A roughly $80M portfolio of high-risk tenders and RFQs, and a re-tender you ran and fronted personally."]}, {"c": "H5", "t": "Achieve effective solutions when dealing with unclear or conflicting positions", "v": "cle", "vt": "CLEARED", "body": ["The Applications Director situation is the tidiest: two informed people with conflicting positions on the same evidence, resolved by separating whose decision it was from whether the risk was controlled. Also SGE23 — an $89.1M allocation against a $140.7M requirement is a conflicting position before anyone has spoken."]}, {"c": "H6", "t": "Anticipate and minimise conflict across organisations and with senior internal and external stakeholders", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Note \"senior\" and \"across organisations\". Eleven Band 1 executives whose functions competed for the same program resource, priority and calendar, held in productive alignment for the duration of a program. The seven-forum model is the mechanism, and it is properly read as a conflict architecture: each forum exists to surface and settle a distinct class of dispute — technical scope and risk, procurement, financial and cost control, project leadership — before it reaches the Steering Committee as a fight."]}, {"c": "H7", "t": "Identify contentious issues, facilitate discussion and debate, and steer parties towards an effective resolution", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The kick-off arc matches phrase for phrase: contentious issue identified — your own processes; discussion facilitated — a forum you chaired with every concern minuted as stated; parties steered to resolution — a jointly developed service catalogue with a change-engagement commitment. Use only if that story is not already committed to Display resilience and courage or Manage self."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: H3 determine and communicate your organisation’s position and bargaining strategy · H6 anticipate and minimise conflict with senior stakeholders. Supporting: A5 · A6", "s": ["At the 2023 State general election, procurement decisions were being taken to the Program Steering Committee itself. That committee was constituted for program governance and management control, with the Electoral Commissioner and the senior executive in the room. It was not constituted to evaluate tenders, and every procurement that reached it displaced program decisions that only it could make.", "Going into the 2024 Local Government elections — a $150 million program with roughly $80 million of high-risk tenders and RFQs ahead of it — that was a governance failure waiting to repeat at greater scale."], "t": ["To determine how the program would go to market, on what basis, in what order, and under whose authority — and to do it before the first tender was drafted rather than after the first dispute."], "a": ["I authored a program procurement strategy, and I started it with a tracker rather than a policy. Every procurement the program required was listed with its required-by date, the probity basis underpinning it, and the incumbent vendor where one existed. That single artefact converted procurement from a series of individual events into a portfolio with a critical path.", "I then prioritised the tracker by risk to identify which procurements were high-risk — by value, by probity exposure, by schedule criticality and by market depth.", "[CONFIRM: the criteria you actually used to classify a procurement as high risk]", "For those, I established a dedicated Procurement Steering Committee with a defined remit: approve tender documents for release to market, oversee evaluation and probity, make the selection, and recommend to the Program Steering Committee. Membership sat with the Chief Information Officer and Chief Operating Officer, and it met monthly.", "The design point is the separation. Commercial decisions were resolved in a forum constituted to make them, and reached the Program Steering Committee as recommendations rather than as debates."], "r": ["Roughly $80 million of high-risk procurement was supervised through a forum built for it. The Program Steering Committee retained its capacity for program-level decisions. And the lesson that produced the design was one from the previous election — which matters, because implementing lessons was precisely what the delivery community had said the organisation did not do."], "notes": ["§ Delivery notes", "• Lead with the diagnosis, not the artefact. \"The highest governing body in the program was being used as a tender panel\" is a sentence that tells a panel you understand what governance forums are for. The tracker and the committee follow from it.", "• Answer at the altitude you operated. If probed on evaluation weightings or walk-away positions: \"I set the strategy, the risk prioritisation and the approval architecture; evaluation panels applied the criteria within it.\" Do not claim tactical commercial detail you did not own.", "• Probe — \"Was this yours or the CIO’s?\" → \"The forum was mine to design and stand up. The decisions inside it were theirs to make. That was the point — I did not want the program manager making commercial selections.\""], "probes": [], "keys": ["$150 million", "$80 million", "Program Steering Committee", "Electoral Commissioner", "Procurement Steering Committee", "Chief Information Officer"], "bul": []}, {"title": "STAR B — Highly advanced", "sub": "Primary indicators: H4 represent your organisation in critical and challenging negotiations · A2 mutually beneficial outcomes · A1 fair and thoughtful influence. Supporting: A5 · H5", "s": ["As Senior Manager, EPMO – Transformation at the NSW Electoral Commission, the incumbent development vendor was not delivering against the agreed roadmap. I had been in continuous conversation with them about non-performance for some time.", "Then they moved our implementation to a new team. That was the point at which the position became untenable — not a missed milestone, but the unilateral removal of the people who understood the work, on an engagement already behind.", "[CONFIRM: which system or program, and what the consequence of continued slippage would have been]"], "t": ["To restore delivery capacity against a date fixed in statute, without losing the work and knowledge the incumbent already held, and without forfeiting the organisation’s contractual position if the relationship ultimately failed."], "a": ["I ran a new tender and sourced an additional vendor, who took over several Epics. That rebalanced development across two partners and reduced the roadmap to what could credibly be delivered. It increased cost, and I put that to the decision-makers as a trade-off rather than as a recommendation dressed up as one.", "The part that mattered most was the conversation with the incumbent. I put them on notice directly: I was under pressure from the Steering Committee, and direction had been given to look elsewhere. I told them before I went to market, not after.", "I did that for two reasons. The first was procedural — you cannot fairly activate non-performance clauses against a vendor you never warned, and I wanted the organisation’s remedies intact and defensible if it came to that. The second was practical: attributing the pressure to the governing body was both true and depersonalising. It invited them to solve the problem rather than defend themselves against me."], "r": ["Development load was balanced across two partners, the roadmap was reduced to something deliverable, and the cost increase was accepted with visibility of exactly what it bought. The incumbent was not surprised, the relationship remained workable, and the organisation’s contractual position was preserved rather than spent.", "[CONFIRM: whether the reduced roadmap was delivered, whether the incumbent’s performance recovered, and whether any non-performance clauses were ultimately activated]"], "notes": ["§ Delivery notes", "• This is the story that answers the architecture risk. It is live, uncomfortable, person-to-person and commercial. Any answer that leads on governance design should close on this.", "• The strongest single element is that you preserved both the relationship and the remedy. Most people manage one — they stay friendly and lose their contractual position, or they go legal and lose the delivery. You kept both live, deliberately.", "• The decision NOT to terminate is the second. Anyone can remove a failing vendor. Choosing to keep them and reshape the work around their capacity is judgement, and against a statutory date it is the only affordable judgement.", "• Probe — \"Wasn’t warning them a commercial risk?\" → \"The larger risk was activating a clause I had never given them the chance to answer. A remedy you cannot defend is not a remedy.\""], "probes": [], "keys": ["Senior Manager", "Steering Committee"], "bul": []}, {"title": "STAR C — Highly advanced (short form)", "sub": "Primary indicators: H1 use evidence and expert advice to shape negotiation strategy · H2 influence outcomes with strong evidence and expert opinion. Written short deliberately — this is an interview answer rather than a written response.", "s": ["A selected vendor’s financials were being sought by the procurement team before a contract could proceed, and the requirement was supported by the Chief Financial Officer at the Program Steering Committee. The procurement had stalled, and the delay was beginning to infringe on downstream processes with no float left in them.", "[CONFIRM: which program and roughly when]"], "t": ["To resolve a genuine due diligence requirement without spending schedule the program did not have."], "a": ["I provided the context that resolved it. The entity was a subsidiary of an ASX-listed parent, so the financial information being sought was already publicly available through the parent’s continuous disclosure obligations to the ASX and ASIC. The assurance the requirement was designed to obtain already existed, in the public domain, at no cost to the schedule."], "r": ["The procurement moved and the downstream sequence held.", "The wider point I would draw from it: I spent fourteen years in funds management and financial reporting across BNP Paribas, RBC Dexia, Milestone Group and Thomson Reuters. Disclosure regimes are not specialist knowledge in that world; they are the furniture. Almost nobody in an electoral commission would carry it, and on that day it was worth a fortnight of schedule."], "notes": ["§ Delivery notes", "• This is your answer to the translation question. Every private-to-public candidate faces an unspoken doubt about whether commercial experience carries across. This is concrete rather than assertive — a specific piece of financial services knowledge, applied inside a public sector procurement, that removed a constraint. Deploy it whenever that doubt is in the room.", "• Frame the CFO with care. \"I provided the disclosure context that resolved it\" — never \"the CFO did not know\". Do not place a named executive on the wrong side of your own good idea in a selection process.", "• Keep the phrasing exact. The parent carried the disclosure obligation and the subsidiary’s position was visible through it. Do not say the subsidiary was itself subject to continuous disclosure — a finance-literate panel member will hear the difference."], "probes": [], "keys": ["Chief Financial Officer", "Program Steering Committee", "Milestone Group", "Thomson Reuters"], "bul": []}], "notes": [{"h": "Verdict", "body": ["This now sits with Commit to customer service and Manage self as your strongest capabilities — and it is the one where the eleven-of-twelve fact does its heaviest work."]}, {"h": "The thesis — and the risk inside it", "body": ["Influence and negotiate is fundamentally about getting outcomes from people you cannot compel. Eleven of twelve Band 1 executives, at a substantive grade above yours, delivered a $150M program to a statutory date through your program. None of them reported to you. That is not a negotiation — it is continuous negotiation, sustained for the length of a program, with senior people who each had their own function, their own priorities and the standing option of not cooperating.", "Your signature, which you have not named:", "You negotiate architecturally. You build structures in which the argument has already been settled, rather than winning arguments one at a time.", "Seven governance forums with defined membership and decision rights. A change request pipeline that routes every proposal through EPMO review, Finance Business Partner and CFO approval before it reaches a decision forum. A program procurement strategy with a risk-prioritised tracker and a dedicated steering committee. A service catalogue with a standing commitment that stakeholders are engaged before change. Gate 2 mandatory criteria. Complaint triage with routing to the accountable area. Every one is a conflict-prevention instrument.", "THE RISK. A panel can read architecture as avoidance — a candidate who designs systems because he does not like the room. You must pair it with at least one live, uncomfortable, person-to-person negotiation. STAR B is that story and it is why it must be in any answer where the architectural material appears."]}, {"h": "Three of your four answers describe implementing a lesson", "body": ["The Procurement Steering Committee exists because of an SGE23 lesson — ICT had been taking procurements to the Program Steering Committee rather than running a project-level forum. The change request pipeline exists because you built it in the EPMO role. The service catalogue exists because of the kick-off.", "That is the answer to the sharpest attack available on your best story. If a panel says \"the criticism at kick-off was that lessons were not implemented — were you not the one who failed to implement them?\", the reply is specific rather than defensive:", "\"Some were, and I had built several of them — the change request pipeline and the procurement steering model both came out of prior election lessons. The criticism was not that lessons were ignored. It was that the EPMO changed methodology mid-delivery while requiring change control of everyone else. That was fair, and it was mine.\""]}, {"h": "Allocation change", "body": ["I previously assigned the vendor re-tender to Work collaboratively as its primary story. On this capability’s indicators that was the wrong home — it is fundamentally a negotiation story: a failing commercial relationship, a formal tender, a deliberate decision not to terminate, a warning issued to preserve contractual remedy, and a cost increase argued and accepted.", "Work collaboratively and Influence and negotiate are both Relationships group and rarely both assessed. The rule:", "• Only one assessed → the vendor re-tender goes there", "• Both assessed → vendor re-tender to Influence and negotiate; Work collaboratively leads on the Communities of Practice, which is strong enough alone and more distinctive", "The kick-off arc is now wanted by a fifth capability through H7. Hold the line — it stays with Display resilience and courage or Manage self. This capability has enough without it."]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "NSWEC LGE24 governance model — seven forums, membership, cadence and decision rights — supplied.", "NSWEC LGE24 Program Management Plan retrospective (OFFICIAL–Sensitive) — supplied.", "Candidate-supplied evidence, 14–15 August 2026."]}], "script": {"id": "inf", "intro": ["Influence and negotiate asks one thing. Can you gain consensus and commitment from others, and resolve issues and conflicts. Notice what is missing from that definition. There is no authority in it. This capability is about getting outcomes from people you cannot compel.", "At Adept, a panel accepts that you argued well and got your way. Advanced wants more. A fair and thoughtful approach alongside the persuasive counter argument. Win-win, not win. Conflict you anticipated rather than survived. Highly advanced adds altitude. You are setting the organisation's position and bargaining strategy, with senior people, across organisational boundaries.", "The trap is the victory story. Most candidates arrive with one hard argument they won and tell it as a contest. That clears Adept and stalls, because it shows no sensitivity, no compromise and no prevention. Your version of the trap is the opposite. You negotiate architecturally. You build structures in which the argument has already been settled, rather than winning arguments one at a time. A panel can read that as avoidance. So the architecture always travels with one live, uncomfortable, person-to-person negotiation."], "standing": ["You clear Advanced on all seven indicators, and Highly advanced on all seven. Nothing here is partial and nothing is uncleared. A6 is exceptional, and so are H2, H6 and H7. This now sits with Commit to customer service and Manage self as your strongest capabilities.", "So claim it at Highly advanced. Do not hold it in reserve. The one caution is inside H3, where the strategy and governance limb is decisive but the tactical bargaining limb is not evidenced. That is where an over-claim would cost you an indicator you have already won."], "inds": {"A1": ["Two halves here, and candidates hear only one. The persuasive counter argument is the loud half. Fair and thoughtful is the half that separates Advanced from Adept, and it means handling opposition without steamrolling it. You have three instances. Methodology decisions made in the room at the kick-off forum against sustained pushback. A program-wide change request put through a governing chain. And the Applications Director conversation, where you presented a counter-position and then accepted hers. That third one is the evidence most candidates simply do not have. So in the room, it sounds like this. I put my counter-position fully, and when hers held up better than mine, I took hers."], "A2": ["Win-win is a phrase panels have heard until it means nothing, so they test it by construction. They want both sides better off, and they reject a story where one side simply conceded. The vendor re-tender is your cleanest example. You did not terminate the incumbent. They retained their work, the program acquired capacity, and the roadmap became deliverable. The service catalogue does the same job. The EPMO gained a defensible offer and the delivery community gained predictability. So in the room, it sounds like this. I could have removed them. Instead I kept their knowledge, added capacity around it, and got a roadmap that could be delivered."], "A3": ["Serious and complex conflicts, resolved with sensitivity and understanding. Panels expect a large dispute, and that expectation is the trap, because scale is not sensitivity. Your better evidence is the smaller instance. You raised a delivery maturity concern with a new Applications Director in a one-to-one rather than in a governance forum. A new director's operating model is not something you examine in front of an audience. That choice evidences the indicator more convincingly than a large conflict would. So in the room, it sounds like this. She was new, and the question I had was about her operating model, so I asked it one-to-one."], "A4": ["Gaining support in advance usually means pre-wiring before the meeting. You did not do that for the contingency change request, and the reason is the interesting part. In your prior role you built a process that engineers the engagement into the approval chain itself. The EPMO reviews it. Finance Business Partners approve it. The Chief Financial Officer approves it. Then the Program Director, the Project Leadership Forum, the Program Steering Committee. Every stakeholder whose support mattered had endorsed it in writing before it arrived.", "So in the room, it sounds like this. I did not need to lobby it through, because I had built the pipeline that engages the stakeholders before the decision forum ever sees the paper. The support was already on the document."], "A5": ["This one is about preparation. Research, a grasp of the issues, the arguments coming back at you, the points of difference, and where you can move. A panel rejects a story where you turned up and were persuasive. The re-tender is a formal tender process, which is a research-based position by construction. The less obvious evidence is the MoSCoW prioritisation method you led with the business areas and the applications team. That is points of difference and areas for compromise, rendered as a method rather than a conversation. You have been treating it as planning. It is negotiation evidence. So in the room, it sounds like this. I did not argue priorities case by case. I put the competing demands into a structured prioritisation and we settled them together."], "A6": ["Anticipate and minimise. Both verbs sit before the fact, and this is where your architectural signature pays. The service catalogue exists so that changes to the EPMO offer cannot ambush delivery teams again, which makes it a conflict-prevention instrument built out of a conflict. The procurement tracker surfaces every procurement and its required-by date before contention arises. Gate 2 criteria prevent late readiness disputes. Complaint triage stops issues escalating for want of an owner. This is exceptional because the pattern repeats. So in the room, it sounds like this. The service catalogue and the procurement steering committee each exist because a conflict happened once, and I built something so it could not happen the same way twice."], "A7": ["Worth knowing this indicator is new in Version 3. The data insights language did not appear in the 2020 framework, and it signals what the sector now expects of executives. So a panel is listening for measurement, not anecdote. You are well placed. The commissioned service evaluation. Earned value management through the Financial and Cost Control forum. P3M3 maturity measurement. And a contingency return evidenced by total expenditure against authority rather than asserted. That last one is the model answer, because the evidence and the claim are the same object. So in the room, it sounds like this. I didn't assert that the contingency had been returned. Total expenditure against authority evidenced it at closure, so the number made the argument rather than me."], "H1": ["Evidence and expert advice shaping the negotiation strategy. A panel wants a moment where you brought something into the room that changed what was possible. Your instance is small, precise and excellent. The procurement team was seeking financial information from a selected vendor, the Chief Financial Officer supported that requirement at the Program Steering Committee, and the delay was cascading downstream. You identified that the entity was a subsidiary of an ASX-listed parent, so the information sought was already public. The procurement moved.", "Say it exactly like this. The financial information being sought was already publicly available through the parent's continuous disclosure obligations to ASX and ASIC. That survives a finance-literate probe. Never imply the subsidiary carried the obligation itself, and never say the Chief Financial Officer did not know."], "H2": ["Sound arguments, strong evidence, quality data, expert opinion. The word doing the work is influence, so the panel wants the outcome to move. You have two. The ASX instance is influence upward, with technical substance, in a Steering Committee, producing a schedule benefit. The contingency return is larger. A program-wide change request agreed by the Steering Committee, with the outcome evidenced by total expenditure against authority.", "This also carries the argument about your career shape. That disclosure knowledge is what you acquire in fourteen years across BNP Paribas, RBC Dexia, Milestone Group and Thomson Reuters, and almost nobody in an electoral commission would hold it. So in the room, it sounds like this. That was financial services knowledge applied inside a public sector procurement, and it removed a schedule constraint."], "H3": ["Determine and communicate your organisation's position and bargaining strategy. This is the indicator I had wrong. I inferred your role from who chaired the forum rather than asking who designed it. You created it. You authored a program procurement strategy, built a tracker listing every procurement with its required-by date, probity basis and incumbent vendor, then prioritised it by risk. You established the Procurement Steering Committee to supervise the high-risk ones, with a remit covering tender documents for market release, evaluation, probity, selection and recommendation upward. And you did it because of a diagnosed failure. At the 2023 State general election, ICT had been taking procurements to the Program Steering Committee instead of running a project-level forum, loading the program's highest governing body with commercial decisions it was not constituted to make.", "Now the calibration. You have not evidenced evaluation weightings, reserve positions or walk-away points, and that is the tactical bargaining limb. If probed there, answer at the altitude you operated. I set the strategy, the risk prioritisation and the approval architecture. Evaluation panels applied the criteria within it. Claiming detail you did not own is the one way to lose this indicator after winning it."], "H4": ["Read the word including carefully. Cross-jurisdictional is offered as an example, not required. That matters, because your cross-jurisdictional evidence is resourcing rather than solution development, and here it does not block you. You clear on vendor representation, which you identified yourself. External representation is not yours for stakeholders or community, but for vendors it is. Roughly $80 million of high-risk tenders and requests for quotation, and a re-tender you ran and fronted personally. So in the room, it sounds like this. I represented the organisation across roughly $80 million of high-risk procurement, and on the re-tender I was the person in front of the vendor, not behind the paper."], "H5": ["Unclear or conflicting positions, and an effective solution out of them. Panels want to see you separate the substance of a disagreement from the authority to settle it. The Applications Director situation is the tidiest example you have. Two informed people, conflicting positions on the same evidence, resolved by separating whose decision it was from whether the risk was controlled. The 2023 State general election gives you a second. An $89.1 million allocation against a $140.7 million requirement is a conflicting position before anyone has spoken. So in the room, it sounds like this. I stopped arguing the conclusion and asked two separate questions. Whose call was it, and was the risk controlled either way."], "H6": ["Note the two qualifiers. Senior, and across organisations. This is not team conflict. Eleven Band 1 executives, whose functions competed for the same program resource, priority and calendar, held in productive alignment for the length of a program. The seven-forum model is the mechanism, and it reads properly as a conflict architecture. Each forum exists to surface and settle a distinct class of dispute. Technical scope and risk. Procurement. Financial and cost control. Project leadership. So in the room, it sounds like this. Seven forums were not administration. Each one was built to absorb a particular kind of disagreement so it never arrived at the Steering Committee as a fight."], "H7": ["Identify contentious issues, facilitate discussion and debate, steer parties to resolution. Three verbs, and a panel wants all three. The kick-off arc matches phrase for phrase. The contentious issue identified was your own processes. The discussion facilitated was a forum you chaired, with every concern minuted as stated. The parties steered to resolution produced a jointly developed service catalogue with a change-engagement commitment. That is exceptional evidence. One piece of allocation discipline though. That story is now wanted by a fifth capability. Hold the line. It stays with Display resilience and courage or Manage self. Use it here only if it is genuinely uncommitted on the day."]}, "stars": [["STAR A carries H3 and H6, with A5 and A6 underneath. It is a diagnosis before it is an artefact, and that is what makes it strong. The moment doing the real work is not the tracker and not the committee. It is the observation that the highest governing body in the program was being used as a tender panel, and that every procurement reaching it displaced a decision only it could make.", "So lead with the diagnosis. The tracker and the committee follow from it. If they probe evaluation weightings or walk-away positions, you set the strategy, the risk prioritisation and the approval architecture, and evaluation panels applied the criteria within it. If they ask whether this was yours or the Chief Information Officer's, the forum was yours to design and stand up and the decisions inside it were theirs to make. You did not want the program manager making commercial selections."], ["STAR B carries H4, A2 and A1, with A5 and H5 supporting. This is the story that answers the architecture risk, because it is live, uncomfortable, person-to-person and commercial. Any answer that leads on governance design should close on this one.", "The strongest element is that you preserved both the relationship and the remedy. Most people manage one. They stay friendly and lose their contractual position, or they go legal and lose the delivery. You kept both live, deliberately. The decision not to terminate is the second. Anyone can remove a failing vendor. Keeping them and reshaping the work around their capacity is judgement. If they ask whether warning the vendor was a commercial risk, the larger risk was activating a clause you had never given them the chance to answer. A remedy you cannot defend is not a remedy."], ["STAR C carries H1 and H2, and it is short on purpose. This is an interview answer, not a written response. The work is done in one sentence about an ASX-listed parent, and everything else is setup and consequence.", "Keep the phrasing exact. The parent carried the disclosure obligation and the subsidiary's position was visible through it. Do not say the subsidiary was itself subject to continuous disclosure, because a finance-literate panel member will hear the difference. Frame the Chief Financial Officer with care. You provided the disclosure context that resolved it. Deploy this whenever the translation doubt is in the room, because it is concrete rather than assertive."]], "outro": ["There is no gap to close here, only a discipline to hold. Keep H3 at the altitude you operated. Keep the kick-off arc with Display resilience and courage or Manage self. Never let the architectural material travel without STAR B beside it. If both Relationships capabilities are assessed, the vendor re-tender comes here while Work collaboratively leads on the Communities of Practice. And the strongest sentence you own on this capability is this one. Eleven of twelve Band 1 executives, at a substantive grade above mine, delivered a $150 million program to a statutory date through my program, and not one of them reported to me."]}}, {"id": "dr", "name": "Deliver results", "group": "Results", "desc": "Achieve results by using resources efficiently and committing to quality outcomes", "verdict": [["Advanced", "7/7 cleared. Five exceptionally. Your strongest Advanced sweep in the entire framework"], ["Highly advanced", "6 of 6 cleared, following the recognition and workforce training evidence supplied 16 August"]], "adv": [{"c": "A1", "t": "Seek and apply the expertise of key individuals to achieve business outcomes", "v": "cle", "vt": "CLEARED", "body": ["The best instance is the Applications Director. You had a diagnosis, she had a different judgement grounded in experience you did not have, and you applied hers over your own — then put a control around the consequence rather than around her. Also the vendor tender, the commissioned research house, and eleven Band 1 executives whose functional expertise you had no alternative but to rely on."]}, {"c": "A2", "t": "Lead a culture of achievement and acknowledge others’ input", "v": "cle", "vt": "CLEARED", "body": ["See the section above. Lead with the minuting and the co-design — acknowledging input by building it into the record and the design is the more distinctive half, and fewer candidates can evidence it. Support it with the award nominations, including the one made outside your own team."]}, {"c": "A3", "t": "Determine how outcomes will be measured and guide others on evaluation methods", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["A benefits framework carrying integrity, timeliness, participation and accessibility, operational efficiency, public trust and compliance — each with formal achievement status at closure. Earned value management through the Financial and Cost Control forum. P3M3 maturity measurement. Gate 2 criteria expressed as testable conditions rather than assertions. Targets set as absolutes: outcome-altering recounts zero, material post-election breaches zero.", "And the strongest version of the indicator: you determined that service outcomes would be measured by someone you did not control, across six survey instruments and roughly 3,500 respondents."]}, {"c": "A4", "t": "Investigate and create opportunities to enhance the achievement of business objectives", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The same signature that appears in every capability — you take ownership of things nobody gave you. Six unrequested initiatives: the program-wide change request, the complaint handling process, Election Operations Reporting, the program procurement strategy, the resilience proposal, and the service catalogue."]}, {"c": "A5", "t": "Make sure others understand the need for on-time and on-budget results and how success is defined", "v": "cle", "vt": "CLEARED", "body": ["Gate 2 is the artefact, and it is the best answer to this indicator you could have: success defined as a condition that can be tested and failed, not as an aspiration. Venues 100% contracted and accessible. Workforce at or above 85% filled with training commenced. Ballots certified and in production. Systems configured and end-to-end tested. Postal ready with first mailout confirmed. Communications in market. No uncontrolled high or extreme risks. Nobody in that program could be unclear what \"ready\" meant."]}, {"c": "A6", "t": "Control business unit output to ensure government outcomes are achieved within budget and on time", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Two elections, two statutory dates that could not move, both delivered. SGE23 at $140.3M against $144.3M. LGE24 on time within a $150M authority with the contingency returned in full and no high residual risks at closure. There is no stronger form of this indicator than an immovable legislated date met twice."]}, {"c": "A7", "t": "Progress organisational priorities and ensure resources are acquired and used effectively", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The resource acquisition numbers are of a scale most executives never touch: 22,990 temporary staff recruited, onboarded, trained and mobilised statewide against a $35M workstream; 2,486 venues contracted; 9,614,100 ballot papers printed and distributed; roughly $80M of vendor capacity procured under a strategy you authored. The \"used effectively\" limb is evidenced rather than claimed — total expenditure below authority with unspent contingency returned."]}], "ha": [{"c": "H3", "t": "Identify and remove potential barriers to achieving outcomes", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your strongest indicator here, and possibly across the whole framework alongside Manage self H3. Six distinct instances, each a named barrier removed by a structural remedy rather than by effort:", "The first is the purest expression of the indicator. You instituted the program-wide change request specifically to take pressure off the project managers and project owners who needed to be delivering — and it returned $12M as a by-product."]}, {"c": "H1", "t": "Use your professional knowledge and the expertise of others to drive organisational and government objectives", "v": "cle", "vt": "CLEARED", "body": ["Your professional knowledge: the ASX disclosure intervention, P3O, P3M3, earned value management, the service catalogue discipline. The expertise of others: eleven functional executives, a commissioned research house, two development partners. And at an electoral commission the organisational objective is a government objective — the conduct of statutory elections is the whole mandate."]}, {"c": "H2", "t": "Create a culture of achievement, fostering on-time and on-budget quality outcomes for the organisation", "v": "cle", "vt": "CLEARED on the delivery-system limb", "body": ["The P3M3 maturity uplift is the cultural evidence, not the delivery record. An organisation that moves up the maturity scale has changed how it works, not merely what it produced once. Two consecutive elections delivered on time and on budget is the output of that change, and the Community of Practice outlasting your tenure is the proof it was cultural rather than personal.", "Weakened, but not defeated, by the recognition gap."]}, {"c": "H6", "t": "Set and communicate high-level priorities for your organisation to achieve government outcomes", "v": "cle", "vt": "CLEARED", "body": ["On the same framing that carried Commit to customer service: at an electoral commission the election program substantially is the organisation’s priority set — the four-year cycle is the strategy. You allocated roughly $133.7M across fourteen workstreams, ran MoSCoW prioritisation with the business areas and the applications team, and risk-prioritised the procurement tracker. Priority setting with money attached is the only kind panels believe."]}, {"c": "H4", "t": "Establish systems to ensure all staff can identify direct connections between their work and your organisation’s outcomes", "v": "cle", "vt": "CLEARED", "body": ["Previously recorded as partial, on the basis that the service catalogue and benefits framework reached your delivery community of perhaps fifty people and not the 22,990 who ran the election. The training architecture answers it.", "The cascade was on the critical path and sequenced across ten months: a Training and Workforce Strategy a year out, training material developed from December to July, an online pack released in March, a second pack in June covering election day training and centralised operations, two days of Returning Officer Support Officer training in June, and three weeks of face-to-face training for Returning Officers and their support officers through June and July. Every election day official then received a face-to-face briefing from their Polling Place Manager before setup.", "That is a system, it reaches every level, and it was gated rather than assumed — the workforce strategy and the staffing model were both approved deliverables rather than activities reported on.", "ONE THING WOULD MAKE IT EXCEPTIONAL. Whether the training content explained WHY a procedure existed rather than only how to perform it. A polling place official who knows that the two-officer check exists because the count cannot be corrected afterwards is a different worker from one who knows only the step. If the material did that, say so — it is the difference between a training system and a line-of-sight system.", "AND HOLD THE BOUNDARY. The $35 million staffing and training workstream was delivered by the HR Director. Your accountability was the programme’s, not the function’s — you governed, funded and gated it. Say it that way."]}, {"c": "H5", "t": "Identify, recognise and celebrate success", "v": "cle", "vt": "CLEARED", "body": ["PREVIOUSLY RECORDED AS NOT CLEARED. THAT JUDGEMENT WAS WRONG — it rested on the absence of a closure event and missed the recognition mechanisms you actually used.", "The agency ran a Chief Operating Officer award scheme with recognition made at divisional meetings. You used it, including nominating an ICT employee for their contribution to your business area and to the election programme — recognition given across a functional boundary, to someone who did not report to you, for work that helped your programme. Recognising your own team is expected; nominating outside it is the form of this indicator that costs the nominator something.", "The narrower point that survives: there was no programme-level closure recognition for a workforce of nearly 23,000. Concede that specifically rather than conceding a disposition you do not have."]}], "stars": [{"title": "STAR A — Advanced, extending to Highly advanced", "sub": "Primary indicators: A5 make sure others understand on-time and on-budget results and how success is defined · A6 control output to achieve outcomes within budget and on time · A7 acquire and use resources effectively. Supporting: A3 · H2", "s": ["The 2024 NSW Local Government elections had to be held on Saturday 14 September 2024. An election is the only class of program where you cannot deliver late, cannot deliver partially, and do not get a second attempt — the date is fixed in legislation and the entire output is consumed in a single day.", "To reach that day the program had to stand up a temporary organisation of nearly 23,000 people, contract almost 2,500 venues across the state, print and distribute more than nine million ballot papers, and have every system configured and tested — inside a $150 million investment authority."], "t": ["To make readiness a decision rather than an opinion. In a program of that shape the dangerous moment is not delivery, it is the point of mobilisation — because once you commit tens of thousands of people and thousands of venues, the cost of being wrong cannot be recovered inside the calendar."], "a": ["I made mobilisation conditional on a mandatory gate with criteria that were binary and testable rather than reported and interpreted:", "• Venues 100% contracted and accessible", "• Workforce at or above 85% filled with training commenced", "• Ballot papers certified and in production", "• Systems configured and end-to-end tested", "• Postal ready with the first mailout confirmed", "• Communications in market", "• No uncontrolled high or extreme risks", "The design principle was that each criterion could be failed. A readiness report can be argued with; a gate criterion cannot. It meant the program could not talk its way past a venue that was contracted but not accessible, or a workforce that was recruited but not trained.", "[CONFIRM: whether you authored the Gate 2 criteria, and who approved them]", "Behind the gate sat fourteen workstreams and roughly $133.7 million, thirteen aggregate projects, nine functional directors and ten project managers, with a four-tier operational command structure running from the Executive Control Group through the Election Operations Command Centre and functional control rooms to returning officers in the field.", "[CONFIRM: whether any criterion came close to failing, and what you did about it — this is the detail that proves the gate was real rather than ceremonial]"], "r": ["The program mobilised 22,990 temporary staff — including 70 returning officers, 2,217 polling place managers, 2,215 deputies, 7,947 election officials and 3,008 declaration vote issuing officers — across 2,099 polling places, 317 early voting offices, 70 returning officers’ offices and five centralised operations sites, with 9,614,100 ballot papers printed.", "The election was delivered on time and within the $150 million authority, with unspent contingency returned, no high residual risks at closure, and all program benefits recorded as achieved.", "Independent evaluation afterwards found 90% of voters found it easy to vote and 88% were satisfied with the experience, with average queue times of 4.3 minutes at early voting and 6.0 minutes on election day. That is the measure I would put in front of a panel, because it is the only one that tests whether the machine worked at the counter rather than in the report."], "notes": ["§ Delivery notes", "• Lead with why the date is different. \"Cannot deliver late, cannot deliver partially, no second attempt\" frames everything that follows and separates this from any ordinary program recovery story.", "• The gate criteria are the answer to A5. Do not paraphrase them — list three or four verbatim. Specificity is the evidence that success was defined rather than described.", "• Close on the queue times, not the headcount. Anyone can recite a mobilisation number. Very few candidates can produce an externally measured customer outcome that proves the mobilisation worked.", "• Probe — \"What if a criterion had failed?\" → have the answer ready. The credibility of a gate rests entirely on what would have happened if it had not been met."], "probes": [], "keys": ["$150 million", "$133.7 million", "23,000", "2,500", "22,990", "2,217", "Executive Control Group", "Election Operations Command Centre"], "bul": ["Venues 100% contracted and accessible", "Workforce at or above 85% filled with training commenced", "Ballot papers certified and in production", "Systems configured and end-to-end tested", "Postal ready with the first mailout confirmed", "Communications in market", "No uncontrolled high or extreme risks"]}, {"title": "STAR B — Highly advanced", "sub": "Primary indicator: H3 identify and remove potential barriers to achieving outcomes. Supporting: A4 · A7 · H1", "s": ["The change control process on the program was one I had built myself in my previous role in the EPMO. Every change was reviewed by the EPMO, approved by the Finance Business Partners and the Chief Financial Officer, then taken to the Program Director, the Project Leadership Forum and the Program Steeri
