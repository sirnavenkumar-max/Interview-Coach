wer as well as here.", "[CONFIRM: whether your programme operationalised the new regulation — training the 2,217 polling place managers and 2,215 deputies on the health and safety direction powers. And whether the 268 incidents reported between 15 July and 11 October 2024, of which 144 required first aid, reported into your governance]"]}, {"h": "The two recurring gaps — a portfolio view", "body": ["Across ten capabilities, two habits now account for six lost or weakened indicators:", "Both are cheap to fix in a next role and neither is a competence deficit — they are omissions of practice. Naming them yourself, accurately, in a development answer is worth more than stretching for either."]}, {"h": "Open items — in priority order", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "Information and Privacy Commission NSW — Mandatory Notification of Data Breach Scheme, commenced 28 November 2023 under the PPIP Act — ipc.nsw.gov.au", "NSW Electoral Commission — \"NSW Electoral Commission prioritises safety and transparency ahead of Local Government elections\", on the Local Government (General) Amendment (Elections) Regulation 2024 — elections.nsw.gov.au", "NSW Electoral Commission Report to the NSW Parliament 2024-25 — incident data 15 July to 11 October 2024 — elections.nsw.gov.au", "NSWEC LGE24 Program Management Plan retrospective (OFFICIAL–Sensitive) and programme governance model — supplied.", "Candidate-supplied evidence, 14–15 August 2026."]}], "script": {"id": "da", "intro": ["The framework describes this capability as being proactive and responsible for your actions, and following legislation, policy and guidelines. At Adept that reads as personal reliability. At Advanced and Highly advanced the subject changes. The panel is no longer asking whether you are accountable. They are asking whether you build the machinery that makes other people accountable.", "So the separator is design. Advanced asks you to design and develop systems that establish and measure accountabilities. Highly advanced adds a second limb most candidates never notice. You have to evaluate whether those systems are still working. One is building the instrument. The other is checking it against reality and changing it when it fails.", "The trap is the confession story. Candidates hear accountability and reach for a mistake they owned. It is honest, it scores at Adept, and nothing in it transfers to anyone else. The second trap is treating legislation as a checkbox."], "standing": ["This is your strongest capability in the framework. At Advanced you clear all eight indicators, five of them exceptionally. At Highly advanced you clear seven of eight, three exceptionally. The single shortfall is H2, and it is partial rather than failed. The participatory half is strong. The cultural safety half does not clear.", "So claim this at Highly advanced. Do not hold it in reserve and do not hedge it. The only thing to manage is H2, and you manage it by not building an answer around cultural safety when you have a choice of indicator."], "inds": {"A1": ["This asks for the machinery, not the intention. A panel will accept structures that outlive the meeting and reject a story about your own reliability. You have seven governance forums, each with terms of reference defining membership and decision-making powers. A service catalogue with a named consumer and a performance expectation for every service. A benefits framework with formal achievement status. A change request pipeline routing every proposal through EPMO review, Finance Business Partner and Chief Financial Officer approval.", "So in the room, it sounds like this. I designed seven forums with defined decision rights and Gate 2 criteria that were binary and testable, because an accountability you cannot test is only a statement of intent."], "A2": ["The word doing the work is exercised. It is not enough that accountabilities exist on a chart. The panel wants the mechanism that pulled them into line with organisational goals and held them there through delivery. Yours is two-part. The EPMO provided compliance and assurance over the program, with gate, change request and embedded assurance reporting throughout delivery. And nine functional directors carried delivery accountability into a Project Leadership Forum that governed scope, budget, schedule and financial risk fortnightly.", "The line to deliver is this. Nine functional directors held delivery accountability, and a fortnightly forum governing scope, budget, schedule and financial risk is where that accountability was exercised rather than assumed."], "A3": ["Due diligence on work health and safety gets answered badly by almost everyone. A panel will accept a control you set where it changes the outcome, and reject anything that happened after the harm was already possible. Yours sits at the design of the resourcing model. An eight-hour-per-day basis, carried in the Election Workforce Staffing Model, approved at gate on 30 March and funded through a $35 million workstream, across 22,990 people in 2,486 venues.", "Hold the boundary. The staffing and training workstream was delivered by the HR Director. You governed it, funded it and gated it. So in the room. Fatigue is the principal safety risk in election delivery, and an executive controls it at the resourcing model, not on the day."], "A4": ["Oversee quality assurance practices invites a thin answer about testing. What lifts it is assurance in layers aimed at different kinds of failure. You have three, which is unusual. EPMO assurance over the program. Technical assurance through the Technology, Scope and Risk forum, with user acceptance testing and performance readiness entry and exit criteria and go-live control. And counting assurance, with two-officer checks, discrepancy thresholds, data entry review and recount protocols standardised before preference distribution.", "Name that third layer. Assurance over a count is assurance where the output cannot be corrected afterwards without a legal process. So the line is this. The target was zero outcome-altering recounts."], "A5": ["Financial probity at this level is not a story about declining something you were offered. A panel hears personal restraint and files it as character. What they want is whether public money was safer because of how you built the system. Your contingency return is the exemplar because it was systemic. Around it sat a standing monthly Financial and Cost Control forum running earned value management with the Chief Financial Officer and Finance, and procurement probity built into the tracker and the Procurement Steering Committee remit.", "So in the room. I did not save that money by being careful with it. I built the system that made underspend visible and easy to return."], "A6": ["This is about the business unit's knowledge, not yours alone. A panel will accept a named authority set and reject a general commitment to compliance. Your program operated under a documented legislative authority set. The Local Government Act and Regulation. The Electoral Act. The Privacy and Personal Information Protection Act. The Government Information Public Access Act. The State Records Act. And the NSW protective security and cyber policies.", "Naming that set from memory is itself the evidence, because most candidates cannot. Learn it as a spoken list. Then close like this. That set was documented as the program's legislative authority, which is why compliance was a design input rather than a review finding."], "A7": ["The test is whether risk lived inside your planning or beside it. A register reviewed monthly is the answer a panel expects and discounts. What they accept is risk as a condition on progress. Gate 2 could not be passed with any uncontrolled high or extreme risk. The procurement tracker was prioritised by risk before any strategy was written. A weekly Program Leadership forum governed risks and issues, and the program closed with no high residual risks.", "So the line is this. Risk was not a register alongside my plan, it was a condition inside it, and that is the difference between managing risk and reporting it."], "A8": ["Strategic and sustainable choices means trade-offs where the short term lost. A panel will reject an example where both horizons happened to align, because nothing was traded. You have three. Retaining a failing vendor rather than terminating, because the knowledge would have left with them. Backing a new director's decision not to reform her operating model until she had been through a full cycle. And building a Community of Practice designed to outlast you.", "Pick one and name the cost out loud. So in the room. I kept a vendor who was underperforming, and I accepted that cost, because terminating them would have taken the knowledge out of the program."], "H1": ["Read the second limb slowly, because that is where this is won. Direct the development of effective systems, and evaluate their ongoing effectiveness. Most candidates evidence the first half and stop. The accountability systems you built were evaluated by the people subject to them, at the LGE24 kick-off, publicly and unfavourably. You acted on that by rebuilding the function as a service catalogue with its consumers. Add P3M3 measurement of the delivery function and an independently commissioned evaluation of the service.", "So in the room. I measure the instruments, not just the outputs. My accountability system was evaluated by the people it governed, it did not survive intact, and I rebuilt it with them."], "H2": ["Say this one plainly. It is partial, not failed. The participatory half is strong. A service catalogue co-designed with the people subject to it. A Project Managers Forum built for psychological safety. A Community of Practice open to anyone interested rather than restricted by role. And a change request pipeline that engages every accountable party before a decision forum sees the paper.", "The cultural safety limb does not clear, and this is the second time. In NSW public sector usage it most often means Aboriginal cultural safety specifically, and the same limb defeated you at Work collaboratively H5. Your best evidence is commissioning a First Nations interviewer for First Nations respondents in the service evaluation. That is research design, not how a team works. Do not stretch it. Claim the participatory half, then name the gap yourself. It is your second recurring gap after recognition."], "H3": ["Two limbs, and standards is the harder one. You have it. An eight-hour resourcing basis is a standard. It determines how many people must be recruited, how venues are rostered and what the workstream costs. Setting it at planning stage, carrying it in an approved staffing model and gating that model is standard-setting followed by due diligence, in that order.", "Say it inside the published framework rather than instead of it. The Commission publishes a ten-hour shift limit, a minimum ten-hour break between shifts, a six consecutive day maximum, a no-isolation rule and hard stops on election night. So the sentence that survives scrutiny is this. We resourced the programme on an eight-hour basis, inside a published fatigue framework that permits ten."], "H4": ["Inspire is the stretch word and you should not chase it rhetorically. A panel hearing an executive try to inspire a culture of probity through language hears speech, not evidence. Meet it structurally. You built the mechanism through which savings across a $150 million program became visible and returnable rather than quietly absorbed at year end. A culture of respect for public money is produced by making underspend easy to return and hard to hide, and that is what the consolidated change request did.", "So in the room. I did not ask people to respect public money. I made returning it the path of least resistance."], "H5": ["The words to notice are consistently and across your organisation. One compliant program does not clear this. The panel wants the same obligations applied the same way beyond your own patch. You have the documented legislative authority set, applied through the EPMO assurance regime across the agency's delivery portfolio, with probity embedded in the procurement architecture, and privacy and records obligations live in a program handling elector data at scale.", "So the line is this. The authority set was documented once and applied through the same assurance regime across the delivery portfolio, which is what makes it consistent rather than a program that happened to be well run."], "H6": ["The word framework is doing the work, and so is the pairing of short and long term. A register is not a framework. Your resilience proposal is. After event assurance did not achieve its posture at SGE23, you drafted a proposal for a new project and took ownership of business resilience and crisis management, with rehearsed scenarios across ransomware, disinformation, sovereign insider threat, and fire and flood.", "One allocation warning. This is the same event as the Highly advanced answer in your Display resilience and courage pack, so use one or the other. So in the room. The program's risk framework ended with the event. The resilience capability was designed not to."], "H7": ["This indicator is new in Version 3 and the timing works in your favour. The NSW Mandatory Notification of Data Breach scheme commenced on 28 November 2023 under the Privacy and Personal Information Protection Act, so the 2024 Local Government elections ran under a breach notification regime less than a year old. It requires an agency to contain a breach immediately, assess within 30 days, notify the Privacy Commissioner and affected individuals, and keep a public register.", "Your program had two data breach incidents, and the external one appears in the Commission's own published report. The loss of a printed electoral roll for a ward, an investigation with other agencies, direct mail to affected individuals, and an apology. That is containment, assessment and notification in the public record. Do not claim you designed the Commission's privacy compliance. So in the room. I ran a program handling elector data at scale through the first local government election held under that scheme."], "H8": ["Anticipate is the test. A panel will accept a change made before the failure and discount a good recovery afterwards. Timing is the whole indicator. Your resilience project anticipated a threat environment rather than responding to an incident. The service catalogue anticipated future methodology disputes and built the engagement commitment that prevents them. The Procurement Steering Committee anticipated the governance load that had degraded the previous election.", "So the line to deliver is this. In each case the change was made before the failure, and I would rather be judged on the incidents that never happened than the ones I recovered from well."]}, "stars": [["This carries H1 and A1 as its primary indicators, with A2 and A4 underneath. Its strength is structural. Eleven of the organisation's twelve Band 1 executives reported into the program for delivery, at a substantive grade above your own. You could not have compelled any of it, which removes every easy explanation a panel might reach for.", "The moment that does the real work is the Situation. Accountability cannot rest on line authority, because there is none. It has to be designed. That sentence earns the rest of the answer, so deliver it slowly and then stop. The Result uses the kick-off as evaluation evidence, not as a resilience story. If that arc is already committed to Display resilience and courage or Manage self, cut the last two paragraphs and close on the three assurance layers. And prepare the probe about holding executives accountable without authority. The answer is through the forums and the record. A decision made in a forum with defined membership and minuted decision rights is not yours to enforce. It is theirs to have made."], ["This is your Advanced answer on A5 extending into H4, with A1 and A7 supporting. Note the allocation warning first. The event is shared with your Act with integrity pack and with Deliver results STAR B. Three capabilities want the contingency return and it is still the same $12 million, so use it once.", "Never lead with the $12 million. Lead with the system. Lead with the number and it sounds like a saving. Lead with the mechanism and the number becomes evidence. Give the consolidation argument room. Ten separate change requests get ten partial views. One program-wide request gets the Chief Financial Officer looking at the whole picture at once, which is how the savings became visible. Do not vary the closing phrasing. Contingency is a budget provision, not an expense classification, so the return is evidenced by total expenditure finishing below the $150 million investment authority. If they ask whether it was over-provisioned, answer at the level of provision methodology. Returning it in full means the risks were managed down."]], "outro": ["There is one gap and it is H2. The cultural safety limb needs lived team practice, not research design, and closing it means work where you own an Aboriginal cultural safety commitment inside how a team operates. Until then, name it yourself rather than stretching the First Nations interviewer evidence. Everything else here is claimable at Highly advanced today, so lead with this capability. And the strongest sentence you own on it is this. An accountability system that has never been evaluated by the people subject to it is an assumption. Mine was, unfavourably, in public, and I rebuilt it."]}}, {"id": "fin", "name": "Finance", "group": "Business Enablers", "desc": "Understand and apply financial processes to achieve value for money and minimise financial risk", "verdict": [["Advanced", "5 of 6 cleared, two exceptionally. A6 — responding to financial and risk management audit outcomes — remains the only hole"], ["Highly advanced", "5 of 5 cleared, following the strategic planning and Treasury business case evidence"]], "adv": [{"c": "A1", "t": "Apply a thorough understanding of recurrent and capital financial terminology, policies and processes for planning, forecasting, preparing and managing budgets", "v": "cle", "vt": "CLEARED, with the recurrent and capital dimension to confirm", "body": ["You constructed and controlled a $133.7 million budget across fourteen workstreams inside a $150 million investment authority, with a contingency provision, stage-gated release of authority, delegated approvals, monthly benefits and cost tracking, and earned value management through a standing forum with the Chief Financial Officer. At the previous election you delivered $140.3 million against $144.3 million.", "The planning, forecasting and management limbs are beyond question. See open question 1 on the recurrent and capital split."]}, {"c": "A2", "t": "Identify and analyse trends, review data and evaluate business options to ensure business cases are financially sound", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["You author the business case that funds the election. That is the highest form this indicator takes — not reviewing a case for soundness, but constructing the case on which the State releases money for a statutory event.", "Underneath it sits the analytical work you described: program structure, resourcing model, demand management and investment planning. Alongside it, earned value management, which is trend analysis by construction because it tells you where cost and schedule performance are heading rather than where they have been. And in the EPMO role you built the demand management and evidence-based business case capability itself — the service, not just the instance.", "[CONFIRM: expand \"PTA\" correctly — do not let an unexplained acronym reach a panel. And confirm whether the submission covered LGE24, SGE23 or both, and the quantum sought and awarded]"]}, {"c": "A3", "t": "Assess relative cost benefits of various purchasing options", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The vendor decision is a clean cost-benefit assessment across live options: terminate and re-acquire the knowledge, escalate and hope, or supplement at higher cost. You chose the option that cost more money and less time, and you presented it as a trade-off rather than as a recommendation dressed up as one — which is what this indicator is actually testing. Behind it sits a procurement strategy with a risk-prioritised tracker across roughly $80 million of tenders and RFQs."]}, {"c": "A4", "t": "Promote the role of sound financial management and its impact on organisational effectiveness", "v": "cle", "vt": "CLEARED", "body": ["A standing monthly Financial and Cost Control forum with the Chief Financial Officer, Finance and the EPMO, running earned value management and contingency management. A change request pipeline that puts Finance Business Partners and the CFO in the approval path of every change before any decision forum sees it. Financial management was not a reporting line in your program; it was in the critical path of every decision."]}, {"c": "A5", "t": "Get specialist financial advice when reviewing and evaluating finance systems and processes", "v": "cle", "vt": "CLEARED", "body": ["ONE THING NOT TO CONFLATE. In the ASX disclosure instance you GAVE the specialist financial advice. That is excellent evidence of expertise and it belongs under Influence and negotiate — it is not evidence of seeking advice, and offering it here would read as a misread of the indicator. Answer A5 with the Finance Business Partners and the CFO in the change pipeline."]}, {"c": "A6", "t": "Respond to financial and risk management audit outcomes, addressing areas of noncompliance in a timely manner", "v": "not", "vt": "UNEVIDENCED", "body": ["This is a genuine gap and it is the classic one for delivery executives: you run the program, and somebody else answers the auditor.", "The NSW Electoral Commission is audited by the Audit Office of NSW, and the EPMO provided compliance and assurance over your program, which means assurance findings existed. Internal audit, external audit, Gateway or health-check reviews, EPMO assurance findings — any of these, with a finding you owned and closed, converts this indicator. See open question 2."]}], "ha": [{"c": "H5", "t": "Establish effective governance to ensure financial resources are used ethically and prudently across your organisation", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your strongest Finance indicator. The change request pipeline routing every proposal through EPMO review, Finance Business Partner and CFO approval. The Financial and Cost Control forum with earned value management and contingency management. Probity embedded in the procurement tracker and the Procurement Steering Committee remit. And the mechanism that made underspend across a $150 million program visible while it could still be returned rather than absorbed at year end."]}, {"c": "H4", "t": "Ensure your organisation uses appropriate advice from finance and risk professionals to make strategic decisions", "v": "cle", "vt": "CLEARED", "body": ["Finance Business Partners and the Chief Financial Officer sat in the approval path rather than in a reporting relationship. On the risk side, the event integrity assurance function and the resilience capability you established fed the same governance. The design principle is worth stating: advice that arrives after a decision is commentary; advice that sits in the approval path is governance."]}, {"c": "H2", "t": "Define organisational directions and set priorities and business plans that refer to key financial indicators and non-financial committed outcomes", "v": "cle", "vt": "CLEARED, on the framing that carries several of your capabilities", "body": ["At an electoral commission the election program substantially is the organisation’s business plan — the cycle is the strategy. Yours carried both halves this indicator asks for: financial indicators through earned value management, monthly cost tracking and expenditure against authority; and non-financial outcomes through a benefits register of six benefits carrying formal achievement status at closure.", "Say \"benefits\" and then translate: \"what the framework calls non-financial committed outcomes, we carried as a benefits register with formal achievement status.\" Translating your own language into theirs demonstrates fluency in both."]}, {"c": "H1", "t": "Advocate for committed outcomes to be considered when making decisions about prioritising projects and allocating resources", "v": "cle", "vt": "CLEARED", "body": ["I had this as partial on the assumption your prioritisation was program-internal. It is not. You work with the Chief Financial Officer and the EPMO portfolio to understand portfolio priorities — including organisational structure, business and funding needs — and you do demand management and investment planning against them. That is resource allocation at organisational altitude, where an election program competes with everything else the agency needs to fund.", "Program-internal prioritisation then follows: MoSCoW sequencing with the business areas against benefit rather than volume, $133.7 million allocated across fourteen workstreams, and a procurement tracker prioritised by risk. Both altitudes, which is what the indicator wants."]}, {"c": "H3", "t": "Anticipate operational and capital needs, and identify the most appropriate financing and funding strategies to meet them", "v": "cle", "vt": "CLEARED", "body": ["This is the indicator the new evidence closes, and it closes it at the top of the range. Anticipating need: you work with senior executives on the strategic plan and goals, with stakeholders on election regulatory priorities, and with the CFO and portfolio on organisational business and funding needs — then convert all of it into a program structure, a resourcing model and an investment plan. Identifying the funding strategy: you develop the business case and take it through approval to a funding submission to NSW Treasury.", "Alongside it sits the control-side strategy — a $150 million investment authority released in stages against gates with delegated approvals rather than drawn as a single envelope. Staged release against evidenced readiness is the right funding structure for a program with an immovable date and a contingency provision, and it is the half of this indicator most candidates never reach.", "THE QUESTION THAT WOULD MAKE THIS EXCEPTIONAL. At SGE23 the initial allocation was $89.1 million against an estimated requirement of $140.7 million, and the election was delivered at $140.3 million against $144.3 million in funding. Something closed a $51.6 million gap. If that was this process — your business case, your submission — then you have not only cleared H3, you have a quantified instance of closing a funding gap larger than most Director-level candidates have ever managed in total. Confirm it and it becomes one of the strongest single claims in your file."]}], "stars": [{"title": "STAR A — Advanced", "sub": "Primary indicators: A1 planning, forecasting, preparing and managing budgets · A2 analyse trends and evaluate options · A4 promote sound financial management. Supporting: A5", "s": ["The 2024 Local Government elections program was authorised at $150 million against an election date fixed in statute. The agency had sought substantial additional funding ahead of the cycle and had not received it, and the Electoral Commissioner had retired months before delivery with an Acting Commissioner in place.", "An election budget has an unusual shape. Almost all of the expenditure lands in a short window, most of it is committed before any of it is tested, and the largest single line — a temporary workforce of nearly 23,000 people — cannot be scaled back once the date is fixed. There is very little in it that can be deferred to recover a position."], "t": ["To construct a budget that could be controlled rather than merely reported, and to know early enough to act if any part of it moved."], "a": ["I structured the program as fourteen workstreams totalling $133.7 million within the authority, each with a defined scope and an accountable functional executive: information services systems and infrastructure at $20 million each; staffing and training at $35 million; venue services at $10 million; digital, marketing and communications at $10 million; voting services at $9 million; financial management, logistics, candidates and parties, customer services, geospatial and analytics, ballot paper production and event integrity assurance across the balance; and $12 million for programme management including contingency.", "Control ran on three instruments. Investment authority was released in stages against gates with delegated approvals, so money followed evidenced readiness rather than optimism. A standing monthly Financial and Cost Control forum with the Chief Financial Officer, Finance and the EPMO ran earned value management, portfolio and corporate governance risk, and contingency management. And every change request was routed through EPMO review, Finance Business Partner approval and CFO approval before it reached the Program Director, the Project Leadership Forum or the Steering Committee.", "Earned value was the instrument that mattered most, because it is the only one that tells you where cost and schedule performance are heading rather than where they have been. On a program where the date cannot move, a trend is more useful than a variance.", "[CONFIRM: how the program was split between recurrent and capital, and how the capital component was approved]"], "r": ["The election was delivered on time, expenditure was reconciled within the $150 million authority, and the entire contingency provision went unspent and was returned — evidenced by total programme expenditure finishing below the investment authority. The program closed with no high residual risks and all benefits recorded as achieved."], "notes": ["§ Delivery notes", "• Lead with the shape of an election budget. \"Almost all the expenditure lands in a short window, most of it is committed before any of it is tested, and the largest line cannot be scaled back\" tells a finance panel you understand the risk profile, not just the numbers.", "• The earned value line is the one to keep. \"On a program where the date cannot move, a trend is more useful than a variance\" is a sentence a CFO will remember.", "• Do not recite all fourteen workstreams. Name three or four with figures and move on. The point is that the budget had a structure, not that you can remember it."], "probes": [], "keys": ["$150 million", "$133.7 million", "$20 million", "$35 million", "$10 million", "$9 million", "$12 million", "Electoral Commissioner", "Cost Control", "Chief Financial Officer"], "bul": []}, {"title": "STAR B — Highly advanced", "sub": "Primary indicators: H5 establish effective governance for ethical and prudent use of financial resources · H4 use appropriate advice from finance and risk professionals", "s": ["The program held a $12 million contingency provision inside a $150 million authority. The default institutional behaviour with contingency is to protect it, spend it late, and finish inside authority without anyone learning where the money actually went."], "t": ["To govern the program’s finances so that underspend surfaced while it could still be returned — without weakening change control to do it."], "a": ["I instituted a program-wide change request rather than requiring each of thirteen aggregate projects to raise and argue its own. The Elections PMO assembled the documentation, so project managers and project owners were not producing change paperwork at the point where their time was worth most.", "The approval chain was unchanged — EPMO review, Finance Business Partners, the Chief Financial Officer, the Program Director, the Project Leadership Forum and the Program Steering Committee. Nothing about the rigour was relaxed; what changed was who carried the burden of assembly, and that the Chief Financial Officer was looking at the whole program at once rather than at thirteen partial views.", "That single view is what made the savings visible. Ten separate requests produce ten local judgements. One consolidated request produces a portfolio judgement, and a portfolio judgement is where underspend shows up."], "r": ["The entire $12 million contingency provision went unspent and was returned, evidenced by total programme expenditure finishing below the $150 million investment authority.", "ACCOUNTING PRECISION — do not vary this phrasing. Contingency is a budget provision, not an expense classification. It never appears as an expense line, and unspent contingency never becomes expenditure. The return is evidenced by total expenditure finishing below the investment authority.", "The governance point, rather than the number: this was not restraint. It was the output of a control architecture that made underspend easy to see and easy to return. Personal probity is worth stating once. A mechanism that produces prudence from everyone else is what this indicator is asking about."], "notes": ["ALLOCATION WARNING. Four capabilities now want the contingency return — Act with integrity, Deliver results, Demonstrate accountability and Finance. It is one event and it can appear once in an application. This version is written for financial governance. If Finance and any of those three are both assessed, use it here only if Finance is the more heavily weighted capability.", "§ Probe preparation — the one you are best equipped for", "If a finance-literate panel member tests you on contingency treatment, you have an unusually precise answer available and you should give it in full:", "\"Contingency is a budget provision, not an expense classification. It never appears as an expense line. If drawn, it becomes expenditure against the consuming workstream, not against a contingency line. Unspent contingency never becomes expenditure at all — which is why the return is evidenced by total expenditure finishing below the investment authority rather than by a contingency figure in the accounts.\"", "That level of precision is where fourteen years in fund accounting, unit pricing and financial reporting actually pays — not as a claim about public financial management, but as demonstrable command of the underlying discipline. Let it show through the accuracy of your answers rather than through an assertion about your background."], "probes": [], "keys": ["$12 million", "$150 million", "The Elections", "Finance Business Partners", "Chief Financial Officer", "Program Director"], "bul": []}, {"title": "STAR C — Highly advanced", "sub": "Primary indicators: H3 anticipate operational and capital needs and identify the most appropriate financing and funding strategies · H1 advocate for committed outcomes when prioritising projects and allocating resources · A2 ensure business cases are financially sound", "s": ["An election program does not begin with a plan. It begins with a funding argument. Before any delivery structure exists, the agency has to establish what the event will require, what it has committed to deliver, and what it will cost — and then persuade NSW Treasury to fund it against every other claim on the State’s money."], "t": ["To establish the investment requirement for the election and construct the case on which it would be funded."], "a": ["I built the case from three streams of input rather than from a cost estimate, because a costed shopping list is not a business case.", "• Strategic. I worked with senior executives to understand the Commission’s strategic plans and goals, so the program was expressed against what the organisation had committed to deliver rather than against what it wanted to buy.", "• Financial and portfolio. I worked with the Chief Financial Officer and the EPMO portfolio to understand portfolio priorities — including broader organisational structure, business needs and funding needs — so the election was positioned against everything else competing for the same envelope.", "• Regulatory. I worked with stakeholders to understand election regulatory priorities, because in this domain scope is set by legislation rather than negotiated. What the Act requires is not a preference and cannot be traded out of a business case.", "I converted those into program strategies, a program structure, a resourcing model, demand management and an investment plan — then developed the business case and took it through approval to a funding submission to NSW Treasury.", "[CONFIRM: expand the acronym you used for the business case instrument, and state which election the submission covered, the quantum sought and the quantum awarded]"], "r": ["The submission was approved and the program was funded.", "The detailed planning was then built directly on that structure — a top-down program breakdown, a high-level critical path spanning roughly twenty workstreams and nineteen application systems, each with its own user acceptance, security and performance test windows, all converging on an election date fixed in statute. That critical path was published thirteen months before polling day."], "notes": ["§ Delivery notes", "• Lead with the sequencing line. \"An election program does not begin with a plan; it begins with a funding argument.\" It tells a finance panel immediately that you understand where your work starts.", "• The three-stream structure is the answer to \"how do you build a business case\". Strategic, financial and portfolio, regulatory. It shows you triangulated the requirement rather than costed a scope, and it is a better answer than most executives give.", "• The regulatory point is the one that separates you. \"What the Act requires is not a preference and cannot be traded out of a business case\" is a sentence very few candidates could say, and it explains why an election business case behaves differently from a discretionary investment.", "• Your critical path chart is the proof of the detail planning. It is dated, it carries your name as the contact, and it was produced thirteen months out. If interview format permits a portfolio artefact, this is the one to take — it evidences planning at scale in a way no verbal answer can.", "ONE DISCIPLINE. Never use the acronym unexpanded. An unexplained abbreviation in a finance answer invites exactly the question you do not want — and if the panel does not recognise it, the strongest evidence in this capability lands as jargon."], "probes": [], "keys": ["Chief Financial Officer"], "bul": ["Strategic. I worked with senior executives to understand the Commission’s strategic plans and goals, so the program was expressed against what the organisation had committed to deliver rather than against what it wanted to buy.", "Financial and portfolio. I worked with the Chief Financial Officer and the EPMO portfolio to understand portfolio priorities — including broader organisational structure, business needs and funding needs — so the election was positioned against everything else competing for the same envelope.", "Regulatory. I worked with stakeholders to understand election regulatory priorities, because in this domain scope is set by legislation rather than negotiated. What the Act requires is not a preference and cannot be traded out of a business case."]}], "notes": [{"h": "Verdict", "body": ["This pack was substantially revised after you supplied the strategic planning and Treasury funding submission evidence. The earlier version is superseded."]}, {"h": "A correction I owe you", "body": ["Before you sent the strategic planning notes, this pack read: \"You manage money exceptionally well. You have never had to raise it, and you have never had to answer for it to an auditor.\" The first half of that was wrong.", "You develop the business case for the funding submission to NSW Treasury. You work with the Chief Financial Officer and the EPMO portfolio on portfolio priorities including organisational structure, business and funding needs. You do demand management and investment planning. That is raising money, and it is the exact activity Highly advanced Finance is built around.", "I inferred the limit of your role from the evidence in front of me rather than asking what sat upstream of delivery. That is the third time in this campaign I have inferred a boundary instead of asking about one — the EPMO feedback, the Procurement Steering Committee, and now this. The pattern is mine to fix. The practical lesson for you is its mirror: you consistently under-describe the upstream half of your work. If I made that mistake with the whole file in front of me, a panel with four pages will make it faster.", "WHAT REMAINS TRUE. The audit half stands. A6 asks you to respond to financial and risk management audit outcomes and close areas of non-compliance, and nothing in the file evidences it. It is the only hole left in this capability at either level."]}, {"h": "Terminology — read this before you write a word", "body": ["This capability is written in NSW public finance language, and two phrases in it are technical rather than descriptive. Using them loosely is more damaging here than in any other capability, because the people assessing Finance answers tend to be the people who use the terms precisely.", "AND A CAUTION ABOUT YOUR OWN BACKGROUND. Fourteen years across fund accounting, unit pricing, financial asset management and financial reporting is real depth — but it is financial services operations, not public financial management. They are different disciplines with different frameworks. Say what it gave you (disclosure regimes, reporting standards, management accounting rigour) rather than implying it substitutes for Treasury experience. The moment you imply equivalence, an assessor who has worked in both will discount everything you say afterwards."]}, {"h": "Open items — in priority order", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "NSW Treasury — Outcome Budgeting, Treasury Policy Paper TPP18-09; NSW Budget Paper No. 2 Outcomes Statement.", "NSWEC LGE24 Program Management Plan retrospective (OFFICIAL–Sensitive) — investment authority, stage-gated releases, delegated approvals, monthly benefits and cost tracking — supplied.", "NSWEC programme governance model — Financial and Cost Control forum, Procurement Steering Committee — supplied.", "Candidate-supplied evidence, 14–15 August 2026."]}], "script": {"id": "fin", "intro": ["Finance at this level is not a test of whether you can read a budget. The capability is about applying financial processes to achieve value for money and minimise financial risk. A panel is listening for control, not custody. They want to know how the money was structured, how you knew early when it moved, and who could stop what.", "What separates Advanced from Adept is authorship. An Adept answer describes operating inside a budget somebody else built. An Advanced answer describes building it, testing the options behind it, and showing the case is financially sound. Highly advanced shifts altitude again. Governance, funding strategy and organisational priorities, not one program's ledger.", "The trap is calling reporting management. Candidates describe numbers going up a line every month and never say what those numbers changed. Your version of it is different. You under-describe the upstream half of your work. You develop the business case and take it to a funding submission to NSW Treasury, and that is what Highly advanced Finance is built around."], "standing": ["At Advanced you clear 5 of 6 indicators, two exceptionally. A2 on financially sound business cases and A3 on purchasing options are the exceptional pair. A6, responding to financial and risk management audit outcomes, is unevidenced, and it is the only hole at either level. At Highly advanced you clear all 5, and H5 on governance is exceptional.", "So claim this one at Highly advanced. The pack was revised after you supplied the strategic planning and Treasury submission evidence, and that evidence carries H3 and H1. Nothing is held in reserve. Just don't dress up A6."], "inds": {"A1": ["A1 asks for recurrent and capital terminology and four verbs. Planning, forecasting, preparing and managing budgets. A panel accepts a budget you built and controlled. They reject one you watched. You constructed and controlled $133.7 million across fourteen workstreams inside a $150 million investment authority, with a contingency provision, stage-gated release of authority, delegated approvals, monthly cost tracking and earned value management through a standing forum with the Chief Financial Officer. At the previous election you delivered $140.3 million against $144.3 million.", "So in the room, it sounds like this. I built a $133.7 million budget inside a $150 million authority and released it in stages against gates, so money followed evidenced readiness. Confirm the recurrent and capital split first. That limb is still open."], "A2": ["A2 is about trends, data and options, so that business cases are financially sound. Most candidates answer it by reviewing somebody else's case. You author the case that funds the election. That is the highest form this indicator takes. Not checking a case for soundness, but constructing the case on which the State releases money for a statutory event. Under it sits program structure, resourcing model, demand management and investment planning. Alongside it, earned value management, which is trend analysis by construction.", "So in the room, it sounds like this. I didn't review the business case, I built it, and the program was funded on it. Expand the abbreviation PTA first, and confirm which election it covered and the quantum sought and awarded."], "A3": ["A3 is relative cost benefits across purchasing options. A panel wants live options with real trade-offs. They reject a recommendation dressed up as an assessment. Yours is clean. Terminate and re-acquire the knowledge, escalate and hope, or supplement at higher cost. You chose the option that cost more money and less time, and you put it up as a trade-off rather than a foregone conclusion. Behind it sits a procurement strategy with a risk-prioritised tracker across roughly $80 million of tenders and requests for quote. So in the room, it sounds like this. I bought time with money, deliberately, and I said so in those terms."], "A4": ["A4 asks you to promote sound financial management and its impact on organisational effectiveness. Promoting doesn't mean advocating in a speech. A panel accepts structures that made financial discipline unavoidable for other people. You have two. A standing monthly Financial and Cost Control forum with the Chief Financial Officer, Finance and the EPMO, running earned value and contingency management. And a change pipeline that put Finance Business Partners and the Chief Financial Officer in the approval path of every change before any decision forum saw it. So in the room, it sounds like this. Financial management wasn't a reporting line, it was in the critical path of every decision."], "A5": ["A5 is about getting specialist financial advice when you review and evaluate finance systems and processes. One thing not to conflate. In the ASX disclosure instance you gave the specialist advice. That is excellent evidence of expertise and it belongs under Influence and negotiate. It is not evidence of seeking advice, and offering it here would read as a misread of the indicator. Answer A5 with the Finance Business Partners and the Chief Financial Officer in the change pipeline.", "So in the room, it sounds like this. I built the specialists into the approval path, so their view arrived before my decision was fixed."], "A6": ["A6 is the one you don't clear. It asks you to respond to financial and risk management audit outcomes and close areas of non-compliance in a timely manner. It is unevidenced. That is the classic gap for a delivery executive. You run the program and somebody else answers the auditor.", "Don't manufacture it. The material is probably there. The NSW Electoral Commission is audited by the Audit Office of NSW, and the EPMO provided assurance over your program, so findings existed. Find one you owned and closed. Internal audit, external audit, a Gateway or health-check review, or an EPMO assurance finding. Any of those converts it. Until then, say plainly where you sat in the assurance chain."], "H5": ["H5 is your strongest Finance indicator and it clears exceptionally. It asks for governance ensuring financial resources are used ethically and prudently across the organisation. A panel wants a mechanism, not a character reference. You have four. The change pipeline routing every proposal through EPMO review, Finance Business Partner and Chief Financial Officer approval. The Financial and Cost Control forum running earned value and contingency management. Probity in the procurement tracker and the Procurement Steering Committee remit. And the mechanism that made underspend across a $150 million program visible while it could still be returned. So in the room, it sounds like this. I built a control architecture that produced prudence from everybody else."], "H4": ["H4 asks that your organisation uses appropriate advice from finance and risk professionals for strategic decisions. The word doing the work is uses. A panel rejects advisers who were consulted and thanked. Yours were positioned. Finance Business Partners and the Chief Financial Officer sat in the approval path rather than in a reporting relationship. On the risk side, the event integrity assurance function and the resilience capability you established fed the same governance. So in the room, it sounds like this. Advice that arrives after a decision is commentary. Advice that sits in the approval path is governance."], "H2": ["H2 wants direction, priorities and business plans referring to key financial indicators and to non-financial committed outcomes. Both halves have to be there. At an electoral commission the election program substantially is the organisation's business plan. The cycle is the strategy. Yours carried both halves. Financial indicators through earned value management, monthly cost tracking and expenditure against authority. Non-financial outcomes through a benefits register of six benefits carrying formal achievement status at closure. So in the room, say benefits and then translate. What the framework calls non-financial committed outcomes, we carried as a benefits register with formal achievement status."], "H1": ["H1 is advocacy for committed outcomes when projects are prioritised and resources allocated. What a panel is really asking is at what altitude you allocate. Program-internal sequencing alone wouldn't carry it. You work with the Chief Financial Officer and the EPMO portfolio on portfolio priorities, including organisational structure, business needs and funding needs, and you do demand management and investment planning against them. That is allocation where an election competes with everything else the agency has to fund. The internal layer follows. MoSCoW sequencing against benefit rather than volume, $133.7 million across fourteen workstreams, and a tracker prioritised by risk. So in the room, say it plainly. I prioritised at two altitudes."], "H3": ["H3 asks you to anticipate operational and capital needs and identify the most appropriate funding strategies. The new evidence closes it at the top of the range. You work with senior executives on the strategic plan and goals, with stakeholders on election regulatory priorities, and with the Chief Financial Officer and the portfolio on business and funding needs. You convert that into a program structure, a resourcing model and an investment plan, then develop the business case and take it to a submission to NSW Treasury. Alongside it, a $150 million authority released in stages against gates rather than drawn as a single envelope. That staged half is the one most candidates never reach.", "One thing to confirm. At SGE23 the initial allocation was $89.1 million against an estimated requirement of $140.7 million, and the election was delivered at $140.3 million against $144.3 million. Something closed a $51.6 million gap. If that was your case, confirm it. It becomes one of the strongest claims in your file."]}, "stars": [["STAR A is your Advanced answer. It carries A1 on planning, forecasting and managing budgets, A2 on trends and options, and A4 on promoting sound financial management, with A5 supporting. Its strength is that you lead with the shape of the money before the size of it. Almost all the expenditure lands in a short window, most of it is committed before any of it is tested, and the largest line, a temporary workforce of nearly 23,000 people, cannot be scaled back once the date is fixed.", "The moment doing the real work is the earned value line. On a program where the date cannot move, a trend is more useful than a variance. A Chief Financial Officer will remember that. One thing not to forget. Don't recite all fourteen workstreams. Name three or four with figures and move on."], ["STAR B carries H5 on governance for ethical and prudent use of financial resources and H4 on advice from finance and risk professionals. Its strength is that the rigour never drops. One program-wide change request instead of thirteen, the Elections PMO assembling the documentation, and the approval chain untouched. The moment doing the real work is the reason. Ten separate requests produce ten local judgements. One consolidated request produces a portfolio judgement, and that is where underspend shows up.", "Two disciplines on delivery. The accounting phrasing does not vary. Contingency is a budget provision, not an expense classification, unspent contingency never becomes expenditure, and the return is evidenced by total expenditure finishing below the investment authority. Give that in full if a finance-literate panel member probes you. And an allocation warning. Four capabilities want this story and it can appear once. Use it here only if Finance carries the heavier weight."], ["STAR C is the answer the new evidence unlocked. It carries H3 on anticipating needs and funding strategies, H1 on prioritisation, and A2 on financially sound business cases. Lead with the sequencing line. An election program does not begin with a plan, it begins with a funding argument. Then the three streams. Strategic, financial and portfolio, and regulatory. It shows you triangulated the requirement rather than costed a scope.", "The moment that separates you is the regulatory stream. What the Act requires is not a preference and cannot be traded out of a business case. Two things on delivery. Your critical path chart is dated, carries your name, and was published thirteen months before polling day, so take it if the format permits an artefact. And never use the acronym unexpanded, or your strongest evidence lands as jargon."]], "outro": ["Three things close this out. Find an audit or assurance finding you owned and closed, because A6 is the only hole and one real example converts it. Confirm the recurrent and capital split so A1 is complete. And chase the SGE23 numbers, because if your business case closed that $51.6 million gap it is the strongest quantified claim in your file. Then go in at Highly advanced and open with the sentence you own outright. An election program does not begin with a plan. It begins with a funding argument."]}}, {"id": "tech", "name": "Technology", "group": "Business Enablers", "desc": "Understand and use available technology to maximise efficiencies and effectiveness", "verdict": [["Advanced", "5 of 5 cleared. Three exceptionally"], ["Highly advanced", "5 of 5 cleared. Two exceptionally"]], "adv": [{"c": "A1", "t": "Promote using creative and accessible technology in your organisation", "v": "cle", "vt": "CLEARED", "body": ["Note the word accessible, which in this framework is not decoration. At LGE24 the accessible technology set was operational rather than aspirational: telephone assisted voting for blind and low vision electors, braille ballot papers, accessible voting screens, contrast-marked ballot boxes, the National Relay Service, and multilingual channels — delivered across 2,486 venues and gated on venue accessibility at Gate 2.", "On the creative side: portfolio management tooling deployed across a delivery population with adoption driven rather than assumed, and an AI transformation program run with the University of Sydney School of Project Management across seven teams."]}, {"c": "A2", "t": "Actively manage risk to ensure compliance with cyber security and acceptable use of technology, including record keeping, cybersecurity, privacy, and responsible artificial intelligence use", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["This indicator names five things and you have evidence against all five, which is rare.", "• Cybersecurity. A $700K event integrity assurance workstream covering cyber, physical security and disinformation; a security test window scheduled for every one of roughly nineteen application systems on the program critical path; rehearsed ransomware and sovereign insider scenarios.", "• Privacy. The Privacy and Personal Information Protection Act in the program’s documented legislative authority set, and two data breach incidents handled under the Mandatory Notification of Data Breach scheme in the first local government election conducted under it.", "• Record keeping. The State Records Act in the same authority set, with the Elections PMO as single secretariat to all seven governance forums.", "• Acceptable use. NSW protective security and cyber policies applied across the program.", "• Responsible AI. See H3 — this is where your evidence is unusual."]}, {"c": "A3", "t": "Keep up to date with new technology and technological trends to understand how using them can support business outcomes", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Most executives answer this indicator with reading habits. You can answer it with working systems across a genuinely wide surface: Next.js and React with TypeScript, Supabase and Postgres with row-level security and database-level testing, Microsoft Dataverse and Power Platform, Azure Functions and Static Web Apps, Cloudflare Pages Functions and Access, Appwrite, Electron, a Chrome extension, and Python.", "And on the AI side specifically: the Anthropic and Google model APIs, locally hosted models via Ollama for data-sovereignty reasons with automatic cloud fallback, embeddings and retrieval indexes, and a FAISS vector store.", "DISCIPLINE. Do not recite that list. Naming ten technologies reads as insecurity. Name two that made a decision different — the local-model routing for data sovereignty, and the row-level security testing — and stop."]}, {"c": "A4", "t": "Seek advice from appropriate subject matter experts about using technology to achieve business strategies and outcomes", "v": "cle", "vt": "CLEARED", "body": ["The Technology, Scope and Risk forum brought ICT leadership together weekly on technical readiness, UAT and performance-readiness entry and exit criteria, system and service go-live and change control. The Chief Information Officer sat on the Procurement Steering Committee you established. Two development vendors, and a new Applications Director whose judgement you took over your own diagnosis.", "ONE HONEST LIMIT. Your personal build estate is solo work with AI assistance. It evidences currency, not consultation. Answer this indicator entirely from NSWEC."]}, {"c": "A5", "t": "Lead the appropriate use of digital systems, ensuring outputs are aligned with legal, ethical, and organisational standards", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Three instances, and the second and third are the kind almost no candidate can produce.", "• At NSWEC: systems operating under a documented legislative authority set, with go-live controlled by defined entry and exit criteria rather than by a date.", "• In the capstone portal: an AI assistant built on Copilot Studio with academic integrity guardrails, an audit log and a coordinator review queue — an AI system deliberately constrained so that it cannot be used to undermine the standards of the institution deploying it.", "• In MaturityOne: a positioning statement carried on every framework row in the database, because the firm holds no PeopleCert or SCAMPI accreditation and any client-facing output must say so. You wrote a probity constraint into a schema so that it cannot be omitted by accident.", "That last one is worth stating explicitly in an interview. Most people express ethical constraints as policy. You expressed one as a data model that makes non-compliance structurally difficult."]}], "ha": [{"c": "H3", "t": "Establish effective governance to ensure organisational compliance with cyber security and acceptable use of technology policies, including record keeping, cybersecurity, privacy, responsible artificial intelligence use, and single points of failure", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your strongest indicator in this capability and one of the strongest in the framework, because it names two things that are new in Version 3 and you have specific evidence against both.", "§ Responsible artificial intelligence use", "All NSW Government use of AI must apply the NSW AI Assessment Framework under Circular DCS-2024-04, with high and critical risk systems referred to the NSW AI Review Committee, and the framework is integrated into the NSW Digital Assurance Framework.", "You have built an instrument against exactly that. The NAIM v2.1 work package carries an eighteen-obligation NSW AIAF ledger mapped to DCS-2024-04 with evidence artefacts and assessment cadence, an Agentic AI Readiness dimension with a five-level maturity rubric, and crosswalks to the NIST AI Risk Management Framework and ISO/IEC 42001 — landed into a product as migrations, not written as a slide deck.", "[CONFIRM: whether this was built as a Naveniem product, for a client engagement, or both — and whether any agency has used it]", "§ Single points of failure", "An odd, specific phrase that most candidates will skip. You should not. After event assurance did not achieve its posture at SGE23 you drafted a proposal for a new project and took ownership of business resilience and crisis management, with rehearsed scenarios across ransomware, disinformation, sovereign insider threat, and fire and flood. Business continuity plans were finalised and BCP testing was scheduled on the program critical path, alongside disaster recovery inside the systems workstream and a four-tier operational command structure running from the Executive Control Group to returning officers in the field.", "Single point of failure analysis is the whole of that work. Name the phrase back to the panel and then give the resilience arc."]}, {"c": "H2", "t": "Put governance frameworks in place to ensure technology delivers value, and initiatives that pose unacceptable risks or misalignment are adjusted or stopped", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The operative words are adjusted or stopped. Governance that cannot stop something is reporting.", "Your technology governance had stop authority written into it. The Technology, Scope and Risk forum controlled system and service go-live through UAT and performance-readiness entry and exit criteria and change control — a system that fails exit criteria does not go live. Gate 2 could not be passed with any uncontrolled high or extreme risk, or with systems not configured and end-to-end tested. And the EPMO assurance model gated the investment decision while governing delivery through standing conditions that are continuously evidenced and withdrawable on breach.", "The adjusted half is evidenced too: the vendor re-tender reshaped a failing delivery rather than terminating it, and the roadmap was reduced to what was deliverable."]}, {"c": "H5", "t": "Lead system strategies that have clear business cases, make user needs central to design, and ensure strategies are efficient and future-proofed to maximise long-term public value", "v": "cle", "vt": "CLEARED", "body": ["Roughly nineteen application systems delivered through a single program, against $20 million of application development and $20 million of infrastructure, all converging on a date fixed in statute — with a business case taken through approval to a funding submission to NSW Treasury underneath it.", "User needs central to design is evidenced better here than in most Technology answers, because you commissioned independent research to test it: approximately 3,500 respondents across six instruments, including in-language interviews in five community languages and qualitative work with people living with disability. The result — 90% of electors found it easy to vote, and 95% of the 46% who needed assistance were satisfied — is a user-centred design outcome measured by someone you did not control.", "THE SOFTER LIMB. \"Future-proofed\" is the weakest word for you, because election technology is cyclical and much of it is rebuilt for each event. If you have any evidence of a systems roadmap or platform strategy extending beyond a single election cycle, it firms this materially. If not, answer on the business case and the user research and do not reach for the word."]}, {"c": "H4", "t": "Critically assess business cases that support introducing technology to ensure clear business needs, public value and full assessment of total cost", "v": "cle", "vt": "CLEARED", "body": ["Note the verb — assess, not write. This indicator is about scrutinising other people’s cases, and the EPMO service you built is exactly that function: demand management and scalable, evidence-based business cases as a standing capability rather than a one-off review. Add the Procurement Steering Committee you established, which reviewed and approved tender documents to market release and tested commercial justification across roughly $80 million.", "And the clearest single instance of total-cost assessment: the vendor decision, where terminating would have cost calendar and knowledge, supplementing cost money, and you priced both before choosing."]}, {"c": "H1", "t": "Maintain current knowledge of the application of emerging and accessible technology and best practices, providing advice and seeking expert advice", "v": "cle", "vt": "CLEARED", "body": ["The providing advice limb is strong and largely unused so far: a consultancy practice built on published technology blueprints — AI maturity, CIO AI, cyber, EPMO, ICT PMO, ICT target operating model, ISO AI governance — alongside eight years teaching postgraduate project management and a year at TAFE NSW.", "The seeking limb is answered from NSWEC, as at A4. Do not answer either limb from the personal build estate."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: H3 governance for compliance including responsible artificial intelligence use · A2 actively manage technology risk including responsible AI. Supporting: H1 · A5", "s": ["All NSW Government use of artificial intelligence — any AI system or component, across its full lifecycle, whether or not it forms part of a formal project — must be assessed under the NSW AI Assessment Framework, mandatory under Circular DCS-2024-04, with high and critical risk systems referred to the NSW AI Review Committee.", "In practice most agencies meet that obligation as a document exercise: a spreadsheet completed once, at the point of approval, by whoever is closest to the system. It satisfies the circular and tells the organisation almost nothing about whether it is actually ready to run AI safely."], "t": ["To turn a point-in-time compliance obligation into something an organisation could be measured against and improve."], "a": ["I built the assessment instrument as a data model rather than a document. Eighteen obligations drawn from the framework, each carrying its required evidence artefact and its reassessment cadence, so that compliance is a state you hold rather than a form you filed.", "I added a maturity dimension for Agentic AI Readiness with a five-level rubric, because the framework was written for AI systems that produce outputs and the risk profile changes materially once systems take actions.", "And I crosswalked the whole instrument to the NIST AI Risk Management Framework and ISO/IEC 42001, so an organisation assessing itself once can answer to a regulator, a board and an auditor from the same evidence base rather than maintaining three.", "[CONFIRM: whether this was product development, client work, or both — and whether any organisation has been assessed with it]"], "r": ["The obligation becomes a maturity position with evidence attached and a review cadence, rather than a completed form. An organisation can see where it is weak, what it would take to move, and answer three separate frameworks from one assessment.", "The reason I built it that way is the same reason I built a gate rather than a report at the election: a control that can only be satisfied once is not a control."], "notes": ["§ Delivery notes", "• Lead by naming the circular. \"Mandatory under DCS-2024-04, with high and critical risk systems going to the AI Review Committee.\" Precision here separates you immediately from candidates who talk about AI in general terms.", "• The distinction to hold is document versus data model. A spreadsheet completed once versus a state with evidence and cadence. It is the whole argument.", "• Close on the callback. \"A control that can only be satisfied once is not a control\" ties this to the Gate 2 answer and shows one philosophy operating in two very different domains.", "• Probe — \"Has anyone used it?\" Answer honestly. If the answer is not yet, say so and pivot to why you built it — being able to describe the regulatory instrument precisely is the evidence this indicator wants."], "probes": [], "keys": ["Assessment Framework", "Review Committee", "Risk Management Framework"], "bul": []}, {"title": "STAR B — Highly advanced", "sub": "Primary indicators: H2 governance frameworks that ensure technology delivers value, with initiatives adjusted or stopped · H5 lead system strategies with clear business cases and user needs central to design. Supporting: A4 · H4", "s": ["The 2024 Local Government elections depended on roughly nineteen application systems — nominations and registration, the roll, ballot paper draw and production, postal and declaration and attendance voting, technology assisted voting, counting and results, the election website, logistics and ballot tracking, venue and financial systems. Around $20 million of application development and $20 million of infrastructure, all of it converging on a date fixed in statute.", "Election systems have an unusual property: they are exercised once, at full load, in public, with no opportunity to remediate. A system that fails on the second Saturday in September has failed permanently."], "t": ["To govern that system estate so that go-live was a decision made on evidence, and so that anything not ready could be stopped while stopping was still possible."], "a": ["I scheduled every system individually on the program critical path with its own user acceptance, security and performance test windows, sequenced backwards from the statutory date. The critical path was published thirteen months out, and it made the consequence of any single slippage visible against a date that could not move.", "Technical governance sat in a weekly Technology, Scope and Risk forum with ICT leadership, holding defined entry and exit criteria for user acceptance and performance readiness testing, control of system and service go-live, and change control. Entry and exit criteria are the mechanism that matters — a system that fails exit criteria does not go live, and that judgement is made against a written standard rather than in a conversation about pressure.", "Above it, Gate 2 could not be passed unless systems were configured and end-to-end tested, and with no uncontrolled high or extreme risk anywhere in the program. And the assurance model gated the investment decision rather than the delivery decision, governing delivery through standing conditions that were continuously evidenced and withdrawable on breach."], "r": ["The systems went live and the election was delivered on time and within a $150 million authority, with no high residual risks at closure.", "The measure I would offer for whether the system estate actually served its users is not an availability figure. Independent research across approximately 3,500 respondents found 90% of electors found it easy to vote, with average queue times of 4.3 minutes at early voting and 6.0 minutes on election day, and 95% satisfaction among the 46% who needed assistance. Technology in an election is invisible when it works, and those are the numbers that show it did."], "notes": ["§ Delivery notes", "• The Situation line is the one to keep. \"Exercised once, at full load, in public, with no opportunity to remediate.\" It explains why the governance had to be this heavy and pre-empts any suggestion of over-engineering.", "• Entry and exit criteria are the H2 answer. Say explicitly that a system failing exit criteria does not go live. Governance that cannot stop something is reporting.", "• Close on the elector numbers, not on availability. Queue times and ease-of-voting are technology outcomes expressed as user outcomes, which is exactly what H5 asks for.", "• The critical path chart is the artefact behind this STAR. Dated, carrying your name, published thirteen months out, with every system scheduled through test and security windows. Take it if the format permits."], "probes": [], "keys": ["$20 million", "$150 million", "3,500"], "bul": []}], "notes": [{"h": "Verdict", "body": ["This capability was substantially rewritten in Version 3. \"Responsible artificial intelligence use\" now appears in both A2 and H3, and H3 adds \"single points of failure\". Those are new tests, most candidates have no evidence against them, and you have unusually specific evidence against both."]}, {"h": "The framing that decides this capability", "body": ["You have two distinct bodies of technology evidence and they do different jobs. Getting the order wrong will cost you the capability.", "THE RISK IN THE SECOND BODY, STATED PLAINLY. Your personal estate is AI-assisted development. A technically literate panel member may ask how much of it you wrote. Do not be defensive and do not overclaim authorship — the honest answer is stronger than either. You specified, governed and verified these builds. The judgement artefacts are unambiguously yours: the working agreements, the verification documents, the security models, the architecture trade-offs, the legal constraints written into the schemas. That is precisely what a Director does with technology, and doing it hands-on is how you stay able to do it at all.", "The claim to make is not \"I am a developer.\" It is: \"I can specify a system, govern its build, assess its business case, and stop it if it is going wrong — and I keep that judgement current by building.\""]}, {"h": "The through-line — and it is the same one as your whole career", "body": ["In the MaturityOne repository there is a document called WORKING-AGREEMENT.md. It contains rules you wrote for yourself: test first; never silence a lint rule; migrations are serial and reviewed; never weaken an existing row-level security policy, only add to it.", "That is the same behaviour as the change request pipeline you built in the EPMO role and were then governed by two roles later, and the same behaviour as the terms of reference defining the decision rights of forums you chaired. You build the control and then submit to it.", "Very few executives can show that pattern in an enterprise program and in their own source code. It is worth one sentence in an interview and no more — the restraint is what makes it land."]}, {"h": "What not to claim", "body": []}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "Digital NSW — NSW AI Assessment Framework; mandatory under NSW Government Circular DCS-2024-04; high and critical risk systems referred to the NSW AI Review Committee; integrated into the NSW Digital Assurance Framework — digital.nsw.gov.au", "Information and Privacy Commission NSW — Mandatory Notification of Data Breach Scheme, commenced 28 November 2023 under the PPIP Act — ipc.nsw.gov.au", "NSWEC LGE24 high-level critical path (A0, \"Contact: Naven Kumar\", as at 22 August 2023); programme governance model; Program Management Plan retrospective (OFFICIAL–Sensitive) — supplied.", "Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025 — supplied.", "Survey of A:\\Claude Dev and A:\\Gemini Flash Dev project estate, 16 August 2026."]}], "script": {"id": "tech", "intro": ["Technology asks whether you understand and use available technology to maximise efficiencies and effectiveness. At Adept, a panel accepts that you sponsored systems and read the reports. At Advanced and Highly advanced they want the governance you built around technology, the risks you actively managed, and the decisions you made differently because you understood how the thing worked.", "This capability was substantially rewritten in Version 3. Responsible artificial intelligence use now appears in both A2 and H3, and H3 adds single points of failure. Most candidates have no evidence against those new tests. You have unusually specific evidence against both.", "The trap is the technology tour. Candidates hear Technology and start listing platforms and trends to prove currency. It reads as insecurity and answers none of the indicators. The panel is testing whether technology under your control delivered value, stayed compliant, and could be stopped."], "standing": ["You clear Advanced on all five, three of them exceptionally. Highly advanced is five of five as well, two exceptionally. Claim this one at Highly advanced without hedging. The reason is H3. It names responsible artificial intelligence use and single points of failure, and you answer both with named instruments and named scenarios rather than intent. Lead there and everything else supports it."], "inds": {"A1": ["Read the word accessible carefully. It isn't decoration in this framework, and a panel won't accept a policy posted on an intranet. They want accessible technology operating at scale for real users.", "Yours was operational. Telephone assisted voting for blind and low vision electors, braille ballot papers, accessible voting screens, contrast-marked ballot boxes, the National Relay Service and multilingual channels, across 2,486 venues, with venue accessibility gated at Gate 2. On the creative side, portfolio management tooling with adoption driven rather than assumed, and an AI transformation program run with the University of Sydney School of Project Management across seven teams. So in the room, it sounds like this. I didn't publish an accessibility standard, I gated the program on it."], "A2": ["This in
