 unethical conduct by a trusted person; two-officer verification and chain-of-custody are controls against manipulation; probity governance over $80M of tendering; supplier qualification before any customer-facing exposure.", "THE QUESTION: was the internal account-credential incident misconduct, or a control failure? If misconduct, you have a response-to-unethical-behaviour example and this indicator is fully cleared. If it was error, it evidences the previous indicator but not this one, and I would not stretch it."]}], "stars": [{"title": "STAR A — Advanced", "sub": "The contingency return, framed for integrity. Indicators: model the highest standards and encourage others to do the same · set an example by representing your organisation honestly · promote practices and systems that create a culture valuing high ethical standards.", "s": ["In the lead-up to the 2024 Local Government elections, the Electoral Commission's funding submission was unsuccessful. That triggered an organisation-wide restructure, the cessation of several programs and projects across the portfolio, and considerable anxiety across the workforce about whether roles would continue. The election program I managed held the only substantial remaining budget, and inside it sat a $12 million contingency — properly approved, risk-justified and entirely defensible on paper."], "t": ["The financial question was straightforward and I was already managing it: I carried program-level risk for cost pressure with mitigations in place. The ethical question was the one that mattered. Nobody was going to ask me about that contingency. In an organisation that had just been awarded nothing, holding a large unexamined reserve was the safe and unremarkable option, and it would have given me flexibility every other program lead had just lost. I judged that continuing to hold it without testing it was not defensible, and that the test needed to be visible rather than something I satisfied myself about privately."], "a": ["• I raised it myself, before anyone raised it with me. I sought Steering Committee endorsement to run a program-wide change request across every workstream — not to seek more money, but to establish what the program would genuinely cost, whether the contingency actually covered it, and how further unknown costs would be mitigated. I chose to open my own position to full scrutiny at the moment when staying quiet carried no risk at all.", "• When the exercise produced an uncomfortable answer, I took it straight back. It showed the contingency being exhausted. I did not manage that inside the program; I returned to the Steering Committee and secured agreement to institute an additional cost control and financial management strategy, reporting over-spend and under-spend at project level on a standing cycle so variance was visible in period rather than at closure.", "• I built the discipline into the mechanism rather than relying on intent. Project underspends were swept back into contingency quarterly. That changed the incentive across the program — contingency stopped being a pool that only drains and became one that projects replenished — which meant I could support genuine draws where they were needed while the overall position improved.", "• I made the reporting honest in both directions. Over-spend was reported as visibly as under-spend. A control that only surfaces good news trains people to hide the other kind."], "r": ["The election was delivered on the statutory date at a forecast $122.8 million against a $150 million investment authority, and the full $12 million contingency was returned as savings — to an organisation that had just been awarded nothing and was stopping programs. The cost control mechanism was carried into business as usual. Financial probity is not really tested when money is plentiful; it is tested when you are holding the only reserve in a building where everyone else has lost theirs."], "notes": ["§ A note on the accounting, in case you are challenged", "Contingency is a budget provision, not an expense classification. It becomes expenditure only if drawn, and when drawn it is spent against the workstream that consumed it — never reported as a line called \"contingency\". A published expense report therefore cannot show a returned contingency as a line item; the return is evidenced by total expenditure landing below the authority. The $122.8 million forecast against the $150 million authority is the arithmetic in which the return is visible. All the figures are consistent."], "probes": [], "keys": ["$12 million", "$122.8 million", "$150 million", "Steering Committee"], "bul": ["I raised it myself, before anyone raised it with me. I sought Steering Committee endorsement to run a program-wide change request across every workstream — not to seek more money, but to establish what the program would genuinely cost, whether the contingency actually covered it, and how further unknown costs would be mitigated. I chose to open my own position to full scrutiny at the moment when staying quiet carried no risk at all.", "When the exercise produced an uncomfortable answer, I took it straight back. It showed the contingency being exhausted. I did not manage that inside the program; I returned to the Steering Committee and secured agreement to institute an additional cost control and financial management strategy, reporting over-spend and under-spend at project level on a standing cycle so variance was visible in period rather than at closure.", "I built the discipline into the mechanism rather than relying on intent. Project underspends were swept back into contingency quarterly. That changed the incentive across the program — contingency stopped being a pool that only drains and became one that projects replenished — which meant I could support genuine draws where they were needed while the overall position improved.", "I made the reporting honest in both directions. Over-spend was reported as visibly as under-spend. A control that only surfaces good news trains people to hide the other kind."]}, {"title": "STAR B — Highly advanced", "sub": "Setting, communicating, evaluating and reinforcing the standard. Indicators: set, communicate, evaluate and reinforce the use of ethical practices, standards and systems · champion and model the highest standards · lead a culture of integrity within your organisation and when dealing with other agencies.", "s": ["At the Electoral Commission, organisational resilience is driven through the Election Program — so the program carries the agency's capability to withstand an incident, not just its own. On the 2023 State general election, which I managed, the event assurance function covering physical security, cyber and red teaming did not achieve its target posture. That was my program's shortfall, and there would be another statutory event within eighteen months."], "t": ["I could have recorded it as a residual risk and handed it on. My view was that a standard the organisation had set and not met is worse than no standard, because it teaches people the standard is aspirational. My task was to close it before the next event, and to close it in a way that would survive my departure from the role."], "a": ["• Evaluate — I recorded the shortfall rather than managing it privately. It went into the formal lessons learned as a stated failure to achieve posture. Putting your own program's shortfall on the record is the precondition for anyone resourcing the fix; managing it quietly guarantees it recurs.", "• Set — I drafted a proposal for a new project, adequately resourced, to monitor and control the integrity of the conduct of an election, and took personal ownership of business resilience and crisis management rather than assigning it. Securing resourcing for a new project in an agency under acute funding pressure required the case to be made on integrity grounds rather than convenience. A specialist vendor was engaged to uplift the resilience posture.", "• Communicate — I took the entire organisation through it, not just the program. We ran a series of desktop exercises and drills covering ransomware, disinformation, insider threat, and natural hazard scenarios including fire and flood. Deliberately the whole organisation, because in an incident the failure point is rarely the specialists — it is the people at the edges who have never been asked what they would do.", "• Reinforce — rehearsal is what converts a procedure into a reflex. A crisis plan that has only been written is a document. One that has been exercised repeatedly across scenarios that feel different from each other is a capability. The scenario range mattered: an insider threat and a flood demand entirely different responses, and an organisation that has only practised one has practised nothing."], "r": ["The capability was tested for real at the 2024 Local Government elections by two separate data incidents, and it held in both — activation, mitigation and recovery ran in line with rehearsed procedures, with minimal disruption to services and the integrity of the election maintained. The Commission's published report on those elections describes the external incident and the response to it. The standard that had not been met in 2023 was met under live conditions in 2024, and the capability sat with the organisation rather than with me."], "notes": [], "probes": [], "keys": ["Election Program", "The Commission"], "bul": ["Evaluate — I recorded the shortfall rather than managing it privately. It went into the formal lessons learned as a stated failure to achieve posture. Putting your own program's shortfall on the record is the precondition for anyone resourcing the fix; managing it quietly guarantees it recurs.", "Set — I drafted a proposal for a new project, adequately resourced, to monitor and control the integrity of the conduct of an election, and took personal ownership of business resilience and crisis management rather than assigning it. Securing resourcing for a new project in an agency under acute funding pressure required the case to be made on integrity grounds rather than convenience. A specialist vendor was engaged to uplift the resilience posture.", "Communicate — I took the entire organisation through it, not just the program. We ran a series of desktop exercises and drills covering ransomware, disinformation, insider threat, and natural hazard scenarios including fire and flood. Deliberately the whole organisation, because in an incident the failure point is rarely the specialists — it is the people at the edges who have never been asked what they would do.", "Reinforce — rehearsal is what converts a procedure into a reflex. A crisis plan that has only been written is a document. One that has been exercised repeatedly across scenarios that feel different from each other is a capability. The scenario range mattered: an insider threat and a flood demand entirely different responses, and an organisation that has only practised one has practised nothing."]}, {"title": "STAR C — Highly advanced", "sub": "Responding to the incidents. Indicators: create a culture in which staff feel able to report apparent breaches and respond promptly to reports · act promptly and visibly to prevent and respond to unethical behaviour (conditional) · lead a culture of integrity and professionalism.", "s": ["During the 2024 Local Government elections the Commission experienced two data incidents. One was internal, involving account credentials. The other was external — a roll product went missing, which the Commission has described publicly: a printed copy of an electoral roll for a ward could not be accounted for. Enrolment information is among the most sensitive datasets any electoral commission holds, and an incident of that kind during a live statutory event carries reputational and public-trust consequences well beyond the data itself."], "t": ["Three things had to hold simultaneously: contain and remediate the incidents; preserve the integrity of an election that could not be paused; and protect the reporting culture that had surfaced them in the first place. That last one is the part people get wrong. An organisation that responds to an incident by looking for someone to blame gets fewer reports, not fewer incidents."], "a": ["• Activation followed rehearsed procedure rather than improvisation. Both incidents were run through the crisis management arrangements the program had built and exercised, which meant the first hour was spent containing rather than deciding who should be in the room.", "• Response was prompt and visible. For the external incident the Commission investigated in cooperation with other agencies, contacted every affected individual directly with details of what had been exposed and guidance on protective steps, and apologised publicly — on the basis that voters need to be able to trust an electoral commission with their information, and an accidental loss is still a loss.", "• The internal incident was contained and remediated under the same arrangements. [Add only what you are comfortable disclosing, and nothing about mechanism or scope.]", "[PLACEHOLDER — the people. What did you do about the individuals involved? Did you shield anyone, absorb pressure, resist a search for blame, or have to act against someone? This is the strongest possible close to the answer and I will not invent it.]", "[PLACEHOLDER — confirm whether there was a formal post-incident review, and whether anything changed as a result.]"], "r": ["Both incidents were mitigated and recovered with minimal disruption to services and the integrity of the election maintained across a statutory event serving 5.24 million electors. The external incident and the Commission's response are documented in its published report to the Minister. The resilience capability built after the 2023 shortfall was validated under live conditions rather than in exercise conditions — which is the only validation that counts."], "notes": [], "probes": [], "keys": ["5.24 million"], "bul": ["Activation followed rehearsed procedure rather than improvisation. Both incidents were run through the crisis management arrangements the program had built and exercised, which meant the first hour was spent containing rather than deciding who should be in the room.", "Response was prompt and visible. For the external incident the Commission investigated in cooperation with other agencies, contacted every affected individual directly with details of what had been exposed and guidance on protective steps, and apologised publicly — on the basis that voters need to be able to trust an electoral commission with their information, and an accidental loss is still a loss.", "The internal incident was contained and remediated under the same arrangements. [Add only what you are comfortable disclosing, and nothing about mechanism or scope.]"]}], "notes": [{"h": "Verdict", "body": ["One structural advantage to state once, early, in any integrity answer. You spent five years at an agency whose entire product is integrity — the impartial administration of elections, independent of ministerial direction, with the Commissioner accountable to Parliament. In most organisations integrity is a compliance overlay on the real work. At the Electoral Commission it is the work."]}, {"h": "The disclosure test — read before preparing anything", "body": ["An integrity answer that over-discloses security detail fails the capability it is answering. A panel assessing this capability is watching what you choose not to say as closely as what you say.", "Handled that way the restraint becomes evidence in itself. A candidate who says \"I can describe the nature and scale but not the content\" has demonstrated the capability inside the answer."]}, {"h": "The pattern — and how it resolved", "body": ["When I first benchmarked this capability, your integrity evidence was entirely preventive and systemic. You built systems that stopped problems occurring, and had nothing about encountering actual wrongdoing and dealing with it. That is why the two indicators containing the word \"respond\" were both partial.", "The resilience arc closed it, and it closed it completely: assurance posture not achieved on the 2023 election, identified in lessons learned, a proposal drafted for a new adequately resourced project, personal ownership of business resilience and crisis management taken, capability built and rehearsed across the whole organisation, then tested by two real incidents and held. Recognise a failure in your own program, document it rather than bury it, fix it structurally, and have it proved under live conditions. That is as complete as a capability narrative gets."]}, {"h": "Open questions", "body": ["Source: NSW Public Sector Capability Framework, Version 3: 2026, Office of the Public Service Commissioner — indicators quoted verbatim. Evidence from the Report on the administration of the 2024 NSW Local Government elections; the 2024 Local Government Election Program Management Plan and governance model; NSW Electoral Commission Annual Report 2022–23; and accounts provided by Naven Kumar, 13–14 August 2026."]}], "script": {"id": "awi", "intro": ["Act with integrity is the capability people assume they'll pass on character alone. The definition is one line. Be ethical and professional, and uphold and promote the public sector values. Now read the verbs at your levels. Advanced asks you to model, reinforce and monitor. Highly advanced asks you to champion, lead, set, evaluate and respond. None of those describe how you personally behave.", "That's what separates Advanced from Adept. Adept is your own conduct and your team's. Advanced is the machinery. A panel wants a mechanism they could inspect, and proof it ran the same way when the finding was uncomfortable. Highly advanced adds public advocacy and reach beyond your own organisation, and Version 3 now names other jurisdictions in that reach.", "The trap is the honesty anecdote. Most candidates arrive with a story about declining something or correcting a number, and it cost them nothing to tell. Integrity only reads as integrity when it was expensive. Your risk is the opposite one."], "standing": ["Here's where you stand. At Advanced you clear all five indicators, three of them exceptionally. The verdict is blunt. This is one of your strongest capabilities and you have been underselling it. At Highly advanced you clear four of five. The fifth, H5, act promptly and visibly to prevent and respond to unethical behaviour, is partial. It turns on a single question about the internal data incident.", "So claim this at Highly advanced. Don't hold it in reserve. Just don't rest the claim on H5 until that question is settled. And state one structural advantage once, early. You spent five years at an agency whose entire product is integrity. The impartial administration of elections, with the Commissioner accountable to Parliament. In most organisations integrity is a compliance overlay on the real work. There it is the work."], "inds": {"A1": ["Model the highest standards and encourage others to do the same. A panel accepts modelling that cost you something and rejects modelling that cost nothing. Yours cost something. You returned $12 million in contingency in an organisation that had just been awarded nothing, when holding it quietly would have gone unquestioned.", "Then your own practice. A published AI transparency statement. A commitment to publish the practice's annual value assessment to the same standard you demand of every client business case, including in unfavourable years. And you minuted criticism of your own processes at the kick-off forum in the stakeholders' own words. So in the room, it sounds like this. I hold my own practice to the standard I set for clients, including in the years the numbers don't flatter me."], "A2": ["Set an example by representing your organisation honestly. This one faces outward. The panel wants a moment where honesty was the costlier option, not a general claim about professionalism.", "You chaired the Procurement Steering Committee with the CIO and the COO across $80 million of high-risk tendering, recommending vendors under probity obligations, where a procurement failure becomes a public integrity failure. At RBC Dexia you resolved the PATRIOT Act data sovereignty exposure rather than accepting it as a documented risk. So in the room, it sounds like this. I told the client the cheaper option would hit their number with no margin for error, because they needed to choose knowing that."], "A3": ["Promote a culture of integrity internally and with external organisations. The question is whether an integrity concern had somewhere to go that didn't depend on personal relationships. Panels reject values statements and accept structures.", "You ran seven governance forums, each with terms of reference defining membership and decision-making powers, defined risk scope and a defined escalation path, with the Elections PMO as secretariat to all seven. Externally, vendor and systems-integrator governance with onboarding protocols and assurance checkpoints. So in the room, it sounds like this. Every forum I stood up had a defined escalation path with the PMO as secretariat, so raising a concern never depended on knowing the right person."], "A4": ["Reinforce and monitor ethical practices, standards and systems. Both verbs are continuous. A panel rejects a policy you wrote once. They want what kept running, and something that made the method hard to bend when a finding was awkward. This is your best-evidenced indicator in the framework.", "The seven-step assurance spine ran identically at every gate, specifically so it couldn't be reshaped to suit a difficult finding. Two-officer verification and discrepancy thresholds in counting, with chain-of-custody tracking across 9.6 million ballot papers. Automatic auditable status logging on every order, supplier and lead record. So in the room, it sounds like this. I ran the same seven steps at every gate, precisely so the method couldn't be reshaped around an inconvenient finding."], "A5": ["Promote practices and systems that create a culture valuing high ethical standards. This is new wording in Version 3. It replaced act promptly on reported breaches, so Advanced is now about building the culture rather than policing it. That shift favours you.", "Your evidence is design choices. The Project Managers Forum with psychological safety as a standing agenda item. Open-door escalation at Program Leadership, removing the hierarchy filter. A management response authored by the reviewed party and presented to committee alongside the finding. And the one I'd lead with. Materiality thresholds published before any escalation occurs. So in the room, it sounds like this. We published the thresholds first, so when something crossed the line it read as the process working, not as an accusation."], "H1": ["Champion and model the highest standards. Champion is the upgrade word. At Advanced you model. At Highly advanced you advocate publicly and take a position that costs you something. A panel will reject internal conduct offered as championing.", "Your practice positioning is the advocacy. Evidence over assertion. Publishing your own value assessment including the unfavourable years. The transparency statement. No junior leverage model. Add eight years teaching the capstone and a directorship of the largest Australian chapter of your professional body. So in the room, it sounds like this. I've committed to publishing my own value assessment to the standard I ask of clients, because a standard you apply only when it suits you isn't a standard."], "H2": ["Lead a culture of integrity within your organisation and when dealing with other agencies, jurisdictions and external organisations. Note the Version 3 addition of jurisdictions. That's the tightest filter here, because most senior candidates have agencies and vendors but nothing crossing jurisdictional lines.", "You have it. 39 staff from the Tasmanian, Victorian and Western Australian electoral commissions integrated into delivery. Then NSW Police liaison, 127 councils, Cyber Security NSW and the Australian Cyber Security Centre on an assurance panel, and the Audit Office. So in the room, it sounds like this. I had 39 staff from three other states' electoral commissions integrated into delivery, alongside police liaison, 127 councils and the Audit Office."], "H3": ["Set, communicate, evaluate and reinforce ethical practices, standards and systems. Four verbs. Most candidates evidence one or two and hope nobody counts. You evidence all four distinctly, so signpost them deliberately.", "Evaluate is the rarest and it's where you start. On the 2023 State general election the event assurance function covering physical security, cyber and red teaming didn't achieve its target posture, and you put that into the formal lessons learned as a stated failure. Set is the proposal you drafted for a new adequately resourced project. Communicate is the whole organisation through desktop exercises and drills. Reinforce is rehearsal across scenarios that feel different from each other. So in the room, it sounds like this. I put my own program's failure on the record, resourced the fix, and rehearsed it until it was a reflex."], "H4": ["Create a culture where staff feel able to report apparent breaches, and respond promptly to reports. Two indicators fused into one, and you answer both halves or you score half.", "Your culture half is rehearsal. Desktop exercises taking the entire organisation through incident scenarios, published escalation thresholds, psychological safety on the forum agenda. People who have practised raising an incident raise real ones faster. Your response half is 2024. Two data incidents, both activated, mitigated and recovered in line with rehearsed procedures, with electoral integrity maintained. The external one is corroborated in the Commission's published report. So in the room, it sounds like this. We rehearsed reporting until it was routine, and when two real incidents arrived during a live statutory event, both were contained."], "H5": ["Act promptly and visibly to prevent and respond to unethical behaviour. This one is not cleared. Prevention you have comprehensively. The insider threat scenario is explicitly a rehearsal for unethical conduct by a trusted person. Two-officer verification and chain-of-custody are controls against manipulation, not just error.", "The response half turns on one question and only you can answer it. Was the internal account-credential incident misconduct, or a control failure? If it was misconduct, this clears fully. If it was error, it evidences H4 and not this one, and I would not stretch it. A panel that senses you're reaching on an integrity question has learned something no later answer undoes. Until it's settled, answer on prevention and name it as prevention."]}, "stars": [["STAR A carries three Advanced indicators at once. Modelling the highest standards, representing the organisation honestly, and promoting systems that build an ethical culture. It's strong because the ethical option and the safe option were visibly different. The moment that does the real work isn't the return. It's that you raised it yourself before anyone raised it with you, then took the uncomfortable answer straight back when the exercise showed the contingency exhausted.", "Have one thing ready in case you're challenged. Contingency is a budget provision, not an expense classification, so a published expense report can't show a returned contingency as a line item. The return is visible in the arithmetic. $122.8 million forecast against a $150 million investment authority."], ["STAR B is your Highly advanced anchor. It carries set, communicate, evaluate and reinforce, and it feeds championing and leading a culture across organisations. Its strength is the shape. Recognise a failure in your own program, document it rather than bury it, fix it structurally, then have it proved under live conditions. The moment that does the real work is the lessons learned entry.", "Say the line that explains why. A standard the organisation set and did not meet is worse than no standard, because it teaches people the standard is aspirational. And don't drop the close. The capability sat with the organisation rather than with you."], ["STAR C is the response story. It carries the reporting culture indicator and it's the conditional route into H5. Its strength is the third thing you were holding. Contain the incidents, protect an election that couldn't be paused, and protect the reporting culture that surfaced them.", "Two cautions. This answer isn't finished. What you did about the individuals involved, and whether a formal post-incident review changed anything, are gaps only you can fill. Second, apply the disclosure test. An integrity answer that over-discloses security detail fails the capability it's answering. Saying I can describe the nature and scale but not the content demonstrates the capability inside the answer."]], "outro": ["Two things to close this out. Settle the internal incident question, because that answer decides whether H5 clears or stays partial. Then fill the two gaps in STAR C. What happened to the people, and what the review changed. Everything else is done, and you should be claiming this at Highly advanced. The sentence you own here is this. Financial probity isn't really tested when money is plentiful. It's tested when you're holding the only reserve in a building where everyone else has lost theirs."]}}, {"id": "ce", "name": "Communicate effectively", "group": "Relationships", "desc": "Communicate clearly, pay attention to others and respond with understanding and respect", "verdict": [["Advanced", "Cleared on seven of eight indicators, two exceptionally. Only \"leverage insights from people with lived experience\" is not evidenced"], ["Highly advanced", "Cleared on all five. The external representation indicator is met through vendor and supplier representation at $80M scale"]], "adv": [{"c": "A1", "t": "Present with credibility, engage diverse audiences and test whether they understand you", "v": "cle", "vt": "", "body": ["Strong. Note the Version 3 emphasis — test whether they understand you. Verification, not transmission.", "• Seven governance forums with genuinely different constituencies — Commissioner and senior executives; ICT leadership; CIO and COO on procurement; project owners and managers; CFO and Finance; the practitioner community. Six registers, weekly to monthly.", "• Board dashboards, milestone reporting and executive briefing packs on a defined monthly cadence with decision forums; weekly Minister's progress reports at the cultural infrastructure PMO.", "• Eight years teaching and assessing the capstone. This is your distinctive asset on this indicator. Assessment is formalised comprehension testing — you do not get to assume students understood you, you mark whether they did, twice a year, for eight years."]}, {"c": "A2", "t": "Translate technical and complex information clearly and concisely for different audiences", "v": "exc", "vt": "", "body": ["Exceptional. Thirty years of it, in domains where getting it wrong has legal consequence.", "• The regulatory convergence analysis: five converging AI and automated-decision regimes translated into board-grade briefings and a prioritised remediation sequence.", "• The telecommunications engagement: a P3M3 maturity assessment across seven process perspectives converted into a three-option costed investment case a divisional leadership team could decide on.", "• Six years explaining what BEPS, automatic exchange of information and the ATO channel migration meant for client tax directors' obligations, systems and timelines.", "• A PATRIOT Act, prudential and privacy position explained to internal and external stakeholders across jurisdictions."]}, {"c": "A3", "t": "Create opportunities for others to contribute to discussion and debate", "v": "exc", "vt": "", "body": ["Exceptional — and chairing is the mechanism, not a supporting example. This is literally the chair's function, exercised across seven forums.", "• The kick-off forum is the flagship: complaints raised, your instinct to defer overruled by the executive, and you convened and chaired the forum where most of the criticism turned out to be about processes you had built.", "• Psychological safety, blockers and escalation as standing agenda items; open-door escalation; a management response built into the assurance method; directors nominating their own quick wins; a community of practice."]}, {"c": "A4", "t": "Set an example by promoting information sharing across your organisation", "v": "cle", "vt": "", "body": ["Strong.", "• The entire EPMO reporting architecture existed to make portfolio status visible where previously it was not — information sharing as an act of design.", "• \"No secrets, no surprises\" as a founding principle; single-source knowledge repository; community of practice; published dashboards; reference libraries published for each capability area at your practice."]}, {"c": "A5", "t": "Manage complex communications that involve understanding and responding to multiple and divergent viewpoints", "v": "exc", "vt": "", "body": ["Strong. Nine functional directors and ten project managers with competing claims on the same constrained capacity; seven forums with structurally different interests; 127 councils; and the kick-off forum where the divergent viewpoints were about your own work."]}, {"c": "A6", "t": "Explore creative ways to share information and communicate with diverse audiences", "v": "cle", "vt": "", "body": ["Good — and one piece of it is genuinely distinctive.", "The desktop exercises are the answer here. Taking an entire organisation through ransomware, disinformation, insider threat and natural hazard scenarios is a communication method, not just a resilience one. A crisis procedure that has been circulated has been read. One that has been rehearsed has been understood, and the difference only shows up when it is needed. Framing rehearsal as communication is a sophisticated answer and few candidates will offer it.", "Supporting, with a caveat: the program delivered multilingual voter information, in-language radio, braille ballot papers and telephone-assisted voting. Claim these as what the program delivered, not as your personal design."]}, {"c": "A7", "t": "Leverage insights from people with lived experience to shape communication and engagement strategies", "v": "not", "vt": "", "body": ["NOT EVIDENCED. You have confirmed that community and accessibility engagement sat with the functional directors and executives — a Program Manager builds and governs the temporary organisation; that authority sits elsewhere. That is a structurally correct answer and the right one to give.", "If a role description sets this capability at Advanced and the agency is service-delivery or community-facing, be ready for the question and answer it forward: this is a growth edge at Director level rather than something to manufacture. It is also the newest indicator in the framework, so most of your competitors will have nothing for it either."], "new3": true}, {"c": "A8", "t": "Write clearly, concisely and persuasively in a range of styles and formats", "v": "cle", "vt": "", "body": ["Exceptional. The range is unusual and you should list it rather than assert it: ministerial progress reports, board and steering committee papers, terms of reference defining decision-making powers, a plan-to-green to a Commissioner-chaired committee, three-option investment cases, a business plan pack aligned to the KPMG Directors' Toolkit, a published methodology, seven written charter assurance findings, program management plans and governance frameworks, regulatory analysis, and academic assessment materials.", "The two most persuasive pieces of writing in your career are both recoveries: the plan-to-green, and the resilience project proposal that secured resourcing in an agency that had just been awarded nothing. Persuasive writing is best evidenced by what it moved."]}], "ha": [{"c": "H1", "t": "Articulate complex concepts and put forward compelling arguments and rationales to all levels and types of audiences", "v": "cle", "vt": "", "body": ["Exceptional — and the governance model is the proof. The phrase is all levels and types, and you genuinely span it in a single role: polling place officials in a 22,990-person temporary workforce, project managers, functional directors, CFO and CIO and COO, a statutory Commissioner, a Minister, reporting that had to withstand parliamentary committee examination, postgraduate students, and client boards."]}, {"c": "H2", "t": "Communicate in a highly articulate and influential way", "v": "exc", "vt": "", "body": ["Exceptional. I initially assessed this as not evidenceable by example. That was wrong, and the governance model is why.", "You designed and chaired seven governance forums and were the only member across all seven. In a typical fortnight that is roughly eight governance meetings, each with different membership and each demanding a different register — strategic and statutory with the Commissioner; technical readiness with ICT leadership; commercial and probity with the CIO and COO across $80M of tendering; delivery governance with owners and managers; earned value with the CFO; and psychological safety and blockers with the practitioner community.", "The influence point is sharper than the range. You chaired the Procurement Steering Committee with the CIO and COO, and the Financial and Cost Control forum with the CFO — chairing people more senior than you, in domains where they were the experts. That does not happen unless you can hold a room on the argument alone.", "And influence is evidenced by what moved: the plan-to-green endorsed by a Commissioner-chaired committee and adopted as the delivery baseline; a Steering Committee persuaded to authorise scrutiny of your own cost position; an additional cost control strategy agreed and carried into business as usual; and a new resilience project adequately resourced in an agency that had just been awarded nothing."]}, {"c": "H3", "t": "Communicate the facts and explain their implications for your organisation and key stakeholders", "v": "exc", "vt": "", "body": ["Exceptional — this is your signature. See the framing at the front of this pack."]}, {"c": "H4", "t": "Promote your organisation's position with credibility across government, other jurisdictions and external organisations", "v": "cle", "vt": "", "body": ["Cleared, through vendor and supplier representation.", "You chaired the Procurement Steering Committee with the CIO and COO, whose terms of reference were to supervise $80M of high-risk tenders and RFQs, approve evaluations and recommend vendors, with probity, evaluation and policy in its risk scope. Technology infrastructure and systems alone were $40M of the 2024 program, with logistics, venue services, ballot printing and the advertising campaign all vendor-delivered. You established the vendor and systems-integrator governance regime, and engaged the specialist vendor that uplifted the resilience posture.", "The framing to use: \"Representing the Commission's position to vendors is not a commercial negotiation in the ordinary sense. If a ballot printer misses, or a count system fails, or a logistics provider under-delivers, the consequence is not a service credit — it is a failed election on a date fixed in legislation, examined publicly and in Parliament. So the position I was representing had very little room to move, and my job was to make that credible to commercial parties whose interests were legitimately different from ours, while holding the probity line.\"", "The government and other-jurisdictions elements are weaker: 39 staff from the Tasmanian, Victorian and Western Australian electoral commissions were integrated into delivery, and the program interfaced with NSW Police, 127 councils, Cyber Security NSW, the Australian Cyber Security Centre and the Audit Office — but external representation to those parties sat with functional directors and the executive. Lead with vendors."]}, {"c": "H5", "t": "Anticipate and address key areas of interest for your audience and adapt under pressure", "v": "cle", "vt": "", "body": ["Strong, and one example is structurally elegant.", "• The sponsor-first rule in your assurance method. You designed the process so no finding reaches a committee the sponsor has not already seen. That is anticipating an audience's key area of interest in the architecture — because a sponsor blindsided in committee becomes an adversary of the assurance function permanently, and the way to prevent that is not tact, it is sequence.", "• The kick-off forum is the adapt-under-pressure half. You went in expecting to manage a process issue and discovered the criticism was of your own work, in front of the people who would deliver the program. You adapted in the room — gave direction and firmed methodology rather than deferring or defending."]}], "stars": [{"title": "STAR A — Advanced", "sub": "Chairing seven forums. Indicators: present with credibility and engage diverse audiences · create opportunities for others to contribute to discussion and debate · manage complex communications involving multiple and divergent viewpoints · write clearly and persuasively in a range of formats.", "s": ["I was accountable for delivering a statewide statutory electoral program through nine functional directors and ten project managers, across fourteen workstreams, to a date fixed in legislation. The communication problem was not volume, it was register. The same issue — a slipping dependency, a procurement risk, a cost variance — has to be expressed one way to a Steering Committee chaired with the Electoral Commissioner in the room, another way to ICT leadership at a technical readiness review, another to the Chief Financial Officer in an earned value discussion, and another again to the project managers who actually have to fix it."], "t": ["My task was to design a governance system that made those translations reliable rather than dependent on me being in good form, and then to run it. If the only route for an issue was through a person, the system would fail the first time that person was unavailable or wrong."], "a": ["• I designed a seven-forum governance model — Program Steering Committee, Technology Scope and Risk, Procurement, Project Leadership, Program Leadership, Financial and Cost Control, and a Project Managers Forum — each with terms of reference defining membership and decision-making powers, a defined risk scope, an escalation path and a cadence from weekly to monthly.", "• I chaired all seven and sat as the only member across all of them, with my PMO as secretariat to each. In a typical fortnight that meant roughly eight governance meetings, each with different membership and each demanding a different register.", "• I designed the forums to draw contribution rather than receive reports. The Project Managers Forum carried psychological safety, blockers, risk escalation and interdependencies as standing agenda items rather than leaving them to any other business. Program Leadership operated an open-door escalation policy so an issue did not have to travel a reporting line, being softened at each step, before reaching someone who could act.", "• I separated who runs a forum from who decides in it, in writing. Documenting decision-making powers in the terms of reference converted personal influence into standing delegation — endorsed once rather than re-argued each meeting, and durable beyond any individual sponsor.", "• I made the written record the product. With the PMO as secretariat to every forum, agendas, minutes, decisions, actions and escalations were produced to a consistent standard across the whole system, so a decision taken in one forum was legible in another."], "r": ["The model governed two consecutive statutory electoral events. Escalation from every other steering committee converged on the Program Steering Committee, which meant issues surfaced in one place rather than in several partial versions. The Commission's published report on the 2024 elections records that its Enterprise Portfolio Management Office provided support and assurance services to the project teams, the governance framework, and monitoring across the design, development, operational readiness, go-live and closure phases of the projects."], "notes": [], "probes": [], "keys": ["Steering Committee", "Electoral Commissioner", "Chief Financial Officer", "Program Steering Committee"], "bul": ["I designed a seven-forum governance model — Program Steering Committee, Technology Scope and Risk, Procurement, Project Leadership, Program Leadership, Financial and Cost Control, and a Project Managers Forum — each with terms of reference defining membership and decision-making powers, a defined risk scope, an escalation path and a cadence from weekly to monthly.", "I chaired all seven and sat as the only member across all of them, with my PMO as secretariat to each. In a typical fortnight that meant roughly eight governance meetings, each with different membership and each demanding a different register.", "I designed the forums to draw contribution rather than receive reports. The Project Managers Forum carried psychological safety, blockers, risk escalation and interdependencies as standing agenda items rather than leaving them to any other business. Program Leadership operated an open-door escalation policy so an issue did not have to travel a reporting line, being softened at each step, before reaching someone who could act.", "I separated who runs a forum from who decides in it, in writing. Documenting decision-making powers in the terms of reference converted personal influence into standing delegation — endorsed once rather than re-argued each meeting, and durable beyond any individual sponsor.", "I made the written record the product. With the PMO as secretariat to every forum, agendas, minutes, decisions, actions and escalations were produced to a consistent standard across the whole system, so a decision taken in one forum was legible in another."]}, {"title": "STAR B — Highly advanced", "sub": "The resilience proposal. Indicators: articulate complex concepts and put forward compelling arguments to all levels and types of audiences · communicate in a highly articulate and influential way · communicate the facts and explain their implications · anticipate and address key areas of interest and adapt under pressure.", "s": ["Organisational resilience at the Electoral Commission is driven through the Election Program. On the 2023 State general election the event assurance function covering physical security, cyber and red teaming did not achieve its target posture, and I recorded that in the formal lessons learned. The next statutory event was eighteen months away. In the same period the agency's funding submission was unsuccessful, an organisation-wide restructure followed, and several programs and projects across the portfolio were stopped."], "t": ["I had to argue for a new project, adequately resourced, inside an organisation that had just been told it was getting nothing and was actively cancelling work. The argument could not be made on delivery convenience or on professional preference. It had to be made on a fact and its implication, to an audience whose default answer to any new spending proposal was already no."], "a": ["• I led with the fact I had already put on the record against myself. The assurance posture had not been achieved on my own program. A standard the organisation had set and not met is worse than no standard, because it teaches people the standard is aspirational. Starting from my own shortfall removed any suggestion this was empire-building.", "• I stated the implication rather than the requirement. The question was not whether we wanted better resilience. It was what happens to a statutory election, and to public confidence in it, if a ransomware event or an insider incident occurs and the organisation has not rehearsed a response. In an electoral commission that consequence is not operational, it is democratic — and it is examined publicly and in Parliament.", "[PLACEHOLDER — who did you put the proposal to, and what specifically did the argument turn on? The forum, the audience and the pivotal point of the case. This is the Action and I need it from you.]", "• I took personal ownership rather than assigning it. I took business resilience and crisis management as my own accountability, which changed the proposal from a request for someone else to be funded into a commitment I was making.", "• I designed the delivery so the argument stayed proven. A specialist vendor was engaged to uplift the posture, and we ran desktop exercises and drills across the entire organisation — ransomware, disinformation, insider threat, fire and flood. Rehearsal is what converts a procedure into a reflex, and it also keeps the case visible: every exercise re-demonstrates why the investment was made."], "r": ["The project was funded and adequately resourced, in an agency that had just been awarded nothing and was stopping other work. The capability was then tested for real at the 2024 Local Government elections by two separate data incidents, and it held in both — activation, mitigation and recovery in line with rehearsed procedures, minimal disruption to services, and the integrity of the election maintained across an event serving 5.24 million electors. The argument was not just accepted; it was subsequently validated under live conditions."], "notes": [], "probes": [], "keys": ["5.24 million", "Election Program"], "bul": ["I led with the fact I had already put on the record against myself. The assurance posture had not been achieved on my own program. A standard the organisation had set and not met is worse than no standard, because it teaches people the standard is aspirational. Starting from my own shortfall removed any suggestion this was empire-building.", "I stated the implication rather than the requirement. The question was not whether we wanted better resilience. It was what happens to a statutory election, and to public confidence in it, if a ransomware event or an insider incident occurs and the organisation has not rehearsed a response. In an electoral commission that consequence is not operational, it is democratic — and it is examined publicly and in Parliament.", "I took personal ownership rather than assigning it. I took business resilience and crisis management as my own accountability, which changed the proposal from a request for someone else to be funded into a commitment I was making.", "I designed the delivery so the argument stayed proven. A specialist vendor was engaged to uplift the posture, and we ran desktop exercises and drills across the entire organisation — ransomware, disinformation, insider threat, fire and flood. Rehearsal is what converts a procedure into a reflex, and it also keeps the case visible: every exercise re-demonstrates why the investment was made."]}], "notes": [{"h": "Verdict", "body": ["The indicators are described in the framework as providing, used together, a picture of the capability required for a role. They are not a checklist. Seven of eight at this quality is an unambiguous Advanced, and five of five is a complete Highly advanced case."]}, {"h": "Your signature on this capability", "body": ["Your communication strength is not eloquence — it is consequence. You are consistently the person who says what the facts mean, to the audience least comfortable hearing it, at the point where it can still change a decision. Read across the career and the same behaviour recurs:", "• The minimum-cost option meets your target with no margin for error, and the base case misses by twelve months.", "• The constraint is not demand, it is supply capacity — and growing demand alone will damage you faster than obscurity would.", "• Five regulatory regimes bind by December 2026, and here is your exposure and the sequence to address it.", "• The true cost position exhausts the contingency, and here is what that means for the program.", "• The assurance function did not achieve its posture, and here is what that means before the next event.", "• The incumbent vendor is not delivering; replacing them shortens the roadmap and increases cost.", "Fact plus implication, consistently, over decades. That is the Highly advanced indicator \"communicate the facts and explain their implications\" and it is the frame I would build every answer around."]}, {"h": "On the word \"chaired\"", "body": ["The person who holds the agenda from open to close, moves the items, calls the decisions and owns the actions to closure is the chair. Seniority in the room is a different thing — that is who holds decision authority, not who runs the meeting. Your terms of reference defined membership and decision-making powers as separate things, which means the separation was designed rather than improvised.", "The formulation to use: \"I designed and chaired the program's seven governance forums — from the Steering Committee attended by the Electoral Commissioner and senior executives, through technology, procurement, delivery, financial control and the practitioner community — with my PMO as secretariat to all seven.\"", "If a panel probes the word: \"Chair in the working sense — I held the agenda, ran the discussion, called and minuted the decisions and owned the actions to closure. The decision authority sat with the members, which is the point of separating the two. A chair who is also the decision-maker tends to get the decision they arrived with.\"", "Naming who was in the room is what makes the claim unambiguous. Nobody hears it as outranking a Commissioner; they hear that you ran the forum the Commissioner attended, which is the more impressive fact. And because the terms of reference documented the arrangement, the claim is verifiable rather than assertional."]}, {"h": "Open questions", "body": ["Source: NSW Public Sector Capability Framework, Version 3: 2026, Office of the Public Service Commissioner — indicators quoted verbatim. Evidence from the 2024 Local Government Election program governance model and terms of reference; the Report on the administration of the 2024 NSW Local Government elections; and accounts provided by Naven Kumar, 13–14 August 2026."]}], "script": {"id": "ce", "intro": ["The framework defines this capability as three things. Communicate clearly. Pay attention to others. Respond with understanding and respect. Only the first is about talking.", "Version 3 asks you to test whether your audience understands you. Verification, not transmission. At Advanced a panel is not marking your fluency. They are marking whether you built something that checks comprehension and draws contribution out of other people. At Highly advanced the words are all levels and types of audiences, and influence. Not that you spoke to them. That something changed because you did.", "The trap is answering with eloquence. Candidates list the papers they wrote and the boards they briefed. That is all transmission, and it is the most common way to score Adept on a capability you could have taken at Advanced. Every answer here needs a mechanism and a consequence attached."], "standing": ["You clear Advanced on seven of eight indicators, two of them exceptionally. One is not evidenced at all, and that is leveraging insights from people with lived experience. Highly advanced is cleared on all five, with external representation met through vendor and supplier representation at $80 million of tendering.", "So claim this at Highly advanced. Do not hold it in reserve. The framework says the indicators together give a picture of the capability, not a checklist. Seven of eight is an unambiguous Advanced and five of five is a complete Highly advanced case."], "inds": {"A1": ["Present with credibility, engage diverse audiences, and test whether they understood you. That last clause carries the weight. A panel accepts a mechanism that proves comprehension and rejects a list of audiences you addressed.", "You have the mechanism twice over. Seven governance forums with genuinely different constituencies, six registers, weekly to monthly. Board dashboards and executive briefing packs on a monthly cadence, and weekly Minister's progress reports at the cultural infrastructure PMO. Then the distinctive asset. Eight years teaching and assessing the capstone, because assessment is formalised comprehension testing. So in the room, it sounds like this. I have spent eight years marking whether people actually understood what I taught them, so I do not treat being understood as an assumption."], "A2": ["Translating technical and complex information for different audiences. The test is whether the translation was fit for a decision. Explaining something accurately is not the indicator. Explaining it so a specific audience could act is.", "Yours is exceptional, over thirty years, in domains where getting it wrong has legal consequence. Five converging AI and automated decision regimes became board-grade briefings and a prioritised remediation sequence. A P3M3 maturity assessment across seven process perspectives became a three-option costed investment case a leadership team could decide on. Six years explaining BEPS, automatic exchange of information and the ATO channel migration to client tax directors. So in the room, it sounds like this. I turned five converging regimes into a board briefing and a prioritised sequence, because a board cannot act on a summary, only on a sequence."], "A3": ["Creating opportunities for others to contribute to discussion and debate. Panels hear soft answers here. I have an open door, I encourage input. What they want is design, and chairing is your mechanism rather than a supporting example.", "The flagship is the kick-off forum. Complaints were raised, your instinct to defer was overruled by the executive, and you chaired the forum where most of the criticism turned out to be about processes you had built. Around it sit psychological safety, blockers and escalation as standing agenda items, open door escalation, and a management response built into the assurance method. So in the room, it sounds like this. I chaired the forum where the criticism was of my own processes, because a complaint with nowhere formal to go does not disappear, it just stops reaching me."], "A4": ["Setting an example by promoting information sharing across the organisation. The word is example. A panel wants sharing built into how the place ran, not a newsletter.", "Frame it architecturally. The entire Enterprise Portfolio Management Office reporting architecture existed to make portfolio status visible where previously it was not. That is information sharing as an act of design rather than goodwill. Under it sit no secrets and no surprises as a founding principle, a single source knowledge repository, a community of practice, published dashboards, and reference libraries for each capability area at your practice. So in the room, it sounds like this. I built the reporting architecture so portfolio status was visible where it had not been, and no secrets and no surprises was the founding principle."], "A5": ["Managing complex communications involving multiple and divergent viewpoints. The key word is divergent. A panel discounts an example where everyone wanted the same thing, and they want to hear what you did with the conflict rather than how you smoothed it.", "You have four sources of real divergence. Nine functional directors and ten project managers with competing claims on the same constrained capacity. Seven forums with structurally different interests. 127 councils. And the kick-off forum, where the divergent viewpoints were about your own work. So in the room, it sounds like this. Nine directors and ten project managers were making competing claims on the same constrained capacity, and my job was not to make them agree, it was to make the trade-off visible and decided in one place."], "A6": ["Exploring creative ways to share information with diverse audiences. Panels expect a channel answer, and channel answers are weak because everyone has one.", "The desktop exercises are the answer. Taking an entire organisation through ransomware, disinformation, insider threat and natural hazard scenarios is a communication method, not just a resilience one. A procedure that has been circulated has been read. One that has been rehearsed has been understood. Few candidates offer that framing. The program also delivered multilingual voter information, in-language radio, braille ballot papers and telephone assisted voting, but claim those as the program's delivery, not your personal design. So in the room, it sounds like this. I treated rehearsal as communication, because a circulated procedure has only been read."], "A7": ["Leveraging insights from people with lived experience to shape communication and engagement. This one is not cleared. It is not evidenced at all, and I am not going to dress that up.", "You have confirmed that community and accessibility engagement sat with the functional directors and executives. A Program Manager builds and governs the temporary organisation, and that authority sits elsewhere. That is structurally correct and it is the right answer to give. Do not manufacture anything. If a role sets this capability at Advanced in a service delivery or community facing agency, expect the question and answer it forward as a growth edge at Director level. It is the newest indicator in the framework, so most of your competitors will have nothing for it either."], "A8": ["Writing clearly, concisely and persuasively in a range of styles and formats. Range and persuasion are the two tests. Every candidate claims to write well, so assert nothing. List the range, then prove persuasion by what the writing moved.", "Ministerial progress reports. Board and steering committee papers. Terms of reference defining decision-making powers. A plan-to-green to a Commissioner-chaired committee. Three-option investment cases. A business plan pack aligned to the KPMG Directors' Toolkit. A published methodology. Seven written charter assurance findings. Regulatory analysis and academic assessment materials. So in the room, it sounds like this. The two most persuasive things I have written were both recoveries, a plan-to-green and a resilience proposal that won resourcing in an agency that had just been awarded nothing."], "H1": ["Articulating complex concepts and putting compelling arguments to all levels and types of audiences. All levels and types is the phrase. Most candidates cover two or three levels across a career. You span the full range inside one role.", "Run the span out loud. Polling place officials inside a 22,990 person temporary workforce. Project managers. Functional directors. The CFO, the CIO and the COO. A statutory Commissioner. A Minister. Reporting that had to withstand parliamentary committee examination. Postgraduate students. Client boards. So in the room, it sounds like this. In one program I was communicating to a 22,990 person temporary workforce at one end and to a Commissioner and a Minister at the other, in reporting that had to withstand parliamentary examination."], "H2": ["Communicating in a highly articulate and influential way. This looks like an indicator you cannot evidence by example, which is why most candidates answer it with adjectives. Evidence it with range and with what moved.", "You designed and chaired seven governance forums and were the only member across all seven. In a typical fortnight that is roughly eight meetings, each demanding a different register. Strategic and statutory with the Commissioner. Commercial and probity with the CIO and COO across $80 million of tendering. Earned value with the CFO. Then what moved. A plan-to-green adopted as the delivery baseline. A Steering Committee persuaded to authorise scrutiny of your own cost position. So in the room, it sounds like this. I chaired the procurement forum with the CIO and COO in it and the cost forum with the CFO in it, in their own domains."], "H3": ["Communicating the facts and explaining their implications. This is your signature and the frame to build every answer on. Your strength is not eloquence, it is consequence.", "The same behaviour recurs for decades. The constraint is not demand, it is supply capacity. Five regulatory regimes bind by December 2026, and here is your exposure and the sequence. The true cost position exhausts the contingency, and here is what that means for the program. The assurance function did not achieve its posture, and here is what that means before the next event. So in the room, it sounds like this. I do not stop at the fact. I say what it means for the decision in front of you, to the people least comfortable hearing it, while it can still change that decision."], "H4": ["Promoting your organisation's position across government, other jurisdictions and external organisations. Three doors here and you walk through one. Lead with vendors and suppliers, because that is where you personally held the position.", "You chaired the Procurement Steering Committee with the CIO and COO, supervising $80 million of high-risk tenders and requests for quote, approving evaluations and recommending vendors, with probity in its risk scope. Technology infrastructure and systems alone were $40 million of the 2024 program. You established the vendor and systems integrator governance regime. Mention the interstate commissions and NSW Police and the Audit Office, but representation there sat with directors and the executive. So in the room, it sounds like this. If a ballot printer misses or a count system fails, the consequence is not a service credit, it is a failed election on a date fixed in legislation, examined publicly and in Parliament."], "H5": ["Anticipating and addressing key areas of interest for your audience, and adapting under pressure. Two halves, one example each. Anticipation is best evidenced structurally, not as tact.", "Anticipation is the sponsor-first rule in your assurance method. No finding reached a committee the sponsor had not already seen. A sponsor blindsided in committee becomes a permanent adversary of the assurance function. Adapting is the kick-off forum. You went in expecting a process issue and found the criticism was of your own work, in front of the people who would deliver the program. You gave direction and firmed up methodology rather than deferring or defending. So in the room, it sounds like this. I designed it so no finding reached a committee before the sponsor had seen it, because that is a sequence problem, not a diplomacy problem."]}, "stars": [["The first answer is your Advanced story and it carries four indicators at once. Presenting to diverse audiences, creating opportunities to contribute, managing divergent viewpoints, and writing in a range of formats. Its strength is the opening move, where you define the problem as register rather than volume.", "The moment doing the real work is separating who runs a forum from who decides in it, in writing. That converted personal influence into standing delegation, endorsed once instead of re-argued every meeting. On delivery, name who was in the room whenever you use the word chaired. Nobody hears it as outranking a Commissioner. They hear that you ran the forum the Commissioner attended, which is the more impressive fact."], ["The second is your Highly advanced story, the resilience proposal. It carries articulating complex concepts to all levels, influence, facts and implications, and adapting under pressure. What makes it hard is the situation. The assurance function had missed its posture, the funding submission had failed, a restructure had followed, and programs were being stopped.", "The moment doing the real work is the first one. You led with the fact you had already recorded against yourself, which removed any suggestion of empire building and set up the pivot from requirement to implication. Land the result fully. Funded in an agency awarded nothing, then tested by two data incidents at the 2024 Local Government elections and holding in both, across an event serving 5.24 million electors. One warning. The Action still has a placeholder. Until you supply the forum, the audience and the point the case turned on, this answer cannot be delivered."]], "outro": ["Two things close this capability out. Fill the placeholder in the resilience answer, because the forum, the audience and the pivotal point are the part only you can supply. And prepare a forward-looking answer on lived experience, naming honestly where that accountability sat. Everything else is ready. The sentence you own here is this. My communication strength is not eloquence, it is consequence. I am the person who says what the facts mean, to the audience least comfortable hearing it, while it can still change the decision."]}}, {"id": "ccs", "name": "Commit to customer service", "group": "Relationships", "desc": "Provide customer-focused services in line with public sector and organisational objectives", "verdict": [["Advanced", "Cleared on all seven indicators, five of them exceptionally"], ["Highly advanced", "Cleared on all five. H1 clears outright on the commissioned evaluation; H3 clears on the agency’s own stated priority goal"]], "adv": [{"c": "A1", "t": "Promote an inclusive, customer-focused culture in your organisation and consider new ways of working to improve customer experience", "v": "cle", "vt": "CLEARED", "body": ["The kick-off arc fits exactly and is already minuted. Complaints that lessons were not implemented → executive challenge to hear them → dedicated Project Managers Forum → structural change to how the service is defined. \"New ways of working\" is the service catalogue itself. \"Inclusive\" is carried by the forum’s own charter, which named psychological safety as a standing item — that word is not decoration, it is the inclusion evidence."]}, {"c": "A2", "t": "Ensure that your organisation’s systems, processes, policies and programs collect customer feedback and insights, and use these to inform your response to customer needs", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["State the elegance explicitly: the complaint was that feedback was collected and never implemented. Your response was not to apologise for the backlog — it was to build the mechanism that makes implementation traceable. Three artefacts: the fortnightly PM Forum as a standing collection point; the Continuous Improvement Register transitioned to BAU at closure; and a commissioned external evaluation whose stated objectives included identifying opportunities for service improvement and developing actionable insights for future services. A closed loop, not a suggestion box."]}, {"c": "A3", "t": "Initiate and develop partnerships with customers to define and evaluate service performance outcomes", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The service catalogue was jointly developed between the Elections PMO and the EPMO with the consumer community in the room, with a standing commitment that stakeholders are engaged in any proposed change. That is not consultation — it is co-definition of the service and its performance outcomes. External corroboration worth using: the ACU delivery-optimisation brief treats an EPMO mandate as a nine-service catalogue and identifies your NSWEC methodology as the reference implementation for its Model 1. You arrived at the discipline independently, from customer complaint, and it was later assessed as the benchmark."]}, {"c": "A4", "t": "Promote and manage partnerships within your organisation and across the public, private and community sectors", "v": "cle", "vt": "CLEARED", "body": ["• Within: 9 functional directors, 7 governance forums, EPMO and Elections PMO", "• Public: 127 councils, each an autonomous public sector customer with an alternative supplier; the AEC for enrolment; Revenue NSW for recovery", "• Private: $80M of high-risk tenders and RFQs supervised through the Procurement SteerCo — ballot printing, logistics, venues, telephony", "• Community: declared institutions — nursing homes and hospitals — as the delivery channel to electors who cannot attend"]}, {"c": "A5", "t": "Communicate with senior stakeholders about key issues and provide expert and influential advice", "v": "cle", "vt": "CLEARED", "body": ["Already evidenced under Communicate effectively. Do not reuse the same story across two capabilities in one application — panels notice. For this capability use a customer-framed instance: Gate 2 readiness advice to the SteerCo, where accessibility was the gating condition."]}, {"c": "A6", "t": "Consider customers’ experience when designing business processes and improving services", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Two marquee items. The Gate 2 accessibility criterion. And the complaint handling process you championed and built — consolidating fragmented intake into triage, routing to the accountable area, then monitored to closure. Behind them: channel design across six voting modes, contrast-marked ballot boxes, accessible screens, maxi pens and magnifiers at every centre, and the Translating and Interpreting Service on election day, at early voting and by phone."]}, {"c": "A7", "t": "Encourage new ideas and creative ways to involve customers in designing business processes and improving services", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Previously your thinnest indicator; no longer. Three items now sit here: the co-designed service catalogue, the complaint handling process built from a problem nobody had assigned to you, and Election Operations Reporting championed during the event so the command structure could see service performance while it could still act on it."]}], "ha": [{"c": "H1", "t": "Create an organisational culture that embraces high-quality customer service by listening to and valuing insights from customers and communities", "v": "cle", "vt": "CLEARED", "body": ["The operative word is communities, and it is doing deliberate work — this indicator asks for more than a customer base. The commissioned evaluation answers it directly: five CALD language groups interviewed in-language, twenty people living with disability, twenty First Nations electors interviewed face to face by a First Nations interviewer, and youth groups. That is not customer feedback. It is community listening designed for the voices hardest to capture, commissioned by the program and published with its uncomfortable findings intact."]}, {"c": "H2", "t": "Communicate and negotiate with stakeholders on strategic issues related to government policy, customer service standards and accessibility, and provide expert, influential advice", "v": "cle", "vt": "CLEARED", "body": ["Three named subjects. You are strong on customer service standards — the Gate 2 accessibility criterion and the complaint process, both of which you had to argue for — and on the policy environment through the funding and legislative pressures at SGE23, including the Electoral Act amendment that cut early voting from 13 days to 7 mid-program.", "DO NOT claim influence on accessibility policy. iVote and technology-assisted voting predate your involvement. Say H2 on the standards leg, not the policy leg."]}, {"c": "H3", "t": "Ensure your organisation’s strategic planning processes prioritise customer experience", "v": "cle", "vt": "CLEARED", "body": ["The objection is that you ran program planning, not corporate strategic planning. Two things answer it. First, at an electoral commission the election program substantially is the agency’s strategic plan — the cycle is the strategy. Second, and better, the agency’s own stated priority goal is a customer-trust goal: \"to maintain trust and confidence in the electoral and democratic systems and processes\", with \"particular attention... to ensuring inclusion and accessibility to all... with audiences who may experience additional barriers to participation in democracy.\" Your program carried participation/accessibility and public trust as tracked benefits with formal achievement status, and commissioned the measurement of the agency’s priority goal. Customer experience embedded in the planning instrument, not reported alongside it."]}, {"c": "H4", "t": "Ensure management systems and processes support service delivery outcomes for diverse customers", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your strongest Highly advanced indicator in this capability and one of the strongest single claims across all four capabilities benchmarked. \"Diverse customers\" is the accessibility and inclusion test, and you answer it with a management control rather than a good intention: accessibility was not a program objective, it was a mandatory gate criterion — and a gate criterion is a management system. Supported by the accessible channel set, wheelchair accessibility ratings across every venue, braille ballot papers, telephone assisted voting, declared institution voting, the National Relay Service and multilingual services — delivered across 2,486 venues by a 22,990-person temporary workforce trained to apply it consistently. Then measured: 46% needed assistance, 95% of them satisfied."]}, {"c": "H5", "t": "Set overall performance standards for service delivery across your organisation and monitor compliance", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["This indicator is the EPMO function stated almost verbatim. R5 — delivery frameworks, lifecycle standards, assurance requirements, decision pathways. R6 — delivery assurance and gateway review. You built both at NSWEC and they applied across the agency’s delivery portfolio, with the EPMO providing compliance and assurance over the very program you later ran. Name the nuance rather than letting a panel find it: the standards were for the project delivery service, applied organisation-wide. The indicator requires organisation-wide service standards set and monitored — you have that, with a maturity trajectory and an external evaluation to evidence it."]}], "stars": [{"title": "STAR A — Advanced", "sub": "Primary indicators: A1 inclusive customer-focused culture and new ways of working · A2 systems collect feedback and use it · A3 partnerships with customers to define and evaluate service performance outcomes · A7 new ideas to involve customers in design", "s": ["I was Program Manager for the 2024 NSW Local Government elections — a $150 million investment authority, a statutory election date that could not move, 127 councils, 5.24 million electors and a temporary workforce of almost 23,000.", "At the program kick-off, the delivery community raised sustained criticism that lessons from previous elections had never been implemented. Most of it was directed at the enterprise delivery methodology, compliance requirements and PMO practice — which I had built myself in my previous role as Senior Manager, EPMO."], "t": ["My first instinct was to take the criticism offline to protect the meeting. The executive overruled me and directed me to ensure the stakeholders were heard and to report back. I accepted that, and I took the task to be more than listening: the program had not yet mobilised, and if the people delivering it did not believe the deli
