dicator names five things. Cybersecurity, privacy, record keeping, acceptable use, and responsible artificial intelligence. Most candidates have one or two. You have all five, and saying that structure out loud is part of the answer.", "A $700,000 event integrity assurance workstream covering cyber, physical security and disinformation, with a security test window for every one of roughly nineteen systems on the critical path. The Privacy and Personal Information Protection Act and the State Records Act both in the program's documented legislative authority set. Two data breach incidents handled under the Mandatory Notification of Data Breach scheme. So in the room, it sounds like this. That indicator names five obligations and I can evidence each one, starting with two data breaches I managed under the mandatory notification scheme."], "A3": ["Most executives answer currency with reading habits, and a panel hears that as passive. What they want is evidence that new technology changed a decision you made.", "You can answer with working systems, from Postgres with row-level security and database-level testing through Dataverse and Power Platform to the Anthropic and Google model APIs, locally hosted models via Ollama, and a FAISS vector store. Now the discipline. Do not recite that list. Naming ten technologies reads as insecurity. Name two that made a decision different, then stop. So in the room, it sounds like this. I route inference to locally hosted models for data sovereignty with automatic cloud fallback, and I test row-level security at the database layer."], "A4": ["The verb is seek. This isn't about being the expert. It's about knowing which expert to go to, and taking their judgement over your own instinct.", "Answer entirely from the Electoral Commission. The Technology, Scope and Risk forum brought ICT leadership together weekly on technical readiness, entry and exit criteria, go-live and change control. The Chief Information Officer sat on the Procurement Steering Committee you established. Two development vendors, and a new Applications Director whose judgement you took over your own diagnosis. Keep the personal build estate out of this, because solo work with AI assistance evidences currency, not consultation. So in the room, it sounds like this. I had my own diagnosis, my new Applications Director had a different one, and I went with his."], "A5": ["A panel will accept a compliance regime here. What earns Advanced exceptionally is showing you made the standard hard to breach rather than merely stated.", "Three instances, and two of them almost no candidate can produce. At the Electoral Commission, systems under a documented legislative authority set, with go-live controlled by entry and exit criteria rather than by a date. In the capstone portal, an AI assistant on Copilot Studio with academic integrity guardrails, an audit log and a coordinator review queue, constrained so it can't undermine the standards of the institution deploying it. In MaturityOne, a positioning statement carried on every framework row in the database, because the firm holds no PeopleCert or SCAMPI accreditation. So in the room, it sounds like this. Most people write an ethical constraint as policy. I wrote mine into the schema."], "H3": ["This is your strongest indicator here and one of your strongest anywhere. All NSW Government use of AI must apply the NSW AI Assessment Framework under Circular DCS-2024-04, with high and critical risk systems referred to the NSW AI Review Committee. You built an instrument against exactly that. The NAIM version 2.1 work package carries an eighteen-obligation ledger mapped to that circular, with evidence artefacts and an assessment cadence, an Agentic AI Readiness dimension, and crosswalks to the NIST AI Risk Management Framework and ISO IEC 42001. It landed as migrations, not a slide deck.", "Then single points of failure. Most candidates will skip that phrase. You shouldn't. After event assurance did not achieve its posture at SGE23 you took ownership of business resilience and crisis management, with rehearsed scenarios across ransomware, disinformation, sovereign insider threat, and fire and flood. Business continuity testing sat on the critical path, and a four-tier command structure ran from the Executive Control Group to returning officers. So in the room, it sounds like this. Single point of failure analysis is what that resilience program was, and I owned it after our assurance posture fell short at the State election."], "H2": ["The operative words are adjusted or stopped. Governance that can't stop something is reporting, and an answer with no stop authority in it fails here no matter how many forums you name.", "Yours had stop authority written in. The Technology, Scope and Risk forum controlled go-live through entry and exit criteria for user acceptance and performance readiness. Gate 2 couldn't be passed with any uncontrolled high or extreme risk, or with systems not configured and end-to-end tested. The adjusted half is there too. The vendor re-tender reshaped a failing delivery rather than terminating it. So in the room, it sounds like this. A system that failed its exit criteria did not go live, and that judgement was made against a written standard rather than in a conversation about pressure."], "H5": ["Four limbs here. A clear business case, user needs central to design, efficiency, and future-proofing for long-term public value. Panels usually get an architecture answer with no users in it at all.", "You had roughly nineteen application systems in one program, against $20 million of application development and $20 million of infrastructure, converging on a date fixed in statute, with a business case taken through approval to a funding submission to NSW Treasury. User needs are evidenced better here than in most Technology answers, because you commissioned independent research to test it. Approximately 3,500 respondents across six instruments, including in-language interviews in five community languages and qualitative work with people living with disability. Future-proofed is your weakest word, because election technology is cyclical and much of it is rebuilt each event. So in the room, it sounds like this. I didn't measure that estate on availability, I measured it on whether roughly 3,500 independently surveyed respondents found it easy to vote, and 90 per cent did."], "H4": ["Note the verb. Assess, not write. This is about scrutinising other people's cases, and total cost means the cost of the alternatives too.", "The EPMO service you built is that function. Demand management and scalable, evidence-based business cases as a standing capability rather than a one-off review. Add the Procurement Steering Committee you established, which reviewed and approved tender documents to market release and tested commercial justification across roughly $80 million. Your clearest instance of total-cost assessment is the vendor decision. So in the room, it sounds like this. Termination would have cost me calendar and knowledge, supplementing would cost money, and I put a number against both before I chose."], "H1": ["Two limbs, and they're usually unbalanced. Maintaining current knowledge, then both providing advice and seeking expert advice. Most candidates evidence seeking. Very few evidence providing at any scale.", "Your providing limb is strong and largely unused so far. A consultancy practice built on published technology blueprints covering AI maturity, CIO AI, cyber, EPMO, ICT PMO, ICT target operating model and ISO AI governance. Eight years teaching postgraduate project management, and a year at TAFE NSW. The seeking limb you answer from the Electoral Commission, exactly as at A4. So in the room, it sounds like this. I publish the blueprints other organisations use, and I've taught postgraduate project management for eight years."]}, "stars": [["This carries H3 and A2, with H1 and A5 supporting. It's your differentiating answer, because it rests on a mandatory instrument most candidates have never named out loud. Lead by naming the circular. Mandatory under DCS-2024-04, with high and critical risk systems going to the AI Review Committee.", "The moment doing the real work is document versus data model. A spreadsheet completed once at approval, against eighteen obligations each carrying its evidence artefact and its reassessment cadence. That's the whole argument, so slow down there. Close on the callback, that a control which can only be satisfied once is not a control, because it ties straight back to Gate 2. If they ask whether anyone has used it, answer honestly and pivot to why you built it."], ["This carries H2 and H5, with A4 and H4 supporting. Its strength is that the governance is inseparable from the constraint. Keep the Situation line exactly as written. Exercised once, at full load, in public, with no opportunity to remediate. It explains why the governance had to be that heavy and pre-empts any suggestion of over-engineering.", "Entry and exit criteria are the H2 answer, so say explicitly that a system failing exit criteria does not go live. Then close on the elector numbers rather than availability. Queue times of 4.3 minutes at early voting and 6.0 minutes on election day are technology outcomes expressed as user outcomes, which is what H5 asks for. The artefact behind this answer is the critical path chart, carrying your name, published thirteen months out. Take it if the format permits."]], "outro": ["Two things would close the remaining space. Settle the open question on the AI maturity instrument, whether it was product development, client work or both, and whether any organisation has been assessed with it. And look for anything showing a systems roadmap beyond a single election cycle, because future-proofed is the one word in H5 you can't reach for. Everything else is already yours. Claim this at Highly advanced, lead with H3, and land the sentence you own outright. A control that can only be satisfied once is not a control."]}}, {"id": "pcm", "name": "Procurement and contract management", "group": "Business Enablers", "desc": "Understand and use procurement processes to ensure effective purchasing and contract performance", "verdict": [["Advanced", "5 of 5 cleared. Three exceptionally"], ["Highly advanced", "5 of 5 cleared. One exceptionally"]], "adv": [{"c": "A1", "t": "Ensure employees and contractors follow government and organisational procurement and contract management policies", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["You did not only ensure people followed the policies. You wrote them — the programme procurement strategy, its policies, its governance and its assurance. Beneath them, the tracker recorded the probity basis underpinning every procurement, and the Procurement Steering Committee reviewed and approved tender documents before release to market with probity and policy compliance explicit in its remit.", "Compliance was designed into the sequence rather than inspected afterwards, which is the difference between this indicator at Advanced and the same words at Adept."]}, {"c": "A2", "t": "Ensure procurement and contract management risks are considered when making contract development and management decisions", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["This indicator asks whether risk shapes the decision. In your model, risk determined the governance route itself: the tracker was prioritised by risk, and that classification decided which procurements went to a dedicated Steering Committee and which did not. Risk was not an input to the paper — it was the routing rule."]}, {"c": "A3", "t": "Promote effective risk management in procurement", "v": "cle", "vt": "CLEARED", "body": ["The Procurement Steering Committee is the institutional form of it: a standing monthly forum with the Chief Information Officer and Chief Operating Officer supervising the high-risk end of an $80 million procurement portfolio, with probity in its remit and recommendations flowing to the Program Steering Committee."]}, {"c": "A4", "t": "Implement effective governance arrangements to monitor provider, supplier and contractor performance against contracted deliverables and outcomes", "v": "cle", "vt": "CLEARED", "body": ["Read the verb carefully — this indicator is about contract management after award, not procurement before it. You have both halves.", "The deliverables themselves: you were involved in developing the ICT agreements, with legal and external counsel, which is where contracted deliverables are actually defined. Performance can only be monitored against terms someone wrote deliberately, and you were in the room when they were written.", "The monitoring: the incumbent development vendor, managed through continuous engagement on non-delivery to a documented position, and acted on when they moved the implementation to a new team.", "ONE THING THAT WOULD MAKE IT SYSTEMATIC. One well-managed vendor is a contract management story. If supplier performance also reported into a forum on a cadence against contracted deliverables with a defined escalation path — the Technology, Scope and Risk forum or the Project Leadership Forum — say so. It converts an instance into an arrangement, which is the word the indicator uses."]}, {"c": "A5", "t": "Represent your organisation when resolving complex or sensitive disputes with providers, suppliers and contractors", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["You identified this yourself: external representation was not yours for stakeholders or community, but for vendors it was. And the instance is a good one, because you handled it in a way that preserved two things most people trade off against each other — the working relationship, and the organisation’s contractual remedy."]}], "ha": [{"c": "H4", "t": "Promote continuous improvement through evaluation of procurement outcomes and risk controls", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The cleanest instance in the capability, and it is exactly what the indicator describes. You evaluated how procurement had been governed at the previous election, identified that ICT had been taking procurements to the Program Steering Committee rather than running a project-level forum, and redesigned the control for the next cycle. Evaluation of a procurement outcome, converted into a changed risk control, carried across an election boundary."]}, {"c": "H2", "t": "Ensure effective governance processes are in place for your organisation’s procurement and contracting policies, processes and outcomes", "v": "cle", "vt": "CLEARED", "body": ["A program procurement strategy you authored; a tracker covering every procurement with its required-by date, probity basis and incumbent supplier; risk prioritisation determining governance route; and a dedicated Steering Committee chaired at Chief Information Officer and Chief Operating Officer level with a remit running from tender document approval through evaluation, probity and selection to recommendation."]}, {"c": "H3", "t": "Monitor and evaluate compliance and the effectiveness of procurement and contract management within your organisation", "v": "cle", "vt": "CLEARED on compliance, thinner on effectiveness", "body": ["Compliance monitoring sat with the Procurement Steering Committee, which carried probity and policy compliance in its remit and reviewed every high-risk procurement before market release.", "Evaluating effectiveness is the second limb and it is answered by H4 — you evaluated the previous cycle’s arrangements and changed them. If there was also a post-election review of how the procurement approach performed at LGE24, that closes the limb properly."]}, {"c": "H1", "t": "Ensure whole-of-government approaches to procurement and contract management are integrated into your organisation’s policies and practices", "v": "cle", "vt": "CLEARED", "body": ["The word that carries this indicator is integrated. It is not asking whether you complied with whole-of-government frameworks — it is asking whether you made them part of how the organisation actually procures.", "You authored programme procurement policies and assurance under the Public Works and Procurement Act framework, and the programme’s ICT contracting ran on the mandated MICTA/ICTA framework, developed with the agency’s legal function, external counsel and the procurement practice lead. That is whole-of-government machinery operationalised into a programme’s working practice, with the policy and assurance layer written to hold it there after you left the room."]}, {"c": "H5", "t": "Champion responsible procurement aligned with government priorities and long-term public value", "v": "cle", "vt": "CLEARED", "body": ["\"Responsible procurement\" is a term of art in NSW. It means the Aboriginal Procurement Policy, the SME and Regional Procurement Policy, modern slavery obligations, sustainability under the Government Resource Efficiency Policy, and faster payment terms for small business.", "It clears here through the instrument rather than through a campaign. The MICTA/ICTA framework carries compliance requirements for ICT accessibility, modern slavery and NSW Government SME and Aboriginal participation requirements as contractual terms — so in developing those agreements you were embedding responsible procurement obligations into enforceable contracts rather than asserting them in a policy statement.", "The programme shape reinforces it. Contracting 2,486 venues across metropolitan, regional and remote New South Wales is regional and small-business spend at scale. Printing and distributing 9,614,100 ballot papers and moving materials statewide sits squarely in the supply chain modern slavery obligations are aimed at.", "HOW TO SAY IT. Lead with the contract, not the policy: \"the ICT agreements we developed carried the accessibility, modern slavery and SME and Aboriginal participation obligations as contractual terms.\" A contractual obligation is enforceable; a policy commitment is aspiration. Saying which one you used tells a panel you understand the difference. If you can add a specific outcome — a supplier engaged, a participation target met, a due diligence step taken on the printing supply chain — the indicator moves from cleared to exceptional."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: H4 continuous improvement through evaluation of procurement outcomes and risk controls · H2 effective governance for procurement policies, processes and outcomes. Supporting: A1 · A2 · A3", "s": ["At the 2023 State general election, procurement decisions were being taken to the Program Steering Committee itself — a forum constituted for program governance and management control, with the Electoral Commissioner and senior executive in the room. It was not constituted to evaluate tenders, and every procurement that reached it displaced a decision only it could make.", "Going into the 2024 Local Government elections — a $150 million program with roughly $80 million of high-risk tenders and requests for quotation ahead of it, against a date fixed in statute — that was a governance failure positioned to repeat at greater scale."], "t": ["To determine how the program would go to market, on what basis, in what order and under whose authority, before the first tender was drafted rather than after the first dispute."], "a": ["I authored a program procurement strategy, and I began it with a tracker rather than a policy. Every procurement the program required was listed with its required-by date, the probity basis underpinning it, and the incumbent supplier where one existed. That single artefact converted procurement from a series of individual events into a portfolio with a critical path — and it made visible, a year out, which procurements had no slack.", "I then prioritised the tracker by risk to identify the high-risk procurements.", "[CONFIRM: the criteria you used to classify a procurement as high risk — value, probity exposure, schedule criticality, market depth]", "For those, I established a dedicated Procurement Steering Committee with a defined remit: approve tender documents for release to market, oversee evaluation and probity, make the selection, and recommend to the Program Steering Committee. Membership sat with the Chief Information Officer and Chief Operating Officer, meeting monthly.", "The design point is the separation of decision classes. Commercial decisions were resolved in a forum constituted to make them and reached the Program Steering Committee as recommendations rather than as debates. The Steering Committee kept its capacity for the decisions only it could take.", "Underneath the architecture sat the whole-of-government machinery: procurement conducted under the agency’s accreditation and the Public Works and Procurement Act framework, and ICT contracting on the mandated MICTA/ICTA framework rather than on bespoke terms. I wrote the programme procurement policies and the assurance underpinning them, so the framework was not something the programme complied with at the end — it was the structure the programme was built on."], "r": ["Roughly $80 million of high-risk procurement was supervised through a forum built for it, and the program delivered on time within its investment authority.", "The part that matters for this capability is where the design came from. It was not imported from a template — it came from evaluating how the previous election’s procurement had been governed and concluding that the control was in the wrong place. The delivery community had told us at kick-off that lessons from previous elections were never implemented. This was one that was."], "notes": ["§ Delivery notes", "• Lead with the diagnosis. \"The highest governing body in the program was being used as a tender panel\" tells a panel immediately that you understand what governance forums are for.", "• The tracker-before-strategy sequence is the sophisticated part. Most people write a policy. You built the portfolio view first and let the strategy follow the evidence.", "• Answer at the altitude you operated. If probed on evaluation weightings or reserve positions: \"I set the strategy, the risk prioritisation and the approval architecture; evaluation panels applied the criteria within it.\"", "• Probe — \"Was this yours or the CIO’s?\" → \"The forum was mine to design and stand up. The decisions inside it were theirs to make. That was the point — I did not want the program manager making commercial selections.\""], "probes": [], "keys": ["$150 million", "$80 million", "Program Steering Committee", "Electoral Commissioner", "Procurement Steering Committee", "Chief Information Officer"], "bul": []}, {"title": "STAR B — Advanced, extending to Highly advanced", "sub": "Primary indicators: A5 represent your organisation resolving complex or sensitive disputes with suppliers · A4 governance to monitor contractor performance against contracted deliverables. Supporting: A2 · H3", "s": ["The incumbent development vendor was not delivering against the agreed roadmap, and I had been in continuous engagement with them about non-performance for some time. Then they moved our implementation to a new team.", "That was the point at which the position became untenable. A missed milestone can be recovered. The unilateral removal of the people who understand the work, on an engagement already behind, against a date fixed in statute, cannot.", "[CONFIRM: which system or programme, and the consequence of continued slippage]"], "t": ["To restore delivery capacity without losing the knowledge the incumbent held, and without forfeiting the organisation’s contractual position if the relationship ultimately failed."], "a": ["I put them on notice directly, and before I went to market rather than after. I told them I was under pressure from the Steering Committee and that direction had been given to look elsewhere.", "I did that for two reasons. The first was procedural: you cannot fairly activate a non-performance clause against a supplier you never warned, and I wanted the organisation’s remedies intact and defensible if it came to that. A remedy you cannot defend is not a remedy. The second was practical: attributing the pressure to the governing body was both true and depersonalising. It invited them to fix the delivery rather than to defend themselves against me.", "I then ran a new tender and brought in an additional development partner, awarded scope across several Epics. I did not terminate the incumbent — removing them would have taken the delivered work and the institutional knowledge with it, and the calendar could not absorb re-acquisition. That rebalanced development across two partners and reduced the roadmap to what could credibly be delivered, at higher cost, which I put to the decision-makers as a trade-off rather than as a recommendation dressed up as one."], "r": ["Development load was balanced, the roadmap was reduced to something deliverable, and the cost increase was accepted with visibility of exactly what it bought. The incumbent was not surprised, the working relationship remained functional, and the organisation’s contractual position was preserved rather than spent.", "[CONFIRM: whether the reduced roadmap was delivered, whether the incumbent recovered, and whether non-performance clauses were ultimately activated]"], "notes": ["§ Delivery notes", "• The strongest element is preserving both the relationship and the remedy. Most people manage one — they stay friendly and lose their contractual position, or they go legal and lose the delivery. Say that you kept both live deliberately.", "• \"A remedy you cannot defend is not a remedy\" is the line to keep. It is contract management discipline expressed in one sentence.", "• The decision not to terminate is the judgement call. Anyone can remove a failing supplier. Reshaping the work around their capacity, against an immovable date, is the harder and cheaper choice.", "• Probe — \"Wasn’t warning them a commercial risk?\" → \"The larger risk was activating a clause I had never given them the chance to answer.\""], "probes": [], "keys": ["Steering Committee"], "bul": []}, {"title": "STAR C — Highly advanced", "sub": "Primary indicators: H1 whole-of-government approaches integrated into your organisation’s policies and practices · H5 champion responsible procurement aligned with government priorities and long-term public value. Supporting: A1 · A4", "s": ["The programme depended on roughly nineteen application systems, against $20 million of application development and $20 million of infrastructure. That estate had to be contracted, and NSW ICT procurement at high risk or above $1 million excluding GST must use the Master ICT Agreement and ICT Agreement framework — mandatory since 1 September 2021 under Procurement Board Direction PBD-2021-02, replacing Procure IT.", "The agreements were ICT’s deliverable. The consequence of getting them wrong was the programme’s, because a contract that does not define the deliverable precisely cannot be enforced against a date fixed in statute."], "t": ["To make sure the programme’s requirements were properly expressed in agreements I did not own."], "a": ["I worked on the development of several ICT Agreements with the agency’s legal function, external counsel at Gilbert + Tobin, the procurement practice lead and ICT stakeholders.", "[CONFIRM: roughly how many agreements, and what they covered]", "The programme’s interest in that room was narrow and specific. Under the ICTA structure the modules and the Order Form are where deliverables, service levels and remedies actually live, and a deliverable defined loosely at contract stage cannot be monitored later. My job was to make sure what the programme needed to be able to enforce was written down while it could still be written down.", "I was careful to keep the two accountabilities distinct. I did not take over ICT’s contract — it was theirs to deliver, and the Applications and ICT leadership held that authority. What I owned was the programme’s exposure to it.", "The framework itself did work that a separate initiative would have done less well. The MICTA/ICTA terms carry compliance requirements for ICT accessibility, modern slavery, and NSW Government requirements for supplier diversity through SME and Aboriginal participation. Contracting on the mandated framework rather than on bespoke terms meant those obligations were enforceable contract conditions rather than commitments in a policy document."], "r": ["The programme’s ICT estate was contracted on the mandated whole-of-government framework, with the programme’s deliverable definitions inside the agreements.", "The value of that showed later. When the incumbent development vendor did not perform, the position was defensible — the deliverables were defined, the shortfall could be documented against them, and the remedies were available and intact. A contract you helped write is a contract you can enforce."], "notes": ["§ Delivery notes", "• The accountability distinction is the sophisticated part. \"It was ICT’s deliverable and my programme’s consequence.\" That sentence shows a panel you understand matrix accountability rather than resenting it, and it is consistent with everything else you have said about functional directors holding authority.", "• Name the framework and the counsel. \"On the mandated MICTA/ICTA framework, with legal and Gilbert + Tobin.\" Precision here is what distinguishes someone who was in the room from someone who was told about it afterwards.", "• This STAR and the vendor STAR are a pair. The reason the non-performance position held is that the deliverables had been defined properly at contract stage. If you use both, say so explicitly — cause and consequence across two years is a stronger narrative than either alone.", "• Lead responsible procurement with the contract, not the policy. A contractual obligation is enforceable; a policy commitment is aspiration. Knowing which one you were using is the answer to H5."], "probes": [], "keys": ["$20 million", "$1 million", "Procurement Board Direction", "Order Form"], "bul": []}], "notes": [{"h": "Verdict", "body": []}, {"h": "A correction, and the finding that survives it", "body": ["An earlier version of this pack asked you to go and check whether your program had used the whole-of-government procurement machinery. That was the wrong question and it was put badly. All NSW agency procurement runs under the Public Works and Procurement Act 1912. Asking a Program Manager who authored the procurement strategy, policies, governance and assurance for an $80 million portfolio whether he had complied with the framework was not a reasonable question.", "What I should have asked, and what I actually needed, was narrower: which instruments, named, so they can be written down.", "The distinction matters beyond this pack. A compliance gap and a documentation gap look identical in a file and are entirely different things. I conflated them. What remains true is only the second one:", "You describe what you built and delivered. You do not narrate the frameworks you built it inside.", "In a private sector CV that instinct is right — outcomes carry, context is noise. In a NSW public sector executive application it inverts. Two candidates both say \"I ran an $80 million procurement.\" The one who says \"under the agency’s accreditation, with ICT contracts on the mandated MICTA/ICTA framework developed with external counsel\" is the one the panel believes, because the second sentence cannot be written by someone who was standing next to the work.", "THIS IS A CV-STRUCTURAL FINDING, NOT A CAPABILITY ONE. It applies to every role section we write. The NSWEC sections must carry the frameworks — legislative authority set, procurement policy framework, ICT contracting framework, assurance regime, funding pathway — alongside the outcomes, not instead of them."]}, {"h": "The framework layer — now confirmed, and it carries two indicators", "body": ["NSW procurement operates under the Public Works and Procurement Act 1912, which establishes the NSW Procurement Board and defines agency procurement obligations. Agencies procure under the terms of their accreditation by the Board, and the Board issues binding Procurement Board Directions.", "Inside that, you authored the LGE24 programme procurement strategy, policies, governance and assurance. That is four instruments, not one, and it is a materially stronger claim than the strategy alone.", "§ The ICT contracting layer", "NSW ICT procurement runs on the ICT Purchasing Framework, which replaced Procure IT and has been mandatory since 1 September 2021 under Procurement Board Direction PBD-2021-02, currently mandated under PBD-2025-03. It has two forms:", "• Core& — low-risk ICT purchases up to $1 million excluding GST, in Core& One and Core& Combined variants", "• MICTA / ICTA — Master ICT Agreement and ICT Agreement, for high-risk procurements or those above $1 million excluding GST. Consolidated to four modules and an Order Form, with additional Orders able to be placed under an ICTA to create a master agreement structure", "You were involved in developing several ICTAs, working with the agency’s legal function, external counsel at Gilbert + Tobin, the procurement practice lead and ICT stakeholders. The contracts were ICT’s deliverable; the programme accountability was yours.", "WHY THIS MATTERS MORE THAN IT LOOKS. The MICTA/ICTA framework carries compliance requirements for ICT accessibility, modern slavery, and NSW Government requirements for SME and Aboriginal participation as contractual terms. That means responsible procurement was not a separate initiative running alongside your contracts — it was inside the instrument you helped develop. That is how H5 clears, and it is a better answer than a policy initiative would have been, because a contractual obligation is enforceable and a policy commitment is not."]}, {"h": "Allocation — this capability collides with Influence and negotiate", "body": ["Both of this pack’s STARs already appear in the Influence and negotiate pack. They are the same two events, and they are the natural evidence for both capabilities. The two are rarely both focus capabilities. The rule:", "• Only one assessed → both stories go there", "• Both assessed → the procurement strategy and the vendor dispute belong HERE, because this is the capability they are literally named after. Influence and negotiate then leads on the ASX disclosure instance and, if it is free, the kick-off arc"]}, {"h": "Open items — in priority order", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "NSW Government Procurement Policy Framework, December 2024 — Public Works and Procurement Act 1912; NSW Procurement Board and Procurement Board Directions; agency accreditation; prequalification schemes; buy.nsw / NSW eTendering; Aboriginal Procurement Policy; SME and Regional Procurement Policy; modern slavery obligations; Government Resource Efficiency Policy; faster payment terms — info.buy.nsw.gov.au", "NSWEC LGE24 governance model — Procurement Steering Committee membership, cadence and remit — supplied.", "NSWEC LGE24 high-level critical path (A0, \"Contact: Naven Kumar\", as at 22 August 2023) — venue procurement, contingent labour procurement and contracts, ballot paper production — supplied.", "Candidate-supplied evidence, 14–16 August 2026."]}], "script": {"id": "pcm", "intro": ["The framework defines this capability as understanding and using procurement processes to ensure effective purchasing and contract performance. Listen to the second half. Purchasing is the front end. Contract performance is everything after signature, and that is where panels probe.", "At Advanced you are tested on whether the people around you follow procurement policy, whether risk shapes contract decisions, whether governance monitors suppliers after award, and whether you can front a hard dispute yourself. The difference from Adept is where compliance sits. At Adept you inspect it afterwards. At Advanced you design it into the sequence. Highly advanced asks whether whole-of-government approaches are integrated into how your organisation procures, and whether evaluation feeds back into changed controls.", "Two traps. The first is answering the whole capability with a procurement story and never reaching contract management after award. The second is describing what you built without naming the framework you built it inside. Two candidates both say they ran an $80 million procurement. The one who says it ran under the agency's accreditation, with ICT contracts on the mandated MICTA and ICTA framework, is the one the panel believes."], "standing": ["You clear Advanced on all five indicators, three of them exceptionally. You clear Highly advanced on all five as well, one exceptionally. That is a full pass at both levels. Claim this capability at Highly advanced and do not hedge it.", "One allocation point. Both STAR answers here also appear in your Influence and negotiate pack. They are the same two events. If only one of those capabilities is assessed, take both stories there. If both are assessed, the procurement strategy and the vendor dispute belong here."], "inds": {"A1": ["This reads like a compliance question. What a panel is listening for is whether you owned the instrument that made other people comply. You did not just ensure people followed the policies. You wrote them. The strategy, the policies, the governance and the assurance. Underneath them, the tracker recorded the probity basis of every procurement, and the Procurement Steering Committee approved tender documents before market release, with probity and policy compliance in its remit. Compliance was designed into the sequence, not inspected afterwards. So in the room, it sounds like this. \"I didn't just apply the programme's procurement policies. I authored them, with the governance and assurance that held them in place.\""], "A2": ["This asks whether risk actually shapes the decision. A panel will reject a risk register bolted onto the back of a submission. In your model, risk determined the governance route itself. The tracker was prioritised by risk, and that classification decided which procurements went to a dedicated Steering Committee and which did not. Risk was not an input to the paper. It was the routing rule. So in the room, it sounds like this. \"I prioritised the tracker by risk, and that classification decided which procurements went to a dedicated Steering Committee. Risk wasn't an input to the decision. It was what routed it.\""], "A3": ["Promoting effective risk management means standing machinery, not one good intervention. A panel wants a cadence and named seniority. The Procurement Steering Committee is the institutional form of it. Monthly, with the Chief Information Officer and the Chief Operating Officer, supervising the high-risk end of an $80 million procurement portfolio. Probity sat in its remit and its recommendations flowed to the Program Steering Committee. So in the room, it sounds like this. \"I stood up a monthly Procurement Steering Committee at Chief Information Officer and Chief Operating Officer level to supervise the high-risk end of an $80 million portfolio, with probity in its remit.\""], "A4": ["Read the verb carefully. This is contract management after award, not procurement before it. You have both halves. You helped develop the ICT agreements with legal and external counsel, and that is where contracted deliverables actually get defined. Then the monitoring. The incumbent development vendor, managed through continuous engagement on non-delivery to a documented position, and acted on when they moved the implementation to a new team.", "So in the room. \"I helped write the deliverable definitions into the agreements, then held the vendor against them.\" One thing would make it systematic. One well-managed vendor is a story, not an arrangement. If supplier performance also reported into a forum on a cadence against contracted deliverables with a defined escalation path, say so, and name it. The Technology, Scope and Risk forum, or the Project Leadership Forum."], "A5": ["Representing your organisation in a dispute means you were the face of it, not the person briefing the face of it. You identified this yourself. External representation was not yours for stakeholders or community, but for vendors it was. The instance is a good one, because you preserved two things most people trade off. The working relationship, and the organisation's contractual remedy. So in the room, it sounds like this. \"I put the vendor on notice myself, before I went to market rather than after, because a remedy you cannot defend is not a remedy. The relationship stayed functional and the contractual position stayed intact.\""], "H1": ["The word that carries this one is integrated. It is not asking whether you complied with whole-of-government frameworks. It is asking whether you made them part of how the organisation procures. You authored programme procurement policies and assurance under the Public Works and Procurement Act framework. The programme's ICT contracting ran on the mandated MICTA and ICTA framework, developed with the agency's legal function, external counsel and the procurement practice lead. That is whole-of-government machinery operationalised into a programme's working practice. So in the room. \"I didn't just comply with the frameworks. I wrote the policy and assurance layer that made them the way we procured.\""], "H2": ["This is governance over the procurement system itself. A panel will accept an architecture. It will not accept one well-run tender. You have four instruments, not one. A procurement strategy you authored. A tracker covering every procurement with its required-by date, probity basis and incumbent supplier. Risk prioritisation setting the governance route. And a Steering Committee chaired at Chief Information Officer and Chief Operating Officer level, with a remit running from tender document approval through evaluation, probity and selection to recommendation. So in the room. \"I authored the programme's procurement strategy, policies, governance and assurance, and built the forum architecture underneath them.\""], "H3": ["Two limbs here, and you are stronger on the first. Compliance monitoring sat with the Procurement Steering Committee, which carried probity and policy compliance in its remit and reviewed every high-risk procurement before market release. That limb is cleared and it is the one to lead with.", "Effectiveness is the second limb and it is thinner. H4 answers it indirectly, because you evaluated the previous cycle's arrangements and changed them. If there was also a post-election review of how the procurement approach performed at the 2024 Local Government elections, that closes the limb properly. If not, answer the compliance limb precisely and let the redesign story carry effectiveness. Do not claim a review you cannot name."], "H4": ["This is the cleanest instance in the capability. A panel wants evaluation turning into a changed control. Not a lessons-learned document. A control that moved. You evaluated how procurement had been governed at the previous election, identified that ICT had been taking procurements to the Program Steering Committee rather than running a project-level forum, and redesigned the control for the next cycle. Evaluation converted into a changed risk control, carried across an election boundary. So in the room. \"I evaluated how the previous election's procurement had been governed, found the control was in the wrong forum, and redesigned it before the next cycle went to market.\""], "H5": ["Responsible procurement is a term of art in New South Wales. It means the Aboriginal Procurement Policy, the SME and Regional Procurement Policy, modern slavery obligations, sustainability under the Government Resource Efficiency Policy, and faster payment terms for small business. It clears through the instrument, not a campaign. The MICTA and ICTA framework carries ICT accessibility, modern slavery and NSW Government SME and Aboriginal participation requirements as contractual terms. The scale reinforces that. 2,486 venues across metropolitan, regional and remote New South Wales, and 9,614,100 ballot papers.", "So lead with the contract, not the policy. \"The ICT agreements we developed carried the accessibility, modern slavery and SME and Aboriginal participation obligations as contractual terms.\" A contractual obligation is enforceable. A policy commitment is aspiration. One specific outcome, a supplier engaged or a participation target met, moves this to exceptional."]}, "stars": [["This one carries H4 and H2, with A1, A2 and A3 underneath. Lead with the diagnosis. The highest governing body in the program was being used as a tender panel. That sentence tells a panel you understand what governance forums are for, before you have described anything you did.", "The moment doing the real work is the sequence. You began with a tracker, not a policy, and made visible a year out which procurements had no slack. Answer at the altitude you operated at. If they probe on evaluation weightings, say you set the strategy, the risk prioritisation and the approval architecture, and evaluation panels applied the criteria within it. Confirm your high-risk classification criteria first."], ["This one carries A5 and A4, with A2 and H3 supporting. The strongest element is that you preserved both the relationship and the remedy. Most people manage one. They stay friendly and lose their contractual position, or they go legal and lose the delivery. Say you kept both live deliberately.", "The line to keep is this. A remedy you cannot defend is not a remedy. That is contract management discipline in one sentence. The other thing not to lose is the decision not to terminate. Anyone can remove a failing supplier. Reshaping the work around their capacity, against an immovable date, is the harder and cheaper choice. If they ask whether warning the vendor was a commercial risk, the larger risk was activating a clause you had never given them the chance to answer."], ["This one carries H1 and H5, with A1 and A4 supporting. The sophisticated part is the accountability distinction. It was ICT's deliverable and your programme's consequence. That shows a panel you understand matrix accountability rather than resenting it.", "Name the framework and name the counsel. On the mandated MICTA and ICTA framework, with legal and Gilbert and Tobin. Precision there separates someone who was in the room from someone who was told afterwards. This STAR and the vendor STAR are a pair. The non-performance position held because the deliverables had been defined properly at contract stage. If you use both, say so explicitly."]], "outro": ["Three things would lift this capability, none of which change the verdict. Confirm the criteria you used to classify a procurement as high risk. Find out whether a post-election review of the procurement approach exists, because that closes the effectiveness limb of H3. And find one concrete responsible procurement outcome, which takes H5 to exceptional. You clear both levels as it stands. The sentence you own here ends your ICT agreements story. A contract you helped write is a contract you can enforce."]}}, {"id": "pm", "name": "Project management", "group": "Business Enablers", "desc": "Understand and use effective ways to plan, coordinate and control projects", "verdict": [["Advanced", "7 of 7 cleared. Four exceptionally"], ["Highly advanced", "7 of 7 cleared. Six exceptionally"]], "adv": [{"c": "A1", "t": "Prepare and review project scope and business cases for projects with multiple interdependencies", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Both verbs, at both altitudes. Prepare: the business case taken through approval to a funding submission to NSW Treasury, then detailed scope planning across a top-down programme structure of thirteen aggregate projects and fourteen workstreams. Review: in the EPMO role you built the demand management and evidence-based business case service itself, which is the reviewing function rather than a reviewing instance.", "\"Multiple interdependencies\" is not a stretch here — it is the defining property of an election programme, where nineteen application systems, a workforce of 22,990 and 2,486 venues all have to arrive at the same Saturday."]}, {"c": "A2", "t": "Use key subject matter experts’ knowledge to inform project plans and directions", "v": "cle", "vt": "CLEARED", "body": ["Nine functional directors whose expertise you had no alternative but to rely on; ICT leadership through a weekly Technology, Scope and Risk forum; the agency’s legal function and external counsel on ICT agreements; and a new Applications Director whose judgement on delivery maturity you took over your own diagnosis."]}, {"c": "A3", "t": "Design and implement effective stakeholder communication strategies for all project stages", "v": "cle", "vt": "CLEARED", "body": ["The seven-forum governance model is the communication architecture, with the Elections PMO as secretariat to all of them — a single, consistent record across every stage of the lifecycle. Alongside it, a $10 million digital, marketing and communications workstream, and \"communications in market\" as a mandatory Gate 2 criterion rather than a reported activity."]}, {"c": "A4", "t": "Monitor project completion and implement effective and rigorous project evaluation methodologies to inform future planning", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Three layers, which is more than this indicator asks for. A consolidated Programme Management Plan retrospective at closure. A benefits framework carrying six benefits with formal achievement status. And an independently commissioned service evaluation across roughly 3,500 respondents.", "The \"inform future planning\" limb is answered by the Continuous Improvement Register transitioned to business as usual — and, more convincingly, by the Procurement Steering Committee, which exists because the previous election’s procurement governance was evaluated and found to be in the wrong place."]}, {"c": "A5", "t": "Develop strategies to correct projects if they vary from their plans", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The plan to green at SGE23 is the exemplar: a red programme inherited, a correction strategy developed and taken to the Steering Committee for approval rather than implemented and reported afterwards. Two further instances: the vendor re-tender that reshaped a failing delivery rather than terminating it, and the consolidated change request that removed a control burden without weakening the control."]}, {"c": "A6", "t": "Manage transitions between project stages and ensure any changes to projects are consistent with organisational goals", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["An eight-stage lifecycle — Initiation, Planning, Mobilisation, Pre-Election, Delivery, Postal and Count, Results, Closure — with investment authority released in stages against gates and delegated approvals, and a mandatory Gate 2 governing the transition into mobilisation on criteria that could be failed.", "The consistency limb is the change request pipeline: every change routed through EPMO review, Finance Business Partner and Chief Financial Officer approval before reaching the Programme Director, the Project Leadership Forum or the Steering Committee. A change cannot drift from organisational goals when the people who own those goals approve it before the decision forum sees it."]}, {"c": "A7", "t": "Participate in governance processes, such as project steering groups", "v": "cle", "vt": "CLEARED", "body": ["The lowest bar in the capability and you clear it several levels above. You did not participate in the governance processes — you designed them: seven forums with terms of reference defining membership and decision-making powers, with your PMO as secretariat to all seven. Clear this indicator in one sentence and move the evidence up to H1 where it earns more."]}], "ha": [{"c": "H7", "t": "Ensure project management decisions consider interdependencies between projects, programs and initiatives", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["This is where your strongest artefact does its work, and it has been sitting unused in the file.", "The high-level critical path for LGE24 is a single A0 sheet, dated 22 August 2023 — thirteen months before polling day — carrying your name as contact. It runs roughly twenty swimlanes across two financial years: programme, venues, standard operating procedures and manuals, staffing, training, logistics and infrastructure, nominations, ballot paper, rolls, business continuity, voting services, counting and results, helpdesk, non-voter — and a systems lane carrying roughly nineteen individual applications, each with its own user acceptance, security and performance test windows. Dependency linkages are drawn between lanes, and a single red line runs vertically through every one of them: election day, 14 September.", "That chart is the indicator rendered as an object. It does not describe interdependencies; it makes them decidable, thirteen months out, against a date that cannot move."]}, {"c": "H1", "t": "Ensure your organisation has systems and effective governance processes in place for project management", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["You did not contribute to the organisation’s project management system. You wrote it.", "The NSWEC Project Management Methodology runs three summary phases — Concept, Strategic Planning, Delivery — across nine detailed phases, with seven governance gates each carrying a mandatory EPMO Assurance Gate Report, and defined activity lanes for the EPMO, the Strategic Executive Committee, Project Steering Committees, project owners, Finance, project managers, change, information services and records management. Business case routes are named explicitly — internal lean, Treasury, or the Digital Restart Fund. Contracts are classified by value and risk profile and managed under a contract management framework with KPIs. Benefits realisation is a standing phase with a register and review dates carried into the Committee calendar. Every artefact lives in Project Hub and every review and approval runs through its RACI workflows.", "Around it sat the rest of the system: a P3O operating model, portfolio tooling deployed with adoption driven, a monthly Community of Practice, and a measured maturity uplift against P3M3.", "§ The durability proof, and it is unusually strong", "Three tests, all passed. The Community of Practice outlasted your tenure. The change request process you designed was still governing the programme you ran two roles later — you were subject to your own system.", "And the methodology itself is instantiated as gates in the agency’s live portfolio platform, still governing the 2027 State general election programme years after you left: projects carried in an enterprise portfolio, advancing through Feasibility Gate, Design and Planning Gate and Development and Preparation Gate, with artefacts, dependencies, financial management, registers, change impact and change requests as structural parts of the record.", "A methodology that is still running the next election two cycles later is not a document. It is the organisation’s operating system for delivery, and you wrote it."]}, {"c": "H5", "t": "Ensure your organisation manages project risks effectively and has strategies to respond when projects differ from their plans", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Risk was a condition inside the plan rather than a register beside it. Gate 2 could not be passed with any uncontrolled high or extreme risk. A weekly Programme Leadership forum governed risks and issues. The procurement tracker was risk-prioritised before a strategy was written. Business continuity plans were finalised and tested on the critical path. The programme closed with no high residual risks.", "And the response strategies are evidenced rather than asserted: a plan to green approved by a Steering Committee, a vendor re-tender, and a resilience capability stood up after event assurance did not achieve its posture."]}, {"c": "H3", "t": "Understand the broader context to inform project directions and mitigate risk", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your strategic planning work is the direct answer and it is better than a contextual awareness claim: working with senior executives on the Commission’s strategic plans and goals, with the Chief Financial Officer and the EPMO portfolio on portfolio priorities including organisational structure and funding needs, and with stakeholders on election regulatory priorities — then converting all three into programme strategy, structure, resourcing model and investment plan.", "Then the lived version. At SGE23 the Electoral Act was amended mid-programme to cut early voting from thirteen days to seven, against a $51.6 million gap between allocation and estimate. At LGE24 the Commissioner retired months before delivery with no funding uplift. Context did not inform those programmes from the outside; it changed underneath them twice."]}, {"c": "H4", "t": "Obtain key stakeholders’ commitment to major project strategies, including cross-organisational initiatives, and ensure ongoing communication", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The structural fact carries this indicator: eleven of the organisation’s twelve Band 1 executives reported into your programme for delivery, at a substantive grade above your own, and none of them reported to you. Commitment there could only be obtained, never required.", "Cross-organisational is evidenced too, and at more than one boundary: the Australian Electoral Commission for enrolment, Revenue NSW for penalty recovery, and 127 councils as autonomous customers each free to buy the service elsewhere."]}, {"c": "H6", "t": "Lead the changes needed to achieve the business benefits of the project", "v": "cle", "vt": "CLEARED", "body": ["A benefits framework carrying integrity, timeliness, participation and accessibility, operational efficiency, public trust and compliance, all recorded as achieved at closure, with lessons transitioned to business as usual through a Continuous Improvement Register.", "ONE NUANCE WORTH PRE-EMPTING. Benefits realisation in an election is unusual, because the benefit largely is the event — a lawful election delivered on time. If a panel probes for post-implementation benefit capture, do not manufacture it. Point instead to the changes you led that produced benefit beyond the event: the service catalogue, the complaint handling process, the resilience capability, and a Community of Practice that outlasted you. Those are benefits the next programme inherits."]}, {"c": "H2", "t": "Make decisions to accept projects based on business cases", "v": "cle", "vt": "CLEARED", "body": ["I had this as the one gap in the capability. The methodology you wrote settles it, and so does the role you held while running it.", "The NPMM makes concept and business case assessment an EPMO function with a named decision chain. At 1.3, EPMO Assessment and Prioritisation: submissions come into the EPMO through Project Hub, are reviewed for completeness, and are PRIORITISED FOR STRATEGIC ALIGNMENT, with EPMO comments appended to the Concept Brief before anything is scheduled to the Strategic Executive Committee. At 2.6, EPMO Gate Assessment: business case assurance is completed, EPMO comments are appended to the business case, and Finance is engaged on the economic, financial and cost benefit analysis. The Committee then approves or rejects at 1.4 and 2.7.", "So the formal vote sat with the Committee — and the assessment, the prioritisation and the business case assurance on which that vote rested sat with the EPMO. As interim EPMO Director you held that function through a full business planning cycle at concept stage. You also rejected change requests, which under your own methodology run through the same hub and the same discipline.", "HOW TO SAY IT WITHOUT OVERCLAIMING. \"The Strategic Executive Committee held the approve-or-reject vote. The assessment, the strategic alignment prioritisation and the business case assurance it voted on were the EPMO’s, and as interim EPMO Director I held that through a business planning cycle. I rejected change requests in my own right.\" That is accurate, it is stronger than claiming the vote, and it is consistent with every other boundary you have drawn in this campaign."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: H7 project management decisions consider interdependencies between projects, programs and initiatives · A1 prepare project scope for projects with multiple interdependencies · A6 manage transitions between stages", "s": ["The 2024 Local Government elections had to be held on Saturday 14 September 2024. Everything the programme produced was consumed on that one day, in public, at full load, with no opportunity to remediate and no possibility of moving the date.", "Reaching it required thirteen aggregate projects and fourteen workstreams to converge simultaneously: 2,486 venues contracted and accessible, 22,990 temporary staff recruited and trained, 9,614,100 ballot papers printed and distributed, rolls closed and composite rolls produced, nominations opened and closed, and roughly nineteen application systems configured, tested for security and performance, and live — each of them depending on several of the others."], "t": ["To make the interdependencies decidable early enough to act on, rather than discoverable late enough to be fatal."], "a": ["I built a single high-level critical path across the whole programme and published it thirteen months before polling day.", "It ran roughly twenty swimlanes across two financial years — programme, venues, standard operating procedures and manuals, staffing, training, logistics and infrastructure, nominations, ballot paper, rolls, business continuity, voting services, counting and results, helpdesk and non-voter — with a systems lane carrying each application individually, scheduled through its own user acceptance, security and performance test windows.", "Two design decisions mattered. First, the dependencies were drawn between lanes rather than described in a register, so the consequence of any single slippage was visible as a line reaching a date. Second, everything was sequenced backwards from statutory milestones that could not move — close of rolls, close of nominations, the ballot paper draw, election day — so the plan was anchored to the law rather than to the effort available.", "It was one A0 sheet. That was deliberate. A plan that has to be assembled from twenty documents cannot be reasoned about in a room by people who did not write it, and eleven of the twelve executives whose functions it governed did not report to me.", "[CONFIRM: how the critical path was maintained and re-baselined through the programme, and how often]"], "r": ["The programme delivered on time and within its $150 million investment authority, with no high residual risks at closure and all benefits recorded as achieved.", "The critical path is also the reason Gate 2 could be a real decision rather than a formality. Mandatory mobilisation criteria — venues 100% contracted and accessible, workforce at or above 85% filled with training commenced, ballots certified and in production, systems configured and end-to-end tested — are only enforceable if you know, months in advance, what has to be true by when. The chart is what made those criteria answerable."], "notes": ["§ Delivery notes", "• This is the artefact to take to interview if the format permits one. It is dated, it carries your name, it was produced thirteen months out, and it evidences planning at a scale no verbal answer conveys. Very few candidates can put a physical object on the table that proves the claim.", "• \"Anchored to the law rather than to the effort available\" is the line to keep. Backward scheduling from statutory milestones is the whole discipline of election delivery in one phrase.", "• The one-sheet decision is worth explaining. A plan that cannot be reasoned about in a room by people who did not write it is not a planning instrument, it is an archive.", "• Probe — \"What happened when something on it slipped?\" have one specific instance ready. The credibility of a critical path rests on it having been used to make a decision, not on its existence."], "probes": [], "keys": ["$150 million", "2,486", "22,990", "9,614,100"], "bul": []}, {"title": "STAR B — Highly advanced", "sub": "Primary indicator: H1 ensure your organisation has systems and effective governance processes in place for project management. Supporting: A4 · A7 · H5", "s": ["I joined the NSW Electoral Commission in October 2019 as Senior Manager, EPMO – Transformation. The agency delivers its entire product in concentrated events on a fixed multi-year cycle and cannot afford a failed election — and its delivery function sat at the lowest levels of portfolio, programme and project management maturity. Practice was inconsistent, the standards the EPMO published were received as compliance rather than help, and the function had no defensible account of what it was for."], "t": ["To give the organisation a project management system that would still be there after I left, because a maturity uplift that depends on one person is not a maturity uplift."], "a": ["I began with a P3M3 assessment rather than a template, so the design answered measured deficits across portfolio, programme and project disciplines rather than importing someone else’s model.", "The reframing was the important move. Rather than defining the EPMO by the standards it published, I defined it as a catalogue of services — each with a named consumer, a defined offer and a performance expectation. A standards body imposes; a service function is accountable to the people who consume it and can be told when the service is poor.", "Around that I built the operating model: a P3O structure, portfolio management tooling deployed across the delivery population with adoption driven rather than assumed, an assurance regime with gates and embedded reporting through delivery, a change request pipeline routing every proposal through EPMO review and Finance and Chief Financial Officer approval before any decision forum saw it, and a monthly Community of Practice — topic-led rather than status-led, open to anyone interested rather than restricted by role.", "And I wrote the methodology itself — three summary phases, nine detailed phases, seven governance gates each carrying a mandatory EPMO assurance report, with defined activity lanes for the EPMO, the Strategic Executive Committee, steering committees, project owners, Finance, project managers, change, information services and records management. Concept assessment and strategic alignment prioritisation sat with the EPMO; approve-or-reject sat with the Committee. Business case routes were named — internal lean, Treasury, or the Digital Restart Fund — so the funding pathway was a decision made at concept stage rather than discovered later.", "[CONFIRM: the portfolio platform name — the CV currently says \"Planview/Clarity\", which names two different vendors’ products, and the live system appears to be a Dataverse-based PPM platform. Also the measurement basis for the adoption figure, and the honest P3M3 start and end levels in P3M3’s own labels: Aware, Repeatable, Defined, Managed, Optimised. Do not mix in CMMI terminology]"], "r": ["Delivery maturity was lifted measurably against the P3M3 scale, and the system outlasted me on three counts. The Community of Practice was still running after I left the role. The change request process I designed was still governing the election programme I ran two roles later — I was subject to my own system and had to live with how well I had built it. And the methodology was later assessed by an external institution, in an unrelated sector, as the reference implementation of its own delivery model.", "The test of a project management system is not whether it works while its author is there. It is whether it constrains them afterwards."], "notes": ["ALLOCATION WARNING. This is the same material as STAR A in the Think and solve problems pack, framed differently — there it is diagnosis and lateral reframing, here it is the institution of a project management system. This capability is its more natural home. If both are assessed, keep it here and let Think and solve problems lead on the delivery maturity analysis.", "§ Delivery notes", "• Lead with the diagnosis, not the model. \"I started with a maturity assessment rather than a template\" is what separates this from every candidate who has stood up a PMO.", "• The service catalogue reframe is your one genuine claim to originality in this capability. Make it explicitly, then let the external validation carry it.", "• Fix the P3M3 labels before this goes anywhere. \"Quantitative\" is CMMI Level 4, not P3M3. Mixing the two in front of an EPMO panel is fatal, and a three-level jump in thirty-one months will be challenged."], "probes": [], "keys": ["Senior Manager", "Chief Financial Officer", "Strategic Executive Committee", "Digital Restart Fund"], "bul": []}], "notes": [{"h": "Verdict", "body": ["This is your discipline, and it is now the strongest capability in your file. It is also the pack that surfaced a role you had never mentioned."]}, {"h": "The role that had never appeared", "body": ["You served as INTERIM EPMO DIRECTOR at the NSW Electoral Commission in 2021, for six months, taking the organisation through its business planning cycle.", "Across fourteen capability packs and thirty-two STARs, that had not once been mentioned. It matters more than anything else in this pack, and not because of this capability.", "Every application you make will face an unspoken question: has this person operated at Director level in the NSW public sector, or is this a step up? Until today the file answered \"close, but no\" — Senior Manager, then Program Manager. An interim Director appointment answers it outright, and it answers it inside the sector, at the agency, in the function you are targeting.", "IT BELONGS IN THREE PLACES. The CV positioning statement. The NSWEC role section, as a distinct entry rather than a footnote. And any answer where a panel is probing whether you can operate at the level. Do not bury it in a sentence about the EPMO Transformation role — it is a separate appointment and should read as one.", "CONFIRM BEFORE IT GOES ANYWHERE: the exact months, whether it was a formal acting or relieving arrangement with a determination, the substantive grade of the EPMO Director role, who you reported to, and the size of the function you held. A referee check will test all five, and \"interim Director\" is precisely the kind of claim a panel verifies."]}, {"h": "The trap: do not answer this capability as a project manager", "body": ["At Advanced, this capability asks whether you run projects well. At Highly advanced it asks something different — whether the ORGANISATION has systems and governance for project management, whether IT manages risk effectively, whether ITS decisions account for interdependencies. Read the Highly advanced column again and notice how many indicators begin with \"Ensure your organisation\".", "Most candidates from a delivery background answer both columns with delivery stories and are marked at Advanced. You have a clean separation available and you should use it deliberately:", "You also have something almost no candidate has: you have taught this discipline at postgraduate level for eight years — PMGT5850, PMGT3850 and PMGT3851 at the University of Sydney — while practising it. Say it once. It changes how a panel hears everything else in this capability."]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "NSWEC LGE24 high-level critical path (A0, \"Contact: Naven Kumar\", as at 22 August 2023) — supplied.", "NSWEC LGE24 Program Management Plan retrospective (OFFICIAL–Sensitive) and programme governance model — supplied.", "NSW Electoral Commission, 2024 NSW Local Government elections report — elections.nsw.gov.au", "ACU Delivery Optimisation brief (Position 10613501, HEW 9) — R1–R9 EPMO service catalogue.", "Candidate-supplied evidence, 14–16 August 2026."]}], "script": {"id": "pm", "intro": ["This capability is about effective ways to plan, coordinate and control projects. That is the framework's own definition, and it is deceptively flat. At Adept a panel wants to know you can run a project to time, cost and quality. Advanced asks for more. Scope and business cases for work with multiple interdependencies, rigorous evaluation, and correction strategies for when the plan and reality part company.", "Highly advanced asks a different question, and this is the trap. Read that column again and notice how many indicators begin with ensure your organisation. Whether the organisation has systems and governance for project management. Whether it manages risk. Whether its decisions account for interdependencies. Most candidates from a delivery background answer both columns with delivery stories, and they get marked at Advanced.", "You have a clean separation available, so use it deliberately. Advanced gets the programme you ran. Highly advanced gets the system you built and the organisation still running on it. And you have something almost no candidate has. You have taught this discipline at postgraduate level for eight years, PMGT5850, PMGT3850 and PMGT3851 at the University of Sydney, while practising it. Say it once."], "standing": ["This is your discipline, and it is now the strongest capability in your file. Advanced is seven of seven cleared, four of them exceptionally. Highly advanced is seven of seven as well, with six marked exceptional. There is nothing to hold in reserve. Claim this one at Highly advanced and let it lead.", "This pack also surfaced a role that had never appeared anywhere in your file. You were interim EPMO Director at the NSW Electoral Commission in 2021, for six months, taking the organisation through its business planning cycle. That answers the unspoken question behind every application you make, which is whether you have operated at Director level in the NSW public sector. Confirm the detail before it goes anywhere, because that is exactly the kind of claim a panel verifies."], "inds": {"A1": ["Two verbs, and a panel checks both. Prepare, and review. Reviewing means sitting on the other side of the desk. You took a business case through approval to a funding submission to NSW Treasury, then scoped thirteen aggregate projects and fourteen workstreams. In the EPMO you built the demand management and evidence-based business case service itself, which is the reviewing function rather than one instance of it. Multiple interdependencies is no stretch here. Nineteen application systems, a workforce of 22,990 and 2,486 venues all had to arrive at the same Saturday. So in the room, it sounds like this. I scoped and made the case for thirteen projects and fourteen workstreams, and I built the service that reviews everybody else's."], "A2": ["Panels reject I consulted widely. They accept a named expert and a decision their knowledge changed. You have four. Nine functional directors you had no alternative but to rely on. ICT leadership through a weekly Technology, Scope and Risk forum. The legal function and external counsel on ICT agreements. And a new Applications Director whose judgement on delivery maturity you took over your own diagnosis. That last one is strongest, because deferring to an expert against yourself cannot be faked. So in the room, it sounds like this. When my new Applications Director read delivery maturity differently from my own diagnosis, I took her judgement over mine."], "A3": ["Communication strategy here means architecture across all stages, not a stakeholder map and a newsletter. Your seven-forum governance model is that architecture, with the Elections PMO as secretariat to all seven, giving one consistent record across the lifecycle. Alongside it sat a $10 million digital, marketing and communications workstream. And communications in market was a mandatory Gate 2 criterion, not an activity someone reported on. Use that, because it made communication something the programme could fail on. So in the room, it sounds like this. Communications in market was not a status line in my programme, it was a gate criterion we could have failed."], "A4": ["The limb candidates miss is inform future planning, which needs a decision that changed because of an evaluation. You have three layers. A consolidated Programme Management Plan retrospective at closure. A benefits framework carrying six benefits with formal achievement status. And an independently commissioned service evaluation across roughly 3,500 respondents. The Continuous Improvement Register then transitioned to business as usual. More convincing still, the Procurement Steering Committee exists because the previous election's procurement governance was evaluated and found to be in the wrong place. So in the room, it sounds like this. The Procurement Steering Committee exists because we evaluated the last election and found procurement governance sitting in the wrong place."], "A5": ["This asks for correction strategies, not heroics. What a panel listens for is whether the strategy was approved, or improvised and reported afterwards. Your exemplar is the plan to green at SGE23. You inherited a red programme, developed the correction strategy, and took it to the Steering Committee for approval before implementing it. Two more instances back it. The vendor re-tender that reshaped a failing delivery rather than terminating it, and the consolidated change request that removed a control burden without weakening the control. So in the room, it sounds like this. I inherited a red programme, and I took the plan to green to the Steering Committee for approval rather than fixing it quietly and telling them after."], "A6": ["Two limbs. Transitions between stages, and changes staying consistent with organisational goals. Your lifecycle has eight stages, from Initiation and Planning through Mobilisation, Pre-Election, Delivery, Postal and Count, Results and Closure, with investment authority released in stages against gates, and a mandatory Gate 2 on criteria that could be failed. The consistency limb is the change request pipeline. Every change ran through EPMO review, the Finance Business Partner and the Chief Financial Officer before it reached the Programme Director or the Steering Committee. So in the room, it sounds like this. Nothing reached a decision forum until Finance and the Chief Financial Officer had signed it, so no change could drift from the organisation's goals."], "A7": ["This is the lowest bar in the capability, and you clear it several levels above. You did not participate in the governance processes, you designed them. Seven forums, each with terms of reference defining membership and decision-making powers, and your PMO as secretariat to all sev
