very framework served them, the framework was the risk."], "a": ["I dedicated a Project Managers Forum to the issues and chaired it, with the EPMO and the PM Practice Lead present.", "[CONFIRM: number of project managers in the forum]", "I noticed early that I was defending my own processes. Some of the criticism I had seen coming; a good deal of it I had not. I minuted every concern as it was raised rather than as I would have preferred it to read, and I made methodology decisions in the room where teams needed direction to move rather than deferring them to a paper.", "The substance of the criticism was fair. An EPMO that changes the engine mid-flight while imposing change control on everyone else does not practise what it preaches, and that is what had happened.", "I escalated the full record — concerns, decisions, actions and escalations — to the Project Leadership Team, and I proposed a structural response rather than a remediation list: the Elections PMO and the EPMO would jointly develop a service catalogue, defining the function as an offer with a named consumer and a performance expectation for each service, with a standing commitment that stakeholders are engaged before any change to it.", "I then championed and built a consolidated complaint handling process. Complaints were arriving through several disconnected funnels with no triage, which meant nobody could tell a service issue from a conduct issue from a potential integrity event. I established single intake, triage, routing to the accountable area, and monitoring through to closure.", "[CONFIRM: prior state — how many intake points; built before or during the event; whether it transitioned to BAU; any volume or resolution-time figure]"], "r": ["The program mobilised with a delivery framework its own users had helped define, and delivered on time and within the $150 million authority.", "The service was subsequently evaluated by an independent research house across approximately 3,500 respondents. Among political participants, satisfaction with the fairness and impartiality of the election rose to 70% from 48% at the previous local government elections, trust to 76% from 56%, and overall satisfaction to 57% from 41%. Among the dissatisfied minority, unresponsiveness to complaints accounted for 3% — complaint handling did not register as a material driver of dissatisfaction, which is the evidence a working triage process produces.", "The criticism at kick-off was that we did not implement lessons. The answer was an independently measured result showing that we did."], "notes": ["§ Delivery notes", "• Length: ~520 words. For a 300-word limit, cut the \"engine mid-flight\" paragraph and the complaint-process detail, and reduce the Result to the three political participant figures plus the complaint line.", "• Do not cut: the sentence where you notice yourself defending your own processes. It is the most persuasive line in the answer and almost no candidate offers one.", "• Probe — \"Weren’t you defending your own work?\" → \"I was, and I could feel it. That’s why I minuted every concern verbatim instead of summarising it. If I’d summarised it, I’d have softened it.\"", "• Probe — \"Did the service catalogue actually get built?\" answer plainly either way. If it was partially built, say so — a candidate who reports a partial structural outcome honestly outranks one who claims a complete one."], "probes": [], "keys": ["$150 million", "5.24 million", "23,000", "3,500", "Program Manager", "Senior Manager", "Project Managers Forum", "Practice Lead"], "bul": []}, {"title": "STAR B — Highly advanced", "sub": "Primary indicators: H4 management systems support service delivery outcomes for diverse customers · H1 culture that values insights from customers and communities · H5 set service standards and monitor compliance · H3 strategic planning prioritises customer experience", "s": ["The NSW Electoral Commission’s stated priority goal is to maintain trust and confidence in the electoral system, with particular attention to inclusion and accessibility for audiences who face additional barriers to participating in democracy.", "For the 2024 Local Government elections I was accountable for delivering that service across 2,486 voting venues, six voting channels and 5.24 million electors, with a temporary workforce of almost 23,000 people trained to deliver it consistently.", "Voting is compulsory. That changes the nature of the customer relationship: an elector who cannot access the service is not a lost customer, they are disenfranchised — and then fined. The customer services function reporting to me through a functional director covered that entire lifecycle: the call centres and IVR, the enrolment interface with the Australian Electoral Commission, the roll products used to mark electors off, and the non-voting, penalty and debt recovery chain with Revenue NSW."], "t": ["To ensure the service worked for the customers most likely to be failed by it — and to know whether it had, rather than assume it."], "a": ["I made accessibility a condition of mobilisation rather than a measure of performance. The program’s mandatory Gate 2 criteria required that venues be 100% contracted and accessible, alongside workforce and systems readiness and no uncontrolled high or extreme risks. A venue that was not accessible did not fail a report — it stopped the gate.", "I maintained the full channel set behind that standard: election day attendance, early voting, postal, declared institution voting, telephone assisted voting for blind and low vision electors, braille ballot papers, accessible voting screens, magnifiers and maxi pens, contrast-marked ballot boxes, translating and interpreting services, and the National Relay Service.", "I championed the development of Election Operations Reporting during the event so that the operational command structure could see service performance while it could still act on it.", "[CONFIRM: what it reported, to whom, at what cadence]", "Most significantly, I commissioned an independent evaluation of the service rather than relying on our own account of it. It covered approximately 3,500 survey respondents across six instruments, including in-language telephone interviews in Arabic, Cantonese, Mandarin, Hindi and Vietnamese with respondents who did not speak English well, and around 90 qualitative interviews — 20 with people living with disability, 20 with telephone voters, five youth groups, and 20 face-to-face interviews with First Nations electors conducted by a First Nations interviewer."], "r": ["Nearly half of electors — 46% — received assistance at a voting centre. Of those, 95% were satisfied and 76% very satisfied. Ease of voting was 90%, satisfaction with time spent at the centre 86%, and overall satisfaction with the in-person experience 88%, with 5% dissatisfied. Average queue time was 4.3 minutes at early voting and 6.0 minutes on election day.", "On-time delivery of postal vote packs improved to 91%, from 79% at the previous election I ran, on postal volume up 50%. That mattered: 87% of postal voters said they would have had difficulty voting otherwise, and 41% could not have voted at all.", "I reported the declines as well. Perceptions of the election being conducted fairly and impartially fell to 76% from 82%, and in-person trust to 80% from 90%. The distinction I drew for the executive is the one I would draw again: perception of the institution softened, while every service delivery measure held or improved, and the dissatisfaction drivers the research identified — not knowing who to vote for, and the absence of accessible candidate information — sat outside the Commission’s service to deliver.", "I did not personally serve a single elector; the functional directors and their teams did. What I did was make accessibility a condition nobody could pass without meeting, and make the service measurable by people I did not control."], "notes": ["§ Delivery notes", "• Length: ~600 words. For 300, cut the channel list to three examples, drop the queue times, and keep the Gate 2 standard, the commissioned evaluation with its First Nations and in-language design, the 95% assistance figure, the postal 79→91%, the honest reporting of declines, and the final two sentences.", "• Never cut: the last paragraph. It answers the question every panel asks a program director about frontline outcomes, and answering it before they ask is what makes the rest credible.", "• Probe — \"What did you personally do for electors with disability?\" → \"I made venue accessibility a gate criterion, so the program could not mobilise past it, and I commissioned research that interviewed twenty people living with disability about whether it worked. I didn’t design the ramp. I made ‘no ramp’ stop a $150 million mobilisation.\"", "• Probe — \"Trust went down on your watch.\" → \"It did, and I put that in front of the executive rather than leading with the numbers that went up. Trust in the institution moved with a national pattern in a year when four billion people voted, and the previous benchmark was set under COVID conditions. What I’m accountable for is the service, and the service measures — ease, waiting time, assistance, on-time postal delivery — held or improved on higher volume.\""], "probes": [], "keys": ["2,486", "5.24 million", "23,000", "3,500", "Australian Electoral Commission", "National Relay Service", "Election Operations Reporting", "First Nations"], "bul": []}], "notes": [{"h": "Verdict", "body": ["This is now your strongest capability of the four benchmarked — stronger than Display resilience and courage, stronger than Act with integrity. You gave it six short answers because you assumed it was a weak one. The reason it is not: this is the only capability where an independent party measured your service and recorded the result."]}, {"h": "The trap in this capability — read first", "body": ["This is the capability most likely to sink a PMO or EPMO candidate, and it sinks them in one of two ways.", "Failure mode one — the internal-only answer. The candidate writes about stakeholders, sponsors and delivery teams. The panel reads: this person has forgotten who the public sector is for. Fatal at Director level, and common, because PMO people genuinely do serve internal consumers all day.", "Failure mode two — the borrowed-outcome answer. The candidate writes about the citizens their program served, and the panel asks what they personally did — at which point the honest answer is that the frontline service was delivered by functional directors. Your own position is the correct one: a Program Manager creates a temporary organisation and manages it; the functional directors and executives hold the authority. That discipline constrains what you can claim.", "The resolution — build the entire answer around this sentence:", "You did not serve the elector directly. You built and ran the machine that made the service to the elector deliverable, measurable, and gated on accessibility.", "The proof artefact already exists in your program. Your Gate 2 mobilisation criteria made \"venues 100% contracted and accessible\" a mandatory condition. You did not install the ramp. You made \"no ramp\" a condition that stops a $150 million mobilisation. That is the difference between claiming an outcome and owning a control."]}, {"h": "The two-tier customer model", "body": ["The framework itself authorises this at Foundational level: \"Recognise that customer service involves both external and internal customers.\" Running both tiers is what separates an Advanced answer from a Highly advanced one. Sequencing rule: open on the elector, spend the body on what you built, close on the elector. Open on the PMO and you have lost the panel in the first sentence.", "§ Tier 1 — the elector and the council (external)", "§ Tier 2 — the delivery community (internal)", "One observation to use deliberately: the elector lifecycle you owned crossed jurisdictions. Enrolment sits with a Commonwealth agency; debt recovery sits with Revenue NSW. And it includes the hard half of customer service — serving the customer you are penalising. Compulsory voting means your customer cannot leave and can be fined. Saying you owned the enquiry channel and the penalty chain, and built the complaint pathway across both, is far more sophisticated than \"we ran a call centre\"."]}, {"h": "The evidence base — the commissioned evaluation", "body": ["Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025, 292pp.", "The findings are good. The commissioning is what clears Highly advanced. Most executives claim customer focus by describing what they built. You put program budget into an external research house evaluating whether the service worked — surveyed by people who did not report to you, in a form you could not edit, with cohorts chosen to reach those most likely to be missed.", "Point at the First Nations interviewer decision. Commissioning a First Nations interviewer for First Nations respondents is a methodological choice with a cost attached, made so the answers would be true rather than polite. The research then surfaced findings uncomfortable for the organisation — perceived tokenism, a reported experience of racism in past election employment, distrust of government — and they are in the report rather than out of it. That is Highly advanced indicator H1 verbatim: listening to and valuing insights from customers and communities."]}, {"h": "The numbers to use", "body": ["§ Service delivery", "§ Accessibility — your single best number", "46% of electors received assistance at a voting centre. Of those, 95% were satisfied — 76% very satisfied.", "Nearly half your customers needed help, and virtually all of them got help that worked. For a capability asking about service to diverse customers, that is a better answer than any list of channels.", "§ Postal — the operational proof", "Read the first two rows together. This is the sentence that wins the capability:", "Demand for the postal channel rose by half, and on-time delivery improved by twelve points — from 79% at the election I ran in 2023 to 91% at the election I ran in 2024.", "Volume up, service up. Same program manager, consecutive programs, measured externally both times. Not a claim about intent — a measured improvement in a service where failure means an elector is disenfranchised.", "§ Political participants — the largest movement in the report", "Scrutineers: 88% satisfied, 89% fair and impartial, 91% trusted the process.", "ATTRIBUTION DISCIPLINE. LGE21 was not your program. LGE24 was. Do not say you personally caused twenty-two points — a panel will test it and you will lose the room. Say instead: \"The program I ran was the delivery vehicle for the service these participants were rating, and the independent evaluation recorded these movements against the previous cycle.\" You own the system; the research owns the number.", "§ Complaints — your process, externally validated", "Among the 28% of political participants who were dissatisfied (n=115), \"NSWEC was unresponsive to complaints\" accounted for 3% — roughly 0.8% of all political participants. Complaint responsiveness did not register as a material driver of dissatisfaction.", "That is exactly what a working triage-and-routing system looks like in survey data: it does not produce praise, it produces absence from the complaint list. Say it that way — it is a sophisticated read and it shows you understand what evidence of a control looks like.", "One honest caveat carried in the report: \"Increasing transparency with regards to complaints from political participants would aid in building confidence.\" That is a transparency ask, not a responsiveness failure. Name it yourself as the next improvement rather than let a panel find it."]}, {"h": "The two things you must handle honestly", "body": ["§ 1. Some elector metrics went down", "Do not hide this — presenting it is what makes everything else believable. The reading to give:", "Perception and trust metrics softened. Service delivery metrics held or improved.", "The report’s own analysis supports you. Dissatisfaction was driven by not knowing who to vote for, insufficient candidate information and lack of candidate advertising — none of which are the Commission’s service to deliver. Meanwhile ease (90%), time at the centre (86%), assistance (95%) and postal on-time delivery (91%) all held or rose. The report also names its own context: LGE21 was COVID-affected, and 2024 was a year in which four billion people voted globally, with attendant election fatigue.", "A candidate who separates perception of the institution from performance of the service, and reports both, is doing the thing this framework calls Advanced judgement — and quietly demonstrating Act with integrity inside a customer service answer.", "§ 2. Council satisfaction is not in the report", "All six research cohorts are electors and political participants. Councils were not surveyed. The 125-of-127 figure stands as a retention statistic in a contestable market, which is strong on its own — but do not describe it as measured satisfaction. If council feedback was captured through a debrief or the client relationship rather than research, it needs to be evidenced separately."]}, {"h": "Deliberately excluded", "body": []}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025, 292pp (supplied).", "NSW Electoral Commission, 2024 NSW Local Government elections report to Parliament, Part 2 — elections.nsw.gov.au", "NSW Electoral Commission — Diversity and inclusion; Assistance for voters with disability; Telephone voting — elections.nsw.gov.au", "NSWEC LGE24 Program Management Plan retrospective (OFFICIAL–Sensitive) and program governance model — supplied.", "NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner."]}], "script": {"id": "ccs", "intro": ["The definition is one line. Provide customer-focused services in line with public sector and organisational objectives. It sounds soft. It is the capability most likely to sink a PMO or enterprise PMO candidate.", "At Adept a panel accepts that you looked after your stakeholders. Advanced wants the service defined with the customer in the room, feedback collected through a system rather than a conversation, and partnerships across the public, private and community sectors. Highly advanced asks what you set, monitored and embedded. Organisation-wide service standards. Management systems that work for diverse customers. Customer experience inside the planning instrument, not reported alongside it.", "Two ways candidates lose it. The internal-only answer, all sponsors and delivery teams, where the panel hears someone who has forgotten who the public sector is for. And the borrowed outcome, where you claim the citizens your program served and the panel asks what you personally did. Your own position is the correct one. A Program Manager creates a temporary organisation and manages it, and the functional directors hold the authority. So build everything around one sentence. You did not serve the elector directly. You built and ran the machine that made the service to the elector deliverable, measurable and gated on accessibility."], "standing": ["You clear Advanced on all seven indicators, four of them marked cleared exceptionally. At Highly advanced you clear all five, two exceptionally. H1 clears outright on the commissioned evaluation. H3 clears on the agency's own stated priority goal.", "So claim this one at Highly advanced. Do not hold it in reserve. It is your strongest capability of the four benchmarked, and you gave it six short answers because you assumed it was weak. This is the only capability where an independent party measured your service and recorded the result."], "inds": {"A1": ["A1 wants an inclusive, customer-focused culture and new ways of working. A panel rejects a values statement and accepts a change in how the work is organised. Your kick-off arc fits exactly, and it is minuted. Complaints that lessons were never implemented, an executive challenge to hear them, a dedicated Project Managers Forum, then a structural change to how the service is defined. The new way of working is the service catalogue itself. The inclusion evidence is the forum's charter, which named psychological safety as a standing item. So in the room, it sounds like this. I was told to listen, and I came back with a change to how the function defines itself rather than a list of fixes."], "A2": ["A2 wants systems that collect customer feedback and use it. The test is the second half. Anyone can collect. The complaint was that feedback was collected and never implemented, and you did not apologise for the backlog. You built the mechanism that makes implementation traceable. The fortnightly Project Managers Forum as a standing collection point. The Continuous Improvement Register, transitioned to business as usual at closure. And a commissioned external evaluation whose objectives included identifying opportunities for service improvement. So in the room, it sounds like this. They told me we collect feedback and never act on it, so I built a closed loop rather than a better suggestion box."], "A3": ["A3 is partnership with customers to define and evaluate service performance outcomes. Consultation does not clear it. Co-definition does. The service catalogue was jointly developed between the Elections PMO and the enterprise PMO with the consumer community in the room, each service given a named consumer and a performance expectation, with a standing commitment that stakeholders are engaged in any proposed change. The ACU delivery optimisation brief then named your NSW Electoral Commission methodology as the reference implementation for its Model 1. So in the room, it sounds like this. I arrived at that discipline from a customer complaint, and it was later assessed as the benchmark."], "A4": ["A4 is partnerships inside your organisation and across the public, private and community sectors. Panels check all four legs. Within, 9 functional directors, 7 governance forums, the enterprise PMO and the Elections PMO. Public, 127 councils, each an autonomous customer with an alternative supplier, plus the Australian Electoral Commission for enrolment and Revenue NSW for recovery. Private, $80 million of high-risk tenders through the procurement steering committee. Community, declared institutions such as nursing homes and hospitals, as the channel to electors who cannot attend. So in the room, it sounds like this. Every one of those 127 councils could have gone elsewhere, and that is what made them customers rather than stakeholders."], "A5": ["A5 is communicating with senior stakeholders and giving expert, influential advice. You already evidence this under Communicate effectively, and that is the risk. Do not reuse the same story across two capabilities in one application. Panels notice, and it reads as a thin record. Use a customer-framed instance instead. Gate 2 readiness advice to the steering committee, where accessibility was the gating condition. So in the room, it sounds like this. My readiness advice was that accessibility was a condition of mobilisation, not a measure of performance, and I asked the committee to hold the gate on it."], "A6": ["A6 is customers' experience when designing business processes and improving services. Design is the operative word. A panel rejects a service you inherited and accepts one you shaped. Two marquee items. The Gate 2 accessibility criterion. And the complaint handling process you built, consolidating fragmented intake into triage, routing to the accountable area, then monitoring to closure. Behind them, six voting modes, contrast-marked ballot boxes, accessible screens, maxi pens and magnifiers, and the Translating and Interpreting Service. So in the room, it sounds like this. Before triage, nobody could tell a service issue from a conduct issue from a potential integrity event, so I built the intake that could."], "A7": ["A7 wants new ideas and creative ways to involve customers in design. This was previously your thinnest indicator. Not any more. The co-designed service catalogue, where the consumers of the function defined the function. The complaint handling process, built from a problem nobody had assigned to you. And Election Operations Reporting, championed during the event so the command structure could see service performance while it could still act on it. So in the room, it sounds like this. Reporting after an election tells you what went wrong. I wanted reporting during it, while we could still fix something."], "H1": ["H1 is a culture that listens to and values insights from customers and communities. The operative word is communities, and it asks for more than a customer base. The commissioned evaluation answers it. Five language groups interviewed in their own language. Twenty people living with disability. Twenty First Nations electors interviewed face to face by a First Nations interviewer. Youth groups. That interviewer decision is a methodological choice with a cost attached, made so the answers would be true rather than polite. What came back was uncomfortable, including perceived tokenism and distrust of government, and it is in the report rather than out of it. So in the room, it sounds like this. I paid for the listening to reach the people most likely to be missed, and published what it found unedited."], "H2": ["H2 names three subjects. Government policy, customer service standards, and accessibility. You are strong on the standards leg, through the Gate 2 accessibility criterion and the complaint process, both of which you had to argue for. You are credible on the policy environment through the funding and legislative pressures at the 2023 State general election, including the Electoral Act amendment that cut early voting from 13 days to 7 mid-program. Now the hard boundary. Do not claim influence on accessibility policy. iVote and technology-assisted voting predate your involvement. So in the room, it sounds like this. I did not write the accessibility policy. I made meeting it a condition of mobilisation and argued for that condition at the gate."], "H3": ["H3 asks whether strategic planning prioritises customer experience. The objection is that you ran program planning, not corporate strategic planning. Two things answer it. At an electoral commission the election program substantially is the agency's strategic plan. The cycle is the strategy. Better still, the agency's own priority goal is a customer trust goal, to maintain trust and confidence in the electoral and democratic systems, with particular attention to inclusion and accessibility for audiences facing additional barriers to participation. Your program carried participation, accessibility and public trust as tracked benefits with formal achievement status. So in the room, it sounds like this. Customer experience was embedded in the planning instrument, and I paid an external party to say whether the agency's own priority goal had been met."], "H4": ["H4 asks whether management systems support service delivery outcomes for diverse customers. This is your strongest Highly advanced indicator and one of the strongest claims across all four capabilities benchmarked. You answer the accessibility test with a management control rather than a good intention. Accessibility was not a program objective, it was a mandatory gate criterion, and a gate criterion is a management system. Underneath it, wheelchair accessibility ratings across every venue, braille ballot papers, telephone assisted voting, the National Relay Service and multilingual services, across 2,486 venues and a 22,990-person temporary workforce trained to apply it consistently. Then measured. 46 per cent of electors needed assistance, and 95 per cent of them were satisfied. So in the room, it sounds like this. I did not design the ramp. I made no ramp stop a $150 million mobilisation."], "H5": ["H5 is setting service delivery standards across the organisation and monitoring compliance. This is the enterprise PMO function stated almost verbatim. Delivery frameworks, lifecycle standards, assurance requirements and decision pathways on one side. Delivery assurance and gateway review on the other. You built both at the NSW Electoral Commission and they applied across the agency's delivery portfolio, with the enterprise PMO assuring the very program you later ran. Name the nuance before a panel finds it. The standards were for the project delivery service, applied organisation-wide. So in the room, it sounds like this. I set the delivery standards for the agency, then ran a program assured against them by the function I had built."]}, "stars": [["This is your Advanced answer and it carries four indicators at once. A1 on culture and new ways of working, A2 on feedback that gets used, A3 on partnership to define the service, A7 on involving customers in design. What makes it strong is that the criticism was aimed at you. The methodology, compliance requirements and PMO practice they attacked were the ones you built in your previous role.", "The moment that does the real work is internal. You noticed you were defending your own processes, so you minuted every concern as it was raised rather than as you would have preferred it to read. Never cut that sentence. Almost no candidate offers one. At 300 words, cut the engine mid-flight paragraph and the complaint process detail, and reduce the result to the three political participant figures plus the complaint line."], ["This is the Highly advanced answer and the one a panel will remember. It carries H4 on management systems for diverse customers, H1 on insights from customers and communities, H5 on standards and compliance, and H3 on planning that prioritises customer experience. It opens correctly, on the agency's priority goal and the elector, not on the PMO. An elector who cannot access the service is not a lost customer, they are disenfranchised, and then fined.", "The moment that does the real work is the commissioning. Most executives claim customer focus by describing what they built. You put program budget into an external research house testing whether the service worked, in a form you could not edit. Never cut the last paragraph. You did not personally serve a single elector, and saying that before the panel asks is what makes everything else credible. At 300 words, keep the Gate 2 standard, the commissioned evaluation, the 95 per cent assistance figure, postal on-time delivery moving from 79 to 91 per cent, and the honest reporting of the declines."]], "outro": ["Nothing here is uncleared, so the work is confirmation rather than repair. Confirm the number of project managers in the forum, the prior number of complaint intake points, whether that process transitioned to business as usual, and what Election Operations Reporting reported and how often. Two disciplines to hold. Councils were never surveyed, so the 125 of 127 figure is retention in a contestable market, not measured satisfaction. And the 2021 local government elections were not your program, so let the research own the movement while you own the system that produced it. Then close on the sentence that wins this capability. Demand for the postal channel rose by half, and on-time delivery improved by twelve points, from 79 per cent at the election I ran in 2023 to 91 per cent at the election I ran in 2024."]}}, {"id": "wc", "name": "Work collaboratively", "group": "Relationships", "desc": "Collaborate with others and value their contribution", "verdict": [["Advanced", "Cleared on all six indicators. Two exceptionally"], ["Highly advanced", "Two of five clear. One partial. Two not evidenced. Claim at Advanced"]], "adv": [{"c": "A1", "t": "Recognise when effective collaboration between teams leads to achieving outcomes", "v": "cle", "vt": "CLEARED", "body": ["The weakest-worded indicator in the framework and a low bar. Thirteen aggregate projects, fourteen workstreams and nine functional directors against a fixed statutory date is interdependency management at scale, and your Project Managers Forum carried interdependencies and communities of practice as standing agenda items. Clear it in one sentence and spend no more words on it."]}, {"c": "A2", "t": "Communicate with others in your organisation and across government to improve information sharing and collaboration", "v": "cle", "vt": "CLEARED, strongly", "body": ["The across-government leg is better than you have been using. In one program you were operationally dependent on the Australian Electoral Commission for enrolment, Revenue NSW for penalty recovery, 127 councils as autonomous customers, and NSW agencies for physical security and cyber posture. Within the organisation: seven governance forums with your PMO as secretariat to all of them, and a monthly Community of Practice."]}, {"c": "A3", "t": "Facilitate opportunities to collaborate with stakeholders to develop solutions together", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Two instances, and the second is the one you keep under-using. The service catalogue co-design at LGE24 — jointly developed with the consumer community in the room. And the AI transformation program run in collaboration with the University of Sydney School of Project Management: seven teams of seven, seven project managers, a genuine industry–academy partnership you convened. That second one matters disproportionately because it sits outside the election evidence, and a portfolio built entirely on one employer is easier to discount."]}, {"c": "A4", "t": "Network widely across government and other organisations to increase opportunities to collaborate", "v": "cle", "vt": "CLEARED", "body": ["Read this indicator carefully before answering it. It is not stakeholder management — it is personal professional networks that create collaboration opportunities. Most candidates answer with program stakeholders and it reads as a misread.", "• Director, PMI Sydney Chapter (2016–2017) — a professional body board role, which is precisely what this indicator means", "• Casual academic, University of Sydney — PMGT5850, PMGT3850 and PMGT3851, continuously since 2018", "• Project Management Teacher, TAFE NSW — 2024", "• Cross-government professional community — NSW Government Innovation Week, NSW Cyber, Digital NSW and Public Sector Network events", "You sit at the intersection of practice, profession and academy, which is a real network and better than most candidates will have."]}, {"c": "A5", "t": "Encourage others to use appropriate ways and tools to collaborate, including digital technology", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Under-used and one of your strongest indicators anywhere. You deployed a P3O operating model and portfolio management tooling across an agency and drove adoption. That is not \"I used Teams\" — it is selecting, deploying and driving adoption of the collaboration infrastructure for an entire delivery population, then running a monthly Community of Practice on top of it.", "TWO HOUSEKEEPING ITEMS BEFORE THIS GOES IN AN APPLICATION. Name the actual platform — Planview and Clarity are different vendors’ products and the current phrasing will be challenged by anyone who knows the market. And be ready to state the measurement basis for the 95% adoption figure: what was counted, over what period, against what denominator."]}, {"c": "A6", "t": "Encourage diverse cultural perspectives in developing strong team relationships", "v": "cle", "vt": "CLEARED", "body": ["The setting: roughly fourteen years of cross-border delivery — BNP Paribas, RBC Dexia including a joint venture with an offshoring target operating model, Milestone Group, and Thomson Reuters across APAC — then a temporary workforce of almost 23,000 across metropolitan, regional and remote NSW.", "The action: the University of Sydney delivery cohort, in which almost every team member was an international student working in a second language and an unfamiliar professional culture. You deliberately built psychological safety, set direction, and led through coaching and empowerment rather than instruction.", "FRAMING WARNING — do not use the sentence \"99% of the team was Chinese\". It states the team’s composition, not your leadership. A panel hears a demographic fact where they asked for an action, and the most charitable reading available to them is that you are offering a team’s ethnicity as an accomplishment. Frame the situation neutrally — \"a delivery cohort in which almost every member was an international student working in a second language and an unfamiliar professional culture\" — then the actions, then what the diversity produced.", "Why psychological safety is the right action to lead with: in many Chinese academic and professional settings, contradicting the lead in an open forum is uncomfortable in a way it is not in an Australian one. Deliberately building safety so disagreement surfaces is therefore a culturally responsive act rather than a generic one. Say why you did it and the indicator clears cleanly."]}], "ha": [{"c": "H4", "t": "Identify and address challenges to collaborating with internal and external stakeholders", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your one Highly advanced indicator, and it is strong. Three independent instances:", "• The vendor re-tender — an external delivery partner not performing, addressed with a structural remedy and an honest cost trade-off", "• The LGE24 kick-off arc — an EPMO-to-delivery-community breakdown, named honestly and resolved structurally through the service catalogue", "• The complaint handling process — fragmented intake across several funnels was a collaboration failure between areas of responsibility before it was a customer problem"]}, {"c": "H3", "t": "Seek out and facilitate opportunities to collaborate with stakeholders across your organisation, government and other jurisdictions to develop solutions", "v": "par", "vt": "PARTIAL. DO NOT CLAIM", "body": ["The operative words are \"other jurisdictions\" and \"develop solutions\". Your program resources people from other electoral jurisdictions and you have personally worked alongside them in count centres. That is cross-jurisdictional resourcing plus personal presence — it is not collaborating across jurisdictions to develop solutions. Hold the line here; the honest answer you gave is the right one.", "What the answer IS good for: the detail that the Program Manager was personally in the count centre alongside seconded interstate officials is excellent colour. It says you were at the sharp end of a $150M program rather than governing it from a distance. Use it as texture in another answer, not as a Highly advanced claim."]}, {"c": "H1", "t": "Create an organisational culture and supporting systems that help communicate and share information and learning across the sector", "v": "not", "vt": "NOT CLEARED", "body": ["The phrase that decides it is \"across the sector\" — not across your organisation. This is the indicator that separates a very good Director from a sector leader, and it is where Advanced-level candidates are most often found out.", "What you have is an excellent ORGANISATIONAL artefact: a monthly Community of Practice of around thirty project managers, project owners and ICT stream leads, open to anyone interested in the topic, which outlasted your tenure. That last fact is the whole value — a Community of Practice that survives its founder is a system rather than a personality.", "What you do not have is contribution beyond the agency. Innovation Week, NSW Cyber, Digital NSW and Public Sector Network were attended, not presented at. Consumption is not contribution, and a panel will make exactly that distinction. The ACU brief treating your NSWEC methodology as its reference implementation shows your practice travelling — but that is someone else’s document about you, not you sharing it.", "THE CHEAPEST CAPABILITY UPGRADE AVAILABLE TO YOU. One presentation — a Public Sector Network session, an IPAA panel, a Digital NSW slot, a written piece on the service catalogue or the EPMO maturity uplift — converts this indicator and lifts the whole capability. It costs a day and it is the difference between Advanced and Highly advanced on the framework’s own terms."]}, {"c": "H5", "t": "Champion cultural capability and inclusivity as cornerstones of collaborative working", "v": "not", "vt": "NOT CLEARED", "body": ["Be aware that in NSW public sector usage \"cultural capability\" most often means Aboriginal cultural capability specifically, and a panel will hear it that way.", "Your best available evidence is real: commissioning a First Nations interviewer for First Nations respondents in the LGE24 service evaluation, and in-language interviews across five CALD communities — a method chosen so the answers would be true, which then produced findings about tokenism and a reported experience of racism that the organisation had to face rather than bury. That is championing cultural capability with a cost attached.", "The gap is that it is research design, and this indicator is about collaborative working — how teams operate. The University of Sydney instance is good leadership practice applied to a culturally distinct team, which clears Advanced but not this. What would close it: one decision that a perspective from that team changed, or one instance where cultural capability shaped how a team was built or run."]}, {"c": "H2", "t": "Publicly celebrate when collaboration leads to successful outcomes", "v": "cle", "vt": "CLEARED", "body": ["THIS INDICATOR WAS PREVIOUSLY RECORDED AS NOT CLEARED. THAT WAS WRONG. The judgement was made on the absence of a closure event and did not account for the recognition mechanisms you actually used.", "The agency ran a Chief Operating Officer award scheme with recognition made at divisional meetings, and you used it — including putting forward an ICT employee for their contribution to your business area and to the election programme.", "That is the strongest form this indicator takes, and it is worth understanding why. Recognising your own team is expected. Nominating someone who does not report to you, from another function, for work that helped your programme, is recognition of collaboration specifically — which is what the indicator asks for. It also costs the nominator something, because credit given across a boundary is credit not retained inside it.", "What remains absent is narrower: no programme-level closure recognition for a workforce of nearly 23,000 people. That is a specific omission worth conceding, and it is not the same as a disposition.", "Note also where the Government House recognition does NOT go. This indicator asks whether YOU celebrated OTHERS — not whether others celebrated you. Filing vice-regal recognition here would be a misread a panel would notice immediately.", "§ Turn the gap into the strongest development answer you have", "Every executive panel asks what you would do differently. Most candidates manufacture a weakness. You have a real one, and it is the kind that demonstrates operational insight rather than deficiency:", "\"We closed a program of nearly 23,000 people on time and within a $150 million authority, and we did not formally recognise the teams that delivered it. I would do that differently. Recognition is the cheapest goodwill instrument a program has — and in an election workforce that reassembles every cycle, it is not sentiment, it is an operational asset. The people you thank are the people who come back.\"", "That answer is honest, specific, unflattering to you, and shows you understand something about a cyclical workforce that most executives would miss. It is worth more than a claimed indicator."]}], "stars": [{"title": "STAR A — Advanced", "sub": "Primary indicators: A1 recognise when collaboration between teams achieves outcomes · A3 facilitate opportunities to collaborate to develop solutions together · plus H4 material (identify and address challenges to collaborating with external stakeholders) used at Advanced altitude", "s": ["As Senior Manager, EPMO – Transformation at the NSW Electoral Commission, I was accountable for delivery assurance across the agency’s technology portfolio in the lead-up to a State general election, where the delivery date is fixed by statute and cannot move.", "The incumbent development vendor was not performing. Delivery against the agreed roadmap was slipping and the collaboration itself had become the constraint — not a commercial dispute, but a partner who could not absorb the volume of work in the time available.", "[CONFIRM: which system or program was at risk, and what the consequence of the slippage would have been]"], "t": ["To protect a statutory delivery date without pretending the existing partnership could recover on its own, and without destabilising the work already underway with the incumbent."], "a": ["I did not terminate the incumbent, and that was a deliberate decision — removing them would have taken the delivered work and the institutional knowledge with it. Instead I ran a new tender process to source an additional development partner and brought them in alongside.", "The new vendor was awarded scope covering several Epics. That rebalanced development load across two partners, and it required me to manage the interface between them — the boundary between the two work packages, the shared architecture, and the risk that two vendors on one roadmap produce three versions of the truth.", "[CONFIRM: how the two-vendor interface was governed — shared backlog, joint ceremonies, single architecture authority, or separated Epics with defined integration points]", "The trade-off was real and I put it to the decision-makers as a trade-off rather than a recommendation dressed as one: two vendors would balance the development and reduce the delivery roadmap, and it would increase cost.", "[CONFIRM: the approximate cost increase, and who approved it]"], "r": ["The development load was balanced across two partners, the delivery roadmap was reduced to what could credibly be delivered, and the cost increase was accepted with visibility of exactly what it bought.", "The collaboration lesson I took from it is the one I would offer a panel: a failing delivery partnership is rarely fixed by escalation, and rarely fixed by replacement either. It is fixed by changing the shape of the work so that what remains is inside the partner’s capacity — and by being honest that this costs money.", "[CONFIRM: whether the reduced roadmap was delivered, and whether both vendors remained engaged through the election]"], "notes": ["§ Delivery notes", "• Why this story and not the kick-off: it is under-used, it involves an external party, and it carries an honest cost trade-off — the texture that makes a collaboration story credible rather than warm. It also frees the kick-off arc for Display resilience and courage, where it is irreplaceable.", "• The decision NOT to terminate is the strongest element. Any manager can remove a failing vendor. Choosing to keep them and reshape the work around their capacity is a judgement call, and it is the collaboration in the story.", "• Probe — \"Why not just replace them?\" → \"Because replacing them meant re-acquiring everything they already knew, and I did not have the calendar for that. The date was set by statute.\"", "• Probe — \"You increased cost. Was that a failure?\" → \"It was the price of a deliverable roadmap. I would rather present an increase against a plan that works than hold a number against a plan that does not.\""], "probes": [], "keys": ["Senior Manager"], "bul": []}, {"title": "STAR B — Advanced", "sub": "Primary indicators: A2 improve information sharing and collaboration · A3 facilitate opportunities to collaborate · A5 encourage others to use appropriate ways and tools to collaborate · A1 recognise when collaboration achieves outcomes", "s": ["When I took the EPMO – Transformation role at the NSW Electoral Commission, delivery practice was inconsistent across the agency’s portfolio. Project managers, project owners and ICT stream leads were solving the same problems separately, and the standards the EPMO published were being received as compliance rather than as help."], "t": ["To build shared practice rather than more standards. A framework tells people what to do; it does not give them anywhere to work out how."], "a": ["I established a monthly Community of Practice and deliberately designed it against the failure mode of most PMO forums — status reporting in disguise. It was topic-led rather than status-led, attendance was open to anyone interested in the topic rather than restricted by role, and it drew around thirty people: project managers, project owners and ICT stream leads.", "[CONFIRM: how topics were chosen — nominated by attendees, or set by the EPMO]", "I paired it with the portfolio management tooling and the P3O operating model I was deploying, so that the practice discussed in the room had somewhere to live afterwards. A community without a system produces goodwill; a system without a community produces compliance. Both were needed."], "r": ["The Community of Practice outlasted my tenure. It was still running after I left the role.", "That is the result I would put in front of a panel, because it is the only durable test of whether a collaboration mechanism was real: a forum that depends on its founder is a personality, and a forum that survives them is a system. This one was a system.", "[CONFIRM: how long it ran under you, and how long it has run since]"], "notes": ["§ Delivery notes", "• Lead the Result with \"it outlasted me\". It is a short sentence, it is verifiable by a referee in one question, and almost no candidate can say it.", "• This STAR also serves Manage and develop people, and part of Demonstrate accountability. Keep it here as the owner and use it there only if this capability is not assessed.", "• Probe — \"How do you know it worked?\" → \"It ran monthly, it drew about thirty people who were not required to be there, and it was still running after I left. Those are the three tests I would apply to anyone else’s, so they are the ones I apply to mine.\""], "probes": [], "keys": ["The Community"], "bul": []}], "notes": [{"h": "Verdict", "body": ["RECOMMENDATION: claim this capability at Advanced, confidently, and do not reach for Highly advanced.", "Highly advanced is not supportable here, and that is the useful result rather than the disappointing one. The gap is structural and worth naming to yourself: your career is unusually strong on coordination and unusually quiet on profession-building. You have run large temporary organisations superbly. Highly advanced here asks something different — that you gave your practice away across the sector.", "\"Across the sector\" is the single easiest phrase on this framework for a panel to test with one follow-up question. A stretched claim reads as inflation. Let the Highly advanced material appear as depth inside an Advanced answer instead — that reads as substance."]}, {"h": "The Government House recognition — where it belongs", "body": ["The 2023 State general election contribution was recognised by the Governor of New South Wales at a privately hosted event at Government House. Group recognition, not individual.", "This had not appeared in any role section, capability pack or STAR before now, and it should have. Vice-regal recognition is the highest ceremonial acknowledgement available in the State, it is external and unimpeachable, and it attaches to the harder of your two elections — the one delivered against a $51.6M funding shortfall, a JSCEM inquiry, an Electoral Act amendment mid-program and the withdrawal of iVote.", "One line, stated flatly, no elaboration. Understatement is what makes it land, and volunteering that it was a group recognition before anyone asks is what makes you credible when you say anything else."]}, {"h": "Story allocation — you now have a portfolio problem", "body": ["The kick-off-to-service-catalogue arc has been serving four capabilities: Display resilience and courage, Communicate effectively, Commit to customer service, and now Work collaboratively. You cannot use one story four times in one application. A panel reading four targeted questions will see the same meeting four times and conclude you had one good year, not a career. Assign each story an owner:"]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "NSWEC LGE24 programme governance model and Program Management Plan retrospective (OFFICIAL–Sensitive) — supplied.", "Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025 — supplied.", "ACU Delivery Optimisation brief (Position 10613501, HEW 9) — R1–R9 EPMO service catalogue.", "Candidate-supplied evidence, 15 August 2026."]}], "script": {"id": "wc", "intro": ["Work collaboratively is defined in one line. Collaborate with others and value their contribution. That sounds soft. It isn't. At Advanced the panel is testing whether collaboration is something you built rather than something you attended. Adept says you worked well with other teams. Advanced says you created the forums, the tools and the partnerships that made other people collaborate.", "Highly advanced moves the boundary outward. The word that decides it is sector. Not your team. Not your agency. It asks whether you gave your practice away, and whether cultural capability shaped how your teams worked.", "Two traps. The first is answering with program stakeholders. Coordination is not collaboration, and a panel hears the difference. The second is consumption. Attending Innovation Week is not contributing to the sector."], "standing": ["You clear Advanced on all six indicators, two of them exceptionally, A3 and A5. Highly advanced is a different picture. Two of five clear, one is partial, two are not evidenced. Claim this capability at Advanced and do not reach higher.", "The gap is structural. Your career is unusually strong on coordination and unusually quiet on profession-building. Across the sector is the easiest phrase on this framework for a panel to test with one follow-up. A stretched claim reads as inflation. Let the Highly advanced material appear as depth inside an Advanced answer instead."], "inds": {"A1": ["The weakest-worded indicator in the framework and a low bar. A panel rejects a warm statement about teamwork. They accept a structure where interdependencies were the work. Yours was thirteen aggregate projects, fourteen workstreams and nine functional directors against a date fixed by statute, and your Project Managers Forum carried interdependencies and communities of practice as standing agenda items. So in the room, it sounds like this. Thirteen projects, fourteen workstreams and nine functional directors against a statutory date, and my Project Managers Forum held the interdependencies as a standing item. Then stop."], "A2": ["This is about improving information sharing inside your organisation and across government. A panel rejects a list of people you copied into emails. They accept dependency you could not control. In one program you depended operationally on the Australian Electoral Commission for enrolment, Revenue NSW for penalty recovery, 127 councils as autonomous customers, and NSW agencies for physical security and cyber posture. Inside the organisation, seven governance forums with your PMO as secretariat to all of them. So in the room, it sounds like this. My program depended on the Australian Electoral Commission, Revenue NSW and 127 autonomous councils, and my PMO was secretariat to all seven governance forums."], "A3": ["The load-bearing word is together. Consultation doesn't clear this. The panel wants the other party in the room while the solution was designed. You have two instances. The service catalogue co-design at LGE24, developed jointly with the consumer community present. And the AI transformation program run with the University of Sydney School of Project Management. Seven teams of seven, seven project managers, a partnership you convened. The second matters most because it sits outside the election evidence. So in the room, it sounds like this. I convened a partnership with the University of Sydney and ran an AI transformation program through seven teams of seven."], "A4": ["Read this one carefully. It is not stakeholder management. It is personal professional networks that create opportunities to collaborate. Most candidates answer with program stakeholders and it reads as a misread. What clears it sits outside the day job. Director of the PMI Sydney Chapter from 2016 to 2017, a professional body board role, which is precisely what this indicator means. Casual academic at the University of Sydney teaching PMGT5850, PMGT3850 and PMGT3851 since 2018. Project Management Teacher at TAFE NSW in 2024. So in the room, it sounds like this. I sit at the intersection of practice, profession and academy."], "A5": ["Under-used, and one of your strongest indicators anywhere. A panel rejects I used Teams. You deployed a P3O operating model and portfolio management tooling across an agency and drove adoption. That is deploying the collaboration infrastructure for an entire delivery population, then running a monthly Community of Practice on top of it. So in the room, it sounds like this. I deployed a P3O operating model and portfolio tooling across the agency, and ran a monthly Community of Practice so the tooling had a culture attached to it.", "Two housekeeping items. Name the actual platform, because Planview and Clarity are different vendors' products. And be ready to state the measurement basis for the 95 per cent adoption figure."], "A6": ["The panel wants your actions, not your team's demographics. The setting is roughly fourteen years of cross-border delivery. BNP Paribas, RBC Dexia including a joint venture with an offshoring target operating model, Milestone Group, and Thomson Reuters across APAC. Then a temporary workforce of almost 23,000 across metropolitan, regional and remote NSW. The action is the University of Sydney delivery cohort, where almost every member was an international student working in a second language. You built psychological safety deliberately and led through coaching rather than instruction.", "One framing warning. Do not say 99 per cent of the team was Chinese. That states composition, not leadership. Frame the situation neutrally, then the actions, then what the diversity produced. Say why you chose safety. In many Chinese professional settings, contradicting the lead in an open forum is uncomfortable in a way it is not here."], "H4": ["Your one strong Highly advanced indicator. The test is whether the collaboration itself was the problem, and whether you fixed it structurally rather than by having a better conversation. Three independent instances. The vendor re-tender, an external partner not performing, addressed with a structural remedy and an honest cost trade-off. The LGE24 kick-off arc, a breakdown between the EPMO and the delivery community, resolved through the service catalogue. And the complaint handling process, where fragmented intake was a collaboration failure between areas of responsibility. So in the room, it sounds like this. In each case the relationship was the constraint, so I changed the structure rather than the tone."], "H3": ["This one is partial and you should not claim it. The operative words are other jurisdictions and develop solutions. Your program resources people from other electoral jurisdictions and you have worked alongside them in count centres. That is cross-jurisdictional resourcing plus personal presence. It is not collaborating across jurisdictions to develop solutions. Hold the line. The honest answer you gave is the right one. What it is good for is texture. The Program Manager personally in the count centre alongside seconded interstate officials says you were at the sharp end of a $150 million program rather than governing it from a distance."], "H1": ["Not cleared, and the phrase that decides it is across the sector. Not across your organisation. This separates a very good Director from a sector leader, and it is where Advanced-level candidates are most often found out. What you have is an excellent organisational artefact. A monthly Community of Practice of around thirty project managers, project owners and ICT stream leads, open to anyone interested, which outlasted your tenure. A Community of Practice that survives its founder is a system rather than a personality.", "What you lack is contribution beyond the agency. Innovation Week, NSW Cyber, Digital NSW and Public Sector Network were attended, not presented at. Consumption is not contribution. One presentation or one written piece converts this, and it costs a day."], "H5": ["Not cleared either. In NSW public sector usage, cultural capability most often means Aboriginal cultural capability specifically, and a panel will hear it that way. Your evidence is real. You commissioned a First Nations interviewer for First Nations respondents in the LGE24 service evaluation, and in-language interviews across five CALD communities. The method produced findings about tokenism and a reported experience of racism the organisation had to face rather than bury.", "The gap is that it is research design, and this indicator is about how teams operate. The University of Sydney instance clears Advanced, not this. What would close it is narrow. One instance where cultural capability shaped how a team was built or run."], "H2": ["This was previously recorded as not cleared. That was wrong. The agency ran a Chief Operating Officer award scheme with recognition at divisional meetings, and you put forward an ICT employee for their contribution to your business area and to the election programme. Recognising your own team is expected. Nominating someone from another function who does not report to you is recognition of collaboration specifically, and it costs you, because credit given across a boundary is credit not retained inside it.", "So in the room, it sounds like this. I nominated an ICT employee who did not report to me, because the contribution that helped my programme most came from outside it. The Government House recognition does not belong here. This asks whether you celebrated others, not the reverse. And concede the omission. There was no closure recognition for a workforce of nearly 23,000."]}, "stars": [["STAR A carries A1 and A3, and lets you use the H4 material at Advanced altitude. It is the vendor re-tender. Choose it over the kick-off arc because it is under-used, it involves an external party, and it carries an honest cost trade-off. That texture makes a collaboration story credible rather than warm, and it frees the kick-off arc for Display resilience and courage.", "The moment that does the real work is the decision not to terminate. Any manager can remove a failing vendor. Keeping them and reshaping the work around their capacity is the judgement call, and it is the collaboration in the story. Present the cost increase as a trade-off, not a recommendation dressed as one. If asked why you didn't just replace them, replacing them meant re-acquiring everything they already knew, and the date was set by statute."], ["STAR B is the Community of Practice and it carries four indicators at once. A2, A3, A5 and A1. What makes it strong is that you designed it against the failure mode of most PMO forums, which is status reporting in disguise. Topic-led rather than status-led, open to anyone interested rather than restricted by role, around thirty people. You paired it with the portfolio tooling and the P3O operating model, so the practice had somewhere to live.", "Lead the Result with it outlasted me. It is short, a referee can verify it in one question, and almost no candidate can say it. If asked how you know it worked, give the three tests. It ran monthly, it drew about thirty people who were not required to be there, and it was still running after you left."]], "outro": ["Claim Work collaboratively at Advanced and let the depth argue for you. Two gaps are worth closing and only one is quick. H1 needs a single act of contribution beyond your agency, and one presentation or written piece does it. H5 needs one instance where cultural capability shaped how a team was built or run. Watch the story allocation too, because the kick-off arc has been serving four capabilities. The sentence you own here is this one. The Community of Practice I built was still running after I left."]}}, {"id": "ms", "name": "Manage self", "group": "Personal Attributes", "desc": "Be persistent, self-reflect and commit to learning", "verdict": [["Advanced", "Cleared on all five, on every limb. Four exceptionally"], ["Highly advanced", "Five of six clear — H1, H2, H3, H4, H6, with H2 now complete on all three limbs. H5 partial on the recognition gap"]], "adv": [{"c": "A1", "t": "Be a professional role model for colleagues, set high personal goals and take pride in achieving them", "v": "cle", "vt": "CLEARED", "body": ["Eight continuous years teaching PMGT5850, PMGT3850 and PMGT3851 at the University of Sydney while holding full-time senior delivery roles, a year at TAFE NSW, and a PMI Sydney Chapter directorship. Sustaining that alongside two election programs is the personal standard, evidenced by conduct rather than claimed. The NSWEC semi-annual performance and development regime, with goals set and reviewed, belongs here as supporting detail — not under A2.", "The fact you have never used as a role-model claim: twice, a software vendor hired you after you implemented their product as their client — BNP Paribas to Milestone Group, RBC Dexia to Thomson Reuters. That is the market judging you the best practitioner of their own product they had encountered. Two independent occurrences fifteen years apart is a pattern, not luck.", "COACHING NOTE. \"Take pride in achieving them\" is the hardest phrase in the framework to answer without sounding self-congratulatory, and most candidates fail it by trying. Evidence pride through standards maintained under pressure — what you refused to lower — not through satisfaction expressed. A panel infers pride; they resent being told about it."]}, {"c": "A2", "t": "Actively seek, reflect on and act on feedback about your performance", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY, on all three limbs", "body": ["The kick-off arc carries the reflect and act limbs. What carries the \"actively seek\" limb is what you did afterwards, and it is better evidence than any 360 instrument.", "You went back to the project managers individually and sought 360 feedback — not on the methodology, but on yourself. The question you asked was why they had not been able to raise the concerns with you personally. Then you met several directors to understand what they were hearing, so the picture was triangulated across levels rather than taken from one.", "That is the hardest question a leader can ask, and it is the only one that reliably improves them. Most executives ask \"what should we fix?\" You asked \"why couldn’t you tell me?\"", "ONE CAUTION. Do not lead this indicator with the semi-annual performance and development plan regime. Every NSW public servant has one; offered as evidence, a panel hears \"I complied with the performance system\". It belongs under A1 as supporting detail on goal-setting. And do not conflate the commissioned service evaluation with feedback on your performance — that research measured the service, not you, and a panel will catch the substitution."]}, {"c": "A3", "t": "Reflect on and use negative feedback as an opportunity for growth and improvement", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The kick-off arc in full. You first tried to contain the criticism and were overruled; then heard it, minuted it verbatim while feeling defensive, and converted it into a structural change to how the function defines itself. The growth is evidenced by the service catalogue existing. That is the difference between \"I took the feedback on board\" and this."]}, {"c": "A4", "t": "Take the initiative and act in a decisive way", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your strongest Advanced indicator, and it reveals a signature you have not named:", "You repeatedly take ownership of things nobody gave you.", "• Championed and built the complaint handling process — fragmented intake nobody had made your responsibility", "• Championed Election Operations Reporting during the event", "• Drafted the resilience proposal after event assurance did not achieve its posture at SGE23, and took ownership of business resilience and crisis management", "• Proposed the program-wide change request that returned the entire $12M contingency", "Plus the decisiveness limb: making methodology decisions in the room at the PM Forum rather than deferring them to a paper, and running a vendor re-tender rather than escalating a failing partnership. Four instances of unrequested ownership is a leadership disposition, not four anecdotes. Say the pattern out loud."]}, {"c": "A5", "t": "Pursue and apply new knowledge and practices relevant to your organisation to improve outcomes", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["P3O, P3M3 maturity uplift, portfolio management tooling, earned value management through the Financial and Cost Control forum, service catalogue discipline, and most recently an AI transformation program and hands-on platform work. Eight years teaching postgraduate project management keeps the knowledge current rather than remembered.", "The thirty-year arc is itself the evidence: fund accounting and unit pricing, to product management, to program delivery, to EPMO and portfolio, to AI transformation. Continuous re-skilling, not one skill applied for three decades."]}], "ha": [{"c": "H3", "t": "Manage challenging, ambiguous and complex issues in a professional way", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Possibly the strongest single indicator across all six capabilities benchmarked. SGE23 alone: a red program inherited, an $89.1M allocation against a $140.7M estimate, the Electoral Act amended mid-program to cut early voting from thirteen days to seven, iVote withdrawn, a JSCEM inquiry running, and a statutory date that could not move. Delivered $140.3M against $144.3M with informality improved in both houses.", "Then LGE24: the Commissioner retired on 5 April 2024 with an Acting Commissioner from the next day, roughly $400M sought and nothing awarded, delivered on time within a $150M authority with the contingency returned.", "\"Ambiguous\" is the word doing the work in this indicator and it is the one candidates usually cannot evidence. A program running through a change of agency head with no funding uplift and an immovable statutory date is textbook ambiguity — twice."]}, {"c": "H1", "t": "Model self-improvement and be proactive in seeking opportunities to learn, grow and apply new skills", "v": "cle", "vt": "CLEARED", "body": ["The teaching-while-practising pattern is the spine. The sharper evidence is that at a senior career stage you moved into AI delivery and hands-on platform building rather than coasting on thirty years of accumulated method. Most executives stop acquiring skills and start deploying reputation. You did not."]}, {"c": "H2", "t": "Actively seek, reflect on and integrate feedback, showing a strong capacity and willingness to modify your behaviour", "v": "cle", "vt": "CLEARED on all three limbs", "body": ["\"I found myself naturally defending them\" — noticed in the moment, and the behaviour changed in the moment: every concern minuted as stated rather than as you would have preferred it to read. Behaviour modification under live pressure, on your own work, in front of the people criticising it.", "Almost no candidate can evidence this. Most offer a story about accepting feedback and changing later. You changed during — and then went looking for more of it, individually, from the people who had found it difficult to give you.", "The framing worth using, if you accept it as a fair reading of what happened: you had designed the Project Managers Forum specifically to create psychological safety for raising risks, issues and concerns away from the leaders. Then at the kick-off you discovered the concerns still had not reached you directly. Building the structure for safety and being someone people feel safe with are different achievements, and you went and tested the second one on yourself."]}, {"c": "H4", "t": "Set an example of thought leadership by promoting new knowledge and practices for your organisation to adopt", "v": "cle", "vt": "CLEARED", "body": ["Read the last five words carefully: \"for your organisation to adopt\". Not across the sector.", "This matters, and it is worth understanding why. You FAILED the equivalent Work collaboratively indicator on almost identical raw material, because that one says \"across the sector\" and your contribution stopped at the agency boundary. Here the framework asks only for your organisation, and you clear comfortably — the service catalogue concept, the P3O operating model, the EPMO methodology adopted agency-wide, the Community of Practice that outlasted you, the resilience project, the complaint handling process, Election Operations Reporting.", "The ACU delivery-optimisation brief treating your NSWEC methodology as its reference implementation is external corroboration that the practice constitutes thought leadership rather than local preference.", "Two indicators, near-identical evidence, opposite outcomes, on one prepositional phrase. That is why these packs run indicator by indicator rather than capability by capability."]}, {"c": "H6", "t": "Encourage diverse approaches to leadership that value collaboration, proactiveness and decisiveness", "v": "cle", "vt": "CLEARED", "body": ["Cleared by the structure before you describe a single instance. Eleven of the organisation’s twelve Band 1 executives reported into your program for delivery, at a substantive grade above your own. You could not have imposed one leadership style on eleven executives running their own functions — the arrangement obliged you to work with eleven different ones.", "STAR C evidences the behaviour directly: backing a new director’s judgement over your own diagnosis, and putting a control around the consequence rather than around her."]}, {"c": "H5", "t": "Create and promote a culture of organisational achievement", "v": "par", "vt": "PARTIAL", "body": ["You have the achievement: two elections delivered, all program benefits recorded as Achieved, a Community of Practice that outlasted you, psychological safety established in the Project Managers Forum.", "What is missing is the promote half — and it is the same gap that cost you the Work collaboratively \"publicly celebrate\" indicator. A culture of achievement is built substantially by recognising achievement, and there was no recognition, award, nomination or celebration at LGE24 closure.", "THIS IS NOW A PATTERN, NOT A COINCIDENCE. The recognition habit costs you a Highly advanced indicator in two separate capabilities. It is the cheapest item on your entire development list to fix, and until it is fixed, use the development answer drafted in the Work collaboratively pack — it is honest and it shows you understand exactly what it cost."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicator: H3 manage challenging, ambiguous and complex issues in a professional way. Supporting: A4 initiative and decisiveness · H1 apply new skills", "s": ["In March 2022 I took over the program for the 2023 NSW State general election. It was rated red on arrival. The initial funding allocation was $89.1 million against an estimated requirement of $140.7 million — a shortfall of $51.6 million against a delivery date fixed in statute.", "Three things then changed underneath the program. The Electoral Act was amended to reduce the early voting period from thirteen days to seven, which altered the operating model for every voting centre in the state. The iVote channel was withdrawn following its failure at the 2021 local government elections. And a parliamentary committee inquiry was running in parallel."], "t": ["To deliver a state general election with the money that existed, the channels that remained, and a legislated timetable that changed while the program was running — and to move the program from red to green in a way the Steering Committee could believe."], "a": ["I instituted a plan to green and took it to the Program Steering Committee for approval rather than implementing it and reporting afterwards. That mattered: a recovery plan that the governing body has approved is a shared commitment; one that the program manager has authored alone is an opinion.", "[CONFIRM: what the plan to green comprised — the three or four moves that actually changed the trajectory]", "I treated the legislative change as a scope event to be re-planned rather than as an explanation for slippage. The reduction from thirteen days to seven changed venue contracting, workforce rostering, logistics and communications simultaneously, and each was re-based against the new timetable.", "[CONFIRM: how the gap between the $89.1M allocation and the eventual $144.3M funding was closed, and your part in it]"], "r": ["The election was delivered at $140.3 million against $144.3 million in funding, and informality improved in both houses — the cleanest available measure that the changes did not degrade the elector experience.", "The program team’s contribution was subsequently recognised by the Governor of New South Wales at a private event at Government House."], "notes": ["§ Delivery notes", "• Lead with the ambiguity, not the adversity. Panels hear funding shortfalls constantly. What they rarely hear is a candidate who delivered while the legislation governing the work changed mid-program. That is the differentiator.", "• The Government House line is group recognition. Say so before anyone asks: \"I was among the program team recognised — it was a group acknowledgement.\" Volunteering it is what makes you credible on everything else.", "• Probe — \"Was the plan to green yours or the Steering Committee’s?\" → \"Mine to author, theirs to own. I did not want a recovery plan I could be the only person committed to.\""], "probes": [], "keys": ["$89.1 million", "$140.7 million", "$51.6 million", "$89.1", "$144.3", "$140.3 million", "$144.3 million", "The Electoral Act", "Steering Committee", "Program Steering Committee"], "bul": []}, {"title": "STAR B — Advanced, extending to Highly advanced", "sub": "Primary indicators: A3 use negative feedback as an opportunity for growth · H2 integrate feedback, showing willingness to modify your behaviour. Supporting: A2", "s": ["At the kick-off of the 2024 Local Government elections program, the delivery community raised sustained criticism that lessons from previous elections had never been implemented. Most of it was directed at the enterprise delivery methodology, compliance requirements and PMO practice —
