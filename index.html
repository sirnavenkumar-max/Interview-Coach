ng Committee.", "That is correct governance. But at program pace, across thirteen aggregate projects and ten project managers, the volume of individual change requests was consuming the capacity of exactly the people who needed to be delivering. The control designed to protect the program had become a tax on it."], "t": ["To reduce the change control burden on delivery without weakening change control itself. Those are usually opposing objectives and the easy answer — relax the process — was not available on a program with a statutory date and public money."], "a": ["I instituted a single program-wide change request rather than requiring each project to raise and argue its own.", "The Elections PMO coordinated and corralled the activities and wrote the documentation, so project managers and project owners were not producing change paperwork at the point in the program where their time was worth most.", "The request then went through the full approval chain unchanged — EPMO review, Finance Business Partners, the Chief Financial Officer, the Program Director, the Project Leadership Forum and the Program Steering Committee. Nothing about the rigour was reduced. What changed was that the burden of assembling it moved from the delivery teams to the function whose job it is.", "[CONFIRM: what the change request actually changed — scope, schedule, budget re-baselining, or a combination]"], "r": ["Project managers and project owners recovered the time the process had been taking from them, and the program retained a fully evidenced change control record.", "The mechanism also became the vehicle through which savings were identified across the program. The entire $12 million contingency provision went unspent and was returned, evidenced by total programme expenditure finishing below the $150 million investment authority.", "ACCOUNTING PRECISION — do not vary this phrasing. Contingency is a budget provision, not an expense classification. It never appears as an expense line, and unspent contingency never becomes expenditure. The return is evidenced by total expenditure finishing below the investment authority — that is the correct and defensible formulation in front of a finance-literate panel."], "notes": ["ALLOCATION WARNING. This is the same event as STAR A in the Act with integrity pack, framed differently — there it is the return of authorised money, here it is the removal of a delivery barrier. Panels remember events, not framings. Use one or the other in a single application, never both.", "§ Delivery notes", "• The framing that makes this Highly advanced is that you removed a barrier you had built. The change control process was yours from the prior role. Owning that is what turns a process improvement into judgement.", "• \"The control designed to protect the program had become a tax on it\" is the sentence to keep. It shows you understand that governance has a cost and that the cost is paid by delivery.", "• Probe — \"Didn’t consolidating changes reduce scrutiny?\" → \"The opposite. Ten separate requests get ten partial views. One program-wide request gets the CFO looking at the whole picture at once, which is how the savings became visible.\""], "probes": [], "keys": ["$12 million", "$150 million", "Finance Business Partners", "Chief Financial Officer", "Program Director", "Project Leadership Forum"], "bul": []}], "notes": [{"h": "Verdict", "body": ["On paper this is your home capability — you are a delivery professional and the evidence is overwhelming. This pack was revised on 16 August after you supplied the recognition evidence; the earlier verdict on H5 is superseded."]}, {"h": "The recognition question — revised", "body": ["Look at what this capability asks:", "• A2 — Lead a culture of achievement and acknowledge others’ input", "• H2 — Create a culture of achievement, fostering on-time and on-budget quality outcomes", "• H5 — Identify, recognise and celebrate success", "Now add what the earlier packs already found:", "• Work collaboratively H2 — Publicly celebrate when collaboration leads to successful outcomes — now CLEARED", "• Manage self H5 — Create and promote a culture of organisational achievement — strengthened", "THIS SECTION IS SUPERSEDED — READ THE CORRECTION BELOW. The recognition gap was recorded as costing four indicators across three capabilities. It does not. You used the agency’s Chief Operating Officer award scheme and divisional recognition, and you nominated an ICT employee from another function for their contribution to your programme. A2 and H5 here both clear, and so does the equivalent Work collaboratively indicator.", "What survives is narrow and specific: there was no programme-level closure recognition for a workforce of nearly 23,000 people. Concede that, not a disposition. In an election workforce that reassembles every cycle, recognition is an operational asset rather than sentiment — the people you thank are the people who come back.", "§ A2 clears on both limbs, and the input limb is the distinctive one", "You acknowledge INPUT in a way most executives do not. At the kick-off you minuted every concern as it was raised rather than as you would have preferred it to read, escalated the complete record, and co-designed the service catalogue with the people who had criticised you. That is acknowledgement of contribution in its most substantive form — building people’s input into the record and into the design.", "You also recognise SUCCESS, through the agency’s award scheme and divisional recognition, including a nomination made across a functional boundary for someone who did not report to you.", "THE ONE THING STILL WORTH CONCEDING. A programme of nearly 23,000 people closed on time and within authority without a closure recognition event. That is a specific, defensible thing to say you would do differently — and the reasoning is what makes it land: in an election workforce that reassembles every cycle, recognition is not sentiment, it is an operational asset. Say that, and do not concede a disposition you do not have."]}, {"h": "Other material available in this capability", "body": ["Not written as STARs because the events are allocated elsewhere, but usable as supporting detail or short verbal answers:"]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "NSW Electoral Commission, 2024 NSW Local Government elections report — elections.nsw.gov.au", "NSWEC LGE24 Program Management Plan retrospective (OFFICIAL–Sensitive) and programme governance model — supplied.", "Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025 — supplied.", "Candidate-supplied evidence, 14–15 August 2026."]}], "script": {"id": "dr", "intro": ["Deliver results is about achieving results by using resources efficiently and committing to quality outcomes. Two limbs, tested separately. Did the thing get done, on time and on budget. And were the resources handled like they belonged to somebody else.", "At Adept you run your own work well. At Advanced you control output across a business unit, define what success means for other people, and go and find the expertise you don't have. Highly advanced moves up again. You set priorities for the organisation, build the systems that connect a worker's task to the outcome, and remove barriers rather than absorb them.", "Here's the trap. Most candidates answer this capability with effort. How hard it was, how many escalations. A panel hears activity and marks it Adept. What lifts you is defined success, controlled resources, and a structural fix that outlasts you. You have all three, so don't spend a sentence on how hard it was."], "standing": ["This is your home capability. At Advanced you clear all seven indicators, five of them exceptionally. That's your strongest Advanced sweep in the entire framework. At Highly advanced you clear six of six, following the recognition and workforce training evidence you supplied on 16 August.", "So claim this at Highly advanced. Don't hold it in reserve. The earlier verdict on identify, recognise and celebrate success is superseded. One thing is still worth conceding, and only one. A programme of nearly 23,000 people closed without a programme-level closure recognition event. Concede that gap, not a disposition you don't have."], "inds": {"A1": ["This asks whether you seek and apply the expertise of key individuals. Panels reject consultation theatre. They accept a moment where somebody else's judgement beat yours and you acted on theirs.", "Your best instance is the Applications Director. You had a diagnosis. She had a different judgement, grounded in experience you did not have. You applied hers over your own, then put a control around the consequence rather than around her. Behind it sit the vendor tender, the commissioned research house and eleven Band 1 executives. So in the room, it sounds like this. I had a view, she had a better one, so I took hers and controlled the risk that came with it rather than controlling her."], "A2": ["Lead a culture of achievement and acknowledge others' input. The second limb is where candidates thin out. Acknowledging input isn't thanking people at the end. It's evidence that what somebody said changed the record or the design.", "Lead with the minuting and the co-design. You minuted every concern at the kick-off as it was raised, not as you'd have preferred it to read, and escalated the complete record. Then you co-designed the service catalogue with the people who had criticised you. Support it with the award nominations, including the one outside your own team. So in the room, it sounds like this. I minuted the criticism as it was said, escalated all of it, then built the people who made it into the design."], "A3": ["Determine how outcomes will be measured, and guide others on evaluation methods. A panel rejects outputs dressed as outcomes. Delivered, completed, implemented. They want to know who decided what good looked like, and how it was tested.", "You built a benefits framework carrying integrity, timeliness, participation and accessibility, operational efficiency, public trust and compliance, each with a formal achievement status at closure. Earned value management ran through the Financial and Cost Control forum. Maturity was measured with P3M3. Targets were absolutes. Outcome-altering recounts zero. Material post-election breaches zero. And the strongest version is this. Service outcomes were measured by someone you did not control, across six survey instruments and roughly 3,500 respondents. So in the room, it sounds like this. I set the measures, then handed the measuring to someone I couldn't influence."], "A4": ["Investigate and create opportunities to enhance the achievement of business objectives. The word doing the work is create. Solving a problem you were handed is the job. Finding one nobody had named is the indicator.", "This is the signature that turns up in every capability of yours. You take ownership of things nobody gave you. Six unrequested initiatives. The programme-wide change request. The complaint handling process. Election Operations Reporting. The programme procurement strategy. The resilience proposal. The service catalogue. Name three, not six, or it stops sounding like judgement. So in the room, it sounds like this. Nobody asked me for the procurement strategy, the complaint handling process or the service catalogue. I built them because the programme was going to need them."], "A5": ["Make sure others understand the need for on-time and on-budget results, and how success is defined. This isn't about you understanding the deadline. It's whether thousands of other people could tell you, without checking, what ready meant.", "Gate 2 is the artefact, and it's the best possible answer here. Success defined as a condition that can be tested and failed. Venues 100 per cent contracted and accessible. Workforce at or above 85 per cent filled with training commenced. Ballots certified and in production. Systems configured and end-to-end tested. Postal ready. Communications in market. No uncontrolled high or extreme risks. So in the room, it sounds like this. Readiness was seven criteria that could each be failed, so nobody had to interpret whether we were ready. Before you say that one, confirm whether you authored those criteria — the pack leaves it open."], "A6": ["Control business unit output so government outcomes are achieved within budget and on time. Control is the operative word. Not delivered, controlled. A panel wants evidence you could have stopped it and knew where the money was.", "Two elections. Two statutory dates that could not move. Both delivered. The 2023 state general election came in at $140.3 million against $144.3 million. The 2024 Local Government elections landed on time inside a $150 million authority, contingency returned in full, no high residual risks at closure. So in the room, it sounds like this. I've delivered against a date fixed in legislation twice, both times under authority, and returned the contingency."], "A7": ["Progress organisational priorities, and make sure resources are acquired and used effectively. Acquisition is easy to evidence. Used effectively is where answers go quiet, because it needs a number at closure rather than a story at the start.", "Your acquisition numbers are at a scale most executives never touch. 22,990 temporary staff recruited, onboarded, trained and mobilised statewide against a $35 million workstream. 2,486 venues contracted. 9,614,100 ballot papers printed and distributed. Roughly $80 million of vendor capacity procured under a strategy you authored. The second limb is evidenced, not claimed, because total expenditure finished below authority with unspent contingency returned. So in the room, it sounds like this. I acquired a workforce of nearly 23,000 people and $80 million of vendor capacity, and finished below the investment authority."], "H3": ["Identify and remove potential barriers to achieving outcomes. This is your strongest indicator here, and possibly across the whole framework alongside the equivalent in Manage self. A panel is listening for the difference between working around a barrier and removing it.", "You have six distinct instances, each a named barrier removed by a structural remedy rather than by pushing harder. The first is the purest. You instituted the programme-wide change request specifically to take pressure off the project managers and project owners who needed to be delivering. It returned $12 million as a by-product. Lead with the intent, not the money, or it becomes a savings story. So in the room, it sounds like this. I removed the barrier by changing the mechanism, and the saving was a consequence rather than the point."], "H1": ["Use your professional knowledge and the expertise of others to drive organisational and government objectives. Three components, and candidates usually land two. Your expertise, other people's expertise, and the line from both to a government objective.", "Your professional knowledge is the ASX disclosure intervention, P3O, P3M3, earned value management and the service catalogue discipline. The expertise of others is eleven functional executives, a commissioned research house and two development partners. The third component is handed to you by the setting. At an electoral commission the organisational objective is a government objective, because the conduct of statutory elections is the whole mandate. So in the room, it sounds like this. There's no gap between that organisation's objective and the government's. The election is the mandate."], "H2": ["Create a culture of achievement, fostering on-time and on-budget quality outcomes for the organisation. This clears on the delivery-system limb. Note the word culture. How the organisation works after you leave, not what it produced once while you were watching.", "So the P3M3 maturity uplift is your cultural evidence, not the delivery record. An organisation that moves up the maturity scale has changed how it works. Two consecutive elections on time and on budget is the output of that change, and the Community of Practice outlasting your tenure is proof it was cultural rather than personal. So in the room, it sounds like this. The proof isn't the two elections. It's that the Community of Practice was still running after I'd gone."], "H6": ["Set and communicate high-level priorities for your organisation. The word is organisation, not programme, and that's the gap most candidates can't bridge. A panel rejects a priority list with no money attached.", "You bridge it on the same framing that carried Commit to customer service. At an electoral commission the election programme substantially is the organisation's priority set, and the four-year cycle is the strategy. Then the mechanisms. Roughly $133.7 million allocated across fourteen workstreams. MoSCoW prioritisation run with the business areas and the applications team. A risk-prioritised procurement tracker. So in the room, it sounds like this. I set the priorities by allocating $133.7 million across fourteen workstreams, which is the only version of prioritisation that has consequences."], "H4": ["Establish systems so all staff can identify direct connections between their work and the organisation's outcomes. Two words carry it. Systems, meaning repeatable and gated. And all staff, meaning the person at the counter. This was previously partial, because the service catalogue and benefits framework reached perhaps fifty people, not the 22,990 who ran the election.", "The training architecture answers it. The cascade was on the critical path and sequenced across ten months. A Training and Workforce Strategy a year out. An online pack in March, a second in June. Three weeks of face-to-face training for Returning Officers and their support officers. Every election day official then got a briefing from their Polling Place Manager before setup. It was gated rather than assumed, because the workforce strategy and the staffing model were approved deliverables.", "One thing would make it exceptional, and only you can answer it. Did the training explain why a procedure existed, not just how to perform it. If it did, say so. And hold the boundary. The $35 million staffing and training workstream was delivered by the HR Director. So in the room, it sounds like this. I didn't run the training. I put it on the critical path, funded it and gated it, so no part of the workforce reached election day without it."], "H5": ["Identify, recognise and celebrate success. This was previously recorded as not cleared, and that judgement was wrong. It rested on the absence of a closure event and missed the mechanisms you actually used. It clears.", "The agency ran a Chief Operating Officer award scheme with recognition made at divisional meetings, and you used it. That includes nominating an ICT employee for their contribution to your business area and to the election programme. Recognising your own team is expected. Nominating across a functional boundary, for someone who didn't report to you, costs the nominator something. What survives is narrow. There was no programme-level closure recognition for a workforce of nearly 23,000. So in the room, it sounds like this. What I'd do differently is a closure event, because in a workforce that reassembles every cycle the people you thank are the people who come back."]}, "stars": [["This carries three Advanced indicators at once. Making others understand on-time and on-budget results and how success is defined. Controlling output within budget and on time. Acquiring and using resources effectively. Lead with why the date is different. Cannot deliver late, cannot deliver partially, no second attempt. That framing separates this from any ordinary programme recovery story.", "The moment doing the real work is the gate. Mobilisation was conditional on criteria that were binary and testable, and each one could be failed. Don't paraphrase them, list three or four verbatim. Close on the queue times, not the headcount. Anyone can recite a mobilisation number. Very few candidates can produce an externally measured customer outcome. And if they ask what would have happened had a criterion failed, have the answer ready. The credibility of the gate rests on it."], ["This one is built for identify and remove potential barriers, and it supports creating opportunities, using resources effectively and applying expertise. First, the allocation warning. This is the same event as the first STAR in your Act with integrity pack, framed differently. There it's the return of authorised money. Here it's the removal of a delivery barrier. Panels remember events, not framings. Use one or the other, never both.", "What makes it Highly advanced is that you removed a barrier you had built. The change control process was yours from your prior role in the EPMO. Owning that turns a process improvement into judgement. Keep the sentence, the control designed to protect the programme had become a tax on it. And be precise on the money. Contingency is a budget provision, not an expense classification. The return is evidenced by total expenditure finishing below the investment authority."]], "outro": ["Two things to close out. Answer the training question for yourself, because if the material explained why a procedure existed and not only how to do it, the line-of-sight indicator lifts from cleared to exceptional. Then rehearse the recognition concession until it's one specific sentence about a closure event for nearly 23,000 people, with the reasoning attached. Everything else here is already won. The strongest sentence you own on this capability is this. I've delivered against a date fixed in legislation twice, both times under authority, with the contingency returned in full."]}}, {"id": "tsp", "name": "Think and solve problems", "group": "Results", "desc": "Think, analyse and consider the broader context to develop practical solutions", "verdict": [["Advanced", "7/7 cleared. Two exceptionally. One limb of A4 is thinner than it looks"], ["Highly advanced", "4 of 5. H2 is a genuine gap — and it is the most strategically important finding in this pack"]], "adv": [{"c": "A1", "t": "Undertake objective, critical analysis to reach accurate conclusions that recognise and manage contextual issues", "v": "cle", "vt": "CLEARED", "body": ["The best instance is small: you attended a squad meeting, observed that every team lead in a supposedly product-based agile team reported through a project status report, and drew an inference about delivery maturity and about whether the prioritisation method you had built would produce what you expected. One weak signal, a correct question, and an implication traced back to your own instrument.", "AND HERE IS HOW TO MAKE IT EXCEPTIONAL. The phrase \"recognise and manage contextual issues\" invites the harder observation — that an EPMO gate and assurance regime demanding project-format reporting will produce project-format reporting from product teams regardless of how they actually work. If you can say that your own governance may have shaped what you observed, you move from good analysis to objective analysis, because you have included yourself in the frame. Very few candidates do."]}, {"c": "A2", "t": "Work through issues, weigh up alternatives and identify the most effective solutions in collaboration with others", "v": "cle", "vt": "CLEARED", "body": ["The vendor decision is the cleanest: terminate, escalate, or supplement — three live options with different costs, evaluated against a statutory date, resolved with the Steering Committee rather than presented to it as a fait accompli."]}, {"c": "A3", "t": "Consider the wider business context when thinking about options to resolve issues", "v": "cle", "vt": "CLEARED", "body": ["Not terminating the incumbent because the knowledge would leave with them and the calendar could not absorb re-acquisition. Designing a Procurement Steering Committee because the Program Steering Committee’s capacity was the scarce resource. Resolving a due diligence requirement because the downstream sequence had no float. In each case the decision turns on a constraint outside the immediate problem."]}, {"c": "A4", "t": "Explore a range of possibilities and creative alternatives to improve systems, processes and business practices", "v": "cle", "vt": "CLEARED, with one caveat", "body": ["THE CAVEAT IS ABOUT HOW YOU PRESENT, NOT WHAT YOU DID. Almost every story you have given me is shaped as \"I identified X and built Y\". The options you considered and rejected are missing from the telling. A panel probing analysis will ask what else you looked at, and \"I built the service catalogue\" does not answer it. Before any interview, take your three strongest solutions and reconstruct the alternatives you discarded and why. You did weigh them — you simply do not narrate them, and on this indicator the narration is the evidence."]}, {"c": "A5", "t": "Put systems and processes in place that are supported by high-quality research and analysis", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["A P3M3 maturity assessment that drove a P3O operating model design. A procurement tracker built before a strategy and prioritised by risk. A service catalogue built from stakeholder feedback rather than from doctrine. An independent evaluation commissioned across six instruments. In every case the system rests on analysis that preceded it."]}, {"c": "A6", "t": "Look for opportunities to design innovative solutions to meet customers’ needs and service demands", "v": "cle", "vt": "CLEARED", "body": ["The complaint handling process, Election Operations Reporting, accessibility as a mandatory gate criterion, and the AI transformation program with the University of Sydney.", "A WORD OF CAUTION ON \"INNOVATIVE\". Your strength is rigour, not novelty. A complaint triage process is excellent practice rather than innovation, and a panel that hears you claim innovation for it will discount the rest. Where you are genuinely original is in the reframe — reading a PMO mandate as a service catalogue with named consumers and performance expectations is a lateral move, and it was later assessed by an external institution as a reference implementation. Claim originality there and nowhere else."]}, {"c": "A7", "t": "Evaluate the performance and effectiveness of services, policies and programs against clear criteria", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["A benefits framework with six benefits carrying formal achievement status at closure. Gate 2 criteria expressed as testable conditions. Earned value management through a standing monthly forum. P3M3 measurement of the delivery function itself. And an independent service evaluation across roughly 3,500 respondents. Few executives can evidence evaluation at programme, function and service level simultaneously."]}], "ha": [{"c": "H5", "t": "Ensure effective governance systems are in place to guarantee quality analysis, research and reform", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your strongest indicator in this capability, because building governance systems is what you do. Seven forums with defined membership, cadence and decision rights. An EPMO assurance regime with gate, change request and embedded assurance reporting throughout delivery. Gate 2 as a mandatory readiness control. A Procurement Steering Committee with probity in its remit. A Financial and Cost Control forum running earned value management. A change request pipeline routing every proposal through EPMO review, Finance Business Partner and CFO approval before any decision forum sees it."]}, {"c": "H4", "t": "Think laterally to develop innovative solutions that have a long-lasting, organisation-wide impact", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Read the test in this indicator: long-lasting and organisation-wide. You have an unusually clean proof of both.", "The change request process you designed in the EPMO Transformation role was still governing the program you ran two roles later — you were subject to your own system. The Community of Practice you established outlasted your tenure. The EPMO methodology was adopted agency-wide and was later assessed by an external institution as the reference implementation of its delivery model.", "The durability test of a system you built is whether it constrains you afterwards. Yours did. That is a better answer to this indicator than any claim about innovation, and you should use it in exactly those words."]}, {"c": "H3", "t": "Identify and evaluate organisation-wide implications when considering proposed solutions to issues", "v": "cle", "vt": "CLEARED", "body": ["The Procurement Steering Committee was designed by reasoning about what the Program Steering Committee would lose if it kept absorbing tender decisions. The consolidation of change requests was designed by reasoning about where the burden of assembly should sit across the whole program. And backing a new director’s decision not to change her operating model mid-cycle was an organisation-wide implications judgement — the risk of reform before a full event outweighed the benefit of the reform."]}, {"c": "H1", "t": "Establish and promote a data-literate culture that focuses on using reliable data to inform decisions, innovate and continuously improve", "v": "cle", "vt": "CLEARED, on the institutionalisation limb", "body": ["You institutionalised data in decision-making rather than merely using it: a standing monthly Financial and Cost Control forum running earned value management with the CFO and Finance; a benefits framework carrying formal achievement status; P3M3 measurement of the delivery function; portfolio management tooling deployed across a delivery population with adoption driven; and a dedicated geospatial, data analytics and metrics workstream covering data collection, statistical and predictive analytics and visualisation.", "CALIBRATION. \"Culture\" is the stretch in this indicator. You have systems, forums and adoption — which is the honest claim. If probed on culture, answer with the Community of Practice and the tooling adoption rather than asserting a cultural change you cannot evidence."]}, {"c": "H2", "t": "Engage in high-level critical analysis of a wide range of complex information and formulate effective responses to critical policy issues", "v": "not", "vt": "NOT CLEARED", "body": ["See the opening section. Your responses to policy change have been operational and excellent. They have not been policy analysis, and the policy instruments at the Commission — funding submissions, the technology-assisted voting question, the parliamentary interface — sat with the Commissioner rather than with you.", "Do not stretch for this one. If it is probed, the honest answer is available and it is not weak: \"My responses to policy change have been delivery responses — when the early voting period was legislated down from thirteen days to seven mid-program, I re-based venue contracting, workforce rostering, logistics and communications against the new timetable. Policy formulation at the Commission sat with the Commissioner. Developing that capability is the next thing I want.\""]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: H4 lateral solutions with long-lasting organisation-wide impact · H5 governance systems that guarantee quality analysis and reform. Supporting: A5 · H1 · H3", "s": ["I joined the NSW Electoral Commission in October 2019 as Senior Manager, EPMO – Transformation. The agency delivers its entire product in concentrated events on a fixed multi-year cycle, and its delivery function was assessed at the lowest levels of portfolio, programme and project management maturity. Delivery practice was inconsistent, standards were received as compliance rather than as help, and the function had no defensible account of what it was for."], "t": ["To lift the delivery capability of an organisation that could not afford a failed election — and to do it in a way that survived me, because a maturity uplift that depends on one person is not a maturity uplift."], "a": ["I started with diagnosis rather than doctrine. A P3M3 assessment established where the function actually sat across portfolio, programme and project disciplines, which meant the design that followed was answering measured deficits rather than importing a template.", "The lateral move was in how I framed the function itself. Rather than defining the EPMO by the standards it published, I defined it as a catalogue of services — each with a named consumer, a defined offer and a performance expectation. That reframing changes the relationship: a standards body imposes, a service function is accountable to the people who consume it, and can be told when the service is poor.", "I built the operating model around that — a P3O structure, portfolio management tooling deployed across the delivery population with adoption driven rather than assumed, an assurance regime with gates and embedded reporting, and a change request pipeline that routed every proposal through EPMO review, Finance Business Partner and Chief Financial Officer approval before any decision forum saw it.", "And I established a monthly Community of Practice — topic-led rather than status-led, open to anyone interested rather than restricted by role — so the practice had somewhere to develop that was not a governance meeting.", "[CONFIRM: name the actual portfolio management platform, and the measurement basis for the adoption figure — what was counted, over what period, against what denominator]"], "r": ["The maturity of the delivery function was lifted measurably against the P3M3 scale.", "[CONFIRM: the honest start and end maturity levels, stated in P3M3’s own labels — 1 Aware, 2 Repeatable, 3 Defined, 4 Managed, 5 Optimised. Do not mix in CMMI terminology; an EPMO panel will catch it immediately]", "The more meaningful results are the durability tests. The Community of Practice outlasted my tenure and was still running after I left the role. The change request process I designed was still governing the election program I ran two roles later — I was subject to my own system, and I had to live with how well I had built it. And the methodology was later assessed by an external institution, in an unrelated sector, as the reference implementation of its own delivery optimisation model.", "The test of a system you build is not whether it works while you are there. It is whether it constrains you afterwards."], "notes": ["§ Delivery notes", "• Lead with the diagnosis. \"I started with a maturity assessment rather than a template\" is the analysis claim, and it is what distinguishes this from every candidate who has stood up a PMO.", "• The service catalogue reframe is your one genuine claim to originality. Make it explicitly — a standards body imposes, a service function is accountable to its consumers. Then let the external validation do the rest of the work.", "• Close on the durability line. \"I was subject to my own system\" is memorable, verifiable and unusual.", "• Fix the P3M3 labels before this goes anywhere. \"Quantitative\" is CMMI Level 4, not P3M3. Mixing the two models in one sentence is fatal in front of an EPMO panel, and a jump of three levels in thirty-one months will be challenged. Decide the honest end point and name it in P3M3’s own words."], "probes": [], "keys": ["Senior Manager", "Finance Business Partner", "Chief Financial Officer", "The Community"], "bul": []}, {"title": "STAR B — Advanced, extending to Highly advanced", "sub": "Primary indicators: A1 objective critical analysis recognising contextual issues · H3 organisation-wide implications of proposed solutions. Supporting: A2 · A3", "s": ["During the 2024 Local Government elections program I designed and led a MoSCoW prioritisation process with the business areas and the applications team, to sequence a development roadmap that had more demand in it than the calendar could carry.", "That method rests on an assumption: that the delivery teams consuming the prioritisation can actually work to it — that they are organised around products and increments rather than around fixed project scope. I had been advised by the portfolio manager that the applications teams were product-based agile squads. A new Information Services Application Director had just been onboarded."], "t": ["To test the assumption underneath my own instrument before the program committed to a roadmap built on it."], "a": ["I asked to attend one of the squad meetings. Every team lead reported through a project status report.", "That single observation was enough to question the premise. A team organised around products reports differently from one organised around a fixed scope, and the reporting format is a reasonable proxy for how the work is actually being planned. My conclusion was that delivery maturity was lower than I had assumed, and therefore that the prioritisation process might not yield the outcome I was expecting — not because the process was wrong, but because its assumptions were.", "I then examined the implication rather than the finding. The obvious response was to change the operating model. But the organisation delivers its entire product in a concentrated event on a multi-year cycle, against a statutory date, with institutional knowledge concentrated in people rather than documents. Reforming a delivery model in the months before that event risks a failure that cannot be recovered inside the calendar, and the reform itself would be led by a director who had not yet been through one.", "I raised it with her in a one-to-one. She had observed the same thing and had decided not to change anything until she had experienced a full election cycle. On the organisation-wide implications, her judgement was better than my instinct, and I backed it — while separating the two questions. The decision was hers. The residual risk went into the Technology, Scope and Risk Steering Committee, where it was collectively owned, visible and covered by the assurance regime for the remainder of delivery."], "r": ["The election was delivered on time and within its investment authority, and the risk was managed through governance rather than through a mid-flight change to how a team worked.", "The analytical caveat I would offer unprompted is that my own governance may have shaped what I observed. An EPMO assurance regime that requires project-format reporting will receive project-format reporting from product teams regardless of how they work internally. If that was part of what I saw, then the maturity constraint was partly mine — and the resolution is to gate the investment decision rather than the delivery decision, funding in stages and governing delivery through standing conditions that are continuously evidenced."], "notes": ["ALLOCATION WARNING. This shares an event with STAR C in the Manage self pack, framed differently — there it is backing a leader whose approach differed from yours, here it is the analysis and the implications reasoning. Use one or the other in a single application, never both.", "§ Delivery notes", "• The final paragraph is what lifts this from Advanced to Highly advanced. Volunteering that your own instrument may have distorted your evidence is the definition of objective analysis, and it converts the single probe that could unpick this story into your strongest moment in it.", "• The structure to keep is finding, then implication, then decision. Most candidates stop at the finding. This indicator is about the implications reasoning, not the observation.", "• Probe — \"You were overruled by someone junior to you in the program structure.\" → \"I was not overruled. It was her decision to make and I agreed with it on the reasoning. What I owned was making sure the risk it left behind was visible to the people accountable for the program.\""], "probes": [], "keys": ["Information Services Application Director", "Risk Steering Committee"], "bul": []}], "notes": [{"h": "Verdict", "body": []}, {"h": "The finding that matters more than the capability", "body": ["H2 asks for \"high-level critical analysis of a wide range of complex information and effective responses to critical POLICY issues\". You do not have it, and the reason is structural rather than accidental.", "When the Electoral Act was amended mid-program to cut early voting from thirteen days to seven, you produced an outstanding DELIVERY response — venue contracting, workforce rostering, logistics and communications all re-based against the new timetable. What you did not produce, and were not positioned to produce, was a policy analysis. The funding submissions were the Commissioner’s. The technology-assisted voting question predates you.", "Put that beside two gaps from the earlier packs and a pattern resolves:", "You are an execution executive, not a policy executive. That is a positioning fact, not a criticism — and it is worth more to you than any single indicator.", "WHAT TO DO WITH IT. Target EPMO and PMO Director, Program Director, Delivery Director and portfolio roles, where execution authority is the core of the job and your evidence is overwhelming. Be cautious about roles whose centre of gravity is policy development, sector stewardship or intergovernmental negotiation — you would be competing on your weakest ground against people whose whole career is that ground. This should also shape the CV positioning statement: claim execution authority at scale, not policy breadth."]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner.", "ACU Delivery Optimisation brief (Position 10613501, HEW 9) — R1–R9 EPMO service catalogue and the investment-gating model.", "NSWEC LGE24 governance model and Program Management Plan retrospective (OFFICIAL–Sensitive) — supplied.", "Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025 — supplied.", "Candidate-supplied evidence, 14–15 August 2026."]}], "script": {"id": "tsp", "intro": ["This capability is the analysis test. The framework defines it as thinking, analysing and considering the broader context to develop practical solutions. At Advanced, a panel wants to watch you reason under real constraint. At Highly advanced they want the systems that keep good analysis happening when you are not in the room.", "The line between Adept and Advanced is the width of the frame. Adept solves the problem in front of it. Advanced solves it while holding the things outside it. The statutory date. The knowledge that walks out the door with a vendor. The committee whose capacity is already spent.", "The trap here is telling outcome stories. Most candidates say I identified the problem and I built the fix. That answers delivery, not analysis. A panel wants the options you weighed and the context that ruled one out. If your story has no discarded option in it, it isn't an analysis story yet."], "standing": ["Here is where you stand. At Advanced you clear all seven indicators, two of them exceptionally, A5 and A7. At Highly advanced you clear 4 of 5. Four indicators across the capability are exceptional, A5, A7, H5 and H4. Seven are cleared. One is not cleared, and that is H2.", "So this is claimable at Highly advanced on four of five. Claim it knowing H2 is a real gap, and be ready to be taken there. Just know where the floor is thin. A4 is cleared on what you did and weak on how you tell it. H2 is a genuine gap, and it's the most strategically important finding in this pack."], "inds": {"A1": ["A1 asks for objective critical analysis that reaches accurate conclusions and recognises contextual issues. A panel will accept a conclusion you drew from traceable evidence, not one you were handed. Your best instance is small, and that's what makes it good. You attended a squad meeting, saw that every team lead in a supposedly product-based agile team reported through a project status report, and inferred that delivery maturity was lower than assumed and that the prioritisation method you'd built might not produce what you expected.", "The word objective invites the harder observation. So in the room, it sounds like this. My own governance may have shaped what I observed, because an assurance regime that demands project-format reporting will get project-format reporting whatever the teams do underneath."], "A2": ["A2 is about working through issues, weighing alternatives and landing the most effective solution with others rather than alone. A panel will accept named options with costs attached. It will reject a decision that arrived fully formed. The vendor decision is your cleanest. Terminate, escalate, or supplement. Three live options, different costs, all evaluated against a statutory date. And you resolved it with the Steering Committee rather than presenting it as a fait accompli. So in the room, it sounds like this. I took the committee three options and the cost of each against the statutory date, and we resolved it together."], "A3": ["A3 is the wider business context indicator. The test is whether the decisive factor sat outside the immediate problem. Yours does, three times over. You didn't terminate the incumbent because the knowledge would leave with them and the calendar couldn't absorb re-acquisition. You designed a Procurement Steering Committee because the Program Steering Committee's capacity was the scarce resource. You resolved a due diligence requirement because the downstream sequence had no float. So in the room, it sounds like this. The reason I didn't terminate wasn't performance. It was that the knowledge would have left with them and the calendar had no room to re-acquire it."], "A4": ["A4 asks you to explore a range of possibilities and creative alternatives to improve systems, processes and business practices. It's cleared, but the caveat is about how you present, not what you did. Almost every story you give is shaped as I identified X and I built Y. The options you rejected are missing from the telling. A panel probing analysis will ask what else you looked at, and I built the service catalogue doesn't answer that. Before any interview, take your three strongest solutions and reconstruct the alternatives you discarded and why. You did weigh them. You just don't narrate them, and here the narration is the evidence."], "A5": ["A5 wants systems and processes supported by high-quality research and analysis. The test is sequence. Did the analysis come first, or did you fit it around a decision already made. Yours came first every time. A P3M3 maturity assessment that drove a P3O operating model design. A procurement tracker built before a strategy and prioritised by risk. A service catalogue built from stakeholder feedback rather than doctrine. An independent evaluation commissioned across six instruments. This one is cleared exceptionally. So in the room, it sounds like this. I started with a maturity assessment rather than a template, so the design answered measured deficits instead of importing someone else's model."], "A6": ["A6 is about designing innovative solutions for customer needs and service demands. You have the material. The complaint handling process, Election Operations Reporting, accessibility as a mandatory gate criterion, and the AI transformation program with the University of Sydney. But be careful with the word innovative. Your strength is rigour, not novelty. A complaint triage process is excellent practice rather than innovation, and a panel that hears you claim otherwise will discount the rest.", "Where you're genuinely original is the reframe, later assessed by an external institution as a reference implementation. Claim originality there and nowhere else. So in the room, it sounds like this. The original move was defining the EPMO as a catalogue of services with named consumers rather than as a standards body."], "A7": ["A7 is evaluation against clear criteria, and the word doing the work is criteria. A panel will reject we reviewed it and it went well. It wants the standard set in advance. You have a benefits framework with six benefits carrying formal achievement status at closure. Gate 2 criteria expressed as testable conditions. Earned value management through a standing monthly forum. P3M3 measurement of the delivery function itself. And an independent service evaluation across roughly 3,500 respondents. So in the room, it sounds like this. I can evidence evaluation at three levels. The programme through benefits, the function through P3M3, and the service through an independent evaluation of roughly 3,500 respondents."], "H5": ["H5 asks whether effective governance systems are in place to guarantee quality analysis, research and reform. Read the word guarantee. A panel wants machinery that produces good analysis without you standing over it. This is your strongest indicator here. Seven forums with defined membership, cadence and decision rights. An EPMO assurance regime with gate, change request and embedded assurance reporting. Gate 2 as a mandatory readiness control. A Procurement Steering Committee with probity in its remit. So in the room, it sounds like this. Nothing reached a decision forum in my program until it had been through EPMO review, the Finance Business Partner and the Chief Financial Officer."], "H4": ["H4 has two tests inside it, long-lasting and organisation-wide. Most candidates answer with novelty and miss both. You have a clean proof of each. The change request process you designed in the EPMO Transformation role was still governing the program you ran two roles later. You were subject to your own system. The Community of Practice you established outlasted your tenure. The methodology was adopted agency-wide and was later assessed by an external institution as the reference implementation of its delivery model. So in the room, it sounds like this, and use these exact words. The durability test of a system you build is whether it constrains you afterwards. Mine did."], "H3": ["H3 asks you to identify and evaluate organisation-wide implications when you consider solutions. The test is whether you reasoned past your own patch. The Procurement Steering Committee came from reasoning about what the Program Steering Committee would lose if it kept absorbing tender decisions. Consolidating change requests came from reasoning about where the burden of assembly should sit across the whole program. So in the room, it sounds like this. I asked what the rest of the organisation would carry if I solved my problem my way, and the risk of reform before a full event outweighed the benefit."], "H1": ["H1 is about establishing and promoting a data-literate culture that uses reliable data to inform decisions. You clear it on the institutionalisation limb, because you built data into decision-making rather than merely using it. A standing monthly Financial and Cost Control forum running earned value management with the Chief Financial Officer and Finance. A benefits framework carrying formal achievement status. P3M3 measurement of the delivery function. Portfolio management tooling deployed across a delivery population with adoption driven.", "Now the calibration. Culture is the stretch word here. You have systems, forums and adoption, and that's the honest claim. If a panel probes culture, answer with the Community of Practice and the tooling adoption rather than asserting a cultural change you can't evidence."], "H2": ["H2 wants high-level critical analysis of a wide range of complex information, and effective responses to critical policy issues. This one is not cleared. Your responses to policy change have been operational and excellent, but they haven't been policy analysis. The funding submissions, the technology-assisted voting question and the parliamentary interface sat with the Commissioner rather than with you.", "Don't stretch for this one. If it's probed, the honest answer is available and it isn't weak. My responses to policy change have been delivery responses. When the early voting period was legislated down from thirteen days to seven mid-program, I re-based venue contracting, workforce rostering, logistics and communications against the new timetable. Developing policy capability is the next thing I want."]}, "stars": [["This is your Highly advanced answer. It carries H4 and H5 as primaries, with A5, H1 and H3 underneath. What makes it strong is that it opens with diagnosis rather than doctrine. A P3M3 assessment before any design meant the operating model answered measured deficits instead of importing a template. Lead with that. It separates you from every candidate who has stood up a PMO.", "The moment doing the real work is the service catalogue reframe. A standards body imposes. A service function is accountable to the people who consume it. Make that distinction explicitly, let the external validation carry the rest, then close on the durability line. And here's what you must not forget. Fix the P3M3 labels first. Quantitative belongs to the CMMI model, not to P3M3, and mixing the two is fatal in front of an EPMO panel."], ["This one runs at Advanced and extends into Highly advanced. It carries A1 and H3 as primaries, with A2 and A3 supporting. The structure to keep is finding, then implication, then decision. Most candidates stop at the finding. One allocation warning first. It shares an event with a STAR in the Manage self pack, framed differently there. Use one or the other in a single application, never both.", "The last paragraph is what lifts this from Advanced to Highly advanced. Volunteering that your own instrument may have distorted your evidence is the definition of objective analysis, and it turns the one probe that could unpick this story into your strongest moment in it. If a panel says you were overruled by someone junior to you, your answer is ready. I wasn't overruled. It was her decision to make and I agreed with the reasoning. What I owned was making the residual risk visible."]], "outro": ["Two jobs on this capability. Reconstruct the rejected alternatives behind your three strongest solutions, because A4 is cleared on what you did and thin on how you tell it. And leave H2 where it is, other than the honest answer, because the gap is structural. You're an execution executive, not a policy executive. That's a positioning fact, not a criticism, and it points you at EPMO and PMO Director, Program Director, Delivery Director and portfolio roles. The strongest sentence you own here is this. The test of a system you build is not whether it works while you are there, it's whether it constrains you afterwards."]}}, {"id": "da", "name": "Demonstrate accountability", "group": "Results", "desc": "Be proactive and responsible for your actions, and follow legislation, policy and guidelines", "verdict": [["Advanced", "8 of 8 cleared, five exceptionally"], ["Highly advanced", "7 of 8 cleared, three exceptionally. H2 partial on cultural safety"]], "adv": [{"c": "A1", "t": "Design and develop systems to establish and measure accountabilities", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["This is the indicator your whole career answers. Seven governance forums with terms of reference defining membership and decision-making powers. A service catalogue with a named consumer and a performance expectation for every service. A benefits framework with formal achievement status. A change request pipeline routing every proposal through EPMO review, Finance Business Partner and Chief Financial Officer approval before any decision forum sees it. Gate 2 criteria that are binary and testable."]}, {"c": "A2", "t": "Ensure accountabilities are exercised in line with government and organisational goals", "v": "cle", "vt": "CLEARED", "body": ["The EPMO provided compliance and assurance over the program, with gate, change request and embedded assurance reporting throughout delivery. Nine functional directors carried delivery accountability into a Project Leadership Forum that governed scope, budget, schedule and financial risk fortnightly."]}, {"c": "A3", "t": "Exercise due diligence to ensure work health and safety risks are addressed", "v": "cle", "vt": "CLEARED", "body": ["Due diligence exercised at the only point where it changes anything — the design of the resourcing model. An eight-hour-per-day basis, carried in the Election Workforce Staffing Model, approved at gate and funded through a $35 million workstream, across a workforce of 22,990 in 2,486 venues. See the section above for the framing and the boundary to hold."]}, {"c": "A4", "t": "Oversee quality assurance practices", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Three distinct assurance layers, which is unusual. The EPMO assurance regime over the program. Technical assurance through the Technology, Scope and Risk forum with UAT and performance-readiness entry and exit criteria and system go-live control. And counting assurance — two-officer checks, discrepancy thresholds, data-entry review and recount protocols standardised before preference distribution.", "That third layer is worth naming explicitly. Quality assurance over a count is quality assurance where the output cannot be corrected afterwards without a legal process, and where the target was zero outcome-altering recounts."]}, {"c": "A5", "t": "Model the highest standards of financial probity, demonstrating respect for public money and other resources", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The contingency return is the exemplar and it is stronger than a personal probity claim because it was systemic: a mechanism that made underspend visible across the whole program and returnable rather than absorbed. Supported by a standing monthly Financial and Cost Control forum running earned value management with the Chief Financial Officer and Finance, and by procurement probity built into the tracker and the Procurement Steering Committee remit."]}, {"c": "A6", "t": "Monitor and maintain the business unit’s knowledge of and compliance with legislative and regulatory frameworks", "v": "cle", "vt": "CLEARED", "body": ["The program operated under a documented legislative authority set: the Local Government Act and Regulation, the Electoral Act, the Privacy and Personal Information Protection Act, the Government Information (Public Access) Act, the State Records Act, and NSW protective security and cyber policies. Naming that set from memory in an interview is itself the evidence for this indicator — most candidates cannot."]}, {"c": "A7", "t": "Incorporate sound risk management principles and strategies into business planning", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Risk was not a register alongside the plan; it was a condition inside it. Gate 2 could not be passed with any uncontrolled high or extreme risk. The procurement tracker was prioritised by risk before any strategy was written. A weekly Program Leadership forum governed risks and issues. The program closed with no high residual risks."]}, {"c": "A8", "t": "Make strategic and sustainable choices that balance meeting short-term goals with long-term success", "v": "cle", "vt": "CLEARED", "body": ["Three genuine trade-offs, each resolved against the long term. Retaining a failing vendor rather than terminating, because the knowledge would have left with them. Backing a new director’s decision not to reform her operating model until she had been through a full cycle, accepting a maturity gap in exchange for stability through the event. And building a Community of Practice designed to outlast you rather than a forum that depended on you."]}], "ha": [{"c": "H1", "t": "Direct the development of effective systems for establishing and measuring accountabilities, and evaluate ongoing effectiveness of those systems", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Note the second limb, which most candidates miss entirely: evaluate the ongoing effectiveness of the accountability systems themselves.", "You have the rarest possible evidence for it. The accountability systems you built were evaluated by the people subject to them — at the LGE24 kick-off, publicly and unfavourably — and you acted on that evaluation by rebuilding the function as a service catalogue with its consumers. Add P3M3 measurement of the delivery function, and an independently commissioned evaluation of the service. You measure the instruments, not just the outputs."]}, {"c": "H6", "t": "Direct the development of short and long-term risk management frameworks to ensure government aims and objectives are achieved", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The resilience proposal is the exemplar and it is a framework rather than a register. After event assurance did not achieve its posture at SGE23, you drafted a proposal for a new project and took ownership of business resilience and crisis management, with rehearsed scenarios across ransomware, disinformation, sovereign insider threat, and fire and flood. Short-term risk management is a program discipline; standing up an organisational resilience capability that outlives the event is the long-term half of this indicator.", "ALLOCATION. This is the same event as the Highly advanced STAR in the Display resilience and courage pack. Use one or the other in a single application."]}, {"c": "H3", "t": "Set standards and exercise due diligence to ensure work health and safety risks are addressed", "v": "cle", "vt": "CLEARED", "body": ["The standards limb is the harder one and you have it. An eight-hour resourcing basis is a standard — a number that determines how many people must be recruited, how venues are rostered and what the workstream costs. Setting it at planning stage, carrying it in an approved staffing model and gating that model is standard-setting followed by due diligence, in that order.", "Say it inside the published framework rather than instead of it: the Commission publishes a ten-hour shift limit, a minimum ten-hour break between rostered shifts, a six-consecutive-day maximum, a no-isolation rule and hard stops on election night. Your programme resourced more conservatively than the ceiling — which is the version of this claim that survives any scrutiny."]}, {"c": "H4", "t": "Inspire an organisational culture that respects the obligation to manage public money and other resources responsibly and with the highest standards of probity", "v": "cle", "vt": "CLEARED", "body": ["\"Inspire\" is the stretch word and you should not try to meet it rhetorically. Meet it structurally instead: you built the mechanism through which savings across a $150M program became visible and returnable rather than quietly absorbed at year end. A culture of respect for public money is produced by making underspend easy to return and hard to hide, and that is what the consolidated change request did."]}, {"c": "H5", "t": "Ensure that legislative and regulatory frameworks are applied consistently and effectively across your organisation", "v": "cle", "vt": "CLEARED", "body": ["The documented legislative authority set, applied through the EPMO assurance regime across the agency’s delivery portfolio, with probity embedded in the procurement architecture and privacy and records obligations live in a program handling elector data at scale."]}, {"c": "H7", "t": "Promote data risk compliance in your organisation", "v": "cle", "vt": "CLEARED, and better than you realise", "body": ["This indicator is new in Version 3, and its timing works in your favour. The NSW Mandatory Notification of Data Breach scheme commenced on 28 November 2023 under the Privacy and Personal Information Protection Act. The 2024 Local Government elections were therefore conducted under a statutory data breach notification regime that had been in force for less than a year.", "The scheme requires an agency to contain a breach immediately, assess within 30 days where there are reasonable grounds to suspect an eligible breach, notify the Privacy Commissioner, notify affected individuals, maintain a published data breach policy and an internal register, and keep a public notification register for at least twelve months.", "Your program had two data breach incidents and the external one is described in the Commission’s own published report — the loss of a printed electoral roll for a ward, an investigation conducted with other agencies, direct mail to affected individuals, and an apology. Read against the scheme, that is containment, assessment, and notification of affected individuals, documented in the public record.", "HOW TO USE IT. Do not claim you designed the Commission’s privacy compliance. Claim what is true and specific: you ran a program handling elector data at scale through the first local government election conducted under the MNDB scheme, and when two incidents occurred they were contained, assessed and notified in accordance with it. Naming the scheme, its commencement date and the thirty-day assessment obligation from memory will place you ahead of almost every candidate in the room."]}, {"c": "H8", "t": "Anticipate changes to the operating environment and make sustainable choices that lead to long-term success", "v": "cle", "vt": "CLEARED", "body": ["The resilience project anticipated a threat environment rather than responding to an incident. The service catalogue anticipated future methodology disputes and built the engagement commitment that prevents them. The Procurement Steering Committee anticipated the governance load that had degraded the previous election. In each case the change was made before the failure, which is the whole of this indicator."]}, {"c": "H2", "t": "Promote participatory approaches to ensure a culture of accountability and cultural safety with clear links to government goals", "v": "par", "vt": "PARTIAL", "body": ["The participatory limb clears strongly: a service catalogue co-designed with the people subject to it, a Project Managers Forum built for psychological safety, a Community of Practice open to anyone interested rather than restricted by role, and a change request pipeline that engages every accountable party before a decision forum sees the paper.", "THE CULTURAL SAFETY LIMB DOES NOT CLEAR — AND THIS IS THE SECOND TIME. In NSW public sector usage, cultural safety most often means Aboriginal cultural safety specifically. The same limb defeated you at Work collaboratively H5. Your best evidence remains the commissioning of a First Nations interviewer for First Nations respondents in the service evaluation — which is a genuine cultural capability decision, but it is research design rather than how a team works. Two capabilities now turn on this. It is the second recurring gap in your portfolio after recognition."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: H1 direct the development of systems for establishing and measuring accountabilities, and evaluate their ongoing effectiveness · A1 design and develop systems to establish and measure accountabilities. Supporting: A2 · A4", "s": ["The 2024 Local Government elections program carried a $150 million investment authority, thirteen aggregate projects, fourteen workstreams and ten project managers — and its delivery resources sat under functional executives who did not report to me. Eleven of the organisation’s twelve Band 1 executives reported into the program for delivery, at a substantive grade above my own.", "In that structure accountability cannot rest on line authority, because there is none. It has to be designed."], "t": ["To build an accountability architecture in which every decision had a named owner, a forum with the standing to make it, and a record — before delivery began, not after the first dispute."], "a": ["I established seven governance forums, each with terms of reference defining membership and decision-making powers, and each constituted to settle a distinct class of decision: program governance and management control at the Steering Committee; technical scope, risk and go-live; procurement of high-risk tenders; aggregate project governance; program risks and issues; financial and cost control with earned value management; and a Project Managers Forum for escalation, blockers and interdependencies.", "[CONFIRM: whether you authored the terms of reference. If you wrote them, the claim moves from \"chaired forums with defined decision rights\" to \"defined the decision rights of the forums I chaired\" — a materially stronger sentence]", "I made the accountabilities measurable rather than declared. A benefits framework carried six benefits with formal achievement status. Gate 2 expressed readiness as binary conditions that could be failed. A change request pipeline routed every proposal through EPMO review, Finance Business Partner and Chief Financial Officer approval before any decision forum saw it. And quality assurance ran in three layers — EPMO assurance over the program, technical entry and exit criteria for go-live, and counting assurance with two-officer checks, discrepancy thresholds and recount protocols standardised before preference distribution.", "The Elections PMO acted as secretariat to all seven forums, which meant the record was single, consistent and mine to keep."], "r": ["The program delivered on time and within authority, closed with no high residual risks, and recorded all benefits as achieved.", "The part I would put in front of a panel, though, is what happened to the architecture itself. At the program kick-off the delivery community told me directly that the enterprise methodology underneath it was not serving them — and it was methodology I had built in my previous role. I minuted every concern as stated, and the response was structural: the function was redefined as a service catalogue with a named consumer and a performance expectation for every service, jointly developed with the people who consume it.", "An accountability system that has never been evaluated by the people subject to it is an assumption. Mine was, unfavourably, in public, and I rebuilt it."], "notes": ["§ Delivery notes", "• The Situation is the strongest opening you have for this capability. \"Accountability cannot rest on line authority, because there is none. It has to be designed.\" That sentence earns the rest of the answer.", "• The Result deliberately uses the kick-off as evaluation evidence, not as a resilience story. If the kick-off arc is already committed to Display resilience and courage or Manage self, cut the last two paragraphs and close on the three assurance layers instead.", "• Probe — \"How did you hold executives accountable with no authority over them?\" → \"Through the forums and the record. A decision made in a forum with defined membership and minuted decision rights is not mine to enforce — it is theirs to have made.\""], "probes": [], "keys": ["$150 million", "Steering Committee", "Project Managers Forum", "Finance Business Partner", "Chief Financial Officer"], "bul": []}, {"title": "STAR B — Advanced, extending to Highly advanced", "sub": "Primary indicators: A5 model the highest standards of financial probity · H4 inspire an organisational culture that respects the obligation to manage public money. Supporting: A1 · A7", "s": ["The 2024 Local Government elections program held a $150 million investment authority with a $12 million contingency provision inside it. The agency had sought substantial additional funding ahead of the cycle and had not received it, and the Electoral Commissioner had retired months before delivery with an Acting Commissioner in place.", "In that environment the ordinary institutional behaviour is to protect contingency, spend it late, and finish inside authority without anyone learning anything about where the money actually went."], "t": ["To run the program’s finances so that underspend was visible while it could still be returned, rather than discovered at closure — and to do it without weakening change control."], "a": ["The financial control architecture had three parts. A standing monthly Financial and Cost Control forum with the Chief Financial Officer, Finance and the EPMO, running earned value management, portfolio and corporate governance risk, and contingency management. A change request pipeline that routed every proposal through EPMO review, Finance Business Partner approval and CFO approval before it reached the Program Director, the Project Leadership Forum and the Steering Committee. And monthly benefits and cost tracking against stage-gated releases with delegated approvals.", "The move that mattered was consolidating change into a single program-wide change request rather than requiring each project to raise its own. The Elections PMO assembled it, so project managers and project owners were not producing change paperwork at the point in the program where their time was worth most. The rigour was unchanged; what changed was who carried the burden of assembling it — and, as a by-product, that the Chief Financial Officer was looking at the whole picture at once rather than at ten partial views.", "[CONFIRM: what the change request actually changed — scope, schedule, budget re-baselining, or a combination]"], "r": ["The entire $12 million contingency provision went unspent and was returned, evidenced by total programme expenditure finishing below the $150 million investment authority.", "ACCOUNTING PRECISION — do not vary this phrasing. Contingency is a budget provision, not an expense classification. It never appears as an expense line, and unspent contingency never becomes expenditure. The return is evidenced by total expenditure finishing below the investment authority. That is the correct and defensible formulation in front of a finance-literate panel.", "The wider point is that this was not an act of restraint. It was the output of a control system that made underspend easy to see and easy to return. Personal probity is worth stating once; a mechanism that produces probity from everyone else is worth more, and it is what this indicator is actually asking about."], "notes": ["ALLOCATION WARNING. This shares an event with the Act with integrity pack and with Deliver results STAR B. Three capabilities want the contingency return. Use it once. This version is written as a system of financial control rather than as a single decision, which is the framing that fits this capability — but it is still the same $12 million.", "§ Delivery notes", "• Never lead with the $12 million. Lead with the system. If you lead with the number it sounds like a saving; if you lead with the mechanism the number becomes evidence.", "• The consolidation argument is the sophisticated part. \"Ten separate requests get ten partial views; one program-wide request gets the CFO looking at the whole picture at once, which is how the savings became visible.\"", "• Probe — \"Was the contingency simply over-provisioned?\" → answer at the level of provision methodology, not defensiveness. Contingency is set against assessed risk exposure at the time of authority; returning it in full means the risks were managed down, not that the provision was wrong."], "probes": [], "keys": ["$150 million", "$12 million", "Electoral Commissioner", "Cost Control", "Chief Financial Officer", "Finance Business Partner"], "bul": []}], "notes": [{"h": "Verdict", "body": ["With the work health and safety evidence supplied on 16 August, this is now your strongest capability in the framework. This pack has been revised; the earlier verdict on A3 and H3 is superseded."]}, {"h": "Work health and safety — the gap, now closed", "body": ["An earlier version of this pack recorded work health and safety as unevidenced and noted that you had never raised it across nine capabilities. The evidence exists and it is better than most candidates could produce.", "The programme was resourced on a rigorous eight-hour-per-day model, carried in the Election Workforce Staffing Model — a deliverable approved at gate on 30 March and funded through the $35 million staffing and training workstream.", "§ Why that is a serious WHS control and not a policy statement", "Capping daily hours across 2,486 venues, seven days of early voting, election day and multiple count centres does not save money — it costs it. An eight-hour resourcing basis requires materially more people than a model where one person works the day, and it is a large part of why the workforce is 22,990 rather than a smaller number. That is money spent on fatigue risk, decided at planning stage, carried in an approved artefact and gated.", "Fatigue is the principal work health and safety risk in election delivery, and it is the one an executive controls at the point of designing the resourcing model — not on the day.", "§ The published framework it sits inside", "The Commission publishes its fatigue management standards, and they are worth knowing verbatim because they let you place your decision in context:", "• \"We take sufficient breaks (30 minutes every five hours).\"", "• \"We have a minimum break of 10 consecutive hours between rostered shifts.\"", "• \"We do not work more than a 10 hour shift (with the exception of election day).\"", "• \"We do not work more than six consecutive days.\"", "• \"We do not work in isolation.\"", "Plus hard stops on the night: counting stops at 10pm, election office staff do not work past 10:30pm, staff do not drive more than an hour from a venue to a material drop-off point, and return-of-material staff do not work past midnight.", "ONE PRECISION POINT BEFORE YOU CLAIM THIS. The published Commission-wide cap is a ten-hour shift. You describe an eight-hour resourcing model. If eight hours was your programme’s rostering and planning basis — more conservative than the published limit — say exactly that. Do not let it read as though you set the Commission’s standards. \"We resourced the programme on an eight-hour basis, inside a published fatigue framework that permits ten\" is both accurate and more impressive than the looser version.", "AND HOLD THE DELIVERY BOUNDARY. The staffing and training workstream was delivered by the HR Director. Same structure as the ICT agreements: their deliverable, your programme accountability. You governed it, funded it and gated it — you did not write the roster. Saying so is consistent with every other boundary you have drawn, and it is what makes the claim credible.", "§ The second legislative change mid-programme", "The Local Government (General) Amendment (Elections) Regulation 2024 commenced in August 2024, weeks before polling day. It made it an offence to film or photograph election officials and scrutineers in a way likely to make them feel intimidated or harassed, and gave election managers and polling place managers power to give health and safety directions at any voting place. It came out of the 2023 State general election, where the Acting Electoral Commissioner stated publicly that staff had been \"filmed and falsely accused of wrongdoing, while carrying out their duties, by members of the public.\"", "Note what that gives you beyond WHS: you have absorbed legislative change during delivery in two consecutive programmes — early voting cut from thirteen days to seven at SGE23, and the safety regulation at LGE24. That is a stronger claim than either instance alone, and it belongs in your Manage self ans
