    if(!(s.keys||[]).length)kb.appendChild(el('div','sub','This answer carries no hard figures — judge it on structure instead.'));
    c.appendChild(kb);
    const hc=el('div','sub',Object.keys(hits).length+' of '+(s.keys||[]).length+' key facts landed');hc.id='hitc';
    hc.style.marginTop='6px';c.appendChild(hc);
    const rr=el('div','row');rr.style.marginTop='10px';
    const cl=el('button','btn gh sm','Clear');cl.onclick=()=>{hits={};transcript='';render();};
    rr.appendChild(cl);c.appendChild(rr);

    /* ---- 2. dictate with the keyboard mic, or type ---- */
    c.appendChild(el('div','vt','2 · Or dictate it, and let it mark itself'));
    c.appendChild(el('div','sub','Tap the box, then tap the <b>microphone key on your keyboard</b> — bottom right, next to the space bar. That is Apple’s own dictation, and it is far more reliable than anything a web page can do. Speak your whole answer, then tap Done.'));
    const ta=document.createElement('textarea');
    ta.className='tx';ta.id='trans';ta.value=transcript;
    ta.placeholder='Dictate or type your answer here…';
    ta.style.cssText='width:100%;min-height:130px;margin-top:8px;background:#16233c;border:1px solid var(--line);color:#d7e2f4;border-radius:12px;padding:12px;font-size:15px;line-height:1.5;resize:vertical';
    ta.oninput=()=>{transcript=ta.value;checkHits(s);paintHits(s);};
    c.appendChild(ta);

    /* ---- 3. optional in-page microphone ---- */
    const mwrap=el('div');mwrap.style.marginTop='18px';
    mwrap.appendChild(el('div','vt','3 · In-page microphone (optional)'));
    const nt=el('div','sub','Live transcription inside the app. It is unreliable on iPhone — if it does not start within a few seconds it will stop itself and tell you. The dictation box above is the better route on iOS.');
    nt.id='micnote';mwrap.appendChild(nt);
    const mrow=el('div','row');mrow.style.cssText='margin:14px 0;align-items:center;gap:14px';
    const why=micAvailable();
    const mic=el('button','mic'+(recOn?' rec':''),recOn?'■':'●');
    mic.setAttribute('aria-label',recOn?'Stop listening':'Start listening');
    if(why){mic.disabled=true;mic.style.opacity=.35;}
    mic.onclick=()=>{
      if(recOn){killRec();note('Stopped. What was captured is in the box above.');mic.className='mic';mic.textContent='●';return;}
      const bad=micAvailable();
      if(bad){note(bad+' Use the dictation box above instead.','warn');return;}
      stopSpeech();                       /* never hold the audio session while listening */
      killRec();
      rec=initRec();
      if(!rec){note('Could not start speech recognition. Use the dictation box above instead.','warn');return;}
      let started=false;
      recOn=true;mic.className='mic rec';mic.textContent='■';
      note('Waiting for the microphone…');
      recWatch=setTimeout(()=>{
        if(!started){killRec();mic.className='mic';mic.textContent='●';
          note('The microphone did not respond. On iPhone this usually means Safari has no microphone permission for this site. Check <b>Settings › Safari › Microphone</b>, or just use the dictation box above — it works everywhere.','warn');}
      },5000);
      rec.onstart=()=>{started=true;if(recWatch){clearTimeout(recWatch);recWatch=null;}
        note('Listening. Speak your answer, then tap the square to stop.');};
      rec.onresult=(e)=>{
        try{
          let t='';
          for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';
          transcript=(transcript+' '+t).replace(/\s+/g,' ').trim();
          const box=document.getElementById('trans');if(box)box.value=transcript;
          checkHits(s);paintHits(s);
        }catch(err){}
      };
      rec.onerror=(e)=>{
        const code=(e&&e.error)||'unknown';
        killRec();mic.className='mic';mic.textContent='●';
        note(code==='not-allowed'||code==='service-not-allowed'
          ? 'Microphone permission was refused. Open <b>Settings › Safari › Microphone</b> and allow it for this site, or use the dictation box above.'
          : 'The microphone stopped ('+esc(code)+'). Use the dictation box above instead.','warn');
      };
      rec.onend=()=>{
        if(recWatch){clearTimeout(recWatch);recWatch=null;}
        recOn=false;rec=null;mic.className='mic';mic.textContent='●';
        if(started)note('Stopped. Tap again to add more, or check the box above.');
      };
      try{rec.start();}
      catch(err){killRec();mic.className='mic';mic.textContent='●';
        note('Could not start the microphone. Use the dictation box above instead.','warn');}
    };
    mrow.appendChild(mic);
    mrow.appendChild(el('div',null,'<div style="font-weight:700">'+(why?'Not available here':'Tap to listen')+'</div><div class="sub">'+(why?esc(why):'Optional — the dictation box above is more reliable')+'</div>'));
    mwrap.appendChild(mrow);
    c.appendChild(mwrap);

    /* ---- compare ---- */
    const r=el('div','row');r.style.marginTop='16px';
    const cmp=el('button','btn gh sm','Show the drafted answer');
    const bd=el('div');bd.style.display='none';bd.appendChild(starBody(s));
    cmp.onclick=()=>{bd.style.display=bd.style.display==='none'?'':'none';};
    const hear=el('button','btn gh sm','▶ Hear it delivered');
    hear.onclick=()=>{killRec();const qs=[];['s','t','a','r'].forEach(k=>(s[k]||[]).forEach(p=>sentences(p).forEach(x=>qs.push({text:x}))));
      playSegs(qs,{onSeg:()=>{},onDone:()=>{}});};
    const stp=el('button','btn gh sm','■ Stop');stp.onclick=()=>{killRec();stopSpeech();};
    r.appendChild(cmp);r.appendChild(hear);r.appendChild(stp);c.appendChild(r);c.appendChild(bd);
    m.appendChild(c);
  }
  if(practice==='shadow'){
    const lines=[];['s','t','a','r'].forEach(k=>(s[k]||[]).forEach(p=>sentences(p).forEach(x=>lines.push(x))));
    if(pIx>=lines.length)pIx=0;
    const c=el('div','card');
    c.appendChild(el('div','vt','Shadowing · line '+(pIx+1)+' of '+lines.length));
    c.appendChild(el('div','sub','The coach says one line. You say it straight back, out loud, in your own rhythm. Then move on. This is how a written answer becomes a spoken one.'));
    const stage=el('div','stage');stage.style.marginTop='16px';
    const aw=el('div','avwrap');aw.innerHTML='<div class="avring"></div>'+FACE;stage.appendChild(aw);
    const say=el('div','saying');say.appendChild(el('div','lbl',esc(s.title)));
    say.appendChild(el('div','txt','<span class="now">'+esc(lines[pIx])+'</span>'));
    stage.appendChild(say);c.appendChild(stage);
    const r=el('div','ctl');
    const back=el('button',null,'⏪');back.onclick=()=>{pIx=Math.max(0,pIx-1);render();speakLine(lines[pIx]);};
    const play=el('button','main','▶');play.onclick=()=>speakLine(lines[pIx]);
    const nxt=el('button',null,'⏩');nxt.onclick=()=>{pIx=Math.min(lines.length-1,pIx+1);render();speakLine(lines[pIx]);};
    r.appendChild(back);r.appendChild(play);r.appendChild(nxt);
    const auto=el('button','btn gh sm','Play all with pauses');
    auto.onclick=()=>{const qs=lines.slice(pIx).map(l=>({text:l,gap:2200}));
      playSegs(qs,{onSeg:(i)=>{pIx=Math.min(lines.length-1,i+ (SP.startAt||0));const t=document.querySelector('.saying .txt');if(t)t.innerHTML='<span class="now">'+esc(qs[i].text)+'</span>';},onDone:()=>{}});};
    r.appendChild(auto);
    c.appendChild(r);
    const p=el('div','prog','<b style="width:'+((pIx+1)/lines.length*100)+'%"></b>');c.appendChild(p);
    m.appendChild(c);
    startBlink();
  }
  if(practice==='seq'){
    const c=el('div','card');
    const b=s.bul||[];
    if(b.length<3){
      c.appendChild(el('div','vt','Not available for this answer'));
      c.appendChild(el('div','sub','This STAR does not have a stepped action sequence. Pick another answer from the list above — thirteen of them do — or use Say it back instead.'));
    } else {
      if(!seqState||seqState.title!==s.title){
        const order=b.map((t,i)=>i);
        for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
        seqState={title:s.title,order,picked:[],checked:false};
      }
      c.appendChild(el('div','vt','Put your actions back in order'));
      c.appendChild(el('div','sub','Tap them in the sequence you actually took. Sequence is what a panel is really listening for — it is the difference between a list of things that happened and a method.'));
      const pool=el('div');pool.style.marginTop='14px';
      seqState.order.forEach(ix=>{
        if(seqState.picked.includes(ix))return;
        const t=el('div','tile',esc(b[ix]));
        t.onclick=()=>{seqState.picked.push(ix);seqState.checked=false;render();};
        pool.appendChild(t);});
      c.appendChild(pool);
      if(seqState.picked.length){
        c.appendChild(el('div','vt','Your sequence'));
        seqState.picked.forEach((ix,n)=>{
          const ok=seqState.checked?(ix===n?' ok':' no'):'';
          const t=el('div','tile sel'+ok,'<b style="color:var(--blue)">'+(n+1)+'.</b> '+esc(b[ix]));
          t.onclick=()=>{seqState.picked.splice(n,1);seqState.checked=false;render();};
          c.appendChild(t);});
      }
      const r=el('div','row');r.style.marginTop='12px';
      const ck=el('button','btn sm','Check');ck.onclick=()=>{seqState.checked=true;render();};
      ck.disabled=seqState.picked.length!==b.length;
      const rs=el('button','btn gh sm','Reset');rs.onclick=()=>{seqState=null;render();};
      r.appendChild(ck);r.appendChild(rs);c.appendChild(r);
      if(seqState.checked){
        const right=seqState.picked.filter((ix,n)=>ix===n).length;
        c.appendChild(el('div','vt',right+' of '+b.length+' in the right place'+(right===b.length?' — that is the method, exactly as you ran it.':'')));
      }
    }
    m.appendChild(c);
  }
}
function speakLine(t){ playSegs([{text:t}],{onSeg:()=>{},onDone:()=>{}}); }

/* ================= REFERENCE MODES ================= */
function indCard(i,open){
  const d=el('div','ind'+(open?' open':''));
  const hd=el('div','hd');
  hd.appendChild(el('div','code',i.c));
  hd.appendChild(el('div','t',esc(i.t)+(i.new3?' <span class="pill">NEW IN V3</span>':'')));
  hd.appendChild(el('div',null,'<span class="chip '+i.v+'">'+VN[i.v]+'</span>'));
  hd.onclick=()=>d.classList.toggle('open');
  d.appendChild(hd);
  const bd=el('div','bd');
  const sc=(i.capRef&&i.capRef.script&&i.capRef.script.inds)?i.capRef.script.inds[i.c]:null;
  if(sc){
    const r=el('div','row');
    const p=el('button','btn sm','▶ Coach me on '+i.c);
    p.onclick=(e)=>{e.stopPropagation();playSegs(sc.flatMap(x=>sentences(x)).map(t=>({text:t})),{onSeg:()=>{},onDone:()=>{}});};
    r.appendChild(p);bd.appendChild(r);
    const w=el('div','notes');w.appendChild(el('div','lbl','What the coach says'));w.appendChild(paras(sc));bd.appendChild(w);
  }
  if(i.vt)bd.appendChild(el('div','vt',esc(i.vt)));
  bd.appendChild(paras(i.body));
  d.appendChild(bd);
  return d;
}
function renderIndicators(){
  const m=$('#main');m.innerHTML='';
  if(!capId)capId=CAPS[0].id;
  const c=cap(capId);
  const head=el('div','card');
  const sel=el('select');sel.style.cssText='width:100%;background:#16233c;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-size:15px';
  CAPS.forEach(x=>{const o=new Option(x.name,x.id);if(x.id===capId)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{capId=sel.value;stopSpeech();render();};
  head.appendChild(sel);
  head.appendChild(el('div','sub','')).style.marginTop='10px';
  head.lastChild.appendChild(chipsFor(c));
  const tabs=el('div','row');tabs.style.marginTop='10px';
  [['adv','Advanced ('+c.adv.length+')'],['ha','Highly advanced ('+c.ha.length+')']].forEach(([k,l])=>{
    const b=el('button','btn '+(tab===k?'':'gh')+' sm',l);b.onclick=()=>{tab=k;render();};tabs.appendChild(b);});
  const co=el('button','btn gh sm','▶ Coach this capability');co.onclick=()=>openCap(capId);tabs.appendChild(co);
  head.appendChild(tabs);
  m.appendChild(head);
  (tab==='adv'?c.adv:c.ha).forEach(i=>m.appendChild(indCard({...i,capRef:c},false)));
}
function renderStars(){
  const m=$('#main');m.innerHTML='';
  if(!capId)capId=CAPS[0].id;
  const c=cap(capId);
  const head=el('div','card');
  const sel=el('select');sel.style.cssText='width:100%;background:#16233c;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-size:15px';
  CAPS.forEach(x=>{const o=new Option(x.name+' ('+(x.stars||[]).length+')',x.id);if(x.id===capId)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{capId=sel.value;stopSpeech();render();};
  head.appendChild(sel);m.appendChild(head);
  (c.stars||[]).forEach((s,ix)=>{
    const d=el('div','card');
    d.appendChild(el('h2',null,esc(s.title)));
    const r=el('div','row');r.style.margin='10px 0';
    const h=el('button','btn sm','▶ Hear it delivered');
    h.onclick=()=>{const qs=[];['s','t','a','r'].forEach(k=>(s[k]||[]).forEach(p=>sentences(p).forEach(x=>qs.push({text:x}))));
      playSegs(qs,{onSeg:()=>{},onDone:()=>{}});};
    const st=el('button','btn gh sm','■ Stop');st.onclick=stopSpeech;
    const pr=el('button','btn gh sm','🎙 Practise this');
    pr.onclick=()=>{pStar=allStars().findIndex(x=>x.cap.id===c.id&&x.title===s.title);transcript='';hits={};mode='practice';practice='say';render();};
    r.appendChild(h);r.appendChild(st);r.appendChild(pr);d.appendChild(r);
    if(c.script&&c.script.stars&&c.script.stars[ix]){
      const w=el('div','notes');w.appendChild(el('div','lbl','Before you hear it — the coach'));w.appendChild(paras(c.script.stars[ix]));d.appendChild(w);}
    d.appendChild(starBody(s));
    m.appendChild(d);
  });
  if(!(c.stars||[]).length)m.appendChild(el('div','card','<p>No STAR answers drafted for this capability yet.</p>'));
}
function renderGaps(){
  const m=$('#main');m.innerHTML='';
  const all=allInds(),gaps=all.filter(i=>i.v==='not'||i.v==='par');
  const h=el('div','card');
  h.appendChild(el('h2',null,'What is not cleared'));
  h.appendChild(el('div','sub','These are the '+gaps.length+' indicators out of '+all.length+' where the evidence is partial or missing. Know them cold, so you can steer away from them or answer them honestly rather than being caught.'));
  const st=el('div','row');st.style.marginTop='12px';
  [['not','Not cleared'],['par','Partial'],['exc','Exceptional'],['cle','Cleared']].forEach(([k,l])=>{
    const d=el('div','stat');d.appendChild(el('div','b',all.filter(i=>i.v===k).length));d.appendChild(el('div','l',l));st.appendChild(d);});
  h.appendChild(st);m.appendChild(h);
  ['not','par'].forEach(k=>{
    const list=gaps.filter(i=>i.v===k);if(!list.length)return;
    m.appendChild(el('div','grp',VN[k]+' — '+list.length));
    list.forEach(i=>m.appendChild(indCard({...i,capRef:i.cap,t:i.t+' — '+i.cap.name},false)));
  });
}
function renderSearch(){
  const m=$('#main');m.innerHTML='';
  const h=el('div','card');
  h.appendChild(el('h2',null,'Search'));
  h.appendChild(el('div','sub','Across every indicator, every line of commentary, every coaching script and every STAR.'));
  const inp=el('input');inp.type='search';inp.value=q;inp.placeholder='contingency · Treasury · MICTA · 22,990 · informality';
  inp.style.marginTop='12px';h.appendChild(inp);m.appendChild(h);
  const res=el('div');m.appendChild(res);
  const run=()=>{
    res.innerHTML='';q=inp.value;const t=q.trim().toLowerCase();
    if(t.length<2){res.appendChild(el('div','card','<div class="sub">Type at least two characters.</div>'));return;}
    let n=0;
    allInds().forEach(i=>{
      const sc=(i.cap.script&&i.cap.script.inds)?(i.cap.script.inds[i.c]||[]):[];
      const hay=(i.c+' '+i.t+' '+(i.vt||'')+' '+(i.body||[]).join(' ')+' '+sc.join(' ')).toLowerCase();
      if(hay.includes(t)){n++;const w=el('div');w.appendChild(el('div','grp',esc(i.cap.name)));
        w.appendChild(indCard({...i,capRef:i.cap},true));res.appendChild(w);}});
    allStars().forEach(s=>{
      const hay=(s.title+' '+(s.sub||'')+' '+['s','t','a','r','notes'].flatMap(k=>s[k]||[]).join(' ')).toLowerCase();
      if(hay.includes(t)){n++;const d=el('div','card');d.appendChild(el('h2',null,esc(s.cap.name)+' — '+esc(s.title)));
        d.appendChild(starBody(s));res.appendChild(d);}});
    res.insertBefore(el('div','grp',n+' match'+(n===1?'':'es')),res.firstChild);
  };
  inp.oninput=run;if(q)run();
  setTimeout(()=>inp.focus(),50);
}

/* ================= SHELL ================= */
const MODES=[['home','Capabilities'],['coach','Coach'],['practice','Practice'],['indicators','Indicators'],['stars','STARs'],['gaps','Gaps'],['search','Search']];
function renderModes(){
  const n=$('#modes');n.innerHTML='';
  MODES.forEach(([k,l])=>{
    const b=el('button',mode===k?'on':'',l);
    b.onclick=()=>{ if(k==='coach'&&!capId){mode='home';render();return;}
      if(k!=='coach'&&k!=='practice')stopSpeech();
      mode=k; if(k==='coach'&&!lesson)lesson=buildLesson(cap(capId)); render();};
    n.appendChild(b);});
}
function render(){
  renderModes();
  ({home:renderHome,coach:renderLesson,practice:renderPractice,indicators:renderIndicators,
    stars:renderStars,gaps:renderGaps,search:renderSearch})[mode]();
  document.querySelector('main').scrollTop=0;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){killRec();if(SP.on)stopSpeech();}});
window.addEventListener('pagehide',()=>{killRec();stopSpeech();});
window.onerror=function(msg){var b=document.getElementById('errbar');
  if(!b){b=document.createElement('div');b.id='errbar';b.className='warn';
    b.style.cssText='position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:99';
    document.body.appendChild(b);}
  b.innerHTML='Something went wrong in the app. Tap to dismiss and carry on.<br><span style="opacity:.7;font-size:12px">'+String(msg).slice(0,140)+'</span>';
  b.onclick=function(){b.remove();};return true;};
render();
</script>
