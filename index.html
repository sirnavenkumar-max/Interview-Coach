reached 22,990 people through a gated cascade, and the forum I set up kept running after I left."], "H5": ["H5 asks you to celebrate organisational success and implement initiatives to maintain morale. Split it. The celebration limb is the same territory as A4. You used the mechanisms rather than creating them, and there was no closure occasion. That half is not cleared, so concede it in the same words. The morale limb is stronger than you think. The Project Managers Forum was designed to give people a place to raise risks, issues and concerns away from the leaders. That is a morale instrument, deliberately built, on a programme you have described as pressure-cooker intensity. So in the room. I built that forum so people could raise concerns away from the leaders, which is maintaining morale by structure rather than exhortation."]}, "stars": [["The first answer carries A3, A1 and A2, and supports H4. Its strength is that it is a chain, not a story. Strategy, structure, outcomes, operational goals, then one sheet that made it visible. The Situation is the argument. Nobody contracts a venue, trains a returning officer or tests an application against trust and confidence. Say that line and the panel knows why this capability exists.", "The ending does the real work, so close on the elector rather than the gate. 90 per cent of electors found it easy to vote, and of the 46 per cent who needed assistance at a voting centre, 95 per cent were satisfied. That is a goal about trust and inclusion arriving as a person being helped to vote. This shares source material with the Finance strategic planning answer, so keep the funding argument there."], ["The second answer carries A5 and reaches toward H2. You took over the 2023 State general election programme in March 2022. Rated red. $89.1 million allocated against an estimated requirement of $140.7 million, with the date fixed in statute. The sentence that makes this an Inspire direction answer rather than a recovery answer is this one. A red programme is a confidence problem. Without it, this is Manage self.", "The real work is done by taking the plan to green to the Programme Steering Committee for approval rather than implementing it and reporting afterwards. An approved plan is a shared commitment. One authored alone is an opinion. Volunteer that the Government House recognition was a group acknowledgement before anyone asks. That is what makes you credible on everything else. Fill the open confirm on what the plan to green comprised. And this is the same recovery used in the Manage self pack, so use one or the other."]], "outro": ["Two gaps are worth naming and only one is quickly in your gift. H1 needs the interim EPMO Director period. If you presented direction, priorities or the investment position to a directors forum or the executive in that role, tell me, and it clears. A4 and the celebration half of H5 close only in future practice, so concede them precisely and move on. Everywhere else, answer in your own register. I do not inspire people with rhetoric. I inspire confidence by removing ambiguity. What generates belief is knowing exactly what has to be true by when."]}}, {"id": "obo", "name": "Optimise business outcomes", "group": "People Management", "desc": "Manage people and resources effectively to achieve public value", "verdict": [["Advanced", "4 of 5 cleared, all four exceptionally. A2 not cleared"], ["Highly advanced", "4 of 5 cleared, two exceptionally. H5 not cleared"]], "adv": [{"c": "A1", "t": "Develop and implement strategic and operational workforce planning practices and initiatives to achieve current and future business goals", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["This is the strongest workforce planning claim in your file and you have never told it as one.", "The pipeline ran thirteen months and was sequenced on the programme critical path: contingent labour requirements completed in August, suppliers confirmed and venues allocated by late September, Returning Officer applications opening in early September and recruitment running through to March, interviews from mid-November, supplier contracts finalised and signed by late December, the Election Workforce Staffing Model approved at gate on 30 March, expressions of interest opening on 1 May, Returning Officers commencing in July and full-time from mid-July, and the main election workforce recruited between 2 August and 30 September.", "Strategic and operational, both. A Training and Workforce Strategy set a year out is the strategic half; an eight-hour-per-day resourcing basis that determines how many people you must recruit is the operational half — and the two are connected, because the resourcing model is what converts a workforce strategy into a headcount.", "THE NUMBER TO LEAD WITH. 22,990 people recruited, onboarded and mobilised in roughly two months — on the back of a thirteen-month pipeline. The two-month figure is the headline; the thirteen-month figure is the reason it was possible. Give them in that order and the point makes itself."]}, {"c": "A4", "t": "Align systems and processes to encourage improved performance and outcomes", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Your central discipline, and the evidence is a system rather than a set of examples: a P3O operating model, portfolio tooling deployed with adoption driven, a methodology with nine phases and seven governance gates, a service catalogue defining what the function owes each consumer, a change request pipeline, earned value management through a standing forum, a benefits framework with formal achievement status, complaint triage, and Election Operations Reporting built during the event so the command structure could see performance while it could still act."]}, {"c": "A5", "t": "Create a workplace culture that encourages people to learn from their mistakes and set an example by doing this yourself", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The second half of that indicator — \"set an example by doing this yourself\" — is where most candidates fail it, and it is where you are strongest anywhere in the framework.", "At the programme kick-off, the delivery community said publicly that the enterprise methodology was not serving them. You had written it. You minuted every concern as stated rather than as you would have preferred it read, named the failure honestly — an EPMO that changes the engine mid-flight while imposing change control on everyone else — and rebuilt the function around what they said. Then you went back to the project managers individually and asked why they had not been able to raise it with you directly.", "The structural half is there too: lessons learned workshops built into the methodology as a closure phase rather than an optional activity, and a Continuous Improvement Register transitioned to business as usual."]}, {"c": "A3", "t": "Encourage staff to take calculated risks to support innovation, adaptability and continuous improvement", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Previously partial. The Master Scheduler instance closes it, and it closes it at the top of the range — because this indicator is only ever really evidenced by what happens when the calculated risk does not come off.", "You set development of the programme critical path as a development goal for your Master Scheduler. That was a genuine stretch assignment: the artefact required was not a schedule but a picture of an entire two-year programme that people who had not written it could reason about, on a date fixed in statute. She was technically strong and did not engage stakeholders, and the successive versions she brought you did not meet the objective.", "What you did next is the whole answer. You did not take the work off her and you did not correct the document. You brought the key stakeholder into a focused session and drew the critical path on a whiteboard with her in the room — and she saw what had been missing: stakeholder engagement, and the tacit knowledge subject matter experts hold about how work actually sequences, which is written down nowhere.", "§ And the systemic version, which is stronger than the instance", "You have run this as a designed practice for eight years. In PMGT5850 you coach nine to ten teams a year through initiating, planning, developing, executing and closing real projects in an experiential learning environment — coaching from the sideline rather than intervening, requiring retrospectives, and offering guidance on what good could look like rather than prescribing it.", "That is calculated risk-taking institutionalised: an environment where people are given genuine latitude, where failure is survivable and expected, and where the learning is extracted deliberately afterwards. One instance is a story. A practice run for eight years is a capability."]}, {"c": "A2", "t": "Remove any barriers to recruiting and retaining people with diverse cultures, backgrounds and experiences", "v": "not", "vt": "NOT CLEARED", "body": ["Note the verb: REMOVE BARRIERS. This is not about celebrating diversity or valuing it — it is about identifying something that stops particular people applying or staying, and taking it away.", "It is also the indicator where your programme is most likely to have real evidence, because a recruitment operation of that size cannot work without reaching people who do not respond to conventional recruitment. Polling places need staff who reflect the communities they serve; a state-wide operation needs people in towns where there is no local labour market; an expression-of-interest process that is online-only excludes anyone without reliable connectivity.", "THIS IS A RECALL PROBLEM, NOT A CAPABILITY ONE. See the questions at the end. Almost any concrete answer clears this indicator, and the same answer will carry into Value diversity and inclusion."]}], "ha": [{"c": "H2", "t": "Optimise outcomes through strategic workforce planning and resource utilisation aligned with the government’s objectives", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Workforce planning at a scale most executives never encounter, against an objective set in legislation rather than chosen. And the resource utilisation limb is evidenced rather than asserted: the entire $12 million contingency provision unspent and returned, with total programme expenditure finishing below a $150 million investment authority.", "Optimisation in this context means something specific and worth saying: you resourced conservatively on safety — an eight-hour daily basis, which costs more people — and still finished under authority. Those two facts together are the argument. Spending less by working people harder is not optimisation; it is deferral of cost onto staff."]}, {"c": "H4", "t": "Set clear boundaries and freedoms for risk-taking in your organisation", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["There is an inversion here worth understanding, because it explains the whole capability. You are partial at A3 — encouraging staff to take risks — and exceptional at H4, which asks you to define where risk-taking is permitted. That is not a contradiction. It is your method.", "You do not create freedom by encouragement. You create it by drawing the boundary precisely enough that everything inside it is genuinely free.", "• Boundaries: seven governance gates each carrying a mandatory assurance report; Gate 2 mobilisation criteria that could be failed; entry and exit criteria controlling system go-live; no uncontrolled high or extreme risk permitted past a gate", "• Freedoms: investment authority released in stages with DELEGATED APPROVALS below the line; terms of reference defining what each forum could decide without escalation; an assurance model that gates the investment decision and then governs delivery through standing conditions, continuously evidenced and withdrawable on breach", "That last construction is the purest expression of this indicator. A standing condition is a freedom with a defined edge: do as you judge best, evidence it continuously, and the freedom is withdrawn only if the evidence stops."]}, {"c": "H3", "t": "Align workforce resources and talent with organisational priorities", "v": "cle", "vt": "CLEARED", "body": ["Fourteen workstreams with money and an accountable executive attached to each; nine functional directors and ten project managers positioned against thirteen aggregate projects; MoSCoW prioritisation with the business areas to sequence demand against benefit rather than volume; and a staffing model that translated all of it into how many people were needed, where, and for how long."]}, {"c": "H1", "t": "Ensure your organisational structure is aligned with your organisation’s goals and responds to change", "v": "cle", "vt": "CLEARED", "body": ["At an electoral commission the programme structure substantially is the operating structure for the period that matters. You designed it — thirteen aggregate projects, fourteen workstreams, an Elections PMO, and a four-tier operational command running from the Executive Control Group through the Election Operations Command Centre and functional control rooms to returning officers in the field.", "The \"responds to change\" limb has two clean instances, both legislative and both mid-programme: the early voting period cut from thirteen days to seven at the 2023 State general election, and the elections regulation commencing weeks before polling day in 2024 that changed the safety powers of every polling place manager. The structure absorbed both."]}, {"c": "H5", "t": "Hold yourself and others accountable for implementing and maintaining inclusive workforce management practices", "v": "not", "vt": "NOT CLEARED", "body": ["The operative word is ACCOUNTABLE — not supportive of, not committed to. This indicator asks whether inclusion was something you held people to, in the way you held them to gate criteria and change control.", "You have the machinery to answer it if the substance exists: a gate that can be failed, a benefits framework with achievement status, a workforce model approved at gate. If any inclusion measure sat inside any of those, this clears immediately. On current evidence none did."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: A1 strategic and operational workforce planning · H2 optimise outcomes through strategic workforce planning and resource utilisation · H3 align workforce resources with organisational priorities", "s": ["The 2024 Local Government elections required a temporary workforce of nearly 23,000 people, working across 2,486 venues in every part of New South Wales, almost all of them employed for a period of weeks and most for a single day. The organisation itself has a permanent workforce in the hundreds.", "Election workforce planning has a property that makes it unlike almost any other kind. The demand is enormous, entirely concentrated, and absolutely non-negotiable — you cannot open a polling place with most of its staff, and you cannot open it late. And the labour market you are recruiting from is the general population, in towns that may have no other employer, for one Saturday."], "t": ["To build a workforce of that size, to a date fixed in statute, without either failing to fill it or breaking the people in it."], "a": ["The plan ran thirteen months and was carried on the programme critical path rather than in a separate workforce document, so that every workforce dependency was visible against the election date alongside everything else.", "• Strategy first. A Training and Workforce Strategy set in September, a year before the event.", "• Contingent labour early. Requirements completed by late August, suppliers confirmed and venues allocated to suppliers by late September, contracts issued in November and signed in December — because the supply arrangements have to exist before the demand is known precisely.", "• Leadership first, then scale. Returning Officer applications opened in September and recruitment ran to March, with interviews from mid-November. Returning Officers commenced in July and went full-time from mid-July, so that the people who would run each district were in place months before the workforce they would manage.", "• The model as a gate. The Election Workforce Staffing Model was approved at gate on 30 March — including a rigorous eight-hour-per-day resourcing basis, which is a fatigue control and which increases headcount substantially.", "• Then the surge. Expressions of interest opened on 1 May; the main election workforce was recruited between 2 August and 30 September.", "The staffing and training workstream was delivered by the HR Director. The programme accountability was mine — the sequencing, the gating of the model, the funding, and the consequence if it failed."], "r": ["22,990 temporary staff were employed and mobilised — 70 returning officers, 2,217 polling place managers, 2,215 deputies, 7,947 election officials and 3,008 declaration vote issuing officers among them — across 2,099 polling places, 317 early voting offices, 70 returning officers’ offices and five centralised operations sites.", "The election was delivered on time, expenditure finished below the $150 million investment authority, and the entire contingency provision was returned unspent.", "The measure I would offer is the two facts together. We resourced conservatively on fatigue, which costs more people, and still finished under authority. Spending less by working people longer is not optimisation — it is moving the cost onto staff and calling it efficiency."], "notes": ["§ Delivery notes", "• Lead with why election workforce planning is different. \"You cannot open a polling place with most of its staff, and you cannot open it late.\" That sentence establishes the constraint and everything after it lands harder.", "• Give the two-month figure first and the thirteen-month figure second. The surge is what impresses; the pipeline is what explains it. In that order it reads as method rather than luck.", "• The closing argument is the one to keep. Resourcing conservatively on safety and still finishing under authority is a genuine optimisation claim, and it pre-empts any suggestion that under-spend came at someone’s expense.", "• Hold the delivery boundary. The HR Director delivered it. Say so — it is the same structure as the ICT agreements and it is what makes the rest credible."], "probes": [], "keys": ["$150 million", "23,000", "2,486", "22,990", "2,217", "2,215", "7,947", "3,008", "Workforce Strategy", "Returning Officer"], "bul": ["Strategy first. A Training and Workforce Strategy set in September, a year before the event.", "Contingent labour early. Requirements completed by late August, suppliers confirmed and venues allocated to suppliers by late September, contracts issued in November and signed in December — because the supply arrangements have to exist before the demand is known precisely.", "Leadership first, then scale. Returning Officer applications opened in September and recruitment ran to March, with interviews from mid-November. Returning Officers commenced in July and went full-time from mid-July, so that the people who would run each district were in place months before the workforce they would manage.", "The model as a gate. The Election Workforce Staffing Model was approved at gate on 30 March — including a rigorous eight-hour-per-day resourcing basis, which is a fatigue control and which increases headcount substantially.", "Then the surge. Expressions of interest opened on 1 May; the main election workforce was recruited between 2 August and 30 September."]}, {"title": "STAR B — Highly advanced", "sub": "Primary indicator: H4 set clear boundaries and freedoms for risk-taking in your organisation. Supporting: A4 · H1", "s": ["Eleven of the organisation’s twelve Band 1 executives reported into the programme for delivery, at a substantive grade above my own, and none of them reported to me. Thirteen aggregate projects, ten project managers, a date fixed in statute.", "In that structure there are only two failure modes and they are opposite. Control everything and the programme stalls, because every decision queues behind one person who has no authority to make most of them anyway. Control nothing and thirteen projects optimise separately and arrive at different times."], "t": ["To define where judgement was free and where it was not, precisely enough that people could act without asking."], "a": ["I drew the boundaries as conditions rather than as approvals.", "Gates carried criteria that could be failed — venues 100% contracted and accessible, workforce at or above 85% filled with training commenced, systems configured and end-to-end tested, no uncontrolled high or extreme risk. Technical go-live ran on defined entry and exit criteria. Those are hard edges, and they are not negotiable in a conversation about pressure.", "Inside them I made the freedoms explicit and real. Investment authority was released in stages with delegated approvals below the line. Terms of reference defined what each of seven forums could decide without escalating. And the assurance model gated the investment decision rather than the delivery decision — delivery governed through standing conditions, continuously evidenced, withdrawable on breach.", "That last construction is the whole design. A standing condition tells a director: run this your way, evidence it as you go, and nobody will interfere unless the evidence stops. It is a freedom with a defined edge, which is the only kind people actually use — an undefined freedom gets used cautiously, because nobody knows where it ends."], "r": ["Thirteen aggregate projects, nine functional directorates and two development vendors delivered to a single immovable date, within authority, with no high residual risks at closure.", "The test of whether the boundaries were right is that I was not the bottleneck. With eleven executives senior to me running their own functions, any design that required my decision would have failed on volume alone."], "notes": ["ALLOCATION WARNING. This draws on the same governance architecture as STAR A in the Demonstrate accountability pack. There it is accountability design; here it is the boundaries-and-freedoms argument. Use one framing or the other, not both.", "§ Delivery notes", "• The two failure modes in the Situation frame the problem better than any description of the governance would. Control everything and it stalls; control nothing and it diverges.", "• \"A freedom with a defined edge is the only kind people actually use\" is the sentence to keep. It is the argument for your entire method, in one line.", "• Close on not being the bottleneck. It is the only objective test of whether delegation was real, and it is verifiable by anyone who was there."], "probes": [], "keys": [], "bul": []}, {"title": "STAR C — Advanced (short form)", "sub": "Primary indicator: A3 encourage staff to take calculated risks to support innovation, adaptability and continuous improvement. Supporting: A5 · Manage and develop people A3", "s": ["The 2024 Local Government elections programme needed a high-level critical path thirteen months before polling day — one sheet showing twenty workstreams, nineteen application systems and the dependencies between them, converging on a date fixed in statute.", "I set its development as a development goal for my Master Scheduler rather than producing it myself. That was a deliberate stretch: what the programme needed was not a schedule, it was a picture the executives who had not written it could reason about in a room."], "t": ["To get the artefact and develop the person, without sacrificing one to the other."], "a": ["She was technically strong. She brought me several versions and none of them met the objective — because each had been built from the documents and the tools rather than from the people. The missing input was tacit: what the functional directors knew about how the work actually sequences, which is not recorded anywhere.", "I did not take the work off her and I did not correct the drafts. I brought the key stakeholder into a focused session and drew the whole critical path on a whiteboard, with her in the room.", "[CONFIRM: how many people were in that session, how long it ran, and whether it was one session or several]"], "r": ["She saw what had been missing — stakeholder engagement, and subject matter expert tacit knowledge — and the plan that followed is the one that governed the programme for the next thirteen months.", "The failure was familiar to me. At the programme kick-off I had been told that the enterprise methodology I had authored did not serve the people who used it, for exactly the same reason: it had been built without them. I learned that at my own expense. Teaching it cost a whiteboard and an afternoon."], "notes": ["§ Delivery notes", "• The intervention is the answer, not the outcome. You changed the conditions so the person could see the gap herself, rather than removing the task or fixing the artefact. That is coaching; the other two are rescue.", "• Do not say she failed, and do not name her. \"The versions did not meet the objective\" is a statement about an artefact. It is accurate and it costs nobody anything.", "• The closing paragraph is what lifts it. A lesson you learned at your own expense, transmitted deliberately to someone else at a fraction of the cost. That is what a leader is for.", "• Pair it with the systemic version if you have room. Nine to ten teams a year for eight years in a designed experiential learning environment turns an anecdote into a practice.", "• Note what it also does to the critical path claim. That artefact is stronger described as something you coached into existence than as something you drew. It evidences the planning AND the developing, from one object."], "probes": [], "keys": ["Master Scheduler"], "bul": []}], "notes": [{"h": "Verdict", "body": ["Both indicators you miss sit on the same theme — diversity and inclusion — and one of them happens to be positioned at Advanced level, which makes it more damaging than a Highly advanced miss."]}, {"h": "Warning: the next capability is going to be harder than this one", "body": ["Diversity and inclusion now defeats six indicators across five capabilities:", "GATHER THIS BEFORE WE DO VALUE DIVERSITY AND INCLUSION. That capability is ten indicators of the same material, and on current evidence most of them will not clear. It is far better to go and find what exists now than to discover the gap there. The questions are at the end of this pack, and they are the most valuable thing in it.", "One thing worth saying plainly: the absence is of EVIDENCE, not of practice. You ran a recruitment operation that put 22,990 people into 2,486 venues across metropolitan, regional and remote New South Wales — an operation that cannot succeed without reaching communities most employers never touch. Some of what this capability asks for almost certainly happened. It has simply never been described."]}, {"h": "Open items — all four are the same question, and it is the one that matters", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner — People Management group.", "NSWEC LGE24 high-level critical path (A0, \"Contact: Naven Kumar\", as at 22 August 2023) — staffing and training swimlanes — supplied.", "NSW Electoral Commission, 2024 NSW Local Government elections report — workforce and venue figures — elections.nsw.gov.au", "NSW Electoral Commission — published work health and safety and fatigue management standards — elections.nsw.gov.au", "NSWEC LGE24 Program Management Plan retrospective (OFFICIAL–Sensitive) and programme governance model — supplied.", "Candidate-supplied evidence, 14–16 August 2026."]}], "script": {"id": "obo", "intro": ["Optimise business outcomes sits in the People Management group, and its definition is short. Manage people and resources effectively to achieve public value. That last phrase is the test. A panel is not asking whether you spent less. They are asking what the people and the money you controlled produced.", "At Adept you run resources well inside a structure someone else designed. At Advanced you build the practices and the systems, and other people run them. Highly advanced moves up again, to the shape of the organisation itself and to where risk taking is permitted inside it.", "The trap is answering this with a budget story. Under time, under cost, no red risks. Half of these indicators are about people, and two are about diversity and inclusion. Bring cost control alone and you lose that half."], "standing": ["At Advanced you clear four of five, all four exceptionally. A2, removing barriers to recruiting and retaining diverse people, is not cleared. At Highly advanced you clear four of five, two exceptionally. H5, on accountability for inclusive workforce practices, is not cleared.", "So claim this one at Highly advanced. H2 and H4 are the exceptional pair and they carry it, with H1 and H3 in support. Both misses sit on the same theme, and one is at Advanced. That gap is the more damaging, because Advanced is the floor you claim to stand on."], "inds": {"A1": ["Strategic and operational, both. A panel will reject a large recruitment number on its own. They want a practice that ties a workforce strategy to a headcount and then delivers it. Yours ran thirteen months and sat on the programme critical path, not in a separate document. The staffing model was approved at gate on 30 March, and the main workforce recruited between 2 August and 30 September.", "The Training and Workforce Strategy set a year out is the strategic half. The eight hour per day resourcing basis, which sets how many people you recruit, is the operational half. So in the room, it sounds like this. We mobilised 22,990 people in two months, and only because the pipeline ran thirteen."], "A4": ["Align systems and processes to encourage improved performance and outcomes. A panel will accept a system here. They will not accept a list of good examples, because examples do not prove alignment. Yours is a system. A P3O operating model. A methodology with nine phases and seven governance gates. Earned value management through a standing forum. A benefits framework with formal achievement status.", "Lead with the piece that is unmistakably about outcomes rather than process. So in the room, it sounds like this. We built the Election Operations Reporting during the event, so the command structure could see performance while it could still act."], "A5": ["Create a culture where people learn from their mistakes, and set an example by doing this yourself. The second half is where most candidates fail. They describe a blameless culture and never name a mistake of their own. At the kick off, the delivery community said publicly that the methodology was not serving them. You had written it.", "You minuted every concern as stated rather than as you would have preferred it read, and lessons learned workshops now sit in the methodology as a closure phase. So in the room, it sounds like this. I had written the methodology they said was failing them, so I rebuilt it around what they told me."], "A3": ["Encourage staff to take calculated risks. Previously partial, now cleared at the top of the range, because this is only really evidenced by what happens when the risk does not come off. You set development of the programme critical path as a development goal for your Master Scheduler. What was needed was a picture people who had not written it could reason about, and her versions did not meet it.", "You brought the key stakeholder into a session and drew the critical path on a whiteboard with her in the room, and she saw what was missing. The systemic version is stronger still. Eight years of PMGT5850, nine to ten teams a year, coaching from the sideline. So in the room, it sounds like this. I changed the conditions so she could see the gap."], "A2": ["Remove any barriers to recruiting and retaining people with diverse cultures, backgrounds and experiences. Note the verb. Remove barriers. This is not about celebrating diversity or valuing it. It is about identifying something that stops particular people applying or staying, and taking it away. This one is not cleared, and it is where your programme most likely has real evidence.", "So this is a recall problem, not a capability one. If you are asked before you have found the evidence, describe the constraint honestly and stop, rather than dressing up a policy as an intervention you led. Almost any concrete answer clears this, and it carries into Value diversity and inclusion."], "H2": ["Optimise outcomes through strategic workforce planning and resource utilisation. The word to decode is optimise. A panel hears cost saving and waits to find out who paid for it. What clears this is a resource decision that was deliberately more expensive on one axis and still landed inside authority. The entire 12 million dollar contingency was returned unspent, and expenditure finished below a 150 million dollar authority.", "So in the room, it sounds like this. We resourced conservatively on fatigue, at eight hours a day, which costs more people, and still came in under authority with the full contingency returned. Spending less by working people longer is not optimisation."], "H4": ["Set clear boundaries and freedoms for risk taking. Encouraging risk and defining where risk is permitted are different jobs, and this asks for the second. A panel will reject warm words about empowerment. You create freedom by drawing the boundary precisely enough that everything inside it is genuinely free. Seven governance gates, and Gate 2 criteria that could be failed.", "The freedoms were equally explicit. Investment authority released in stages with delegated approvals below the line. Terms of reference defining what each forum could decide without escalating. So in the room, it sounds like this. A standing condition is a freedom with a defined edge. Run it your way, evidence it continuously, and it goes only if the evidence stops."], "H3": ["Align workforce resources and talent with organisational priorities. This is not headcount allocation. It asks whether priorities were ranked by something other than who shouted loudest. This one is cleared, though not exceptionally, so use it in support rather than as an opening claim.", "Fourteen workstreams, each with money and an accountable executive attached. Nine functional directors and ten project managers positioned against thirteen aggregate projects. So in the room, it sounds like this. We ran MoSCoW prioritisation with the business areas so demand was sequenced against benefit rather than volume, and the staffing model turned that into how many people we needed and for how long."], "H1": ["Ensure your organisational structure is aligned with your goals and responds to change. Candidates answer only the first limb. The second needs an instance where something moved underneath you and the structure held. At an electoral commission the programme structure substantially is the operating structure, and you designed it. Thirteen aggregate projects, fourteen workstreams, an Elections PMO, and a four tier command.", "So in the room, it sounds like this. Twice the legislative framework changed underneath us mid programme, once an Act amendment cutting early voting from thirteen days to seven in 2023, and once a regulation changing the safety powers of every polling place manager weeks before polling day in 2024, and the structure absorbed both."], "H5": ["Hold yourself and others accountable for inclusive workforce management practices. The operative word is accountable. Not supportive of. Not committed to. This asks whether inclusion was something you held people to, the way you held them to gate criteria and change control. This one is not cleared. You have the machinery. A gate that can be failed, a benefits framework, a workforce model approved at gate. No inclusion measure sat inside them.", "So do not attempt it on general commitment. A panel will ask what the consequence was when the measure was not met, and you will have no answer. Check the staffing model, the gate criteria and the benefits framework. If nothing is there, leave it and work the four you own."]}, "stars": [["STAR A carries A1, H2 and H3 at once. Its strength is that the scale is verifiable and the method shows underneath it. 22,990 temporary staff across 2,099 polling places, in an organisation whose permanent workforce is in the hundreds.", "Lead with why election workforce planning is different. You cannot open a polling place with most of its staff, and you cannot open it late. Give the two month figure first and the thirteen month figure second, so it reads as method rather than luck. The moment that does the real work is the close, resourcing conservatively on fatigue and still finishing under authority. And hold the delivery boundary. The HR Director delivered that workstream."], ["STAR B is your H4 answer, with A4 and H1 in support. One warning. It draws on the same governance architecture as STAR A in the Demonstrate accountability pack. There it is accountability design, here it is boundaries and freedoms. Use one framing, never both.", "Its strength is the problem statement before the governance. Eleven of the organisation's twelve Band 1 executives reported into the programme for delivery, at a grade above your own, and none reported to you. Control everything and it stalls. Control nothing and thirteen projects arrive at different times. The line that does the real work is that a freedom with a defined edge is the only kind people actually use."], ["STAR C is the short form answer for A3, with A5 in support. The intervention is the answer, not the outcome. You changed the conditions so she could see the gap herself. Taking the work off her or correcting the drafts would both have been rescue.", "Two things you must not forget. Do not say she failed and do not name her. The versions did not meet the objective is a statement about an artefact, and it costs nobody anything. And keep the closing paragraph, where the same failure was one you had already made with a methodology built without its users."]], "outro": ["Two gaps, and they are the same gap. A2 and H5 both sit on diversity and inclusion, and A2 is the one to fix first because it is at Advanced. Closing them takes two concrete things. One barrier you identified and removed in an operation that put 22,990 people into 2,486 venues across metropolitan, regional and remote New South Wales. And one inclusion measure that sat inside a gate or the benefits framework, with a consequence attached. Find both before you touch Value diversity and inclusion. The absence is of evidence, not of practice. And the sentence you own outright is this one. We resourced conservatively on fatigue, which costs more people, and still finished under authority."]}}, {"id": "mrc", "name": "Manage reform and change", "group": "People Management", "desc": "Support and champion change, and help others to engage with change", "verdict": [["Advanced", "5 of 5 cleared. Four exceptionally"], ["Highly advanced", "4 of 5 cleared. Two exceptionally. H5 not cleared"]], "adv": [{"c": "A3", "t": "Translate change initiatives into practical strategies and explain these to staff, including their role in implementing them", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The strongest evidence here is one you have never used for this purpose: the methodology you wrote gives organisational change its own activity lane, alongside the EPMO, the executive committee, steering committees, project owners, Finance, project managers, information services and records management.", "The change deliverables are mandatory rather than optional — a Business Change Management Plan, a Change Communications Plan, a Training Needs Analysis, To Be process definitions, training materials and a training schedule — developed during Development and Preparation, tested during Operational Readiness, executed at go-live, and carried through warranty into business-as-usual transition. \"Their role in implementing them\" is exactly what a To Be process and a training needs analysis produce."]}, {"c": "A4", "t": "Implement structured change management processes to identify and develop responses to workplace cultural barriers", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Read this as change resistance, and the kick-off arc is close to a textbook answer. The barrier was cultural in the organisational sense: the delivery community had concluded that lessons were never implemented and that the EPMO imposed rather than served. That belief, not any individual process, was the obstacle.", "You identified it by hearing it — every concern minuted as stated rather than as you would have preferred — and the response was structural rather than reassurance: the function redefined as a service catalogue with a named consumer and a performance expectation for each service, jointly developed with the people who had raised the complaint."]}, {"c": "A5", "t": "Create an environment where people are encouraged to share different views", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["A Project Managers Forum designed explicitly so that risks, issues and concerns could be raised in a psychologically safe setting away from the leaders. A Community of Practice that was topic-led rather than status-led and open to anyone interested rather than restricted by role. And the test case: when the different views were about work you had authored, you recorded them verbatim and then went back individually to ask why they had not reached you sooner."]}, {"c": "A1", "t": "Clarify the purpose and benefits of continuous improvement for staff and provide coaching and leadership in times of uncertainty", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["Continuous improvement structured rather than exhorted: lessons learned workshops as a mandatory closure phase in the methodology, a Continuous Improvement Register transitioned to business as usual, and a monthly Community of Practice that outlasted your tenure.", "The uncertainty limb is unusually well evidenced. You led through a red programme inherited with a $51.6 million gap between allocation and estimate, an Electoral Act amendment cutting early voting from thirteen days to seven mid-programme, the retirement of the Electoral Commissioner months before a $150 million delivery, and an elections regulation commencing weeks before polling day that changed the safety powers of every polling place manager."]}, {"c": "A2", "t": "Help others to address emerging challenges and risks and build support for change initiatives", "v": "cle", "vt": "CLEARED", "body": ["The service catalogue built support for a change from the people who had resisted the previous one. The Procurement Steering Committee addressed a governance risk before it recurred at greater scale. The resilience capability was stood up after event assurance did not achieve its posture. And the Master Scheduler was helped to address her own challenge by having the missing input put in front of her rather than supplied to her."]}], "ha": [{"c": "H4", "t": "Anticipate, plan for and address workplace cultural barriers to change at an organisational level", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The operative word is ANTICIPATE, and it is the one most candidates cannot evidence — because addressing a barrier that has already appeared is ordinary, and preventing one is not.", "Your service catalogue carried a standing commitment that stakeholders are engaged before any proposed change to it. That is not a fix for the kick-off complaint; it is a structural guarantee that the barrier which produced the complaint cannot form again. The change request pipeline does the same work in a different domain — routing every proposal through the accountable parties before any decision forum sees it, so that change arrives already owned rather than announced.", "And the sharpest instance is one where you anticipated a cultural barrier and chose not to create it. A new Applications Director had not yet been through an election cycle. You had diagnosed lower delivery maturity than you expected and would have changed the operating model. She judged that reform before living one full event was the greater risk, and you backed her — then routed the residual risk into governance rather than around her. That is anticipating a cultural barrier to change and declining to build one."]}, {"c": "H1", "t": "Define high-level goals to build a culture of continuous improvement and translate these into practical implementation strategies", "v": "exc", "vt": "CLEARED, EXCEPTIONALLY", "body": ["The maturity uplift is the goal and the operating model is the translation. You began with a P3M3 assessment across portfolio, programme and project disciplines, so the target was a measured deficit rather than an aspiration — then built the implementation: a P3O structure, portfolio tooling deployed with adoption driven, an assurance regime with gates and embedded reporting, a change request pipeline, and a monthly Community of Practice so practice had somewhere to develop that was not a governance meeting.", "High-level goal, measured baseline, practical implementation, measured movement. That sequence is the indicator."]}, {"c": "H2", "t": "Build staff support for and commitment to announced change, and plan and prepare for long-term organisational change, with a focus on the wider context", "v": "cle", "vt": "CLEARED", "body": ["Support built where it is hardest to build — from the people who had publicly rejected the previous version, by making them co-authors of the next one. Long-term organisational change evidenced by durability: a methodology written in one role, governing you in another, and still running the 2027 State general election programme. And the wider context limb is answered by the strategic planning work — organisational goals, portfolio priorities and election regulatory priorities taken as inputs before any change was designed."]}, {"c": "H3", "t": "Create an organisational culture that actively seeks opportunities to improve", "v": "cle", "vt": "CLEARED", "body": ["The word is ACTIVELY, and the test is whether improvement is sought rather than accepted. Three instances: a Community of Practice, topic-led and voluntary, which outlasted you; the Procurement Steering Committee, which exists because the previous election's procurement governance was examined and found to be in the wrong place; and an independently commissioned service evaluation across roughly 3,500 respondents, which is an organisation deliberately buying criticism it could not control."]}, {"c": "H5", "t": "Develop systems and practices that create a culturally safe environment", "v": "not", "vt": "NOT CLEARED", "body": ["The seventh appearance. Note that this one asks for SYSTEMS AND PRACTICES, which is the register you are strongest in everywhere else — you build gates, catalogues, pipelines and registers. If any cultural safety measure had been built into any of them, this would be among your easiest indicators rather than an empty one.", "Psychological safety does not answer it, and you should not offer it. Psychological safety is about whether it is safe to speak. Cultural safety is about whether it is safe to be."]}], "stars": [{"title": "STAR A — Highly advanced", "sub": "Primary indicators: A3 translate change initiatives into practical strategies and explain staff roles · A4 structured change management processes · H1 define goals for continuous improvement and translate into implementation strategies", "s": ["An electoral commission delivers its entire product in concentrated events on a multi-year cycle. Between events, systems and processes change — and the people who will use them at the next event are largely not the people who used them at the last one, because most of the workforce is temporary and reassembles each cycle.", "That creates a specific failure mode. A project can deliver a system successfully and the business change can fail to land, and nobody discovers it until the event — at which point there is no time to fix anything."], "t": ["To make organisational change a structural part of delivery rather than something projects did if they had time left."], "a": ["I wrote the agency's project management methodology — three summary phases, nine detailed phases, seven governance gates each carrying a mandatory assurance report — and I gave change its own activity lane in it, alongside the EPMO, the executive committee, steering committees, project owners, Finance, project managers, information services and records management.", "The change deliverables were made mandatory and gated rather than optional: a Business Change Management Plan, a Change Communications Plan, a Training Needs Analysis, To Be process definitions, training materials and a training schedule. They are developed during Development and Preparation, exercised during Operational Readiness, executed at go-live, and carried through warranty into business-as-usual transition.", "The detail I would point to, because it is where most change management quietly fails, is what the methodology requires when something does not work. Where a workaround is agreed at defect closure, it must be incorporated into the To Be processes, into the Business Change Management Plan and into the training material. A workaround that lives only in a defect register is a change that will not survive contact with the people who have to use it — and at the next event, those will be different people.", "[CONFIRM: what the methodology replaced, and whether change management was a defined discipline in it before]"], "r": ["Organisational change became a gated deliverable rather than a good intention, assessed at the same gates as the technical work and by the same assurance function.", "The durability test is the one I would offer. The methodology is instantiated as gates in the agency's portfolio platform and is still governing the 2027 State general election programme — projects advancing through feasibility, design and development gates, with artefacts, dependencies, registers and change requests as structural parts of the record rather than as attachments to it."], "notes": ["§ Delivery notes", "• The Situation is what makes this a change capability answer. \"The people who will use it at the next event are not the people who used it at the last one\" is a change management problem almost nobody else has to solve, and it explains why the discipline had to be structural.", "• Lead the Action with the lane, not the list. Giving change its own activity lane in a delivery methodology is the decision. The deliverables follow from it.", "• The workaround rule is the detail that proves you have done this. Anyone can require a change plan. Requiring that workarounds propagate into processes, plans and training is the insight of someone who has watched change fail.", "• Allocation: this shares the methodology with the Project management pack, where it evidences a project management SYSTEM. Here it evidences a CHANGE system. Different arguments from one artefact — but if both capabilities are assessed, keep the change lane here and the gates there."], "probes": [], "keys": ["Business Change Management Plan", "Change Communications Plan", "Training Needs Analysis", "Operational Readiness"], "bul": []}, {"title": "STAR B — Highly advanced", "sub": "Primary indicators: H4 anticipate, plan for and address workplace cultural barriers to change at an organisational level · A4 · H2", "s": ["At the kick-off of a $150 million election programme, the delivery community said openly that lessons from previous elections were never implemented, and that the enterprise methodology, compliance requirements and PMO practice did not serve them. I had built all three in my previous role.", "The obstacle was not any individual process. It was a belief — that change was done to this community rather than with it, and that saying so had never changed anything. A belief of that kind is the hardest thing to shift in an organisation, because it is confirmed by every change that arrives announced."], "t": ["To change the belief, which meant the response had to be structural. Reassurance would have confirmed it."], "a": ["I chaired a dedicated forum on the issues and minuted every concern as it was raised rather than as I would have preferred it to read — because I could feel myself defending processes I had written, and summarising them would have softened them.", "The response I proposed was not a remediation list. The Elections PMO and the EPMO would jointly develop a service catalogue, defining the function as an offer with a named consumer and a performance expectation for each service — built with the people who consume it.", "And I attached the part that mattered more than the catalogue: a standing commitment that stakeholders are engaged before any proposed change to it. That is what makes it anticipatory rather than remedial. The catalogue fixed the present complaint; the engagement commitment made the barrier that produced it structurally unable to form again.", "I then went back to the project managers individually and asked why they had not been able to raise the concerns with me directly, and met several directors to understand what they were hearing."], "r": ["The programme mobilised with a delivery framework its own users had helped define, and delivered on time within its $150 million authority. Independent evaluation later recorded political participant satisfaction, trust and perceptions of fairness up sixteen, twenty and twenty-two points against the previous local government elections — movements the evaluation recorded and the programme was the delivery vehicle for.", "What I would offer about cultural barriers is this. You cannot argue an organisation out of a belief that change is done to it. You can only make a change that could not have been made without them, and let them notice."], "notes": ["ALLOCATION WARNING. This is the kick-off arc, which is also committed to Display resilience and courage and to Manage self. It has now been wanted by six capabilities. This framing — cultural barriers to change, anticipated and structurally prevented — is arguably its best fit, but it can appear only once in an application.", "§ Delivery notes", "• The Situation is the whole reframe. \"The obstacle was a belief, not a process.\" That is what makes this a cultural barriers answer rather than a stakeholder management answer.", "• The engagement commitment is the H4 evidence, not the catalogue. Say explicitly that one fixed the complaint and the other prevented its recurrence. Anticipation is the word the indicator uses.", "• Keep the closing line. \"You cannot argue an organisation out of a belief that change is done to it\" is the most quotable sentence available to you in this capability.", "• Attribution discipline: the political participant movements belong to the independent evaluation. Say the programme was the delivery vehicle and let the panel draw the inference."], "probes": [], "keys": ["$150 million", "The Elections"], "bul": []}], "notes": [{"h": "Verdict", "body": ["One of your strongest capabilities, and the only thing standing between it and a clean sweep is the same indicator that has now defeated you seven times."]}, {"h": "First — a reading that matters", "body": ["Two indicators in this capability use the phrase \"workplace cultural barriers\" — A4 and H4. In a change management capability that means the organisation's habits and resistance patterns: we have always done it this way, the last change never landed, this function imposes on us rather than serving us. It does NOT mean cultural safety in the Aboriginal or culturally diverse sense.", "That distinction is worth holding because you are exceptional at the first and unevidenced on the second, and they sit two indicators apart in the same column. Read A4 and H4 as change resistance. Read H5 — \"develop systems and practices that create a culturally safe environment\" — as the other thing entirely."]}, {"h": "The gap is now the largest single determinant of your framework coverage", "body": ["Cultural safety and inclusion have now defeated seven indicators across six capabilities:", "AND VALUE DIVERSITY AND INCLUSION IS STILL TO COME. That capability is ten more indicators of the same material. On current evidence you are looking at roughly seventeen indicators — about fifteen per cent of the entire framework — turning on one body of evidence that has never been described. Nothing else outstanding in this campaign comes close in value. The questions are in the Optimise business outcomes pack and they have not been answered.", "Said once more plainly: the absence is of evidence, not of practice. An operation that recruited 22,990 people into 2,486 venues across every part of New South Wales cannot have done so without reaching communities conventional recruitment misses. Go and find what happened."]}, {"h": "Open items", "body": []}, {"h": "Sources", "body": ["NSW Public Sector Capability Framework Version 3: 2026, Office of the Public Service Commissioner — People Management group.", "NSWEC Project Management Methodology NPMM v5.4 — change activity lane, Business Change Management Plan, Change Communications Plan, Training Needs Analysis, To Be processes, workaround incorporation rules — supplied.", "NSWEC LGE24 governance model and Program Management Plan retrospective (OFFICIAL–Sensitive) — supplied.", "Fiftyfive5, \"Evaluation of NSW Electoral Commission services at the 2024 NSW Local Government elections report\", 29 January 2025 — supplied.", "Candidate-supplied evidence, 14–16 August 2026."]}], "script": {"id": "mrc", "intro": ["This capability has one line of definition. Support and champion change, and help others to engage with change. Notice where the weight sits. Not deliver change. Help others engage with it. The subject of almost every indicator here is somebody other than you.", "At Advanced the indicators want change translated into practical strategies, with staff told their role in implementing them. They want structured processes for cultural barriers, an environment where different views get shared, and coaching through uncertainty. Supporting a change somebody else designed is Adept. Building the structure that makes change land on people who were not in the room is Advanced. Highly advanced lifts it again, to organisational level, to anticipation, and to culture.", "The trap is a reading trap. Two indicators use the phrase workplace cultural barriers, A4 and H4. In a change capability that means the organisation's habits and resistance patterns. The last change never landed. This function imposes on us rather than serving us. It does not mean cultural safety in the Aboriginal or culturally diverse sense. Read it the wrong way and you hand back two indicators you own outright."], "standing": ["This is one of your strongest capabilities. At Advanced you clear 5 of 5, four of them exceptionally. At Highly advanced you clear 4 of 5, two exceptionally. The one that fails is H5, systems and practices for a culturally safe environment, and it is the same indicator that has now defeated you seven times.", "So claim this at Highly advanced. Four of five is a claim you can carry into a room and defend. Lead with H4 and H1. Do not go looking for H5, and do not offer a substitute for it."], "inds": {"A3": ["A3 is the translation layer. A panel wants the path from an announcement to what a person does differently on Monday. A communications plan alone gets rejected, because telling people about a change is not telling them their part in it.", "Your strongest evidence is one you have never used this way. The methodology you wrote gives organisational change its own activity lane, alongside the EPMO, project owners, Finance and project managers. The change deliverables are mandatory, not optional. A Business Change Management Plan, a Training Needs Analysis, To Be process definitions and a training schedule, carried through go-live into business as usual. Their role in implementing them is exactly what a To Be process and a training needs analysis produce. So in the room, it sounds like this. I gave change its own activity lane in the methodology, so everyone affected gets a To Be process and a training plan for their part in it."], "A4": ["Read A4 as change resistance. A panel will reject an example where the barrier was one difficult individual. They want the belief underneath.", "Yours was exactly that. The delivery community had concluded that lessons were never implemented and that the EPMO imposed rather than served. That belief, not any single process, was the obstacle. You identified it by hearing it, with every concern minuted as stated rather than as you would have preferred it to read. The response was structural rather than reassuring. The function was redefined as a service catalogue, with a named consumer and a performance expectation for each service, built jointly with the people who had complained. So in the room, it sounds like this. The barrier was a belief that change was done to this community, so I rebuilt the function with the people who had said so."], "A5": ["A5 is where candidates say they have an open door and the panel writes nothing down. What clears it is a mechanism you designed, plus one occasion where the different views were about you.", "You have both. A Project Managers Forum designed so risks and concerns could be raised in a psychologically safe setting away from the leaders. A Community of Practice that was topic-led rather than status-led, open to anyone interested rather than restricted by role. Then the test case. When the views were about work you had authored, you recorded them verbatim and asked people individually why they had not reached you sooner. So in the room, it sounds like this. When the criticism was of a methodology I wrote myself, I minuted it word for word, then asked each project manager why it had taken a forum for me to hear it."], "A1": ["A1 has two limbs and most candidates carry only one. Continuous improvement, and coaching through uncertainty. On the first, a panel listens for improvement that is structured rather than exhorted. Yours is built in. Lessons learned workshops as a mandatory closure phase. A Continuous Improvement Register handed into business as usual. A monthly Community of Practice that outlasted your tenure.", "The uncertainty limb is unusually well evidenced. A red programme inherited with a $51.6 million gap between allocation and estimate. An Electoral Act amendment cutting early voting from thirteen days to seven mid-programme. The Electoral Commissioner retiring months before a $150 million delivery. So in the room, it sounds like this. I led people through a $51.6 million funding gap, a legislative change mid-flight and the Commissioner's retirement, and the improvement register I built was handed into business as usual."], "A2": ["A2 is cleared, and the verb that decides it is help. This indicator is about somebody else's challenge. Solve it yourself and report the outcome, and a panel scores it as delivery instead.", "Four instances carry it. The service catalogue built support for a change from the very people who had resisted the previous one. The Procurement Steering Committee addressed a governance risk before it could recur at greater scale. The resilience capability was stood up after event assurance did not achieve its posture. The sharpest is the smallest. The Master Scheduler was helped with her own challenge by having the missing input put in front of her rather than supplied to her. So in the room, it sounds like this. I did not give the Master Scheduler the answer. I put the missing input in front of her, so the schedule stayed hers."], "H4": ["The operative word in H4 is anticipate, and it is the one most candidates cannot evidence. Addressing a barrier that has already appeared is ordinary. Preventing one from forming is not.", "Your service catalogue carried a standing commitment that stakeholders are engaged before any proposed change to it. That is not a fix for the kick-off complaint. It is a guarantee that the barrier which produced it cannot form again. The change request pipeline does the same, routing proposals through the accountable parties before any decision forum sees them, so change arrives already owned rather than announced.", "The sharpest instance is a barrier you chose not to create. A new Applications Director had not been through an election cycle. You would have changed the operating model. She judged reform before living one full event was the greater risk, you backed her, and routed the residual risk into governance rather than around her. So in the room, it sounds like this. The catalogue fixed the complaint, and the commitment to engage before changing it stopped the belief behind it re-forming."], "H1": ["H1 wants a high-level goal and the practical implementation underneath it. The failure mode a panel listens for is an aspiration with no baseline. Build a culture of continuous improvement is not a goal, because nothing about it can be measured.", "The maturity uplift is your goal and the operating model is your translation. You began with a P3M3 assessment across portfolio, programme and project disciplines, so the target was a measured deficit rather than an ambition. Then you built it out. A P3O structure. Portfolio tooling with adoption actively driven. An assurance regime with gates and embedded reporting. A change request pipeline. A monthly Community of Practice, so practice had somewhere to develop that was not a governance meeting. So in the room, it sounds like this. I started with a P3M3 baseline so the goal was a measured deficit, then built the structures to close it."], "H2": ["H2 has three limbs and candidates usually drop the third. Build support for announced change. Prepare for long-term organisational change. And focus on the wider context, which means the change was designed from inputs outside itself.", "Support you built where it is hardest, from people who had publicly rejected the previous version, by making them co-authors of the next one. Long-term change you evidence through durability. A methodology written in one role, governing you in another, and still running the 2027 State general election programme. The wider context limb is the strategic planning work, where organisational goals, portfolio priorities and election regulatory priorities were inputs before any change was designed. So in the room, it sounds like this. I wrote the methodology in one role, it governed me in the next, and it is still governing the 2027 State general election programme."], "H3": ["The word that decides H3 is actively. The test is whether improvement is sought out or merely accepted when it arrives. A suggestion box is acceptance, and it will not lift you here.", "Three instances will. A Community of Practice that was topic-led and voluntary, and outlasted you. The Procurement Steering Committee, which exists because the previous election's procurement governance was examined and found to be in the wrong place. And an independently commissioned service evaluation across roughly 3,500 respondents, which is an organisation deliberately buying criticism it could not control. So in the room, it sounds like this. We commissioned an independent evaluation across roughly 3,500 respondents, which meant buying criticism we had no ability to shape."], "H5": ["H5 is not cleared. This is the seventh appearance of this material and it is empty again. What makes it sting is the wording. It asks for systems and practices, the register you are strongest in everywhere else. You build gates, catalogues, pipelines and registers. One cultural safety measure inside any of them and this would be among your easiest indicators.", "Do not offer psychological safety here. It does not answer the question and a good panel will know. Psychological safety is about whether it is safe to speak. Cultural safety is about whether it is safe to be. An operation that recruited 22,990 people into 2,486 venues across every part of New South Wales cannot have done so without reaching communities conventional recruitment misses. That story exists. It has never been written down."]}, "stars": [["This is your methodology answer and it carries A3, A4 and H1. The Situation is what makes it a change answer, so do not rush it. The people who will use a system at the next event are largely not the people who used it at the last one, because most of the workforce is temporary and reassembles each cycle. That is why the discipline had to be structural.", "Lead the Action with the lane, not the list. The moment that does the real work is the workaround rule. Where a workaround is agreed at defect closure, it must be incorporated into the To Be processes, the Business Change Management Plan and the training material. Anyone can require a change plan. Requiring workarounds to propagate is the insight of someone who has watched change fail. One caution. The methodology is shared with the Project management pack, so keep the change lane here and the gates there."], ["This is the kick-off arc, carrying H4 first with A4 and H2 behind it. One warning. It has now been wanted by six capabilities, including Display resilience and courage and Manage self, and it can appear only once in an application. Cultural barriers anticipated and structurally prevented is arguably its best fit. Choose that deliberately rather than by accident.", "The Situation is the whole reframe. The obstacle was a belief, not a process. In the Action, say explicitly that the catalogue fixed the complaint and the engagement commitment prevented its recurrence, because anticipation is the word the indicator uses. Watch attribution on the result. The movements of sixteen, twenty and twenty-two points belong to the independent evaluation, so say the programme was the delivery vehicle and let the panel draw the inference."]], "outro": ["Two things are outstanding. The small one is confirming what the methodology replaced and whether change management existed in it before you wrote it. The large one is H5, and it is bigger than this capability. Cultural safety and inclusion have defeated seven indicators across six capabilities, and Value diversity and inclusion is still ahead with ten more. That is roughly seventeen indicators turning on one body of evidence that has never been described. The questions sit in the Optimise business outcomes pack and they are unanswered. Everything else here is done, and this is the sentence you own outright. You cannot argue an organisation out of a belief that change is done to it. You can only make a change that could not have been made without them, and let them notice."]}}]};
const CAPS=DATA.caps;
const VN={exc:'Exceptional',cle:'Cleared',par:'Partial',not:'Not cleared'};
const GROUPS=['Personal Attributes','Relationships','Results','Business Enablers','People Management'];
const $=(s)=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const cap=id=>CAPS.find(c=>c.id===id);
const inds=c=>c.adv.concat(c.ha);
const allInds=()=>CAPS.flatMap(c=>inds(c).map(i=>({...i,cap:c})));
const allStars=()=>CAPS.flatMap(c=>(c.stars||[]).map((s,ix)=>({...s,cap:c,ix})));

/* ---------- tiny persistence, silently optional ---------- */
const MEM={};
const store={get(k,d){try{const v=localStorage.getItem('nk_'+k);return v?JSON.parse(v):(MEM[k]??d);}catch(e){return MEM[k]??d;}},
  set(k,v){MEM[k]=v;try{localStorage.setItem('nk_'+k,JSON.stringify(v));}catch(e){}}};
let done=store.get('done',{});
const markDone=(k)=>{done[k]=1;store.set('done',done);};

/* ================= SPEECH ENGINE ================= */
const SP={
  q:[],i:0,on:false,paused:false,rate:store.get('rate',1),voice:null,voices:[],
  onSeg:null,onWord:null,onDone:null,kick:null
};
function loadVoices(){
  const v=speechSynthesis.getVoices()||[];
  SP.voices=v.filter(x=>/^en/i.test(x.lang));
  if(!SP.voices.length) SP.voices=v;
  const want=store.get('voice',null);
  let pick=want&&SP.voices.find(x=>x.name===want);
  if(!pick){
    const pref=[/karen/i,/catherine/i,/matilda/i,/serena/i,/daniel/i,/samantha/i,/moira/i,/en-AU/i,/en-GB/i];
    for(const p of pref){pick=SP.voices.find(x=>p.test(x.name)||p.test(x.lang));if(pick)break;}
  }
  SP.voice=pick||SP.voices[0]||null;
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=()=>{loadVoices();if(window.refreshVoiceSel)refreshVoiceSel();}; }
const HAS_TTS = 'speechSynthesis' in window;

/* split a paragraph into speakable sentences, keeping punctuation */
function sentences(p){
  let t=String(p).replace(/^[•§]\s*/,'').trim();
  t=t.replace(/(\d)\.(\d)/g,'$1\u0001$2')          /* decimals: $140.7 */
     .replace(/\b([A-Z])\.(?=\s?[A-Z]\.)/g,'$1\u0001')  /* initials */
     .replace(/\b(Mr|Mrs|Ms|Dr|No|vs|St|Rd|approx)\./gi,'$1\u0001');
  const parts=t.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g)||[t];
  const out=[];
  parts.forEach(s=>{s=s.trim();if(!s)return;
    if(out.length&&(out[out.length-1].length<20||s.length<20)) out[out.length-1]+=' '+s; else out.push(s);});
  return out.map(s=>s.replace(/\u0001/g,'.').replace(/\s+/g,' ').trim());
}
/* make text friendlier to a speech synthesiser */
function spoken(t){
  return String(t)
    .replace(/^[•§]\s*/,'')
    .replace(/—/g,', ').replace(/–/g,' to ')
    .replace(/’/g,"'").replace(/[“”]/g,'')
    .replace(/\bNSWEC\b/g,'the N S W Electoral Commission')
    .replace(/\bEPMO\b/g,'E P M O').replace(/\bPMO\b/g,'P M O')
    .replace(/\bP3M3\b/g,'P three M three').replace(/\bP3O\b/g,'P three O')
    .replace(/\bMICTA\b/g,'MICTA').replace(/\bICTA\b/g,'I C T A')
    .replace(/\bSTAR\b/g,'star').replace(/\bWHS\b/g,'W H S')
    .replace(/\bA(\d)\b/g,'A $1').replace(/\bH(\d)\b/g,'H $1')
    .replace(/\s+/g,' ').trim();
}
function stopSpeech(){
  SP.on=false;SP.paused=false;SP.q=[];SP.i=0;
  if(SP.kick){clearInterval(SP.kick);SP.kick=null;}
  if(HAS_TTS){try{speechSynthesis.cancel();}catch(e){}}
  mouth(false);
}
function playSegs(list,opts){
  opts=opts||{};stopSpeech();
  SP.q=list;SP.i=opts.from||0;SP.on=true;SP.onSeg=opts.onSeg;SP.onDone=opts.onDone;
  /* Chrome/Safari watchdog: long queues can stall */
  SP.kick=setInterval(()=>{ if(SP.on&&!SP.paused&&HAS_TTS&&speechSynthesis.paused){try{speechSynthesis.resume();}catch(e){}} },4000);
  step();
}
function step(){
  if(!SP.on) return;
  if(SP.i>=SP.q.length){ SP.on=false; mouth(false); if(SP.kick)clearInterval(SP.kick); SP.onDone&&SP.onDone(); return; }
  const seg=SP.q[SP.i];
  SP.onSeg&&SP.onSeg(SP.i,seg);
  if(!HAS_TTS){ return; }
  const u=new SpeechSynthesisUtterance(spoken(seg.text));
  if(SP.voice)u.voice=SP.voice;
  u.rate=SP.rate;u.pitch=1;u.volume=1;u.lang=(SP.voice&&SP.voice.lang)||'en-AU';
  u.onstart=()=>mouth(true,seg.text);
  u.onend=()=>{ mouth(false); if(!SP.on)return; SP.i++; setTimeout(step,seg.gap||120); };
  u.onerror=()=>{ mouth(false); if(!SP.on)return; SP.i++; setTimeout(step,120); };
  try{speechSynthesis.speak(u);}catch(e){ SP.i++; setTimeout(step,80); }
}
function pauseResume(){
  if(!SP.on)return;
  if(SP.paused){ SP.paused=false; try{speechSynthesis.resume();}catch(e){} mouth(true); }
  else { SP.paused=true; try{speechSynthesis.pause();}catch(e){} mouth(false); }
  renderCtl&&renderCtl();
}
function jump(n){
  if(!SP.q.length)return;
  const t=Math.max(0,Math.min(SP.q.length-1,SP.i+n));
  playSegs(SP.q,{from:t,onSeg:SP.onSeg,onDone:SP.onDone});
}

function mouth(on,txt){
  const m=document.getElementById('mouth'),t=document.getElementById('teeth');
  if(!m)return;
  if(talkT){clearInterval(talkT);talkT=null;}
  const ring=document.querySelector('.avring');
  if(!on){ m.setAttribute('rx',15);m.setAttribute('ry',3); t.setAttribute('ry',0); ring&&ring.classList.remove('live'); return; }
  ring&&ring.classList.add('live');
  const chars=(txt||'').replace(/[^a-z]/gi,'').split('');
  let k=0;
  talkT=setInterval(()=>{
    const c=chars.length?chars[k%chars.length]:'a';k++;
    let rx=13,ry=4,tr=0;
    if('aeo'.includes(c)){rx=12;ry=10;tr=3;}
    else if('iu'.includes(c)){rx=9;ry=7;tr=2;}
    else if('mbp'.includes(c)){rx=15;ry=2.5;tr=0;}
    else if('fv'.includes(c)){rx=13;ry=4;tr=3;}
    else {rx=13;ry=6;tr=2;}
    m.setAttribute('rx',rx);m.setAttribute('ry',ry);t.setAttribute('ry',tr);
  },95);
}

function buildLesson(c){

  segs.push({t:'What this capability is testing',k:'intro',paras:S.intro});

  inds(c).forEach(i=>{ if(S.inds&&S.inds[i.c]) segs.push({t:i.c+' · '+i.t,k:'ind',code:i.c,v:i.v,paras:S.inds[i.c],ref:i}); });
  (c.stars||[]).forEach((s,ix)=>{

    const words=n.split(' ').filter(w=>w.length>3);
    if(words.length>1&&words.every(w=>t.includes(w)))h[k]=1;
    const digits=n.replace(/[^0-9]/g,'');
    if(digits.length>=3&&t.replace(/[^0-9]/g,'').includes(digits))h[k]=1;
